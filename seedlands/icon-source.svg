<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfd6ff"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- isometric-ish map grid -->
  <g opacity="0.9" transform="translate(512,540)">
    <g stroke="#26314a" stroke-width="6" fill="none" opacity="0.5">
      <path d="M-300 0 L0 -170 L300 0 L0 170 Z"/>
      <path d="M-150 -85 L150 85 M150 -85 L-150 85"/>
    </g>
  </g>
  <!-- big diamond gem mark -->
  <g transform="translate(512,470)">
    <rect x="-150" y="-150" width="300" height="300" rx="40" transform="rotate(45)" fill="url(#mark)"/>
    <circle cx="0" cy="0" r="62" fill="url(#portal)"/>
  </g>
  <!-- scattered gem dots -->
  <g fill="#ffcf5e">
    <rect x="250" y="690" width="46" height="46" rx="8" transform="rotate(45 273 713)"/>
    <rect x="700" y="700" width="40" height="40" rx="8" transform="rotate(45 720 720)"/>
    <rect x="470" y="800" width="36" height="36" rx="8" transform="rotate(45 488 818)"/>
  </g>
</svg>
