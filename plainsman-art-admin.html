<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Dashboard — Plainsman Art</title>
  <meta property="og:title" content="Team Dashboard — Plainsman Art">
  <meta property="og:description" content="Internal order management for Plainsman Art.">
  <meta property="og:image" content="https://williamsdigital.io/og-plainsman-art.png">
  <meta property="og:url" content="https://williamsdigital.io/plainsman-art-admin">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --auburn-navy: #03244D;
      --auburn-navy-deep: #021833;
      --auburn-orange: #E87722;
      --auburn-orange-bright: #F58220;
      --burnt: #B5571A;
      --cream: #F7F3EC;
      --warm-white: #FBF8F3;
      --slate: #2A3340;
      --stone: #C9C2B5;
      --light-stone: #E8E2D5;
      --dark-stone: #6B6558;
      --bg: #F1ECE3;
      --red: #C85446;
      --yellow: #D4A12E;
      --green: #5A8A4A;
      --blue: #4A6FA5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--slate);
      background: var(--bg);
      font-size: 14px;
    }

    a { color: inherit; text-decoration: none; }

    /* ========== LOGIN ========== */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at 20% 30%, rgba(232, 119, 34, 0.15), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(3, 36, 77, 0.08), transparent 55%),
        var(--bg);
    }

    .login-card {
      max-width: 460px;
      width: 100%;
      background: var(--warm-white);
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(3, 36, 77, 0.12);
      border-top: 4px solid var(--auburn-orange);
    }

    .login-card .pa-mark {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--auburn-navy);
      color: var(--auburn-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 1px;
      margin: 0 auto 16px;
    }

    .login-card .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--auburn-navy);
    }

    .login-card .divider {
      width: 40px;
      height: 2px;
      background: var(--auburn-orange);
      margin: 12px auto 8px;
    }

    .login-card .sub {
      font-size: 0.6rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--auburn-orange);
      font-weight: 700;
      margin-bottom: 28px;
    }

    .admin-badge {
      display: inline-block;
      padding: 6px 14px;
      background: var(--auburn-navy);
      color: var(--auburn-orange);
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 22px;
      font-weight: 700;
    }

    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--auburn-navy);
      margin-bottom: 24px;
    }

    .role-select {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .role-option {
      padding: 14px 8px;
      border: 2px solid var(--light-stone);
      background: var(--cream);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .role-option:hover { border-color: var(--auburn-orange); }

    .role-option.active {
      border-color: var(--auburn-orange);
      background: var(--warm-white);
      box-shadow: 0 4px 12px rgba(232, 119, 34, 0.18);
    }

    .role-option .role-name {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--auburn-navy);
      margin-bottom: 2px;
    }

    .role-option .role-desc {
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 600;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-form input {
      padding: 14px 16px;
      border: 1px solid var(--light-stone);
      background: var(--warm-white);
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--slate);
    }

    .login-form input:focus {
      outline: none;
      border-color: var(--auburn-orange);
    }

    .login-form button {
      padding: 14px;
      background: var(--auburn-orange);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 0.74rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 6px;
    }

    .login-form button:hover { background: var(--auburn-orange-bright); }

    .login-screen.hidden { display: none; }

    /* ========== APP LAYOUT ========== */
    .app { display: none; }
    .app.active { display: block; }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      background: var(--auburn-navy);
      color: var(--cream);
      display: flex;
      flex-direction: column;
      padding: 28px 0 20px;
    }

    .sidebar-brand {
      padding: 0 24px 24px;
      border-bottom: 1px solid rgba(247, 243, 236, 0.1);
      margin-bottom: 18px;
    }

    .sidebar-brand .name {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .sidebar-brand .brand-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sidebar-brand .brand-divider .line {
      flex: 1;
      height: 1px;
      background: var(--auburn-orange);
    }

    .sidebar-brand .brand-divider .star {
      width: 4px;
      height: 4px;
      background: var(--auburn-orange);
      transform: rotate(45deg);
    }

    .sidebar-brand .role-tag {
      font-size: 0.62rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--auburn-orange);
      font-weight: 600;
    }

    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(247, 243, 236, 0.75);
      cursor: pointer;
      transition: all 0.25s;
      border-left: 3px solid transparent;
    }

    .sidebar-nav a:hover {
      color: var(--cream);
      background: rgba(232, 119, 34, 0.08);
    }

    .sidebar-nav a.active {
      color: var(--cream);
      background: rgba(232, 119, 34, 0.14);
      border-left-color: var(--auburn-orange);
    }

    .sidebar-nav a svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .sidebar-nav .badge {
      margin-left: auto;
      background: var(--auburn-orange);
      color: white;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .sidebar-footer {
      padding: 20px 24px 0;
      border-top: 1px solid rgba(247, 243, 236, 0.1);
    }

    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: rgba(247, 243, 236, 0.6);
      cursor: pointer;
      transition: color 0.3s;
    }

    .sidebar-footer a:hover { color: var(--auburn-orange); }
    .sidebar-footer svg { width: 16px; height: 16px; }

    /* ========== MAIN ========== */
    .main {
      padding: 32px 36px 60px;
      overflow-x: hidden;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--auburn-navy);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .page-header .subtitle {
      font-size: 0.82rem;
      color: var(--dark-stone);
    }

    .btn {
      padding: 9px 18px;
      background: var(--auburn-orange);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover { background: var(--auburn-orange-bright); }

    .btn-outline {
      background: transparent;
      color: var(--auburn-navy);
      border: 1px solid var(--auburn-navy);
    }

    .btn-outline:hover {
      background: var(--auburn-navy);
      color: white;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
    }

    /* ========== STATS ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--warm-white);
      padding: 20px 22px;
      border-left: 3px solid var(--auburn-orange);
      box-shadow: 0 2px 12px rgba(3, 36, 77, 0.05);
    }

    .stat-card .label {
      font-size: 0.65rem;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--auburn-navy);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-card .delta {
      font-size: 0.72rem;
      color: var(--dark-stone);
      font-weight: 500;
    }

    .stat-card.red { border-left-color: var(--red); }
    .stat-card.yellow { border-left-color: var(--yellow); }
    .stat-card.blue { border-left-color: var(--blue); }
    .stat-card.green { border-left-color: var(--green); }

    /* ========== PANEL ========== */
    .panel {
      background: var(--warm-white);
      box-shadow: 0 2px 12px rgba(3, 36, 77, 0.05);
      margin-bottom: 24px;
    }

    .panel-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--light-stone);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .panel-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--auburn-navy);
      letter-spacing: 0.5px;
    }

    .panel-tabs {
      display: flex;
      gap: 4px;
    }

    .panel-tab {
      padding: 6px 14px;
      font-size: 0.66rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.25s;
    }

    .panel-tab:hover { color: var(--auburn-navy); }
    .panel-tab.active {
      color: var(--auburn-navy);
      border-color: var(--light-stone);
      background: var(--cream);
    }

    .panel-body { padding: 0; }

    /* ========== TABLE ========== */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 14px 22px;
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 700;
      background: var(--cream);
      border-bottom: 1px solid var(--light-stone);
    }

    td {
      padding: 14px 22px;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--light-stone);
      color: var(--slate);
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(232, 119, 34, 0.03); }

    .order-num {
      font-weight: 700;
      color: var(--auburn-navy);
      letter-spacing: 0.3px;
    }

    .product-mini {
      font-size: 0.72rem;
      color: var(--dark-stone);
      margin-top: 2px;
    }

    /* ========== STATUS PILLS ========== */
    .pill {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 2px;
    }

    .pill-pending { background: rgba(200, 84, 70, 0.12); color: var(--red); }
    .pill-printing { background: rgba(212, 161, 46, 0.15); color: var(--burnt); }
    .pill-shipping { background: rgba(74, 111, 165, 0.12); color: var(--blue); }
    .pill-shipped { background: rgba(90, 138, 74, 0.13); color: var(--green); }
    .pill-rush { background: var(--red); color: white; }
    .pill-signed { background: var(--auburn-navy); color: var(--auburn-orange); }
    .pill-retail { background: var(--light-stone); color: var(--dark-stone); }
    .pill-commission { background: var(--auburn-orange); color: white; }

    /* ========== PIPELINE BOARD ========== */
    .pipeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .pipeline-column {
      background: var(--warm-white);
      box-shadow: 0 2px 12px rgba(3, 36, 77, 0.05);
      border-top: 3px solid var(--dark-stone);
      display: flex;
      flex-direction: column;
      max-height: 70vh;
    }

    .pipeline-column.pending { border-top-color: var(--red); }
    .pipeline-column.printing { border-top-color: var(--yellow); }
    .pipeline-column.shipping { border-top-color: var(--blue); }
    .pipeline-column.complete { border-top-color: var(--green); }

    .pipeline-column-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--light-stone);
      background: var(--cream);
    }

    .pipeline-column-header h3 {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--auburn-navy);
    }

    .col-count {
      background: var(--auburn-navy);
      color: var(--auburn-orange);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
    }

    .pipeline-column-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }

    .order-card {
      background: var(--cream);
      padding: 12px 14px;
      margin-bottom: 10px;
      border-left: 3px solid var(--light-stone);
      cursor: pointer;
      transition: all 0.25s;
    }

    .order-card:hover {
      background: var(--warm-white);
      box-shadow: 0 4px 14px rgba(3, 36, 77, 0.08);
      transform: translateX(2px);
    }

    .order-card.rush { border-left-color: var(--red); }
    .order-card.signed { border-left-color: var(--auburn-orange); }
    .order-card.commission { border-left-color: var(--auburn-orange); }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .order-card .order-num { font-size: 0.72rem; }

    .order-card .order-tags {
      display: flex;
      gap: 4px;
    }

    .mini-tag {
      font-size: 0.55rem;
      padding: 2px 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 2px;
    }

    .mini-tag.rush { background: var(--red); color: white; }
    .mini-tag.signed { background: var(--auburn-navy); color: var(--auburn-orange); }
    .mini-tag.retail { background: var(--light-stone); color: var(--dark-stone); }
    .mini-tag.commission { background: var(--auburn-orange); color: white; }

    .order-card .customer {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--auburn-navy);
      margin-bottom: 3px;
    }

    .order-card .items {
      font-size: 0.7rem;
      color: var(--dark-stone);
    }

    .order-card .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--light-stone);
      font-size: 0.68rem;
    }

    .order-card .total {
      font-weight: 700;
      color: var(--auburn-navy);
    }

    .sla-pill {
      font-size: 0.58rem;
      padding: 2px 7px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 2px;
    }

    .sla-pill.green { background: rgba(90, 138, 74, 0.15); color: var(--green); }
    .sla-pill.yellow { background: rgba(212, 161, 46, 0.18); color: var(--burnt); }
    .sla-pill.red { background: var(--red); color: white; }

    /* ========== ORDER DETAIL MODAL ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 24, 51, 0.6);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--warm-white);
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border-top: 4px solid var(--auburn-orange);
    }

    .modal-header {
      padding: 22px 26px;
      border-bottom: 1px solid var(--light-stone);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--auburn-navy);
      letter-spacing: 0.5px;
    }

    .modal-header .sub {
      font-size: 0.72rem;
      color: var(--dark-stone);
      margin-top: 2px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--dark-stone);
      cursor: pointer;
      line-height: 1;
    }

    .modal-body { padding: 22px 26px; }

    .modal-section {
      margin-bottom: 22px;
    }

    .modal-section h3 {
      font-size: 0.62rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--auburn-orange);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .modal-section p,
    .modal-section .text {
      font-size: 0.86rem;
      color: var(--slate);
      line-height: 1.6;
      white-space: pre-line;
    }

    .product-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--light-stone);
      font-size: 0.84rem;
    }

    .product-line:last-child { border-bottom: none; }

    .product-line .product-name { font-weight: 600; color: var(--auburn-navy); }
    .product-line .product-specs { font-size: 0.72rem; color: var(--dark-stone); margin-top: 2px; }

    .modal-footer {
      padding: 16px 26px;
      border-top: 1px solid var(--light-stone);
      background: var(--cream);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* ========== EMPTY STATE ========== */
    .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--dark-stone);
      font-size: 0.85rem;
    }

    .empty .ico {
      font-size: 2rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    /* ========== MOBILE TOGGLE ========== */
    .mobile-toggle {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: var(--auburn-navy);
      color: var(--cream);
      border: none;
      padding: 10px 12px;
      cursor: pointer;
    }

    .mobile-toggle svg {
      width: 22px; height: 22px;
      stroke: currentColor; stroke-width: 2; fill: none;
    }

    /* ========== MOBILE ========== */
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        top: 0; left: -260px;
        width: 240px;
        height: 100vh;
        z-index: 90;
        transition: left 0.3s;
      }
      .sidebar.open { left: 0; }
      .mobile-toggle { display: block; }
      .main { padding: 60px 18px 40px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .pipeline { grid-template-columns: 1fr; }
      .pipeline-column { max-height: none; }
      .panel-header { flex-direction: column; align-items: flex-start; }
      th, td { padding: 10px 14px; font-size: 0.74rem; }
      th { font-size: 0.55rem; letter-spacing: 1.2px; }
      .role-select { grid-template-columns: 1fr; }
      .hide-mobile { display: none; }
    }

    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="brand">Plainsman Art</div>
      <div class="divider"></div>
      <div class="sub">Auburn · Original Prints</div>

      <div class="admin-badge">Team Dashboard</div>
      <h1>Sign In</h1>

      <div style="font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; color:var(--dark-stone); margin-bottom:12px; font-weight:600;">Select your role</div>
      <div class="role-select">
        <div class="role-option active" onclick="selectRole(this, 'owner')">
          <div class="role-name">Mike</div>
          <div class="role-desc">Owner</div>
        </div>
        <div class="role-option" onclick="selectRole(this, 'jason')">
          <div class="role-name">Jason</div>
          <div class="role-desc">Partner</div>
        </div>
        <div class="role-option" onclick="selectRole(this, 'fulfillment')">
          <div class="role-name">Team</div>
          <div class="role-desc">Fulfillment</div>
        </div>
      </div>

      <form class="login-form" onsubmit="login(event)">
        <input type="email" id="loginEmail" placeholder="you@plainsmanart.com">
        <input type="password" id="loginPassword" placeholder="••••••••">
        <button type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app">
    <button class="mobile-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="name">Plainsman Art</div>
          <div class="brand-divider">
            <span class="line"></span>
            <span class="star"></span>
            <span class="line"></span>
          </div>
          <div class="role-tag" id="sidebarRoleTag">Owner</div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
          <a onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg>
            Sign Out
          </a>
        </div>
      </aside>

      <main class="main" id="mainContent"></main>
    </div>
  </div>

  <!-- ============ MODAL ============ -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle">Order</h2>
          <div class="sub" id="modalSubtitle"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script>
    // ========== DATA ==========
    const orders = [
      { num: 'PA-2026-0042', customer: 'Auburn Athletics Dept.', type: 'commission', status: 'pending', items: 8, total: 2400, date: '2026-04-28', sla: 14, address: '392 S Donahue Dr\nAuburn, AL 36849', notes: 'Bulk order — gameday action shots for hall of fame display.', products: [
        { name: 'Jordan-Hare · Sideline', sku: 'PA-GAME-JH-24', specs: '24x36 Framed Print', qty: 4 },
        { name: 'Toomer\'s Corner', sku: 'PA-HIST-TOOM-24', specs: '24x36 Framed Print', qty: 4 }
      ]},
      { num: 'PA-2026-0041', customer: 'Wesley Crawford', type: 'signed', rush: true, status: 'pending', items: 1, total: 495, date: '2026-04-28', sla: 5, address: '1822 Heath Rd\nBirmingham, AL 35243', notes: 'Rush — birthday gift, needs by 5/3.', products: [
        { name: 'Bo Jackson · 1985', sku: 'PA-SIGN-BO-18', specs: '18x24 Signed Edition', qty: 1 }
      ]},
      { num: 'PA-2026-0040', customer: 'Erin McElroy', type: 'retail', status: 'pending', items: 2, total: 525, date: '2026-04-27', sla: 12, address: '54 Pine Cone Ln\nMobile, AL 36608', products: [
        { name: 'Toomer\'s Corner · After the Win', sku: 'PA-GAME-TOOM-18', specs: '18x24 Print', qty: 1 },
        { name: 'Samford Hall at Dusk', sku: 'PA-HIST-SAM-12', specs: '12x16 Print', qty: 1 }
      ]},
      { num: 'PA-2026-0039', customer: 'Caldwell Family', type: 'commission', status: 'printing', items: 3, total: 780, date: '2026-04-26', sla: 10, address: '210 Lakeview Dr\nAuburn, AL 36830', notes: 'Custom commission — 3 family game-day photos.', products: [
        { name: 'Custom Commission Set', sku: 'PA-COMM-CALD-3', specs: '12x16 Print Set (3)', qty: 3 }
      ]},
      { num: 'PA-2026-0038', customer: 'Davis Holcomb', type: 'retail', status: 'printing', items: 1, total: 340, date: '2026-04-25', sla: 9, address: '88 Riverview Cir\nMontgomery, AL 36106', products: [
        { name: 'Kick Six · 2013', sku: 'PA-GAME-KICK6-24', specs: '24x36 Limited Print', qty: 1 }
      ]},
      { num: 'PA-2026-0037', customer: 'Marisa Linden', type: 'signed', status: 'shipping', items: 1, total: 425, date: '2026-04-23', sla: 6, address: '1133 Oak Hollow\nBirmingham, AL 35223', products: [
        { name: 'Jason Campbell · Sugar Bowl', sku: 'PA-SIGN-JC-18', specs: '18x24 Signed Edition', qty: 1 }
      ]},
      { num: 'PA-2026-0036', customer: 'Tigers Apparel Co.', type: 'commission', status: 'shipping', items: 6, total: 1620, date: '2026-04-22', sla: 5, address: '402 N College St\nAuburn, AL 36830', products: [
        { name: 'War Eagle Gallery Set', sku: 'PA-COMM-WE-12', specs: '12x16 Set of 6', qty: 6 }
      ]},
      { num: 'PA-2026-0034', customer: 'Auburn Athletics Dept.', type: 'commission', status: 'shipped', items: 4, total: 1280, date: '2026-04-15', sla: 0, tracking: '9405 5036 9930 0123 4501 27' },
      { num: 'PA-2026-0033', customer: 'Robin Pryce', type: 'retail', status: 'shipped', items: 2, total: 510, date: '2026-04-12', sla: 0, tracking: '9405 5036 9930 0123 4488 02' },
      { num: 'PA-2026-0032', customer: 'Hayden Murchison', type: 'signed', status: 'shipped', items: 1, total: 495, date: '2026-04-10', sla: 0, tracking: '9405 5036 9930 0123 4477 91' }
    ];

    let currentRole = 'owner';
    let currentView = 'pipeline';

    // ========== LOGIN ==========
    function selectRole(el, role) {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      currentRole = role;
    }

    function login(e) {
      e.preventDefault();
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.add('active');
      renderSidebar();
      renderDefaultView();
    }

    function logout() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('app').classList.remove('active');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // ========== ICONS ==========
    const icons = {
      dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
      orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M9 5H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2h-4M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>',
      customers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a4 4 0 014-4h8a4 4 0 014 4v2"/></svg>',
      chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M3 3v18h18M9 17V9M15 17v-6M21 17v-3"/></svg>',
      print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/></svg>',
      ship: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><rect x="3" y="8" width="13" height="10"/><path d="M16 11h4l2 3v4h-6"/><circle cx="7" cy="20" r="2"/><circle cx="17" cy="20" r="2"/></svg>',
      gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><rect x="3" y="8" width="18" height="13"/><path d="M3 11h18M12 8v13M7 8a3 3 0 010-6c2 0 5 6 5 6M17 8a3 3 0 000-6c-2 0-5 6-5 6"/></svg>',
      megaphone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M3 11v2a2 2 0 002 2h2l8 5V4l-8 5H5a2 2 0 00-2 2zM18 9a4 4 0 010 6"/></svg>'
    };

    // ========== SIDEBAR PER ROLE ==========
    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      const tag = document.getElementById('sidebarRoleTag');

      const pending = orders.filter(o => o.status === 'pending').length;
      const printing = orders.filter(o => o.status === 'printing').length;
      const shipping = orders.filter(o => o.status === 'shipping').length;

      if (currentRole === 'owner') {
        tag.textContent = 'Mike — Owner';
        nav.innerHTML = `
          <a class="active" data-view="pipeline" onclick="navSwitch(this)">${icons.dash} Pipeline</a>
          <a data-view="allOrders" onclick="navSwitch(this)">${icons.orders} Orders ${pending ? `<span class="badge">${pending}</span>` : ''}</a>
          <a data-view="customers" onclick="navSwitch(this)">${icons.customers} Customers</a>
          <a data-view="reports" onclick="navSwitch(this)">${icons.chart} Reports</a>
        `;
      } else if (currentRole === 'jason') {
        tag.textContent = 'Jason — Partner';
        nav.innerHTML = `
          <a class="active" data-view="overview" onclick="navSwitch(this)">${icons.dash} Overview</a>
          <a data-view="signedQueue" onclick="navSwitch(this)">${icons.gift} Signed Editions</a>
          <a data-view="giveaways" onclick="navSwitch(this)">${icons.megaphone} Giveaways</a>
          <a data-view="allOrders" onclick="navSwitch(this)">${icons.orders} Orders</a>
        `;
      } else {
        tag.textContent = 'Fulfillment Team';
        nav.innerHTML = `
          <a class="active" data-view="printQueue" onclick="navSwitch(this)">${icons.print} Print Queue ${printing ? `<span class="badge">${printing}</span>` : ''}</a>
          <a data-view="shipQueue" onclick="navSwitch(this)">${icons.ship} Ready to Ship ${shipping ? `<span class="badge">${shipping}</span>` : ''}</a>
          <a data-view="completed" onclick="navSwitch(this)">${icons.orders} Completed</a>
        `;
      }
    }

    function navSwitch(el) {
      document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
      currentView = el.dataset.view;
      renderView();
      if (window.innerWidth <= 980) toggleSidebar();
    }

    function renderDefaultView() {
      if (currentRole === 'owner') currentView = 'pipeline';
      else if (currentRole === 'jason') currentView = 'overview';
      else currentView = 'printQueue';
      renderView();
    }

    // ========== HELPERS ==========
    function slaStatus(days) {
      if (days >= 10) return { cls: 'green', text: `${days}d` };
      if (days >= 5) return { cls: 'yellow', text: `${days}d` };
      if (days > 0) return { cls: 'red', text: `${days}d` };
      return { cls: 'green', text: 'Done' };
    }

    function statusPill(s) {
      const map = {
        pending: 'Awaiting',
        printing: 'Printing',
        shipping: 'Ready to Ship',
        shipped: 'Shipped'
      };
      return `<span class="pill pill-${s}">${map[s]}</span>`;
    }

    function typeLabel(t) {
      const map = { signed: 'Signed', commission: 'Commission', retail: 'Retail' };
      return map[t] || t;
    }

    function statSummary() {
      const pending = orders.filter(o => o.status === 'pending');
      const active = orders.filter(o => o.status === 'printing' || o.status === 'shipping');
      const monthRev = orders.reduce((a, b) => a + b.total, 0);
      const pendingRev = pending.reduce((a, b) => a + b.total, 0);
      const activeRev = active.reduce((a, b) => a + b.total, 0);
      return { pending, active, monthRev, pendingRev, activeRev };
    }

    // ========== VIEWS ==========
    function renderView() {
      const main = document.getElementById('mainContent');
      const map = {
        pipeline: renderPipeline,
        allOrders: renderAllOrders,
        customers: renderCustomers,
        reports: renderReports,
        overview: renderJasonOverview,
        signedQueue: renderSignedQueue,
        giveaways: renderGiveaways,
        printQueue: renderPrintQueue,
        shipQueue: renderShipQueue,
        completed: renderCompleted
      };
      main.innerHTML = (map[currentView] || renderPipeline)();
      window.scrollTo(0, 0);
    }

    // ========== OWNER: PIPELINE ==========
    function renderPipeline() {
      const cols = {
        pending: orders.filter(o => o.status === 'pending'),
        printing: orders.filter(o => o.status === 'printing'),
        shipping: orders.filter(o => o.status === 'shipping'),
        complete: orders.filter(o => o.status === 'shipped')
      };
      const s = statSummary();

      return `
        <div class="page-header">
          <div>
            <h1>Fulfillment Pipeline</h1>
            <div class="subtitle">All active orders, grouped by stage</div>
          </div>
          <button class="btn">+ Manual Order</button>
        </div>

        <div class="stats-row">
          <div class="stat-card red">
            <div class="label">Awaiting</div>
            <div class="value">${cols.pending.length}</div>
            <div class="delta">$${s.pendingRev.toLocaleString()} pending approval</div>
          </div>
          <div class="stat-card yellow">
            <div class="label">In Production</div>
            <div class="value">${cols.printing.length + cols.shipping.length}</div>
            <div class="delta">$${s.activeRev.toLocaleString()} active</div>
          </div>
          <div class="stat-card blue">
            <div class="label">Avg Fulfillment</div>
            <div class="value">8.6d</div>
            <div class="delta">↓ 1.2d vs March</div>
          </div>
          <div class="stat-card green">
            <div class="label">Revenue (April)</div>
            <div class="value">$${s.monthRev.toLocaleString()}</div>
            <div class="delta">↑ 24% vs March</div>
          </div>
        </div>

        <div class="pipeline">
          ${renderColumn('Pending', 'pending', cols.pending)}
          ${renderColumn('Printing', 'printing', cols.printing)}
          ${renderColumn('Ready to Ship', 'shipping', cols.shipping)}
          ${renderColumn('Shipped', 'complete', cols.complete)}
        </div>
      `;
    }

    function renderColumn(title, cls, items) {
      return `
        <div class="pipeline-column ${cls}">
          <div class="pipeline-column-header">
            <h3>${title}</h3>
            <span class="col-count">${items.length}</span>
          </div>
          <div class="pipeline-column-body">
            ${items.length === 0 ? '<div class="empty"><div class="ico">·</div>Nothing here</div>' : items.map(o => {
              const sla = slaStatus(o.sla);
              const cardClasses = [];
              if (o.rush) cardClasses.push('rush');
              if (o.type === 'signed') cardClasses.push('signed');
              if (o.type === 'commission') cardClasses.push('commission');
              return `
                <div class="order-card ${cardClasses.join(' ')}" onclick="openOrder('${o.num}')">
                  <div class="order-card-header">
                    <div class="order-num">${o.num}</div>
                    <div class="order-tags">
                      ${o.rush ? '<span class="mini-tag rush">Rush</span>' : ''}
                      <span class="mini-tag ${o.type}">${typeLabel(o.type)}</span>
                    </div>
                  </div>
                  <div class="customer">${o.customer}</div>
                  <div class="items">${o.items} ${o.items === 1 ? 'item' : 'items'}</div>
                  <div class="footer-row">
                    <span class="total">$${o.total.toLocaleString()}</span>
                    <span class="sla-pill ${sla.cls}">${sla.text}</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ========== OWNER: ALL ORDERS ==========
    function renderAllOrders() {
      return `
        <div class="page-header">
          <div>
            <h1>All Orders</h1>
            <div class="subtitle">Complete order history, sortable and searchable</div>
          </div>
          <button class="btn btn-outline">Export CSV</button>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>${orders.length} Orders</h2>
            <div class="panel-tabs">
              <div class="panel-tab active">All</div>
              <div class="panel-tab">Retail</div>
              <div class="panel-tab">Signed</div>
              <div class="panel-tab">Commission</div>
            </div>
          </div>
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th class="hide-mobile">Type</th>
                  <th>Status</th>
                  <th class="hide-mobile">Date</th>
                  <th style="text-align:right">Total</th>
                </tr>
              </thead>
              <tbody>
                ${orders.map(o => `
                  <tr onclick="openOrder('${o.num}')" style="cursor:pointer">
                    <td>
                      <div class="order-num">${o.num}</div>
                      <div class="product-mini">${o.items} ${o.items === 1 ? 'item' : 'items'}</div>
                    </td>
                    <td>${o.customer}${o.rush ? ' <span class="pill pill-rush" style="margin-left:6px">Rush</span>' : ''}</td>
                    <td class="hide-mobile"><span class="pill pill-${o.type === 'signed' ? 'signed' : o.type === 'commission' ? 'commission' : 'retail'}">${typeLabel(o.type)}</span></td>
                    <td>${statusPill(o.status)}</td>
                    <td class="hide-mobile">${o.date}</td>
                    <td style="text-align:right;font-weight:600">$${o.total.toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== OWNER: CUSTOMERS ==========
    function renderCustomers() {
      const map = {};
      orders.forEach(o => {
        if (!map[o.customer]) map[o.customer] = { name: o.customer, orders: 0, total: 0, type: o.type };
        map[o.customer].orders++;
        map[o.customer].total += o.total;
      });
      const list = Object.values(map).sort((a, b) => b.total - a.total);

      return `
        <div class="page-header">
          <div>
            <h1>Customers</h1>
            <div class="subtitle">${list.length} customers · sorted by lifetime value</div>
          </div>
          <button class="btn">+ Add Customer</button>
        </div>

        <div class="panel">
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th class="hide-mobile">Type</th>
                  <th style="text-align:right">Orders</th>
                  <th style="text-align:right">Lifetime Value</th>
                </tr>
              </thead>
              <tbody>
                ${list.map(c => `
                  <tr style="cursor:pointer">
                    <td><div class="order-num">${c.name}</div></td>
                    <td class="hide-mobile"><span class="pill pill-${c.type === 'signed' ? 'signed' : c.type === 'commission' ? 'commission' : 'retail'}">${typeLabel(c.type)}</span></td>
                    <td style="text-align:right">${c.orders}</td>
                    <td style="text-align:right;font-weight:600">$${c.total.toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== OWNER: REPORTS ==========
    function renderReports() {
      const s = statSummary();
      const byType = {};
      orders.forEach(o => { byType[o.type] = (byType[o.type] || 0) + o.total; });

      return `
        <div class="page-header">
          <div>
            <h1>Reports</h1>
            <div class="subtitle">Revenue and sales breakdown</div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card green">
            <div class="label">Revenue (April)</div>
            <div class="value">$${s.monthRev.toLocaleString()}</div>
            <div class="delta">↑ 24% vs March</div>
          </div>
          <div class="stat-card blue">
            <div class="label">Avg Order Value</div>
            <div class="value">$${Math.round(s.monthRev / orders.length).toLocaleString()}</div>
            <div class="delta">↑ 8% vs March</div>
          </div>
          <div class="stat-card yellow">
            <div class="label">Signed Editions</div>
            <div class="value">${orders.filter(o => o.type === 'signed').length}</div>
            <div class="delta">$${(byType.signed || 0).toLocaleString()} from signed</div>
          </div>
          <div class="stat-card">
            <div class="label">Commissions</div>
            <div class="value">${orders.filter(o => o.type === 'commission').length}</div>
            <div class="delta">$${(byType.commission || 0).toLocaleString()} from commissions</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2>Revenue by Product Type</h2></div>
          <div class="panel-body" style="padding:24px">
            ${Object.entries(byType).map(([t, v]) => {
              const pct = Math.round((v / s.monthRev) * 100);
              return `
                <div style="margin-bottom:18px">
                  <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:6px">
                    <span style="font-weight:600;color:var(--auburn-navy)">${typeLabel(t)}</span>
                    <span style="color:var(--dark-stone)">$${v.toLocaleString()} · ${pct}%</span>
                  </div>
                  <div style="background:var(--cream);height:8px;border-radius:4px;overflow:hidden">
                    <div style="background:var(--auburn-orange);height:100%;width:${pct}%;border-radius:4px"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ========== JASON: OVERVIEW ==========
    function renderJasonOverview() {
      const signed = orders.filter(o => o.type === 'signed');
      const giveawayPool = orders.filter(o => o.type === 'signed').length;
      const s = statSummary();

      return `
        <div class="page-header">
          <div>
            <h1>Welcome back, Jason</h1>
            <div class="subtitle">Quick view of signed editions, giveaways, and recent activity</div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="label">Signed Orders</div>
            <div class="value">${signed.length}</div>
            <div class="delta">All-time signed editions</div>
          </div>
          <div class="stat-card yellow">
            <div class="label">Awaiting Signature</div>
            <div class="value">${signed.filter(o => o.status === 'pending').length}</div>
            <div class="delta">Need your signature</div>
          </div>
          <div class="stat-card green">
            <div class="label">Active Giveaway</div>
            <div class="value">10</div>
            <div class="delta">Prints, draws end 4/30</div>
          </div>
          <div class="stat-card blue">
            <div class="label">Revenue (April)</div>
            <div class="value">$${s.monthRev.toLocaleString()}</div>
            <div class="delta">From all orders</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2>Recent Signed Edition Orders</h2></div>
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Status</th>
                  <th class="hide-mobile">Date</th>
                  <th style="text-align:right">Total</th>
                </tr>
              </thead>
              <tbody>
                ${signed.map(o => `
                  <tr onclick="openOrder('${o.num}')" style="cursor:pointer">
                    <td><div class="order-num">${o.num}</div></td>
                    <td>${o.customer}</td>
                    <td>${statusPill(o.status)}</td>
                    <td class="hide-mobile">${o.date}</td>
                    <td style="text-align:right;font-weight:600">$${o.total.toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== JASON: SIGNED QUEUE ==========
    function renderSignedQueue() {
      const signed = orders.filter(o => o.type === 'signed' && o.status !== 'shipped');

      return `
        <div class="page-header">
          <div>
            <h1>Signed Editions Queue</h1>
            <div class="subtitle">Orders awaiting your signature, before they go to print</div>
          </div>
          <button class="btn">+ Schedule Signing Session</button>
        </div>

        <div class="panel">
          <div class="panel-body">
            ${signed.length === 0 ? '<div class="empty"><div class="ico">·</div>Nothing in the queue</div>' : `
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Print</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${signed.map(o => `
                  <tr>
                    <td><div class="order-num">${o.num}</div></td>
                    <td>${o.customer}</td>
                    <td>${o.products ? o.products[0].name : '—'}</td>
                    <td>${statusPill(o.status)}</td>
                    <td style="text-align:right"><button class="btn btn-sm" onclick="openOrder('${o.num}')">View</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`}
          </div>
        </div>
      `;
    }

    // ========== JASON: GIVEAWAYS ==========
    function renderGiveaways() {
      const giveaways = [
        { name: 'Jason Campbell · Sugar Bowl Print', status: 'active', entries: 1842, prints: 10, ends: '2026-04-30' },
        { name: 'Cam Newton · Heisman Print', status: 'draft', entries: 0, prints: 5, ends: '2026-05-30' },
        { name: 'Bo Jackson · 1985 Print', status: 'completed', entries: 2103, prints: 5, ends: '2026-03-30' }
      ];

      return `
        <div class="page-header">
          <div>
            <h1>Giveaways</h1>
            <div class="subtitle">Active and past giveaways across social channels</div>
          </div>
          <button class="btn">+ New Giveaway</button>
        </div>

        <div class="panel">
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Giveaway</th>
                  <th>Status</th>
                  <th style="text-align:right">Entries</th>
                  <th style="text-align:right" class="hide-mobile">Prints</th>
                  <th class="hide-mobile">Ends</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${giveaways.map(g => `
                  <tr>
                    <td><div class="order-num">${g.name}</div></td>
                    <td><span class="pill pill-${g.status === 'active' ? 'shipping' : g.status === 'draft' ? 'pending' : 'shipped'}">${g.status}</span></td>
                    <td style="text-align:right;font-weight:600">${g.entries.toLocaleString()}</td>
                    <td style="text-align:right" class="hide-mobile">${g.prints}</td>
                    <td class="hide-mobile">${g.ends}</td>
                    <td style="text-align:right"><button class="btn btn-sm btn-outline">Manage</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== FULFILLMENT: PRINT QUEUE ==========
    function renderPrintQueue() {
      const queue = orders.filter(o => o.status === 'pending' || o.status === 'printing');

      return `
        <div class="page-header">
          <div>
            <h1>Print Queue</h1>
            <div class="subtitle">${queue.length} orders ready to print</div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card red">
            <div class="label">Awaiting Approval</div>
            <div class="value">${orders.filter(o => o.status === 'pending').length}</div>
            <div class="delta">Need owner approval first</div>
          </div>
          <div class="stat-card yellow">
            <div class="label">Currently Printing</div>
            <div class="value">${orders.filter(o => o.status === 'printing').length}</div>
            <div class="delta">In production now</div>
          </div>
          <div class="stat-card blue">
            <div class="label">Rush Orders</div>
            <div class="value">${queue.filter(o => o.rush).length}</div>
            <div class="delta">Priority — print first</div>
          </div>
          <div class="stat-card">
            <div class="label">Total Items</div>
            <div class="value">${queue.reduce((a, b) => a + b.items, 0)}</div>
            <div class="delta">Prints to produce</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2>Queue (priority order)</h2></div>
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer / Notes</th>
                  <th style="text-align:right">Items</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${queue.sort((a, b) => (b.rush ? 1 : 0) - (a.rush ? 1 : 0)).map(o => `
                  <tr>
                    <td>
                      <div class="order-num">${o.num}</div>
                      ${o.rush ? '<span class="pill pill-rush" style="margin-top:4px;display:inline-block">Rush</span>' : ''}
                    </td>
                    <td>
                      ${o.customer}
                      ${o.products ? `<div class="product-mini">${o.products.map(p => p.qty + '× ' + p.specs).join(' · ')}</div>` : ''}
                    </td>
                    <td style="text-align:right;font-weight:600">${o.items}</td>
                    <td>${statusPill(o.status)}</td>
                    <td style="text-align:right"><button class="btn btn-sm" onclick="openOrder('${o.num}')">Open</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== FULFILLMENT: SHIP QUEUE ==========
    function renderShipQueue() {
      const queue = orders.filter(o => o.status === 'shipping');

      return `
        <div class="page-header">
          <div>
            <h1>Ready to Ship</h1>
            <div class="subtitle">${queue.length} orders printed and ready for labels</div>
          </div>
          <button class="btn">Print All Labels</button>
        </div>

        <div class="panel">
          <div class="panel-body">
            ${queue.length === 0 ? '<div class="empty"><div class="ico">·</div>Nothing waiting to ship</div>' : `
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Ship To</th>
                  <th style="text-align:right" class="hide-mobile">Items</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${queue.map(o => `
                  <tr>
                    <td>
                      <div class="order-num">${o.num}</div>
                      <div class="product-mini">${o.customer}</div>
                    </td>
                    <td><div style="white-space:pre-line;font-size:0.78rem">${o.address || '—'}</div></td>
                    <td style="text-align:right;font-weight:600" class="hide-mobile">${o.items}</td>
                    <td style="text-align:right">
                      <button class="btn btn-sm btn-outline" onclick="openOrder('${o.num}')">Open</button>
                      <button class="btn btn-sm">Print Label</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`}
          </div>
        </div>
      `;
    }

    // ========== FULFILLMENT: COMPLETED ==========
    function renderCompleted() {
      const done = orders.filter(o => o.status === 'shipped');

      return `
        <div class="page-header">
          <div>
            <h1>Completed Orders</h1>
            <div class="subtitle">Shipped — with tracking numbers</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th class="hide-mobile">Date</th>
                  <th>Tracking</th>
                </tr>
              </thead>
              <tbody>
                ${done.map(o => `
                  <tr>
                    <td><div class="order-num">${o.num}</div></td>
                    <td>${o.customer}</td>
                    <td class="hide-mobile">${o.date}</td>
                    <td style="font-family:monospace;font-size:0.75rem;color:var(--dark-stone)">${o.tracking || '—'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== ORDER DETAIL MODAL ==========
    function openOrder(num) {
      const o = orders.find(x => x.num === num);
      if (!o) return;
      document.getElementById('modalTitle').textContent = o.num;
      document.getElementById('modalSubtitle').innerHTML = `${o.customer} · ${o.date} · ${statusPill(o.status)}`;

      const body = document.getElementById('modalBody');
      body.innerHTML = `
        ${o.products ? `
          <div class="modal-section">
            <h3>Items (${o.items})</h3>
            ${o.products.map(p => `
              <div class="product-line">
                <div>
                  <div class="product-name">${p.name}</div>
                  <div class="product-specs">${p.specs} · SKU ${p.sku}</div>
                </div>
                <div style="font-weight:700;color:var(--auburn-navy)">×${p.qty}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${o.address ? `<div class="modal-section"><h3>Ship To</h3><div class="text">${o.address}</div></div>` : ''}
        ${o.notes ? `<div class="modal-section"><h3>Notes</h3><div class="text">${o.notes}</div></div>` : ''}
        ${o.tracking ? `<div class="modal-section"><h3>Tracking</h3><div class="text" style="font-family:monospace">${o.tracking}</div></div>` : ''}
        <div class="modal-section">
          <h3>Total</h3>
          <div style="font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--auburn-navy)">$${o.total.toLocaleString()}</div>
        </div>
      `;

      const footer = document.getElementById('modalFooter');
      if (o.status === 'pending') {
        footer.innerHTML = `<button class="btn btn-outline" onclick="closeModal()">Close</button><button class="btn">Approve & Send to Print</button>`;
      } else if (o.status === 'printing') {
        footer.innerHTML = `<button class="btn btn-outline" onclick="closeModal()">Close</button><button class="btn">Mark Ready to Ship</button>`;
      } else if (o.status === 'shipping') {
        footer.innerHTML = `<button class="btn btn-outline" onclick="closeModal()">Close</button><button class="btn">Print Label & Ship</button>`;
      } else {
        footer.innerHTML = `<button class="btn btn-outline" onclick="closeModal()">Close</button>`;
      }

      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal(e) {
      if (e && e.target.id !== 'modalOverlay' && e.target.className !== 'modal-close') return;
      document.getElementById('modalOverlay').classList.remove('open');
    }
  </script>
</body>
</html>
