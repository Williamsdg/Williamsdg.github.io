<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Plainsman Art</title>
  <meta property="og:title" content="Admin — Plainsman Art">
  <meta property="og:description" content="Internal admin for Plainsman Art.">
  <meta property="og:image" content="https://williamsdigital.io/og-plainsman-art.png">
  <meta property="og:url" content="https://williamsdigital.io/plainsman-art-admin">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --auburn-navy: #03244D;
      --auburn-navy-deep: #021833;
      --auburn-orange: #E87722;
      --auburn-orange-bright: #F58220;
      --burnt: #B5571A;
      --cream: #F7F3EC;
      --warm-white: #FBF8F3;
      --slate: #2A3340;
      --light-stone: #E8E2D5;
      --dark-stone: #6B6558;
      --bg: #F1ECE3;
      --red: #C85446;
      --yellow: #D4A12E;
      --green: #5A8A4A;
      --blue: #4A6FA5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--slate);
      background: var(--bg);
      font-size: 14px;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }

    /* ========== MOCK BANNER ========== */
    .mock-banner {
      background: var(--yellow);
      color: var(--auburn-navy);
      text-align: center;
      padding: 8px 16px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      position: relative;
      z-index: 50;
    }

    /* ========== LOGIN ========== */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at 20% 30%, rgba(232, 119, 34, 0.15), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(3, 36, 77, 0.08), transparent 55%),
        var(--bg);
    }

    .login-card {
      max-width: 440px;
      width: 100%;
      background: var(--warm-white);
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(3, 36, 77, 0.12);
      border-top: 4px solid var(--auburn-orange);
    }

    .login-card .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--auburn-navy);
    }

    .login-card .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 8px;
    }
    .login-card .divider .line { flex: 1; height: 1px; background: var(--auburn-orange); }
    .login-card .divider .star { width: 4px; height: 4px; background: var(--auburn-orange); transform: rotate(45deg); }

    .login-card .sub {
      font-size: 0.62rem;
      letter-spacing: 4.5px;
      text-transform: uppercase;
      color: var(--auburn-orange);
      font-weight: 700;
      margin-bottom: 28px;
    }

    .login-card .admin-badge {
      display: inline-block;
      padding: 6px 14px;
      background: var(--auburn-navy);
      color: var(--auburn-orange);
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 22px;
      font-weight: 700;
    }

    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--auburn-navy);
      margin-bottom: 22px;
    }

    .login-form { display: flex; flex-direction: column; gap: 12px; }

    .login-form input {
      padding: 14px 16px;
      border: 1px solid var(--light-stone);
      background: var(--warm-white);
      font-size: 0.85rem;
      color: var(--slate);
    }
    .login-form input:focus { outline: none; border-color: var(--auburn-orange); }

    .login-form button {
      padding: 14px;
      background: var(--auburn-orange);
      color: white;
      border: none;
      font-size: 0.74rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 6px;
    }
    .login-form button:hover { background: var(--auburn-orange-bright); }
    .login-form button:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-error {
      background: rgba(200, 84, 70, 0.1);
      color: var(--red);
      padding: 10px;
      font-size: 0.78rem;
      margin-top: 6px;
      display: none;
    }
    .login-error.show { display: block; }

    .login-screen.hidden { display: none; }

    /* ========== APP LAYOUT ========== */
    .app { display: none; }
    .app.active { display: block; }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      background: var(--auburn-navy);
      color: var(--cream);
      display: flex;
      flex-direction: column;
      padding: 28px 0 20px;
    }

    .sidebar-brand {
      padding: 0 24px 24px;
      border-bottom: 1px solid rgba(247, 243, 236, 0.1);
      margin-bottom: 18px;
    }

    .sidebar-brand .name {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .sidebar-brand .brand-divider { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sidebar-brand .brand-divider .line { flex: 1; height: 1px; background: var(--auburn-orange); }
    .sidebar-brand .brand-divider .star { width: 4px; height: 4px; background: var(--auburn-orange); transform: rotate(45deg); }

    .sidebar-brand .role-tag {
      font-size: 0.62rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--auburn-orange);
      font-weight: 600;
    }

    .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(247, 243, 236, 0.75);
      cursor: pointer;
      transition: all 0.25s;
      border-left: 3px solid transparent;
    }
    .sidebar-nav a:hover { color: var(--cream); background: rgba(232, 119, 34, 0.08); }
    .sidebar-nav a.active {
      color: var(--cream);
      background: rgba(232, 119, 34, 0.14);
      border-left-color: var(--auburn-orange);
    }
    .sidebar-nav a svg { width: 17px; height: 17px; flex-shrink: 0; }
    .sidebar-nav .badge {
      margin-left: auto;
      background: var(--auburn-orange);
      color: white;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .sidebar-footer {
      padding: 20px 24px 0;
      border-top: 1px solid rgba(247, 243, 236, 0.1);
    }
    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: rgba(247, 243, 236, 0.6);
      cursor: pointer;
      transition: color 0.3s;
    }
    .sidebar-footer a:hover { color: var(--auburn-orange); }
    .sidebar-footer svg { width: 16px; height: 16px; }

    /* ========== MAIN ========== */
    .main { padding: 32px 36px 60px; overflow-x: hidden; }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--auburn-navy);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .page-header .subtitle { font-size: 0.82rem; color: var(--dark-stone); }

    .btn {
      padding: 10px 20px;
      background: var(--auburn-orange);
      color: white;
      border: none;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover { background: var(--auburn-orange-bright); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: var(--auburn-navy);
      border: 1px solid var(--auburn-navy);
    }
    .btn-outline:hover { background: var(--auburn-navy); color: white; }

    .btn-sm { padding: 6px 12px; font-size: 0.65rem; letter-spacing: 1.5px; }

    .btn-danger { background: var(--red); }
    .btn-danger:hover { background: #a8453a; }

    /* ========== STATS ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--warm-white);
      padding: 20px 22px;
      border-left: 3px solid var(--auburn-orange);
      box-shadow: 0 2px 12px rgba(3, 36, 77, 0.05);
    }
    .stat-card .label {
      font-size: 0.65rem;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .stat-card .value {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--auburn-navy);
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-card .delta { font-size: 0.72rem; color: var(--dark-stone); font-weight: 500; }
    .stat-card.red { border-left-color: var(--red); }
    .stat-card.yellow { border-left-color: var(--yellow); }
    .stat-card.blue { border-left-color: var(--blue); }
    .stat-card.green { border-left-color: var(--green); }

    /* ========== PANEL ========== */
    .panel {
      background: var(--warm-white);
      box-shadow: 0 2px 12px rgba(3, 36, 77, 0.05);
      margin-bottom: 24px;
    }

    .panel-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--light-stone);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .panel-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--auburn-navy);
    }

    .panel-body { padding: 0; }
    .panel-body.padded { padding: 24px; }

    /* ========== TABLE ========== */
    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      padding: 14px 22px;
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 700;
      background: var(--cream);
      border-bottom: 1px solid var(--light-stone);
    }

    td {
      padding: 14px 22px;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--light-stone);
      color: var(--slate);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(232, 119, 34, 0.03); }

    .order-num {
      font-weight: 700;
      color: var(--auburn-navy);
      letter-spacing: 0.3px;
    }

    /* ========== STATUS PILLS ========== */
    .pill {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .pill-pending { background: rgba(200, 84, 70, 0.12); color: var(--red); }
    .pill-paid { background: rgba(74, 111, 165, 0.12); color: var(--blue); }
    .pill-printing { background: rgba(212, 161, 46, 0.15); color: var(--burnt); }
    .pill-shipped { background: rgba(90, 138, 74, 0.13); color: var(--green); }
    .pill-cancelled { background: var(--light-stone); color: var(--dark-stone); }
    .pill-active { background: rgba(90, 138, 74, 0.13); color: var(--green); }
    .pill-draft { background: rgba(212, 161, 46, 0.15); color: var(--burnt); }
    .pill-archived { background: var(--light-stone); color: var(--dark-stone); }

    /* ========== PRODUCTS GRID ========== */
    .paintings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      padding: 22px;
    }

    .painting-card {
      background: var(--warm-white);
      border: 1px solid var(--light-stone);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      overflow: hidden;
    }
    .painting-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(3, 36, 77, 0.08);
    }

    .painting-card .img {
      aspect-ratio: 1;
      background: var(--cream);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .painting-card .img-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: rgba(3, 36, 77, 0.2);
      font-weight: 700;
    }

    .painting-card .info { padding: 12px 14px 14px; }

    .painting-card h4 {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--auburn-navy);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .painting-card .meta {
      font-size: 0.7rem;
      color: var(--dark-stone);
      margin-bottom: 8px;
    }

    .painting-card .price-line {
      font-size: 0.78rem;
      color: var(--slate);
      font-weight: 600;
    }

    /* ========== UPLOAD MODAL / FORMS ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 24, 51, 0.6);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--warm-white);
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border-top: 4px solid var(--auburn-orange);
    }

    .modal-header {
      padding: 22px 26px;
      border-bottom: 1px solid var(--light-stone);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--auburn-navy);
    }
    .modal-header .sub { font-size: 0.72rem; color: var(--dark-stone); margin-top: 2px; }
    .modal-close {
      background: none; border: none; font-size: 1.6rem;
      color: var(--dark-stone); cursor: pointer; line-height: 1;
    }

    .modal-body { padding: 22px 26px; }

    .form-row { margin-bottom: 18px; }
    .form-row label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-row input, .form-row textarea, .form-row select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--light-stone);
      background: var(--warm-white);
      font-size: 0.85rem;
      color: var(--slate);
    }
    .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
      outline: none; border-color: var(--auburn-orange);
    }
    .form-row textarea { min-height: 80px; resize: vertical; font-family: inherit; }
    .form-row .help {
      font-size: 0.7rem;
      color: var(--dark-stone);
      margin-top: 4px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Variants editor */
    .variants-editor { margin-bottom: 18px; }
    .variants-editor label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dark-stone);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .variant-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
    }
    .variant-row input, .variant-row select {
      padding: 10px 12px;
      border: 1px solid var(--light-stone);
      background: var(--warm-white);
      font-size: 0.8rem;
    }
    .variant-row .remove {
      background: none;
      border: none;
      color: var(--red);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 8px;
    }
    .variants-add {
      margin-top: 6px;
      padding: 8px 14px;
      background: transparent;
      color: var(--auburn-navy);
      border: 1px dashed var(--auburn-navy);
      cursor: pointer;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .variants-add:hover { background: var(--auburn-navy); color: white; }

    /* Image upload */
    .image-upload {
      border: 2px dashed var(--light-stone);
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: var(--cream);
    }
    .image-upload:hover { border-color: var(--auburn-orange); background: rgba(232, 119, 34, 0.04); }
    .image-upload.has-file { border-style: solid; border-color: var(--green); }
    .image-upload input[type="file"] { display: none; }
    .image-upload .icon {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--auburn-orange);
      margin-bottom: 8px;
    }
    .image-upload .text { font-size: 0.82rem; color: var(--auburn-navy); font-weight: 600; }
    .image-upload .hint { font-size: 0.7rem; color: var(--dark-stone); margin-top: 4px; }
    .image-preview {
      max-width: 200px; max-height: 200px;
      margin: 12px auto 0;
      display: block;
      border: 1px solid var(--light-stone);
    }

    .modal-footer {
      padding: 16px 26px;
      border-top: 1px solid var(--light-stone);
      background: var(--cream);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* Order detail items */
    .product-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--light-stone);
      font-size: 0.84rem;
    }
    .product-line:last-child { border-bottom: none; }
    .product-line .product-name { font-weight: 600; color: var(--auburn-navy); }
    .product-line .product-specs { font-size: 0.72rem; color: var(--dark-stone); margin-top: 2px; }

    .modal-section { margin-bottom: 22px; }
    .modal-section h3 {
      font-size: 0.62rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--auburn-orange);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .modal-section p, .modal-section .text {
      font-size: 0.86rem;
      color: var(--slate);
      line-height: 1.6;
      white-space: pre-line;
    }

    /* ========== EMPTY STATE ========== */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--dark-stone);
      font-size: 0.9rem;
    }
    .empty .ico {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: rgba(3, 36, 77, 0.15);
      margin-bottom: 12px;
    }
    .empty h3 {
      font-family: 'Playfair Display', serif;
      color: var(--auburn-navy);
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--auburn-navy);
      color: white;
      padding: 14px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 9999;
      transform: translateY(140px);
      opacity: 0;
      transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }

    /* ========== MOBILE ========== */
    .mobile-toggle {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: var(--auburn-navy);
      color: var(--cream);
      border: none;
      padding: 10px 12px;
      cursor: pointer;
    }
    .mobile-toggle svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        top: 0; left: -260px;
        width: 240px;
        height: 100vh;
        z-index: 90;
        transition: left 0.3s;
      }
      .sidebar.open { left: 0; }
      .mobile-toggle { display: block; }
      .main { padding: 60px 18px 40px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .form-grid-2 { grid-template-columns: 1fr; gap: 0; }
      .variant-row { grid-template-columns: 1fr 1fr; }
      th, td { padding: 10px 14px; font-size: 0.74rem; }
      th { font-size: 0.55rem; letter-spacing: 1.2px; }
      .hide-mobile { display: none; }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ============ MOCK BANNER ============ -->
  <div class="mock-banner" id="mockBanner" style="display:none;">
    Demo Mode — Supabase not yet configured · Using sample data
  </div>

  <!-- ============ LOGIN ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="brand">Plainsman Art</div>
      <div class="divider">
        <span class="line"></span><span class="star"></span><span class="line"></span>
      </div>
      <div class="sub">Auburn · Original Prints</div>

      <div class="admin-badge">Admin Dashboard</div>
      <h1>Sign In</h1>

      <form class="login-form" onsubmit="login(event)">
        <input type="email" id="loginEmail" placeholder="you@plainsmanart.com" required>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
        <button type="submit" id="loginBtn">Sign In</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app">
    <button class="mobile-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="name">Plainsman Art</div>
          <div class="brand-divider">
            <span class="line"></span><span class="star"></span><span class="line"></span>
          </div>
          <div class="role-tag" id="sidebarUser">Mike — Owner</div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
          <a onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg>
            Sign Out
          </a>
        </div>
      </aside>

      <main class="main" id="mainContent"></main>
    </div>
  </div>

  <!-- ============ MODAL (shared) ============ -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalIfBackdrop(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle">Modal</h2>
          <div class="sub" id="modalSubtitle"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div class="toast" id="toast"></div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="plainsman-art/assets/js/supabase-config.js"></script>

  <script>
    // ========== STATE ==========
    let currentUser = null;
    let currentView = 'dashboard';
    let paintingsCache = [];
    let ordersCache = [];

    // ========== MOCK DATA (used when PA_MOCK_MODE) ==========
    const mockPaintings = [
      {
        id: 'p1', title: 'Toomer\'s Corner · After the Win', description: 'Classic Toomer\'s rolling shot.',
        category: 'historic', status: 'active', image_url: '',
        printify_product_id: null, created_at: '2026-04-20T10:00:00Z',
        variants: [
          { id: 'v1', size: '12x16', finish: 'print', price_cents: 22000 },
          { id: 'v2', size: '18x24', finish: 'print', price_cents: 28500 },
          { id: 'v3', size: '24x36', finish: 'framed', price_cents: 42000 }
        ]
      },
      {
        id: 'p2', title: 'Jordan-Hare Under the Lights', description: 'Night game over Pat Dye Field.',
        category: 'gameday', status: 'active', image_url: '',
        printify_product_id: null, created_at: '2026-04-18T10:00:00Z',
        variants: [
          { id: 'v4', size: '12x16', finish: 'print', price_cents: 24000 },

      {

        category: 'historic', status: 'active', image_url: '',
        printify_product_id: null, created_at: '2026-04-12T10:00:00Z',
        variants: [
          { id: 'v6', size: '12x16', finish: 'print', price_cents: 22000 },

      {

        category: 'ironbowl', status: 'draft', image_url: '',
        printify_product_id: null, created_at: '2026-04-08T10:00:00Z',
        variants: [
          { id: 'v8', size: '24x36', finish: 'framed', price_cents: 38500 }
        ]
      }
    ];

    const mockOrders = [
      {
        id: 'o1', order_num: 'PA-2026-0042', stripe_session_id: 'cs_test_a1', printify_order_id: null,
        customer_name: 'Wesley Crawford', customer_email: 'wes@example.com',
        ship_address: { line1: '1822 Heath Rd', city: 'Birmingham', state: 'AL', zip: '35243' },
        status: 'paid', total_cents: 28500, tracking_number: null, notes: 'Gift wrap requested',

        items: [{ painting_title: 'Toomer\'s Corner · After the Win', variant_size: '18x24', variant_finish: 'print', qty: 1, price_cents: 28500 }]
      },
      {
        id: 'o2', order_num: 'PA-2026-0041', stripe_session_id: 'cs_test_a2', printify_order_id: 'p_38211',
        customer_name: 'Erin McElroy', customer_email: 'erin@example.com',
        ship_address: { line1: '54 Pine Cone Ln', city: 'Mobile', state: 'AL', zip: '36608' },
        status: 'printing', total_cents: 52500, tracking_number: null, notes: '',
        created_at: '2026-05-03T11:00:00Z',
        items: [
          { painting_title: 'Toomer\'s Corner · After the Win', variant_size: '18x24', variant_finish: 'print', qty: 1, price_cents: 28500 },
          { painting_title: 'Samford Hall at Dusk', variant_size: '12x16', variant_finish: 'print', qty: 1, price_cents: 24000 }
        ]
      },
      {
        id: 'o3', order_num: 'PA-2026-0040', stripe_session_id: 'cs_test_a3', printify_order_id: 'p_38199',
        customer_name: 'Marisa Linden', customer_email: 'marisa@example.com',
        ship_address: { line1: '1133 Oak Hollow', city: 'Birmingham', state: 'AL', zip: '35223' },
        status: 'shipped', total_cents: 38500, tracking_number: '9405 5036 9930 0123 4501 27',
        notes: '', created_at: '2026-04-28T09:00:00Z',
        items: [{ painting_title: 'Kick Six · 2013', variant_size: '24x36', variant_finish: 'framed', qty: 1, price_cents: 38500 }]
      },
      {
        id: 'o4', order_num: 'PA-2026-0039', stripe_session_id: 'cs_test_a4', printify_order_id: 'p_38120',
        customer_name: 'Davis Holcomb', customer_email: 'davis@example.com',
        ship_address: { line1: '88 Riverview Cir', city: 'Montgomery', state: 'AL', zip: '36106' },
        status: 'shipped', total_cents: 24000, tracking_number: '9405 5036 9930 0123 4488 02',
        notes: '', created_at: '2026-04-22T13:00:00Z',
        items: [{ painting_title: 'Samford Hall at Dusk', variant_size: '12x16', variant_finish: 'print', qty: 1, price_cents: 24000 }]
      }
    ];

    // ========== INIT ==========
    window.addEventListener('DOMContentLoaded', async () => {
      if (PA_MOCK_MODE) {
        document.getElementById('mockBanner').style.display = 'block';
      }
      // Restore session
      if (!PA_MOCK_MODE && pa_db) {
        const { data } = await pa_db.auth.getSession();
        if (data.session) {
          currentUser = data.session.user;
          enterApp();
        }
      } else {
        // Mock: stay on login screen, but accept any creds
      }
    });

    // ========== AUTH ==========
    async function login(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        if (PA_MOCK_MODE) {
          await new Promise(r => setTimeout(r, 400));
          currentUser = { email };
        } else {
          const { data, error } = await pa_db.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentUser = data.user;
        }
        enterApp();
      } catch (err) {
        errEl.textContent = err.message || 'Sign in failed.';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    function enterApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.add('active');
      document.getElementById('sidebarUser').textContent =
        (currentUser && currentUser.email ? currentUser.email.split('@')[0] : 'Mike') + ' — Owner';
      renderSidebar();
      navTo('dashboard');
    }

    async function logout() {
      if (!PA_MOCK_MODE && pa_db) {
        await pa_db.auth.signOut();
      }
      currentUser = null;
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('app').classList.remove('active');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // ========== ICONS ==========
    const icons = {
      dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
      paintings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M9 5H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2h-4M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>',
      settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>'
    };

    // ========== SIDEBAR ==========
    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      const pendingCount = ordersCache.filter(o => o.status === 'paid' || o.status === 'pending').length;
      nav.innerHTML = `
        <a class="${currentView==='dashboard'?'active':''}" data-view="dashboard" onclick="navSwitch(this)">${icons.dash} Dashboard</a>
        <a class="${currentView==='paintings'?'active':''}" data-view="paintings" onclick="navSwitch(this)">${icons.paintings} Paintings</a>
        <a class="${currentView==='orders'?'active':''}" data-view="orders" onclick="navSwitch(this)">${icons.orders} Orders ${pendingCount ? `<span class="badge">${pendingCount}</span>` : ''}</a>
        <a class="${currentView==='settings'?'active':''}" data-view="settings" onclick="navSwitch(this)">${icons.settings} Settings</a>
      `;
    }

    function navSwitch(el) {
      navTo(el.dataset.view);
      if (window.innerWidth <= 980) toggleSidebar();
    }

    async function navTo(view) {
      currentView = view;
      renderSidebar();
      const main = document.getElementById('mainContent');
      main.innerHTML = '<div class="empty"><div class="ico">·</div>Loading…</div>';
      window.scrollTo(0, 0);

      if (view === 'dashboard') await renderDashboard();
      else if (view === 'paintings') await renderPaintings();
      else if (view === 'orders') await renderOrders();
      else if (view === 'settings') renderSettings();
    }

    // ========== DATA ACCESS ==========
    async function loadPaintings() {
      if (PA_MOCK_MODE) {
        paintingsCache = [...mockPaintings];
        return paintingsCache;
      }
      const { data: p, error } = await pa_db
        .from('paintings')
        .select('*, painting_variants(*)')
        .order('created_at', { ascending: false });
      if (error) { toast(error.message, 'error'); return []; }
      paintingsCache = (p || []).map(row => ({
        ...row,
        variants: row.painting_variants || []
      }));
      return paintingsCache;
    }

    async function loadOrders() {
      if (PA_MOCK_MODE) {
        ordersCache = [...mockOrders];
        return ordersCache;
      }
      const { data: o, error } = await pa_db
        .from('orders')
        .select('*, order_items(*)')
        .order('created_at', { ascending: false });
      if (error) { toast(error.message, 'error'); return []; }
      ordersCache = (o || []).map(row => ({ ...row, items: row.order_items || [] }));
      return ordersCache;
    }

    // ========== DASHBOARD ==========
    async function renderDashboard() {
      await Promise.all([loadPaintings(), loadOrders()]);
      renderSidebar();

      const totalRev = ordersCache
        .filter(o => o.status !== 'cancelled' && o.status !== 'pending')
        .reduce((sum, o) => sum + (o.total_cents || 0), 0);
      const monthRev = ordersCache
        .filter(o => o.status !== 'cancelled' && o.status !== 'pending' &&
          new Date(o.created_at).getMonth() === new Date().getMonth())
        .reduce((sum, o) => sum + (o.total_cents || 0), 0);
      const pendingOrders = ordersCache.filter(o => o.status === 'paid').length;
      const activePaintings = paintingsCache.filter(p => p.status === 'active').length;

      document.getElementById('mainContent').innerHTML = `
        <div class="page-header">
          <div>
            <h1>Welcome back, ${(currentUser?.email || 'Mike').split('@')[0]}</h1>
            <div class="subtitle">Here's what's happening at Plainsman Art</div>
          </div>
          <button class="btn" onclick="navTo('paintings');setTimeout(openUploadModal,50)">+ Upload Painting</button>
        </div>

        <div class="stats-row">
          <div class="stat-card green">
            <div class="label">Revenue (this month)</div>
            <div class="value">$${(monthRev/100).toLocaleString(undefined,{maximumFractionDigits:0})}</div>
            <div class="delta">From paid orders</div>
          </div>
          <div class="stat-card red">
            <div class="label">Awaiting Fulfillment</div>
            <div class="value">${pendingOrders}</div>
            <div class="delta">Paid · waiting on Printify</div>
          </div>
          <div class="stat-card blue">
            <div class="label">Active Paintings</div>
            <div class="value">${activePaintings}</div>
            <div class="delta">${paintingsCache.length} total in catalog</div>
          </div>
          <div class="stat-card yellow">
            <div class="label">Lifetime Revenue</div>
            <div class="value">$${(totalRev/100).toLocaleString(undefined,{maximumFractionDigits:0})}</div>
            <div class="delta">All-time, paid orders</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Recent Orders</h2>
            <button class="btn btn-outline btn-sm" onclick="navTo('orders')">View All →</button>
          </div>
          <div class="panel-body">
            ${ordersCache.length === 0 ? `
              <div class="empty">
                <div class="ico">·</div>
                <h3>No orders yet</h3>
                <p>When customers buy a print, orders will appear here.</p>
              </div>
            ` : `
              <table>
                <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th class="hide-mobile">Date</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>
                  ${ordersCache.slice(0, 5).map(o => `
                    <tr onclick="openOrderDetail('${o.id}')" style="cursor:pointer">
                      <td><div class="order-num">${o.order_num || o.id.slice(0,8)}</div></td>
                      <td>${o.customer_name || '—'}</td>
                      <td>${statusPill(o.status)}</td>
                      <td class="hide-mobile">${formatDate(o.created_at)}</td>
                      <td style="text-align:right;font-weight:600">$${(o.total_cents/100).toFixed(2)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            `}
          </div>
        </div>
      `;
    }

    // ========== PAINTINGS ==========
    async function renderPaintings() {
      await loadPaintings();
      renderSidebar();

      document.getElementById('mainContent').innerHTML = `
        <div class="page-header">
          <div>
            <h1>Paintings</h1>
            <div class="subtitle">Your catalog of prints — ${paintingsCache.length} total</div>
          </div>
          <button class="btn" onclick="openUploadModal()">+ Upload Painting</button>
        </div>

        <div class="panel">
          ${paintingsCache.length === 0 ? `
            <div class="empty">
              <div class="ico">·</div>
              <h3>No paintings yet</h3>
              <p>Upload your first piece to get started.</p>
              <button class="btn" style="margin-top:14px" onclick="openUploadModal()">+ Upload Painting</button>
            </div>
          ` : `
            <div class="paintings-grid">
              ${paintingsCache.map(p => {
                const lowest = (p.variants || []).reduce((min, v) => v.price_cents < min ? v.price_cents : min, Infinity);
                const sizes = (p.variants || []).length;
                return `
                  <div class="painting-card" onclick="openPaintingDetail('${p.id}')">
                    <div class="img" style="${p.image_url ? `background-image:url('${p.image_url}')` : ''}">
                      ${!p.image_url ? `<div class="img-fallback">${p.title.charAt(0)}</div>` : ''}
                    </div>
                    <div class="info">
                      <h4>${escapeHtml(p.title)}</h4>
                      <div class="meta">
                        ${categoryLabel(p.category)} · ${statusPillSm(p.status)}
                      </div>
                      <div class="price-line">
                        ${sizes ? `${sizes} ${sizes===1?'size':'sizes'} · from $${(lowest/100).toFixed(0)}` : 'No variants'}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // ========== UPLOAD MODAL ==========
    let uploadFile = null;
    let editingPaintingId = null;

    function openUploadModal(painting = null) {
      editingPaintingId = painting ? painting.id : null;
      uploadFile = null;
      const isEdit = !!painting;

      document.getElementById('modalTitle').textContent = isEdit ? 'Edit Painting' : 'Upload Painting';
      document.getElementById('modalSubtitle').textContent = isEdit ? 'Update artwork, pricing, or status' : 'Add a new piece to your catalog';

      const variantRows = (painting?.variants?.length ? painting.variants : [{ size: '12x16', finish: 'print', price_cents: 22000 }])
        .map((v, i) => variantRowHtml(i, v)).join('');

      document.getElementById('modalBody').innerHTML = `
        <form id="paintingForm" onsubmit="savePainting(event)">
          <div class="form-row">
            <label>Painting Image ${isEdit ? '(leave empty to keep current)' : ''}</label>
            <label class="image-upload" id="imageDropzone">
              <input type="file" accept="image/*" onchange="handleImagePick(event)">
              <div class="icon">+</div>
              <div class="text" id="imageDropText">Click to upload high-res image</div>
              <div class="hint">300 DPI recommended for large prints · max 50 MB</div>
              ${painting?.image_url ? `<img src="${painting.image_url}" class="image-preview">` : ''}
            </label>
          </div>

          <div class="form-row">
            <label>Title</label>
            <input type="text" id="painting_title" required value="${painting ? escapeAttr(painting.title) : ''}" placeholder="e.g. Toomer's Corner · After the Win">
          </div>

          <div class="form-row">
            <label>Description</label>
            <textarea id="painting_description" placeholder="Optional — shown on the storefront product page">${painting ? escapeHtml(painting.description || '') : ''}</textarea>
          </div>

          <div class="form-grid-2">
            <div class="form-row">
              <label>Category</label>
              <select id="painting_category">
                ${['gameday','historic','signed','skylines','ironbowl','commission'].map(c =>
                  `<option value="${c}" ${painting?.category===c?'selected':''}>${categoryLabel(c)}</option>`
                ).join('')}
              </select>
            </div>
            <div class="form-row">
              <label>Status</label>
              <select id="painting_status">
                <option value="active" ${painting?.status==='active'?'selected':''}>Active (visible on store)</option>
                <option value="draft" ${(!painting||painting?.status==='draft')?'selected':''}>Draft (hidden)</option>
                <option value="archived" ${painting?.status==='archived'?'selected':''}>Archived</option>
              </select>
            </div>
          </div>

          <div class="variants-editor">
            <label>Sizes &amp; Pricing</label>
            <div id="variantsList">${variantRows}</div>
            <button type="button" class="variants-add" onclick="addVariantRow()">+ Add Size</button>
          </div>
        </form>
      `;

      document.getElementById('modalFooter').innerHTML = `
        ${isEdit ? `<button class="btn btn-danger btn-sm" onclick="deletePainting('${painting.id}')">Delete</button>` : ''}
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="document.getElementById('paintingForm').requestSubmit()">${isEdit ? 'Save Changes' : 'Upload Painting'}</button>
      `;

      document.getElementById('modalOverlay').classList.add('open');
    }

    function variantRowHtml(idx, v) {
      return `
        <div class="variant-row" data-idx="${idx}">
          <select class="v-size">
            ${['8x10','11x14','12x12','12x16','16x20','18x24','24x36','30x40'].map(s =>
              `<option value="${s}" ${v?.size===s?'selected':''}>${s}</option>`
            ).join('')}
          </select>
          <select class="v-finish">
            ${[['print','Print'],['canvas','Canvas'],['framed','Framed']].map(([val,label]) =>
              `<option value="${val}" ${v?.finish===val?'selected':''}>${label}</option>`
            ).join('')}
          </select>
          <input type="number" class="v-price" min="1" step="1" placeholder="Price" value="${v?.price_cents ? (v.price_cents/100) : ''}">
          <button type="button" class="remove" onclick="this.parentElement.remove()" title="Remove">&times;</button>
        </div>
      `;
    }

    function addVariantRow() {
      const list = document.getElementById('variantsList');
      const idx = list.children.length;
      list.insertAdjacentHTML('beforeend', variantRowHtml(idx, { size: '12x16', finish: 'print', price_cents: 22000 }));
    }

    function handleImagePick(e) {
      const file = e.target.files[0];
      if (!file) return;
      uploadFile = file;
      const dropzone = document.getElementById('imageDropzone');
      dropzone.classList.add('has-file');
      document.getElementById('imageDropText').textContent = file.name;
      // preview
      const reader = new FileReader();
      reader.onload = ev => {
        let preview = dropzone.querySelector('.image-preview');
        if (!preview) {
          preview = document.createElement('img');
          preview.className = 'image-preview';
          dropzone.appendChild(preview);
        }
        preview.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function savePainting(e) {
      e.preventDefault();
      const title = document.getElementById('painting_title').value.trim();
      const description = document.getElementById('painting_description').value.trim();
      const category = document.getElementById('painting_category').value;
      const status = document.getElementById('painting_status').value;

      const variants = [...document.querySelectorAll('#variantsList .variant-row')].map(row => ({
        size: row.querySelector('.v-size').value,
        finish: row.querySelector('.v-finish').value,
        price_cents: Math.round(parseFloat(row.querySelector('.v-price').value || 0) * 100)
      })).filter(v => v.price_cents > 0);

      if (!title) { toast('Title is required', 'error'); return; }
      if (variants.length === 0) { toast('Add at least one size with a price', 'error'); return; }
      if (!editingPaintingId && !uploadFile) { toast('Please upload an image', 'error'); return; }

      try {
        if (PA_MOCK_MODE) {
          await new Promise(r => setTimeout(r, 500));
          if (editingPaintingId) {
            const idx = mockPaintings.findIndex(p => p.id === editingPaintingId);
            if (idx >= 0) {
              mockPaintings[idx] = {
                ...mockPaintings[idx],
                title, description, category, status,
                variants: variants.map((v,i) => ({ ...v, id: 'v_'+Math.random().toString(36).slice(2,8) }))
              };
            }
          } else {
            mockPaintings.unshift({
              id: 'p_'+Math.random().toString(36).slice(2,8),
              title, description, category, status,
              image_url: uploadFile ? URL.createObjectURL(uploadFile) : '',
              printify_product_id: null,
              created_at: new Date().toISOString(),
              variants: variants.map(v => ({ ...v, id: 'v_'+Math.random().toString(36).slice(2,8) }))
            });
          }
          closeModal();
          toast(editingPaintingId ? 'Painting updated' : 'Painting uploaded', 'success');
          renderPaintings();
          return;
        }

        let imageUrl = null;
        if (uploadFile) {
          const path = `paintings/${Date.now()}-${uploadFile.name.replace(/[^a-z0-9.-]/gi,'_')}`;
          const { error: upErr } = await pa_db.storage.from('paintings').upload(path, uploadFile);
          if (upErr) throw upErr;
          const { data: urlData } = pa_db.storage.from('paintings').getPublicUrl(path);
          imageUrl = urlData.publicUrl;
        }

        if (editingPaintingId) {
          const update = { title, description, category, status };
          if (imageUrl) update.image_url = imageUrl;
          const { error } = await pa_db.from('paintings').update(update).eq('id', editingPaintingId);
          if (error) throw error;
          // Replace variants
          await pa_db.from('painting_variants').delete().eq('painting_id', editingPaintingId);
          await pa_db.from('painting_variants').insert(variants.map(v => ({ ...v, painting_id: editingPaintingId })));
        } else {
          const { data, error } = await pa_db.from('paintings').insert({
            title, description, category, status, image_url: imageUrl
          }).select().single();
          if (error) throw error;
          await pa_db.from('painting_variants').insert(variants.map(v => ({ ...v, painting_id: data.id })));
        }

        closeModal();
        toast(editingPaintingId ? 'Painting updated' : 'Painting uploaded', 'success');
        renderPaintings();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
      }
    }

    function openPaintingDetail(id) {
      const p = paintingsCache.find(x => x.id === id);
      if (p) openUploadModal(p);
    }

    async function deletePainting(id) {
      if (!confirm('Delete this painting? This cannot be undone.')) return;
      try {
        if (PA_MOCK_MODE) {
          const idx = mockPaintings.findIndex(p => p.id === id);
          if (idx >= 0) mockPaintings.splice(idx, 1);
        } else {
          const { error } = await pa_db.from('paintings').delete().eq('id', id);
          if (error) throw error;
        }
        closeModal();
        toast('Painting deleted', 'success');
        renderPaintings();
      } catch (err) {
        toast(err.message || 'Delete failed', 'error');
      }
    }

    // ========== ORDERS ==========
    async function renderOrders() {
      await loadOrders();
      renderSidebar();

      document.getElementById('mainContent').innerHTML = `
        <div class="page-header">
          <div>
            <h1>Orders</h1>
            <div class="subtitle">${ordersCache.length} orders · sorted by most recent</div>
          </div>
        </div>

        <div class="panel">
          ${ordersCache.length === 0 ? `
            <div class="empty">
              <div class="ico">·</div>
              <h3>No orders yet</h3>
              <p>When customers buy a print, orders will appear here.</p>
            </div>
          ` : `
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Status</th>
                  <th class="hide-mobile">Date</th>
                  <th class="hide-mobile">Tracking</th>
                  <th style="text-align:right">Total</th>
                </tr>
              </thead>
              <tbody>
                ${ordersCache.map(o => `
                  <tr onclick="openOrderDetail('${o.id}')" style="cursor:pointer">
                    <td>
                      <div class="order-num">${o.order_num || o.id.slice(0,8)}</div>
                      <div style="font-size:0.7rem;color:var(--dark-stone);margin-top:2px">${(o.items||[]).length} ${(o.items||[]).length===1?'item':'items'}</div>
                    </td>
                    <td>${o.customer_name || '—'}</td>
                    <td>${statusPill(o.status)}</td>
                    <td class="hide-mobile">${formatDate(o.created_at)}</td>
                    <td class="hide-mobile" style="font-family:monospace;font-size:0.72rem;color:var(--dark-stone)">${o.tracking_number || '—'}</td>
                    <td style="text-align:right;font-weight:600">$${(o.total_cents/100).toFixed(2)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        </div>
      `;
    }

    function openOrderDetail(id) {
      const o = ordersCache.find(x => x.id === id);
      if (!o) return;
      document.getElementById('modalTitle').textContent = o.order_num || o.id;
      document.getElementById('modalSubtitle').innerHTML = `${o.customer_name || ''} · ${formatDate(o.created_at)} · ${statusPill(o.status)}`;

      const addr = o.ship_address || {};
      document.getElementById('modalBody').innerHTML = `
        ${o.items && o.items.length ? `
          <div class="modal-section">
            <h3>Items (${o.items.length})</h3>
            ${o.items.map(it => `
              <div class="product-line">
                <div>
                  <div class="product-name">${escapeHtml(it.painting_title || '—')}</div>
                  <div class="product-specs">${it.variant_size || ''} · ${it.variant_finish || ''}</div>
                </div>
                <div style="text-align:right">
                  <div style="font-weight:700;color:var(--auburn-navy)">×${it.qty}</div>
                  <div style="font-size:0.75rem;color:var(--dark-stone)">$${(it.price_cents/100).toFixed(2)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${o.customer_email ? `
          <div class="modal-section">
            <h3>Customer</h3>
            <div class="text">${escapeHtml(o.customer_name || '')}<br>${escapeHtml(o.customer_email)}</div>
          </div>
        ` : ''}

        ${addr.line1 ? `
          <div class="modal-section">
            <h3>Ship To</h3>
            <div class="text">${escapeHtml(addr.line1)}${addr.line2 ? '\n' + escapeHtml(addr.line2) : ''}\n${escapeHtml(addr.city||'')}, ${escapeHtml(addr.state||'')} ${escapeHtml(addr.zip||'')}</div>
          </div>
        ` : ''}

        ${o.tracking_number ? `
          <div class="modal-section">
            <h3>Tracking</h3>
            <div class="text" style="font-family:monospace">${escapeHtml(o.tracking_number)}</div>
          </div>
        ` : ''}

        ${o.printify_order_id ? `
          <div class="modal-section">
            <h3>Printify Order</h3>
            <div class="text" style="font-family:monospace">${escapeHtml(o.printify_order_id)}</div>
          </div>
        ` : ''}

        ${o.notes ? `
          <div class="modal-section">
            <h3>Notes</h3>
            <div class="text">${escapeHtml(o.notes)}</div>
          </div>
        ` : ''}

        <div class="modal-section">
          <h3>Total</h3>
          <div style="font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--auburn-navy)">$${(o.total_cents/100).toFixed(2)}</div>
        </div>
      `;
      document.getElementById('modalFooter').innerHTML = `
        <button class="btn btn-outline" onclick="closeModal()">Close</button>
      `;
      document.getElementById('modalOverlay').classList.add('open');
    }

    // ========== SETTINGS ==========
    function renderSettings() {
      document.getElementById('mainContent').innerHTML = `
        <div class="page-header">
          <div>
            <h1>Settings</h1>
            <div class="subtitle">Integration status and configuration</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2>Integration Status</h2></div>
          <div class="panel-body padded">
            <div style="display:grid;gap:14px">
              ${integrationRow('Supabase', PA_MOCK_MODE ? 'not-configured' : 'connected', PA_MOCK_MODE ? 'Add SUPABASE_URL and SUPABASE_ANON_KEY in plainsman-art/assets/js/supabase-config.js' : 'Authenticated as ' + (currentUser?.email || ''))}
              ${integrationRow('Stripe', 'pending', 'Webhook endpoint and secret key need to be added to the Vercel webhook handler')}
              ${integrationRow('Printify', 'pending', 'API token and shop ID need to be added to the Vercel webhook handler')}
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2>Account</h2></div>
          <div class="panel-body padded">
            <div style="font-size:0.85rem;color:var(--slate);margin-bottom:8px">
              <strong>Signed in as:</strong> ${currentUser?.email || 'Mike'}
            </div>
            <button class="btn btn-outline" onclick="logout()">Sign Out</button>
          </div>
        </div>
      `;
    }

    function integrationRow(name, status, note) {
      const colors = {
        connected: { bg: 'rgba(90,138,74,0.13)', fg: 'var(--green)', label: 'Connected' },
        pending: { bg: 'rgba(212,161,46,0.15)', fg: 'var(--burnt)', label: 'Pending' },
        'not-configured': { bg: 'rgba(200,84,70,0.12)', fg: 'var(--red)', label: 'Not Configured' }
      };
      const c = colors[status];
      return `
        <div style="display:flex;align-items:center;gap:16px;padding:14px;border:1px solid var(--light-stone);background:var(--cream)">
          <div style="width:40px;height:40px;background:${c.bg};color:${c.fg};display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700">${name.charAt(0)}</div>
          <div style="flex:1">
            <div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--auburn-navy);font-weight:600">${name}</div>
            <div style="font-size:0.78rem;color:var(--dark-stone);margin-top:2px">${note}</div>
          </div>
          <span class="pill" style="background:${c.bg};color:${c.fg}">${c.label}</span>
        </div>
      `;
    }

    // ========== HELPERS ==========
    function statusPill(s) {
      const map = {
        pending: 'Pending Payment',
        paid: 'Paid',
        printing: 'Printing',
        shipped: 'Shipped',
        cancelled: 'Cancelled'
      };
      return `<span class="pill pill-${s}">${map[s] || s}</span>`;
    }

    function statusPillSm(s) {
      return `<span class="pill pill-${s}" style="font-size:0.55rem;padding:2px 6px">${s}</span>`;
    }

    function categoryLabel(c) {
      const map = {
        gameday: 'Gameday',
        historic: 'Historic',
        signed: 'Signed',
        skylines: 'Skylines',
        ironbowl: 'Iron Bowl',
        commission: 'Commission'
      };
      return map[c] || c;
    }

    function formatDate(s) {
      if (!s) return '—';
      const d = new Date(s);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }
    function closeModalIfBackdrop(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => el.classList.remove('show'), 3000);
    }
  </script>
</body>
