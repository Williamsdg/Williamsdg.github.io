<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fulfillment Dashboard — Shannon Harris Art</title>
  <meta property="og:title" content="Fulfillment Dashboard — Shannon Harris Art">
  <meta property="og:description" content="Internal order management dashboard for Shannon Harris Art.">
  <meta property="og:image" content="https://williamsdigital.io/og-shannon-harris.png">
  <meta property="og:url" content="https://williamsdigital.io/shannon-harris-art-admin">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --warm-cream: #FAF6F1;
      --soft-taupe: #C4B5A4;
      --deep-charcoal: #2C2C2C;
      --muted-gold: #C8A96E;
      --sage-green: #8B9A7E;
      --blush: #D4A89A;
      --off-white: #FEFDFB;
      --light-taupe: #E8DFD4;
      --auburn-orange: #E87722;
      --auburn-navy: #03244D;
      --red: #C85446;
      --yellow: #D4A12E;
      --green: #5A8A4A;
      --blue: #4A6FA5;
      --bg: #F5F1EC;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      color: var(--deep-charcoal);
      background: var(--bg);
      font-size: 14px;
    }

    /* ========== LOGIN ========== */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      max-width: 460px;
      width: 100%;
      background: var(--off-white);
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 2px 30px rgba(0,0,0,0.08);
    }

    .login-card .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .login-card .divider {
      width: 40px;
      height: 1px;
      background: var(--muted-gold);
      margin: 10px auto 8px;
    }

    .login-card .sub {
      font-size: 0.6rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--soft-taupe);
      margin-bottom: 30px;
    }

    .admin-badge {
      display: inline-block;
      padding: 6px 14px;
      background: var(--deep-charcoal);
      color: var(--muted-gold);
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .login-card h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .role-select {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .role-option {
      padding: 14px 8px;
      border: 2px solid var(--light-taupe);
      background: var(--warm-cream);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .role-option:hover {
      border-color: var(--muted-gold);
    }

    .role-option.active {
      border-color: var(--deep-charcoal);
      background: var(--deep-charcoal);
      color: var(--off-white);
    }

    .role-option .role-name {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .role-option .role-desc {
      font-size: 0.62rem;
      opacity: 0.7;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-form input {
      padding: 12px 14px;
      border: 1px solid var(--light-taupe);
      background: var(--warm-cream);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      outline: none;
    }

    .login-form input:focus {
      border-color: var(--muted-gold);
    }

    .login-form button {
      padding: 14px;
      background: var(--deep-charcoal);
      color: var(--off-white);
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.3s;
    }

    .login-form button:hover { background: var(--muted-gold); }

    /* ========== APP LAYOUT ========== */
    .app {
      display: none;
      min-height: 100vh;
    }

    .app.active { display: flex; }
    .login-screen.hidden { display: none; }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 240px;
      background: var(--deep-charcoal);
      color: var(--off-white);
      padding: 24px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-brand {
      padding: 0 24px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-brand .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .sidebar-brand .role-tag {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      background: var(--muted-gold);
      color: var(--deep-charcoal);
      font-size: 0.58rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .sidebar-nav {
      padding: 20px 0;
      flex: 1;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .sidebar-nav a:hover {
      color: white;
      background: rgba(255,255,255,0.04);
    }

    .sidebar-nav a.active {
      color: white;
      background: rgba(255,255,255,0.06);
      border-left-color: var(--muted-gold);
    }

    .sidebar-nav a svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.8;
    }

    .sidebar-nav .badge {
      margin-left: auto;
      background: var(--auburn-orange);
      color: white;
      font-size: 0.6rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-footer a {
      color: rgba(255,255,255,0.4);
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-footer a:hover { color: white; }

    /* ========== MAIN ========== */
    .main {
      flex: 1;
      padding: 30px 40px;
      max-width: 100%;
      overflow-x: hidden;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .page-header .subtitle {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #999;
      font-weight: 500;
      margin-top: 4px;
    }

    /* ========== STATS ROW ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--off-white);
      padding: 20px;
      border-left: 3px solid var(--muted-gold);
    }

    .stat-card.red { border-left-color: var(--red); }
    .stat-card.yellow { border-left-color: var(--yellow); }
    .stat-card.blue { border-left-color: var(--blue); }
    .stat-card.green { border-left-color: var(--green); }

    .stat-card .label {
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #999;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 500;
      line-height: 1;
    }

    .stat-card .delta {
      font-size: 0.7rem;
      color: var(--green);
      margin-top: 6px;
      font-weight: 500;
    }

    /* ========== VIEWS ========== */
    .view { display: none; }
    .view.active { display: block; }

    /* ========== PIPELINE (Kanban) ========== */
    .pipeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      min-height: 60vh;
    }

    .pipeline-column {
      background: var(--off-white);
      padding: 16px;
      border-top: 3px solid var(--light-taupe);
    }

    .pipeline-column.pending { border-top-color: var(--red); }
    .pipeline-column.printing { border-top-color: var(--yellow); }
    .pipeline-column.shipping { border-top-color: var(--blue); }
    .pipeline-column.complete { border-top-color: var(--green); }

    .pipeline-column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--light-taupe);
    }

    .pipeline-column-header h3 {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .col-count {
      background: var(--warm-cream);
      padding: 3px 10px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #666;
    }

    .order-card {
      background: var(--warm-cream);
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: all 0.3s;
    }

    .order-card:hover {
      border-left-color: var(--muted-gold);
      transform: translateX(3px);
    }

    .order-card.rush { border-left-color: var(--red); background: #FDEDEC; }
    .order-card.auburn { border-left-color: var(--auburn-navy); }
    .order-card.warning { border-left-color: var(--yellow); background: #FDF6E3; }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .order-num {
      font-family: 'Montserrat', monospace;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .order-tags { display: flex; gap: 4px; flex-wrap: wrap; }

    .mini-tag {
      font-size: 0.58rem;
      padding: 2px 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .mini-tag.rush { background: var(--red); color: white; }
    .mini-tag.auburn { background: var(--auburn-navy); color: var(--auburn-orange); }
    .mini-tag.retail { background: var(--sage-green); color: white; }

    .order-card .customer {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .order-card .items {
      font-size: 0.72rem;
      color: #666;
      margin-bottom: 8px;
    }

    .order-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px dashed var(--light-taupe);
    }

    .sla-timer {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .sla-timer svg { width: 12px; height: 12px; }
    .sla-timer.green { color: var(--green); }
    .sla-timer.yellow { color: var(--yellow); }
    .sla-timer.red { color: var(--red); }

    .order-total {
      font-weight: 600;
      font-size: 0.82rem;
    }

    /* ========== TABLE VIEW ========== */
    .data-table {
      background: var(--off-white);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead { background: var(--warm-cream); }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: #666;
      border-bottom: 1px solid var(--light-taupe);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--light-taupe);
    }

    tr:hover td { background: rgba(250, 246, 241, 0.5); }
    tr:last-child td { border-bottom: none; }

    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      font-size: 0.58rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .status-pill.pending { background: #FCE8DE; color: #9D4B1E; }
    .status-pill.printing { background: #FFF4DB; color: #8B6A14; }
    .status-pill.shipping { background: #DAE5F1; color: #2A4870; }
    .status-pill.shipped { background: #E1EAD8; color: #3F5F30; }
    .status-pill.delivered { background: #DFE8DA; color: #3F5F30; }

    .btn {
      padding: 7px 14px;
      background: var(--deep-charcoal);
      color: white;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover { background: var(--muted-gold); }
    .btn.secondary { background: var(--warm-cream); color: var(--deep-charcoal); border: 1px solid var(--light-taupe); }
    .btn.secondary:hover { background: var(--light-taupe); }
    .btn.approve { background: var(--green); }
    .btn.approve:hover { background: #3F5F30; }
    .btn.print { background: var(--blue); }
    .btn.print:hover { background: #2A4870; }
    .btn.ship { background: var(--auburn-orange); }
    .btn.ship:hover { background: #B85F14; }

    /* ========== PRINTER / SHIPPER QUEUES ========== */
    .queue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 16px;
    }

    .queue-card {
      background: var(--off-white);
      padding: 20px;
      border-top: 3px solid var(--blue);
    }

    .queue-card.ship { border-top-color: var(--auburn-orange); }
    .queue-card.rush { border-top-color: var(--red); }

    .queue-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--light-taupe);
    }

    .queue-card-header .order-info .num {
      font-family: 'Montserrat', monospace;
      font-size: 0.68rem;
      color: #999;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .queue-card-header .order-info .cust {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .line-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--light-taupe);
    }

    .line-item:last-of-type { border-bottom: none; }

    .line-thumb {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #C8A96E, #D4A89A);
      flex-shrink: 0;
    }

    .line-item:nth-child(2) .line-thumb { background: linear-gradient(135deg, #8B9A7E, #C4B5A4); }
    .line-item:nth-child(3) .line-thumb { background: linear-gradient(135deg, #3A5A7C, #C8A96E); }

    .line-details { flex: 1; font-size: 0.8rem; }
    .line-details .prod-name { font-weight: 600; margin-bottom: 2px; }
    .line-details .prod-sku { font-size: 0.68rem; color: #999; font-family: monospace; margin-bottom: 2px; }
    .line-details .prod-specs { font-size: 0.7rem; color: #666; }
    .line-qty { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 500; }

    .queue-card-footer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--light-taupe);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .queue-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.7rem;
      color: #666;
    }

    .queue-meta strong { color: var(--deep-charcoal); }

    .address-block {
      background: var(--warm-cream);
      padding: 10px 12px;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 12px 0;
      font-family: 'Montserrat', monospace;
    }

    /* ========== MOBILE ========== */
    .mobile-toggle {
      display: none;
      background: var(--deep-charcoal);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
    }

    .mobile-toggle svg { width: 22px; height: 22px; stroke: white; stroke-width: 2; }

    @media (max-width: 1100px) {
      .pipeline { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 900px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -240px;
        transition: left 0.3s;
        z-index: 200;
      }
      .sidebar.open { left: 0; }
      .mobile-toggle { display: block; }
      .main { padding: 60px 16px 20px; }
      .pipeline { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-card .value { font-size: 1.5rem; }
      .page-header h1 { font-size: 1.4rem; }
      th, td { padding: 10px 12px; font-size: 0.72rem; }
      th { font-size: 0.56rem; letter-spacing: 1px; }
      .hide-mobile { display: none; }
      .queue-grid { grid-template-columns: 1fr; }
      .role-select { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr; }
    }

    @media (pointer: coarse) {
      .sidebar-nav a { padding: 14px 24px; }
      .btn { padding: 10px 16px; min-height: 40px; }
    }
  </style>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="brand">Shannon Harris</div>
      <div class="divider"></div>
      <div class="sub">Art &amp; Design</div>

      <div class="admin-badge">Internal Dashboard</div>
      <h1>Sign In</h1>

      <div style="font-size:0.72rem; letter-spacing:1.5px; text-transform:uppercase; color:#999; margin-bottom:10px; font-weight:500;">Select your role</div>
      <div class="role-select">
        <div class="role-option active" onclick="selectRole(this, 'owner')">
          <div class="role-name">Shannon</div>
          <div class="role-desc">Owner</div>
        </div>
        <div class="role-option" onclick="selectRole(this, 'printer')">
          <div class="role-name">Printer</div>
          <div class="role-desc">Print queue</div>
        </div>
        <div class="role-option" onclick="selectRole(this, 'shipper')">
          <div class="role-name">Shipper</div>
          <div class="role-desc">Ship labels</div>
        </div>
      </div>

      <form class="login-form" onsubmit="login(event)">
        <input type="email" id="loginEmail" placeholder="you@email.com">
        <input type="password" id="loginPassword" placeholder="••••••••">
        <button type="submit">Sign In to Dashboard</button>
      </form>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app">

    <button class="mobile-toggle" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="name">Shannon Harris</div>
        <div class="role-tag" id="sidebarRoleTag">Owner</div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- populated by JS based on role -->
      </nav>
      <div class="sidebar-footer">
        <a onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <main class="main" id="mainContent">
      <!-- views injected by role -->
    </main>

  </div>

  <script>
    // ========== DATA ==========
    const orders = [

    let currentRole = 'owner';
    let currentView = 'pipeline';

    // ========== LOGIN ==========
    function selectRole(el, role) {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      currentRole = role;
    }

    function login(e) {
      e.preventDefault();
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.add('active');
      renderSidebar();
      renderDefaultView();
    }

    function logout() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('app').classList.remove('active');
      currentView = 'pipeline';
    }

    // ========== SIDEBAR PER ROLE ==========
    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      const tag = document.getElementById('sidebarRoleTag');

      const iconDash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>';
      const iconOrders = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M9 5H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2h-4M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>';
      const iconPrint = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/></svg>';
      const iconShip = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l5 5M4 13v-5a4 4 0 014-4h0"/></svg>';
      const iconCustomer = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a4 4 0 014-4h8a4 4 0 014 4v2"/></svg>';
      const iconChart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 3v18h18M9 17V9M15 17v-6M21 17v-3"/></svg>';

      if (currentRole === 'owner') {
        tag.textContent = 'Shannon — Owner';
        const pending = orders.filter(o => o.status === 'pending').length;
        nav.innerHTML = `
          <a class="active" onclick="navSwitch(this,'pipeline')">${iconDash} Pipeline</a>
          <a onclick="navSwitch(this,'allOrders')">${iconOrders} All Orders ${pending ? `<span class="badge">${pending}</span>` : ''}</a>
          <a onclick="navSwitch(this,'customers')">${iconCustomer} Customers</a>
          <a onclick="navSwitch(this,'reports')">${iconChart} Reports</a>
        `;
      } else if (currentRole === 'printer') {
        tag.textContent = 'Printer';
        const toPrint = orders.filter(o => o.status === 'printing').length;
        nav.innerHTML = `
          <a class="active" onclick="navSwitch(this,'printQueue')">${iconPrint} Print Queue ${toPrint ? `<span class="badge">${toPrint}</span>` : ''}</a>
          <a onclick="navSwitch(this,'printDone')">${iconOrders} Completed</a>
        `;
      } else {
        tag.textContent = 'Shipper';
        const toShip = orders.filter(o => o.status === 'shipping').length;
        nav.innerHTML = `
          <a class="active" onclick="navSwitch(this,'shipQueue')">${iconShip} Ready to Ship ${toShip ? `<span class="badge">${toShip}</span>` : ''}</a>
          <a onclick="navSwitch(this,'shipDone')">${iconOrders} Shipped</a>
        `;
      }
    }

    function navSwitch(el, view) {
      document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
      currentView = view;
      renderView();
      if (window.innerWidth <= 768) toggleSidebar();
    }

    function renderDefaultView() {
      if (currentRole === 'owner') currentView = 'pipeline';
      else if (currentRole === 'printer') currentView = 'printQueue';
      else currentView = 'shipQueue';
      renderView();
    }

    // ========== SLA CALC ==========
    function slaStatus(days) {
      if (days >= 10) return { cls: 'green', text: `${days}d left` };
      if (days >= 5) return { cls: 'yellow', text: `${days}d left` };
      if (days > 0) return { cls: 'red', text: `${days}d left` };
      return { cls: 'green', text: 'Delivered' };
    }

    // ========== VIEWS ==========
    function renderView() {
      const main = document.getElementById('mainContent');

      if (currentRole === 'owner') {
        if (currentView === 'pipeline') main.innerHTML = renderPipeline();
        else if (currentView === 'allOrders') main.innerHTML = renderAllOrders();
        else if (currentView === 'customers') main.innerHTML = renderCustomers();
        else if (currentView === 'reports') main.innerHTML = renderReports();
      } else if (currentRole === 'printer') {
        if (currentView === 'printQueue') main.innerHTML = renderPrintQueue();
        else main.innerHTML = renderPrintDone();
      } else {
        if (currentView === 'shipQueue') main.innerHTML = renderShipQueue();
        else main.innerHTML = renderShipDone();
      }
      window.scrollTo(0, 0);
    }

    // ========== OWNER: PIPELINE ==========
    function renderPipeline() {
      const cols = {
        pending: orders.filter(o => o.status === 'pending'),
        printing: orders.filter(o => o.status === 'printing'),
        shipping: orders.filter(o => o.status === 'shipping'),
        complete: orders.filter(o => o.status === 'shipped')
      };

      const pendingRev = cols.pending.reduce((a, b) => a + b.total, 0);
      const activeRev = [...cols.printing, ...cols.shipping].reduce((a, b) => a + b.total, 0);
      const monthRev = orders.reduce((a, b) => a + b.total, 0);

      return `
        <div class="page-header">
          <div>
            <h1>Fulfillment Pipeline</h1>
            <div class="subtitle">All active orders, grouped by stage</div>
          </div>
          <button class="btn">+ New Manual Order</button>
        </div>

        <div class="stats-row">
          <div class="stat-card red">
            <div class="label">Awaiting Approval</div>
            <div class="value">${cols.pending.length}</div>
            <div class="delta">$${pendingRev} pending</div>
          </div>
          <div class="stat-card yellow">
            <div class="label">In Production</div>
            <div class="value">${cols.printing.length + cols.shipping.length}</div>
            <div class="delta">$${activeRev} active</div>
          </div>
          <div class="stat-card blue">
            <div class="label">Avg Fulfillment</div>
            <div class="value">9.2d</div>
            <div class="delta">↓ 1.3d vs last month</div>
          </div>
          <div class="stat-card green">
            <div class="label">Revenue (April)</div>
            <div class="value">$${monthRev.toLocaleString()}</div>
            <div class="delta">↑ 18% vs March</div>
          </div>
        </div>

        <div class="pipeline">
          ${renderColumn('Pending Approval', 'pending', cols.pending, 'approve')}
          ${renderColumn('Printing', 'printing', cols.printing)}
          ${renderColumn('Ready to Ship', 'shipping', cols.shipping)}
          ${renderColumn('Shipped', 'complete', cols.complete)}
        </div>
      `;
    }

    function renderColumn(title, cls, items, actionType) {
      return `
        <div class="pipeline-column ${cls}">
          <div class="pipeline-column-header">
            <h3>${title}</h3>
            <span class="col-count">${items.length}</span>
          </div>
          ${items.map(o => {
            const sla = slaStatus(o.sla);
            const classes = [];
            if (o.rush) classes.push('rush');
            if (o.type === 'auburn') classes.push('auburn');
            return `
              <div class="order-card ${classes.join(' ')}">
                <div class="order-card-header">
                  <div class="order-num">${o.num}</div>
                  <div class="order-tags">
                    ${o.rush ? '<span class="mini-tag rush">Rush</span>' : ''}
                    ${o.type === 'auburn' ? '<span class="mini-tag auburn">Auburn</span>' : '<span class="mini-tag retail">Retail</span>'}
                  </div>
                </div>
                <div class="customer">${o.customer}</div>
                <div class="items">${o.items} ${o.items === 1 ? 'item' : 'items'} · $${o.total}</div>
                <div class="order-card-footer">
                  <div class="sla-timer ${sla.cls}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    ${sla.text}
                  </div>
                  ${actionType === 'approve' ? '<button class="btn approve" onclick="approveOrder(\'' + o.num + '\')">Approve</button>' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function approveOrder(num) {
      const o = orders.find(x => x.num === num);
      if (o) o.status = 'printing';
      renderSidebar();
      renderView();
    }

    // ========== OWNER: ALL ORDERS TABLE ==========
    function renderAllOrders() {
      return `
        <div class="page-header">
          <div><h1>All Orders</h1><div class="subtitle">Complete order history</div></div>
        </div>
        <div class="data-table">
          <table>
            <thead>
              <tr>
                <th>Order</th><th class="hide-mobile">Date</th><th>Customer</th><th class="hide-mobile">Type</th>
                <th>Items</th><th>Total</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody>
              ${orders.map(o => `
                <tr>
                  <td class="order-num">${o.num}</td>
                  <td class="hide-mobile">${new Date(o.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td>
                  <td><strong>${o.customer}</strong>${o.rush ? ' <span class="mini-tag rush">Rush</span>' : ''}</td>
                  <td class="hide-mobile">${o.type === 'auburn' ? '<span class="mini-tag auburn">Auburn</span>' : '<span class="mini-tag retail">Retail</span>'}</td>
                  <td>${o.items}</td>
                  <td><strong>$${o.total}</strong></td>
                  <td><span class="status-pill ${o.status}">${o.status}</span></td>
                  <td><button class="btn secondary">View</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // ========== OWNER: CUSTOMERS ==========
    function renderCustomers() {
      const byCustomer = {};
      orders.forEach(o => {
        if (!byCustomer[o.customer]) byCustomer[o.customer] = { count: 0, total: 0, type: o.type };
        byCustomer[o.customer].count++;
        byCustomer[o.customer].total += o.total;
      });

      return `
        <div class="page-header">
          <div><h1>Customers</h1><div class="subtitle">${Object.keys(byCustomer).length} total</div></div>
        </div>
        <div class="data-table">
          <table>
            <thead><tr><th>Customer</th><th>Type</th><th>Orders</th><th>Lifetime Value</th><th></th></tr></thead>
            <tbody>
              ${Object.entries(byCustomer).sort((a,b)=>b[1].total-a[1].total).map(([name, data]) => `
                <tr>
                  <td><strong>${name}</strong></td>
                  <td>${data.type === 'auburn' ? '<span class="mini-tag auburn">Auburn</span>' : '<span class="mini-tag retail">Retail</span>'}</td>
                  <td>${data.count}</td>
                  <td><strong>$${data.total.toLocaleString()}</strong></td>
                  <td><button class="btn secondary">View</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // ========== OWNER: REPORTS ==========
    function renderReports() {
      const retailRev = orders.filter(o => o.type === 'retail').reduce((a,b)=>a+b.total, 0);
      const auburnRev = orders.filter(o => o.type === 'auburn').reduce((a,b)=>a+b.total, 0);
      const total = retailRev + auburnRev;
      const retailPct = (retailRev/total*100).toFixed(0);
      const auburnPct = (auburnRev/total*100).toFixed(0);

      return `
        <div class="page-header">
          <div><h1>Reports</h1><div class="subtitle">Sales and fulfillment analytics</div></div>
        </div>
        <div class="stats-row">
          <div class="stat-card green"><div class="label">Total Revenue</div><div class="value">$${total.toLocaleString()}</div><div class="delta">April 2026</div></div>
          <div class="stat-card blue"><div class="label">Retail</div><div class="value">$${retailRev.toLocaleString()}</div><div class="delta">${retailPct}% of total</div></div>
          <div class="stat-card yellow"><div class="label">Auburn Wholesale</div><div class="value">$${auburnRev.toLocaleString()}</div><div class="delta">${auburnPct}% of total</div></div>
          <div class="stat-card red"><div class="label">Avg Order Value</div><div class="value">$${(total/orders.length).toFixed(0)}</div><div class="delta">${orders.length} orders</div></div>
        </div>
        <div style="background:var(--off-white);padding:30px;margin-top:20px;">
          <h3 style="font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:2px;margin-bottom:20px;">Top Selling Products</h3>
          <table><thead><tr><th>Product</th><th>SKU</th><th>Units</th><th>Revenue</th></tr></thead>
            <tbody>
              <tr><td><strong>Toomer's Corner</strong></td><td style="font-family:monospace;font-size:0.75rem;">SHA-AUB-TOOMER-12</td><td>14</td><td>$308</td></tr>
              <tr><td><strong>Tiger Eye</strong></td><td style="font-family:monospace;font-size:0.75rem;">SHA-AUB-TIGER-24</td><td>5</td><td>$1,120</td></tr>
              <tr><td><strong>Trees of Tradition</strong></td><td style="font-family:monospace;font-size:0.75rem;">SHA-AUB-TREES-18</td><td>10</td><td>$220</td></tr>
              <tr><td><strong>Above the Clouds</strong></td><td style="font-family:monospace;font-size:0.75rem;">SHA-LAND-CLOUDS-18</td><td>4</td><td>$196</td></tr>
            </tbody>
          </table>
        </div>
      `;
    }

    // ========== PRINTER: QUEUE ==========
    function renderPrintQueue() {
      const queue = orders.filter(o => o.status === 'printing');
      return `
        <div class="page-header">
          <div><h1>Print Queue</h1><div class="subtitle">${queue.length} orders approved and awaiting print</div></div>
        </div>
        <div class="queue-grid">
          ${queue.map(o => `
            <div class="queue-card ${o.rush ? 'rush' : ''}">
              <div class="queue-card-header">
                <div class="order-info">
                  <div class="num">${o.num}</div>
                  <div class="cust">${o.customer}</div>
                </div>
                <div class="order-tags">
                  ${o.rush ? '<span class="mini-tag rush">Rush</span>' : ''}
                  ${o.type === 'auburn' ? '<span class="mini-tag auburn">Auburn</span>' : '<span class="mini-tag retail">Retail</span>'}
                </div>
              </div>
              ${(o.products || []).map(p => `
                <div class="line-item">
                  <div class="line-thumb"></div>
                  <div class="line-details">
                    <div class="prod-name">${p.name}</div>
                    <div class="prod-sku">${p.sku}</div>
                    <div class="prod-specs">${p.specs}</div>
                  </div>
                  <div class="line-qty">×${p.qty}</div>
                </div>
              `).join('')}
              <div class="queue-card-footer">
                <div class="queue-meta">
                  <div>Approved: <strong>${new Date(o.date).toLocaleDateString()}</strong></div>
                  <div class="sla-timer ${slaStatus(o.sla).cls}">${slaStatus(o.sla).text}</div>
                </div>
                <button class="btn print" onclick="markPrintDone('${o.num}')">Mark Print Complete</button>
              </div>
            </div>
          `).join('') || '<div style="padding:60px;text-align:center;color:#999;background:var(--off-white);"><h3 style="font-family:\'Cormorant Garamond\',serif;font-weight:400;margin-bottom:8px;color:var(--deep-charcoal);">All caught up</h3><p style="font-size:0.82rem;">No orders in the print queue. New approvals will show up here.</p></div>'}
        </div>
      `;
    }

    function markPrintDone(num) {
      const o = orders.find(x => x.num === num);
      if (o) o.status = 'shipping';
      renderSidebar();
      renderView();
    }

    function renderPrintDone() {
      const done = orders.filter(o => ['shipping','shipped','delivered'].includes(o.status));
      return `
        <div class="page-header"><div><h1>Completed Prints</h1><div class="subtitle">${done.length} orders printed</div></div></div>
        <div class="data-table">
          <table>
            <thead><tr><th>Order</th><th>Customer</th><th class="hide-mobile">Items</th><th>Completed</th><th>Status</th></tr></thead>
            <tbody>${done.map(o => `
              <tr>
                <td class="order-num">${o.num}</td>
                <td><strong>${o.customer}</strong></td>
                <td class="hide-mobile">${o.items}</td>
                <td class="hide-mobile">${new Date(o.date).toLocaleDateString()}</td>
                <td><span class="status-pill ${o.status}">${o.status}</span></td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
      `;
    }

    // ========== SHIPPER ==========
    function renderShipQueue() {
      const queue = orders.filter(o => o.status === 'shipping');
      return `
        <div class="page-header">
          <div><h1>Ready to Ship</h1><div class="subtitle">${queue.length} orders printed and ready for shipping labels</div></div>
        </div>
        <div class="queue-grid">
          ${queue.map(o => `
            <div class="queue-card ship ${o.rush ? 'rush' : ''}">
              <div class="queue-card-header">
                <div class="order-info">
                  <div class="num">${o.num}</div>
                  <div class="cust">${o.customer}</div>
                </div>
                <div class="order-tags">
                  ${o.rush ? '<span class="mini-tag rush">Rush</span>' : ''}
                  ${o.type === 'auburn' ? '<span class="mini-tag auburn">Auburn</span>' : '<span class="mini-tag retail">Retail</span>'}
                </div>
              </div>
              <div style="font-size:0.68rem;letter-spacing:1.5px;text-transform:uppercase;color:#999;font-weight:600;margin-bottom:6px;">Ship To</div>
              <div class="address-block">${(o.address || '').replace(/\n/g,'<br>')}</div>
              ${(o.products || []).map(p => `
                <div class="line-item">
                  <div class="line-details">
                    <div class="prod-name">${p.name} <span style="font-weight:400;color:#999;">×${p.qty}</span></div>
                    <div class="prod-specs">${p.specs}</div>
                  </div>
                </div>
              `).join('')}
              <div class="queue-card-footer">
                <div class="queue-meta">
                  <div class="sla-timer ${slaStatus(o.sla).cls}">${slaStatus(o.sla).text}</div>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn secondary" onclick="alert('Shipping label PDF would download here.')">Print Label</button>
                  <button class="btn ship" onclick="markShipped('${o.num}')">Mark Shipped</button>
                </div>
              </div>
            </div>
          `).join('') || '<div style="padding:60px;text-align:center;color:#999;background:var(--off-white);"><h3 style="font-family:\'Cormorant Garamond\',serif;font-weight:400;margin-bottom:8px;color:var(--deep-charcoal);">All caught up</h3><p style="font-size:0.82rem;">No orders ready to ship. Printer will notify you when prints are done.</p></div>'}
        </div>
      `;
    }

    function markShipped(num) {
      const tracking = prompt('Enter tracking number for ' + num + ':');
      if (!tracking) return;
      const o = orders.find(x => x.num === num);
      if (o) { o.status = 'shipped'; o.tracking = tracking; o.sla = 0; }
      renderSidebar();
      renderView();
    }

    function renderShipDone() {
      const done = orders.filter(o => ['shipped','delivered'].includes(o.status));
      return `
        <div class="page-header"><div><h1>Shipped Orders</h1><div class="subtitle">${done.length} shipped</div></div></div>
        <div class="data-table">
          <table>
            <thead><tr><th>Order</th><th>Customer</th><th class="hide-mobile">Shipped</th><th>Tracking</th><th>Status</th></tr></thead>
            <tbody>${done.map(o => `
              <tr>
                <td class="order-num">${o.num}</td>
                <td><strong>${o.customer}</strong></td>
                <td class="hide-mobile">${new Date(o.date).toLocaleDateString()}</td>
                <td style="font-family:monospace;font-size:0.72rem;">${o.tracking || '—'}</td>
                <td><span class="status-pill ${o.status}">${o.status}</span></td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
      `;
    }

    // ========== MOBILE ==========
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>

</body>
</html>
