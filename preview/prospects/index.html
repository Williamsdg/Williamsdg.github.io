*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:60px}
header{background:linear-gradient(135deg,var(--navy),var(--navy-d));padding:26px 20px;border-bottom:2px solid var(--lime)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--lime)}
.sub{color:var(--mut);font-size:.85rem;margin-top:4px}
.priv{display:inline-block;margin-top:8px;font-size:.7rem;font-weight:700;color:var(--lime);border:1px solid var(--lime);border-radius:6px;padding:2px 8px;text-transform:uppercase;letter-spacing:.05em}
.controls{position:sticky;top:0;z-index:20;background:rgba(7,11,26,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.tab:hover{border-color:var(--lime);color:var(--txt)}
.tab.on{background:var(--lime);color:#0a0f1f;border-color:var(--lime)}
.tab .n{opacity:.7;font-weight:700;margin-left:5px}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:8px;font-size:.88rem}
input[type=search]:focus{outline:none;border-color:var(--lime)}
.chk{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.8rem;cursor:pointer;user-select:none}
.chk input{accent-color:var(--lime);width:15px;height:15px}
.count{color:var(--mut);font-size:.8rem;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;transition:.15s}
.card:hover{border-color:rgba(201,214,46,.5);transform:translateY(-2px)}
.card.drafted{border-left:3px solid var(--lime)}
.cn{font-size:1.02rem;font-weight:700;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:6px}
.p-cat{background:rgba(29,55,109,.6);color:#bcd0ff;border:1px solid rgba(120,150,220,.4)}
.p-web-nosite{background:rgba(201,214,46,.16);color:var(--lime);border:1px solid rgba(201,214,46,.4)}
.p-web-weak{background:rgba(245,180,80,.14);color:#f5c46a;border:1px solid rgba(245,180,80,.35)}
.p-web-has{background:rgba(255,255,255,.06);color:var(--mut);border:1px solid var(--line)}
.loc{color:var(--mut);font-size:.82rem}
.type{color:var(--txt);font-size:.83rem;opacity:.85}
.pitch{font-size:.8rem;color:#bcd0ff}
.contact{display:flex;flex-direction:column;gap:4px;margin-top:2px;border-top:1px solid var(--line);padding-top:9px}
.contact a{color:var(--lime);text-decoration:none;font-size:.84rem;font-weight:600}
.contact a:hover{text-decoration:underline}
.contact .nc{color:var(--mut);font-size:.8rem}
.who{color:var(--txt);font-size:.82rem;font-weight:600}
.notes{font-size:.76rem;color:var(--mut);font-style:italic}
.draft-tag{display:inline-block;font-size:.64rem;font-weight:800;color:#0a0f1f;background:var(--lime);padding:2px 7px;border-radius:5px;text-transform:uppercase}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>

const CATS = ["All","Construction","Landscaping","Coffee","Farm","Museum"];
let activeCat = "All";
const $ = s => document.querySelector(s);

function webClass(w){const l=(w||"").toLowerCase();if(l.includes("no site"))return"p-web-nosite";if(l.includes("weak")||l.includes("outdated")||l.includes("basic")||l.includes("moderate")||l.includes("needs"))return"p-web-weak";return"p-web-has";}
function isDrafted(r){return (r.notes||"").toLowerCase().includes("drafted");}

function tabs(){
  const counts={}; DATA.forEach(r=>counts[r.cat]=(counts[r.cat]||0)+1);
  $("#tabs").innerHTML = CATS.map(c=>{
    const n = c==="All"?DATA.length:(counts[c]||0);
    return `<button class="tab ${c===activeCat?'on':''}" data-c="${c}">${c}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{activeCat=t.dataset.c;tabs();render();});
}

function render(){
  const q=$("#q").value.toLowerCase().trim();
  const noSite=$("#noSite").checked, hasEmail=$("#hasEmail").checked, drafted=$("#drafted").checked;
  let list=DATA.filter(r=>{
    if(activeCat!=="All"&&r.cat!==activeCat)return false;
    if(noSite&&!(r.web||"").toLowerCase().includes("no site"))return false;
    if(hasEmail&&!r.email)return false;
    if(drafted&&!isDrafted(r))return false;
    if(q){const blob=[r.name,r.loc,r.type,r.notes,r.contact,r.pitch].join(" ").toLowerCase();if(!blob.includes(q))return false;}
    return true;
  });
  $("#count").textContent=list.length+" shown";
  $("#empty").style.display=list.length?"none":"block";
  $("#grid").innerHTML=list.map(r=>{
    const draftTag=isDrafted(r)?`<span class="draft-tag">Draft ready</span>`:"";
    const phone=r.phone?`<a href="tel:${r.phone.replace(/[^0-9+]/g,'')}">&#9742; ${r.phone}</a>`:"";
    const email=r.email?`<a href="mailto:${r.email}">&#9993; ${r.email}</a>`:"";
    const nc=(!r.phone&&!r.email)?`<span class="nc">No phone/email &mdash; see notes</span>`:"";
    const who=r.contact?`<span class="who">${r.contact}</span>`:"";
    return `<div class="card ${isDrafted(r)?'drafted':''}">
      <div class="cn">${r.name} ${draftTag}</div>
      <div class="meta">
        <span class="pill p-cat">${r.cat}</span>
        <span class="pill ${webClass(r.web)}">${r.web}</span>
      </div>
      <div class="loc">&#128205; ${r.loc} &middot; <span class="type">${r.type}</span></div>
      <div class="pitch">&#127919; ${r.pitch}</div>
      <div class="contact">${who}${phone}${email}${nc}</div>
      ${r.notes?`<div class="notes">${r.notes}</div>`:""}
    </div>`;
  }).join("");
}
["#q","#noSite","#hasEmail","#drafted"].forEach(s=>$(s).addEventListener("input",render));
tabs();render();
</script>
