<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Owner Dashboard | Graceland South</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF6EE; --paper:#FFFFFF; --sand:#F1EADC; --line:#E4DCCB;
  --navy:#0E2238; --navy-2:#1B3552; --ink:#16263A; --muted:#566273;
  --orange:#E87722; --orange-deep:#A85214; --shutter-soft:#E6EEF5;
  --ok-bg:#E0F2E7; --ok:#125C38; --wait-bg:#FBEECF; --wait:#734A00; --off-bg:#ECE6DA; --off:#48525F; --no:#9A2B1B; --no-bg:#F8E4DF;
  --display:"Fraunces",Georgia,serif; --body:"Figtree",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0;line-height:1.15;font-weight:600;text-wrap:balance}
h1{font-size:clamp(28px,4vw,38px)}
h2{font-size:22px}
h3{font-size:18.5px}
p{margin:0 0 12px}
a{color:var(--orange-deep)}
button,input,select,textarea{font-family:var(--body)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}

.demo{background:var(--navy);color:#D8E2EC;font-size:14px;padding:8px 20px;display:flex;gap:10px 18px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.demo button{background:none;border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;min-height:44px;padding:6px 16px;font-weight:600;font-size:14px;cursor:pointer}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 10px 22px;line-height:1.1}
.brand small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-deep)}
.brand b{font-family:var(--display);font-size:22px;color:var(--navy);font-weight:600}
nav.side button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:46px;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--ink);font-size:15.5px;font-weight:600;cursor:pointer;text-align:left}
nav.side button[aria-current="true"]{background:var(--navy);color:#fff}
nav.side .n{background:var(--orange);color:var(--navy);border-radius:999px;font-size:12.5px;font-weight:700;padding:1px 9px}
.viewsite{margin-top:auto;display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;border:1.5px solid var(--navy);color:var(--navy);text-decoration:none;font-weight:600;font-size:15px}

main{padding:34px 40px 80px;max-width:1040px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{color:var(--muted);margin:6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.tile b{display:block;font-family:var(--display);font-size:34px;color:var(--navy);line-height:1}
.tile span{font-size:14px;color:var(--muted)}
.lock{display:flex;gap:14px;align-items:center;background:var(--shutter-soft);border-left:5px solid var(--navy);border-radius:12px;padding:14px 18px;margin-bottom:24px;color:var(--navy)}
.lock svg{flex:0 0 26px}
.lock b{display:block}
.lock span{font-size:14.5px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.card.new{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.rq-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rq-top small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.new{background:var(--orange);color:var(--navy)}
.pill.asked,.pill.pending{background:var(--wait-bg);color:var(--wait)}
.pill.approved,.pill.available,.pill.published{background:var(--ok-bg);color:var(--ok)}
.pill.declined{background:var(--no-bg);color:var(--no)}
.pill.booked,.pill.blocked,.pill.waiting,.pill.hidden{background:var(--off-bg);color:var(--off)}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 18px;margin:16px 0}
.meta div{font-size:15px;font-weight:600;color:var(--navy);min-width:0;overflow-wrap:anywhere}
.meta span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{background:var(--cream);border-radius:12px;padding:14px 16px;margin:0 0 12px;font-size:15.5px}
.msg{border-left:3px solid var(--navy);padding:4px 0 4px 14px;margin:0 0 12px;font-size:15px}
.msg span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.warn{background:var(--wait-bg);color:var(--wait);border-radius:10px;padding:10px 14px;font-size:14.5px;font-weight:600;margin:0 0 12px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 20px;border-radius:999px;border:0;font-size:15.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn-yes{background:var(--navy);color:#fff}
.btn-go{background:var(--orange);color:var(--navy)}
.btn-line{background:none;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn-quiet{background:none;color:var(--no);box-shadow:inset 0 0 0 1.5px #D9B3AB}
.panel{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.panel label{display:block;font-size:14px;font-weight:600;color:var(--navy);margin:10px 0 6px}
input,select,textarea{width:100%;min-height:46px;padding:10px 13px;border:1.5px solid #CFC6B3;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
textarea{min-height:92px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--navy) 50%),linear-gradient(135deg,var(--navy) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 13px) 20px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chips button{min-height:44px;border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:8px 12px;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left}
.sum{background:var(--cream);border-radius:12px;padding:14px 16px;margin:12px 0}
.sum div{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0}
.sum .t{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700;color:var(--navy);font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{text-align:center;color:var(--muted);padding:34px 18px;border:1.5px dashed var(--line);border-radius:18px}
.subhead{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}

.seg{display:inline-flex;gap:6px;background:var(--sand);padding:5px;border-radius:999px;margin-bottom:16px;max-width:100%}
.seg button{min-height:44px;border:0;border-radius:999px;background:transparent;font-size:15px;font-weight:600;color:var(--ink);padding:8px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:1fr 190px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows b{display:block;color:var(--navy)}
.rows small{color:var(--muted);font-size:14px}
.live{font-size:14px;color:var(--ok);font-weight:600}
.pay{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.pay .who small{display:block;color:var(--muted);font-size:14px}
.pay .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pay select{width:150px}
.opt{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--paper)}
.opt.pick{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.opt .k{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-deep)}
.opt ul{margin:10px 0 0;padding-left:19px;font-size:15px;color:var(--ink)}
.opt li{margin-bottom:5px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow span{flex:1}
.qrow button{min-height:44px;min-width:44px;border:0;background:none;color:var(--no);font-weight:600;cursor:pointer}
.fine{font-size:13.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 20px;border-radius:14px;font-size:15px;font-weight:500;max-width:min(520px,calc(100vw - 28px));width:max-content;z-index:50;visibility:hidden;opacity:0;transition:opacity .2s;box-shadow:0 14px 34px -12px rgba(14,34,56,.7)}
.toast.on{visibility:visible;opacity:1}

.mtabs{display:none}
@media (max-width:900px){
  .shell{display:block}
  aside{display:none}
  .mtabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:20;background:rgba(250,246,238,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;scrollbar-width:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mtabs button{flex:0 0 auto;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
  .mtabs button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .mtabs .n{background:var(--orange);color:var(--navy);border-radius:999px;font-size:12px;font-weight:700;padding:0 7px;margin-left:6px}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px}
  main{padding:14px 16px 90px}
  .meta{grid-template-columns:1fr 1fr}
  .meta .wide{grid-column:1/-1}
  .three{grid-template-columns:1fr}
}
@media (min-width:901px){ .mhead{display:none} }
@media (max-width:560px){
  .tiles{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tile{padding:12px 10px}
  .tile b{font-size:26px}
  .tile span{font-size:12.5px;line-height:1.25;display:block;margin-top:4px}
  .card{padding:18px 16px}
  .acts .btn{flex:1 1 40%}
  .acts .btn-yes{flex-basis:100%}
  .two{grid-template-columns:1fr}
  .rows li{grid-template-columns:1fr;gap:8px}
  .pay{grid-template-columns:1fr}
  .pay .ctl{justify-content:flex-start}
  .pay select{width:100%}
  .seg{display:flex}
  .seg button{flex:1;padding:8px 10px}
  .demo{padding:8px 16px;font-size:13px}
}
</style>
</head>
<body>

<div class="demo"><span>Concept dashboard for Susan Miller. The guests shown are samples, not real people.</span><button id="resetBtn">Reset the demo</button></div>

<div class="mhead">
  <div class="brand" style="padding:0"><small>Owner dashboard</small><b>Graceland South</b></div>
  <a class="btn btn-line" href="index.html" style="min-height:44px;padding:8px 16px;font-size:14.5px">View site</a>
</div>
<div class="mtabs" id="mtabs" role="tablist" aria-label="Dashboard sections"></div>

<div class="shell">
  <aside>
    <div class="brand"><small>Owner dashboard</small><b>Graceland South</b></div>
    <nav class="side" id="side" aria-label="Dashboard sections"></nav>
    <a class="viewsite" href="index.html">View your site</a>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="gs-data.js?v=202609301"></script>
<script>
(function(){
  var $ = function(s, r){ return (r || document).querySelector(s); };
  var state = GS.load();
  var view = 'requests', openPanel = null, house = 'gs';
  var TABS = [['requests','Requests'],['weekends','Weekends'],['payments','Payments'],['guests','Guests'],['reviews','Reviews'],['setup','How it runs']];
  var LABEL = { 'new': 'New', asked: 'Waiting on guest', approved: 'Approved', declined: 'Declined' };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function money(n){ return '$' + Number(n).toLocaleString('en-US'); }
  function persist(){ GS.save(state); }
  var toastT;
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 4200); }
  function weekend(id){ for (var i = 0; i < state.weekends.length; i++) if (state.weekends[i].id === id) return state.weekends[i]; return null; }
  function count(st){ return state.requests.filter(function(r){ return r.status === st; }).length; }
  function extras(guests){ return Math.max(0, guests - GS.BASE_OCCUPANCY) * GS.EXTRA_GUEST * GS.NIGHTS; }

  function nav(){
    var badge = { requests: count('new'), reviews: state.reviews.filter(function(v){ return v.status === 'waiting'; }).length };
    var html = TABS.map(function(t){
      var n = badge[t[0]] ? '<span class="n">' + badge[t[0]] + '</span>' : '';
      return '<button type="button" data-view="' + t[0] + '" aria-current="' + (t[0] === view) + '"><span>' + t[1] + '</span>' + n + '</button>';
    }).join('');
    $('#side').innerHTML = html; $('#mtabs').innerHTML = html;
  }

  /* ---------- requests ---------- */
  function requestCard(r){
    var w = weekend(r.weekend), conflict = '';
    if (w && r.prop !== 'lake' && w[r.prop] === 'booked' && r.status !== 'approved') conflict = '<p class="warn">Heads up: this weekend already shows Booked at ' + esc(GS.PROPS[r.prop].short) + '.</p>';
    var thread = (r.thread || []).map(function(m){ return '<div class="msg"><span>' + (m.from === 'you' ? 'You wrote' : 'Guest wrote') + '</span>' + esc(m.text) + '</div>'; }).join('');
    var acts = '';
    if (r.status === 'new' || r.status === 'asked') {
      acts = '<div class="acts"><button class="btn btn-yes" data-do="approve" data-id="' + r.id + '">Approve</button><button class="btn btn-line" data-do="ask" data-id="' + r.id + '">Ask a question</button><button class="btn btn-quiet" data-do="decline" data-id="' + r.id + '">Decline</button></div>';
    }
    var panel = '';
    if (openPanel && openPanel.id === r.id) panel = openPanel.kind === 'ask' ? askPanel(r) : openPanel.kind === 'approve' ? approvePanel(r) : declinePanel(r);
    return '<article class="card ' + (r.status === 'new' ? 'new' : '') + '" id="c-' + r.id + '">' +
      '<div class="rq-top"><div><h3>' + esc(r.name) + '</h3><small>' + esc(r.sent) + (r.fromSite ? ' &middot; sent from your site' : '') + '</small></div><span class="pill ' + r.status + '">' + LABEL[r.status] + '</span></div>' +
      '<div class="meta">' +
        '<div><span>House</span>' + esc(GS.PROPS[r.prop].short) + '</div>' +
        '<div><span>Weekend</span>' + esc(GS.weekendName(state, r.weekend, r.otherDates)) + '</div>' +
        '<div><span>Guests</span>' + esc(r.guests) + (r.guests > GS.BASE_OCCUPANCY ? ' (' + (r.guests - GS.BASE_OCCUPANCY) + ' over six)' : '') + '</div>' +
        '<div><span>Reason</span>' + esc(r.reason) + '</div>' +
        '<div><span>History</span>' + esc(r.stayed) + '</div>' +
        '<div class="wide"><span>Email</span>' + esc(r.email) + '</div>' +
        '<div><span>Phone</span>' + (esc(r.phone) || 'Not given') + '</div>' +
      '</div>' +
      (r.note ? '<p class="note">' + esc(r.note) + '</p>' : '') + conflict + thread + acts + panel + '</article>';
  }
  function askPanel(r){
    return '<div class="panel"><label>Your saved questions (tap to add)</label><div class="chips">' +
      state.questions.map(function(q, i){ return '<button type="button" data-do="useq" data-i="' + i + '">' + esc(q) + '</button>'; }).join('') +
      '</div><label for="askText">Your message to ' + esc(r.name.replace('Sample guest: ', '')) + '</label><textarea id="askText"></textarea>' +
      '<div class="acts" style="margin-top:12px"><button class="btn btn-yes" data-do="sendask" data-id="' + r.id + '">Send question</button><button class="btn btn-line" data-do="cancel">Cancel</button></div></div>';
  }
  function approvePanel(r){
    var ex = extras(r.guests);
    return '<div class="panel"><div class="two"><div><label for="rate">Weekend rate you are quoting</label><input id="rate" inputmode="numeric" placeholder="Your rate, in dollars" data-id="' + r.id + '"></div>' +
      '<div><label for="how">How they can pay</label><select id="how"><option>Zelle, CashApp, Venmo or check</option><option>Zelle</option><option>CashApp</option><option>Venmo</option><option>Check</option></select></div></div>' +
      '<div class="sum"><div><span>Your weekend rate</span><span id="sRate">Enter above</span></div>' +
      '<div><span>Cleaning fee (pass-thru)</span><span>' + money(GS.CLEANING) + '</span></div>' +
      (ex ? '<div><span>' + (r.guests - GS.BASE_OCCUPANCY) + ' additional guests, $50 each per night, 2 nights</span><span>' + money(ex) + '</span></div>' : '') +
      '<div class="t"><span>Total to send</span><span id="sTotal">Rate + ' + money(GS.CLEANING + ex) + '</span></div></div>' +
      '<p class="fine">Approving sends ' + esc(r.name.replace('Sample guest: ', '')) + ' your rate and how to pay. The weekend shows Pending on your site until you mark the payment received.</p>' +
      '<div class="acts"><button class="btn btn-yes" data-do="sendapprove" data-id="' + r.id + '">Approve and send payment details</button><button class="btn btn-line" data-do="cancel">Cancel</button></div></div>';
  }
  function declinePanel(r){
    return '<div class="panel"><label for="decText">Your note (you can edit it)</label><textarea id="decText">Thank you so much for asking. I am not able to host this one, but I hope you find a great place to stay. War Eagle!</textarea>' +
      '<div class="acts" style="margin-top:12px"><button class="btn btn-quiet" data-do="senddecline" data-id="' + r.id + '">Send and decline</button><button class="btn btn-line" data-do="cancel">Cancel</button></div></div>';
  }
  function viewRequests(){
    var open = state.requests.filter(function(r){ return r.status === 'new' || r.status === 'asked'; });
    var done = state.requests.filter(function(r){ return r.status === 'approved' || r.status === 'declined'; });
    var openWk = state.weekends.filter(function(w){ return w.gs === 'available'; }).length;
    return '<div class="head"><div><h1>Requests</h1><p>Every request waits here for you. Nobody books on their own.</p></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + count('new') + '</b><span>waiting on you</span></div><div class="tile"><b>' + count('asked') + '</b><span>waiting on a guest</span></div><div class="tile"><b>' + openWk + '</b><span>popular weekends still open</span></div></div>' +
      '<div class="lock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b>Automatic bookings are off.</b><span>A guest can ask. Only you can say yes.</span></div></div>' +
      (open.length ? open.map(requestCard).join('') : '<div class="empty">No requests are waiting. New ones from your site show up here.</div>') +
      (done.length ? '<p class="subhead">Already answered</p>' + done.map(requestCard).join('') : '');
  }

  /* ---------- weekends ---------- */
  function viewWeekends(){
    var rows = state.weekends.map(function(w){
      var st = w[house] || 'blocked';
      return '<li><div><b>' + esc(w.label) + '</b><small>' + esc(w.when) + ' &middot; ' + esc(w.kind) + '</small></div><div><label class="fine" for="st-' + w.id + '" style="display:block;margin-bottom:4px">Shows on your site as</label><select id="st-' + w.id + '" data-wk="' + w.id + '">' +
        ['available','pending','booked','blocked'].map(function(s){ return '<option value="' + s + '"' + (s === st ? ' selected' : '') + '>' + GS.STATUS[s] + '</option>'; }).join('') + '</select></div></li>';
    }).join('');
    return '<div class="head"><div><h1>Weekends</h1><p>Change a weekend here and your site updates. No more retyping the list.</p></div><span class="live">Live on your site</span></div>' +
      '<div class="seg" role="group" aria-label="Choose a house"><button type="button" data-house="gs" aria-pressed="' + (house === 'gs') + '">Graceland South</button><button type="button" data-house="nr" aria-pressed="' + (house === 'nr') + '">Neighbor\'s Retreat</button></div>' +
      '<div class="card"><ul class="rows">' + rows + '</ul></div>' +
      '<div class="card"><h2>Add a weekend</h2><div class="two" style="margin-top:6px"><div class="panel" style="border:0;margin:0;padding:0"><label for="nwLabel">What to call it</label><input id="nwLabel" placeholder="For example, A-Day"></div><div class="panel" style="border:0;margin:0;padding:0"><label for="nwWhen">When</label><input id="nwWhen" placeholder="For example, April 10"></div></div><div class="acts" style="margin-top:14px"><button class="btn btn-yes" data-do="addweekend">Add to my site</button></div></div>' +
      '<p class="fine">The lake cottage is offered occasionally, so it is handled by request and has no list.</p>';
  }

  /* ---------- payments ---------- */
  function viewPayments(){
    var due = state.stays.filter(function(s){ return !s.paid; }).length;
    var rows = state.stays.map(function(s){
      var ex = extras(s.guests);
      var amt = s.total ? money(s.total) : 'Your rate + ' + money(GS.CLEANING + ex);
      return '<div class="card"><div class="pay"><div class="who"><h3>' + esc(s.name) + '</h3><small>' + esc(GS.PROPS[s.prop].short) + ' &middot; ' + esc(GS.weekendName(state, s.weekend, s.otherDates)) + ' &middot; ' + esc(s.guests) + ' guests</small><small>' + amt + '</small></div>' +
        '<div class="ctl"><span class="pill ' + (s.paid ? 'approved' : 'pending') + '">' + (s.paid ? 'Received' : 'Not received yet') + '</span>' +
        '<select data-method="' + s.id + '" aria-label="How ' + esc(s.name) + ' paid">' + ['Zelle','CashApp','Venmo','Check','Not paid yet'].map(function(m){ return '<option' + (m === s.method ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select>' +
        '<button class="btn ' + (s.paid ? 'btn-line' : 'btn-yes') + '" data-do="togglepaid" data-id="' + s.id + '">' + (s.paid ? 'Undo' : 'Mark received') + '</button></div></div></div>';
    }).join('');
    return '<div class="head"><div><h1>Payments</h1><p>Zelle, CashApp, Venmo and checks, the way you take them now. No card fees.</p></div></div>' +
      '<div class="tiles"><div class="tile"><b>' + due + '</b><span>not received yet</span></div><div class="tile"><b>' + (state.stays.length - due) + '</b><span>received</span></div><div class="tile"><b>' + money(GS.CLEANING) + '</b><span>cleaning fee on each stay</span></div></div>' + rows;
  }

  /* ---------- guests ---------- */
  function viewGuests(){
    return '<div class="head"><div><h1>Guests</h1><p>Your own guest book, with private notes only you can see.</p></div></div>' +
      state.guests.map(function(g, i){
        return '<div class="card"><div class="rq-top"><div><h3>' + esc(g.name) + '</h3><small>' + (g.stays ? g.stays + (g.stays === 1 ? ' stay' : ' stays') : 'No stays yet') + ' &middot; ' + esc(g.last) + '</small></div><span class="pill ' + (g.stays > 1 ? 'approved' : 'booked') + '">' + esc(g.tag) + '</span></div>' +
          '<div class="panel" style="border:0;margin:6px 0 0;padding:0"><label for="gn-' + i + '">Private note</label><textarea id="gn-' + i + '" data-gnote="' + i + '" placeholder="Anything you want to remember about this guest">' + esc(g.note) + '</textarea></div></div>';
      }).join('');
  }

  /* ---------- reviews ---------- */
  function viewReviews(){
    var list = state.reviews;
    return '<div class="head"><div><h1>Reviews</h1><p>A review sent from your site waits here until you publish it.</p></div></div>' +
      (list.length ? list.map(function(v){
        return '<div class="card"><div class="rq-top"><div><h3>' + esc(v.name) + '</h3><small>' + (esc(v.dates) || 'No dates given') + '</small></div><span class="pill ' + v.status + '">' + (v.status === 'waiting' ? 'Waiting for you' : v.status === 'published' ? 'On your site' : 'Hidden') + '</span></div><p class="note" style="margin-top:14px">' + esc(v.text) + '</p>' +
          '<div class="acts"><button class="btn btn-yes" data-do="pubreview" data-id="' + v.id + '">' + (v.status === 'published' ? 'Published' : 'Publish to my site') + '</button><button class="btn btn-line" data-do="hidereview" data-id="' + v.id + '">Hide</button></div></div>';
      }).join('') : '<div class="empty">No reviews are waiting. Try it: open your site, scroll to Leave a review, and send one.</div>');
  }

  /* ---------- how it runs ---------- */
  function viewSetup(){
    return '<div class="head"><div><h1>How it runs</h1><p>What sits behind this dashboard, and what stays the same for you.</p></div></div>' +
      '<div class="lock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b>Automatic bookings are off, and stay off.</b><span>The site only takes requests. You screen every guest exactly as you do today.</span></div></div>' +
      '<div class="card"><h2>What stays the same</h2><ul style="margin:10px 0 0;padding-left:19px"><li>You talk to every guest before they are approved.</li><li>You set the rate for each weekend when you reply.</li><li>Guests pay you by Zelle, CashApp, Venmo or check. No booking fees.</li><li>It works from your phone.</li></ul></div>' +
      '<p class="subhead">The booking software behind it</p>' +
      '<p>The site and this dashboard would run on an established vacation rental system, so the calendar, the requests and the paperwork are kept by software built for exactly this. We would use OwnerRez, or one of two other popular choices.</p>' +
      '<div class="three">' +
        '<div class="opt pick"><span class="k">Our pick</span><h3>OwnerRez</h3><ul><li>Has an inquiry-only setting: a guest can only book after you respond.</li><li>Lets you list Zelle, CashApp, Venmo and check as the ways to pay, and record each payment yourself.</li><li>Rental agreements with digital signatures are included.</li><li>Connects to Airbnb and Vrbo if you ever list there.</li><li>$40 a month for one property, with no booking fees or contracts.</li></ul></div>' +
        '<div class="opt"><span class="k">Also popular</span><h3>Lodgify</h3><ul><li>Offers a request flow where you accept or reject each booking request.</li><li>Supports manual payment methods such as checks.</li><li>Connects to Airbnb and Vrbo.</li></ul></div>' +
        '<div class="opt"><span class="k">Also popular</span><h3>Hospitable</h3><ul><li>With instant booking turned off, every request needs your review.</li><li>Connects to Airbnb and Vrbo, with rental agreements.</li><li>Guest payments go through card processing in the US, so it fits Zelle and checks less well.</li></ul></div>' +
      '</div>' +
      '<p class="fine" style="margin-top:12px">Features and the OwnerRez price are as published by each company in September 2026.</p>' +
      '<p class="subhead">Your saved screening questions</p>' +
      '<div class="card"><p class="fine">These are examples. You would write your own, and they appear as one-tap replies on every request.</p>' +
        state.questions.map(function(q, i){ return '<div class="qrow"><span>' + esc(q) + '</span><button type="button" data-do="delq" data-i="' + i + '" aria-label="Remove this question">Remove</button></div>'; }).join('') +
        '<div class="two" style="margin-top:14px;grid-template-columns:1fr auto"><input id="newQ" placeholder="Add a question you always ask" aria-label="Add a question you always ask"><button class="btn btn-yes" data-do="addq">Add</button></div></div>';
  }

  function render(keepScroll){
    var y = window.scrollY;
    nav();
    $('#main').innerHTML = { requests: viewRequests, weekends: viewWeekends, payments: viewPayments, guests: viewGuests, reviews: viewReviews, setup: viewSetup }[view]();
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  function go(v){ view = v; openPanel = null; render(false); }
  ['#side','#mtabs'].forEach(function(sel){
    $(sel).addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) go(b.dataset.view); });
  });
  function find(list, id){ for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  $('#main').addEventListener('click', function(e){
    var h = e.target.closest('[data-house]');
    if (h) { house = h.dataset.house; render(true); return; }
    var b = e.target.closest('[data-do]'); if (!b) return;
    var act = b.dataset.do, id = b.dataset.id, r;
    if (act === 'ask' || act === 'approve' || act === 'decline') {
      openPanel = { id: id, kind: act }; render(true);
      var f = act === 'ask' ? $('#askText') : act === 'approve' ? $('#rate') : $('#decText');
      if (f) { f.focus(); var c = $('#c-' + id); if (c) c.scrollIntoView({ block: 'nearest' }); }
    } else if (act === 'cancel') { openPanel = null; render(true); }
    else if (act === 'useq') { var t = $('#askText'); t.value = (t.value ? t.value + ' ' : '') + state.questions[+b.dataset.i]; t.focus(); }
    else if (act === 'sendask') {
      var txt = $('#askText').value.trim();
      if (!txt) { toast('Write your question first.'); return; }
      r = find(state.requests, id); r.thread = r.thread || []; r.thread.push({ from: 'you', text: txt }); r.status = 'asked';
      openPanel = null; persist(); render(true); toast('Question sent. On the real site this goes to the guest by email.');
    } else if (act === 'sendapprove') {
      r = find(state.requests, id);
      var rate = parseInt(String($('#rate').value).replace(/[^0-9]/g, ''), 10);
      if (!rate) { toast('Enter the weekend rate you are quoting.'); $('#rate').focus(); return; }
      var total = rate + GS.CLEANING + extras(r.guests);
      r.status = 'approved';
      r.thread = r.thread || []; r.thread.push({ from: 'you', text: 'Approved. Total ' + money(total) + ', payable by ' + $('#how').value + '.' });
      state.stays.unshift({ id: 's' + Date.now(), name: r.name, prop: r.prop, weekend: r.weekend, otherDates: r.otherDates, guests: r.guests, total: total, method: 'Not paid yet', paid: false });
      var w = weekend(r.weekend); if (w && r.prop !== 'lake') w[r.prop] = 'pending';
      if (!state.guests.some(function(g){ return g.name === r.name; })) state.guests.unshift({ name: r.name, stays: 0, last: 'Approved for ' + GS.weekendName(state, r.weekend, r.otherDates), tag: 'New', note: '' });
      openPanel = null; persist(); render(true);
      toast('Approved. ' + (w ? 'That weekend now shows Pending on your site.' : 'Payment details sent.'));
    } else if (act === 'senddecline') {
      r = find(state.requests, id); r.status = 'declined'; r.thread = r.thread || []; r.thread.push({ from: 'you', text: $('#decText').value.trim() });
      openPanel = null; persist(); render(true); toast('Declined, with your note.');
    } else if (act === 'togglepaid') {
      var s = find(state.stays, id); s.paid = !s.paid;
      if (s.paid && s.method === 'Not paid yet') s.method = 'Zelle';
      var w2 = weekend(s.weekend); if (w2 && s.prop !== 'lake') w2[s.prop] = s.paid ? 'booked' : 'pending';
      persist(); render(true); toast(s.paid ? 'Marked received. The weekend shows Booked on your site.' : 'Moved back to not received.');
    } else if (act === 'addweekend') {
      var l = $('#nwLabel').value.trim(), wh = $('#nwWhen').value.trim();
      if (!l || !wh) { toast('Add a name and a date for the weekend.'); return; }
      state.weekends.push({ id: 'w' + Date.now(), label: l, when: wh, kind: 'Added by you', gs: house === 'gs' ? 'available' : 'blocked', nr: house === 'nr' ? 'available' : 'blocked' });
      persist(); render(true); toast('Added. It is on your site now.');
    } else if (act === 'pubreview' || act === 'hidereview') {
      var v = find(state.reviews, id); v.status = act === 'pubreview' ? 'published' : 'hidden';
      persist(); render(true); toast(act === 'pubreview' ? 'Published. It now leads the reviews on your site.' : 'Hidden. It will not appear on your site.');
    } else if (act === 'delq') { state.questions.splice(+b.dataset.i, 1); persist(); render(true); }
    else if (act === 'addq') { var q = $('#newQ').value.trim(); if (!q) return; state.questions.push(q); persist(); render(true); toast('Saved. It will show as a one-tap reply.'); }
  });

  $('#main').addEventListener('input', function(e){
    if (e.target.id === 'rate') {
      var r = find(state.requests, e.target.dataset.id);
      var rate = parseInt(String(e.target.value).replace(/[^0-9]/g, ''), 10);
      var fixed = GS.CLEANING + extras(r.guests);
      $('#sRate').textContent = rate ? money(rate) : 'Enter above';
      $('#sTotal').textContent = rate ? money(rate + fixed) : 'Rate + ' + money(fixed);
    }
    var gi = e.target.getAttribute('data-gnote');
    if (gi !== null) { state.guests[+gi].note = e.target.value; persist(); }
  });
  $('#main').addEventListener('change', function(e){
    var wk = e.target.getAttribute('data-wk');
    if (wk) { weekend(wk)[house] = e.target.value; persist(); nav(); toast('Saved. Your site now shows ' + GS.STATUS[e.target.value] + ' for ' + weekend(wk).label + '.'); }
    var m = e.target.getAttribute('data-method');
    if (m) { find(state.stays, m).method = e.target.value; persist(); }
  });
  $('#resetBtn').addEventListener('click', function(){ state = GS.reset(); openPanel = null; view = 'requests'; render(false); toast('Demo reset to the sample data.'); });
  window.addEventListener('pageshow', function(){ state = GS.load(); render(true); });

  render(false);
})();
</script>
</body>
</html>
