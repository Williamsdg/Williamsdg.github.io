<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My Vassaltis (concept)</title>
<meta name="theme-color" content="#F6F3ED">
<link rel="icon" href="https://vassaltis.com/wp-content/uploads/2020/11/cropped-Vassaltis_favicon-1-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  body { font-size: 16px; }
  .p-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 31px); }
  .p-side { border-right: 1px solid var(--line); background: var(--paper); padding: 26px 16px; position: sticky; top: 31px; height: calc(100vh - 31px); display: flex; flex-direction: column; gap: 2px; }
  .p-side .brand { padding: 0 10px 26px; display: block; text-decoration: none; }
  .p-side .brand img { width: 118px; height: auto; }
  .p-side .brand span { display: block; font-family: var(--serif); font-size: 20px; margin-top: 10px; }
  .p-side a.nv { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r); text-decoration: none; font-size: 15px; min-height: 44px; }
  .p-side a.nv:hover { background: var(--pumice-2); }
  .p-side a.nv[aria-current="page"] { background: var(--basalt); color: var(--chalk); }
  .p-side a.nv svg { width: 19px; height: 19px; }
  .p-side .foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); font-size: 13px; }
  .p-main { padding: 36px clamp(18px, 4vw, 56px) 80px; max-width: 1040px; width: 100%; min-width: 0; }
  .p-h1 { font-family: var(--serif); font-size: clamp(34px, 4vw, 48px); line-height: 1.05; letter-spacing: -.015em; margin: 0 0 8px; }
  .p-lede { color: var(--muted); margin: 0 0 28px; font-size: 16px; }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .pgrid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 18px; align-items: start; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 8px; }
  .card-b { padding: 20px 22px; }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .card-h h2 { font-size: 16px; font-weight: 600; }
  .visit-hero { display: grid; grid-template-columns: 200px 1fr; overflow: hidden; }
  .visit-hero .ph { background: var(--pumice) center/cover no-repeat; min-height: 220px; }
  .visit-hero .when { font-family: var(--serif); font-size: 30px; line-height: 1.1; }
  .status-note { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 10px 12px; border-radius: var(--r); margin: 12px 0; }
  .status-note.req { background: var(--amber-wash); color: var(--amber); }
  .status-note.ok { background: var(--vine-wash); color: var(--vine-ink); }
  .rows > div { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .rows > div:last-child { border-bottom: 0; }
  .rows > div > span:first-child { color: var(--muted); font-size: 14px; }
  .wine-mini { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .wine-mini:last-child { border-bottom: 0; }
  .wine-mini .b { height: 76px; display: grid; place-items: center; background: var(--paper); border-radius: 4px; position: relative; overflow: hidden; }
  .wine-mini .b img { height: 64px; width: auto; }
  .wine-mini .b img.l { height: 100%; width: 100%; object-fit: cover; }
  .wine-mini .n { font-family: var(--serif); font-size: 21px; line-height: 1.1; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 6px; margin-right: 14px; font-size: 15px; cursor: pointer; white-space: nowrap; min-height: 44px; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--basalt); border-color: var(--basalt); font-weight: 600; }
  .passport { display: grid; gap: 18px; }
  .stamp { display: grid; grid-template-columns: 160px 1fr; gap: 0; }
  .stamp .side-l { background: var(--basalt); color: var(--chalk); padding: 20px; border-radius: 8px 0 0 8px; display: flex; flex-direction: column; justify-content: space-between; }
  .stamp .side-l .d { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
  .stamp .side-l .hx { width: 46px; height: 46px; border: 1.5px solid rgba(246,243,237,.6); clip-path: polygon(22% 0, 80% 4%, 100% 48%, 76% 100%, 18% 96%, 0 50%); background: rgba(246,243,237,.12); }
  .stamp .side-r { border-radius: 0 8px 8px 0; }
  .pw { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .pw:last-child { border-bottom: 0; }
  .pw .b { height: 96px; display: grid; place-items: center; background: var(--paper); border-radius: 4px; overflow: hidden; }
  .pw .b img { height: 86px; width: auto; } .pw .b img.l { height: 100%; width: 100%; object-fit: cover; }
  .stars { display: inline-flex; gap: 2px; }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars label { font-size: 22px; line-height: 1; cursor: pointer; color: var(--pumice); padding: 4px 2px; min-width: 28px; text-align: center; }
  .stars label.on { color: var(--wine); }
  .stars input:focus-visible + label { outline: 2px solid var(--vine); border-radius: 3px; }
  .saved-note { font-size: 13px; color: var(--vine-ink); }
  .login { max-width: 980px; margin: 0 auto; padding: 48px 20px 80px; }
  .login h1 { font-family: var(--serif); font-size: clamp(40px, 6vw, 68px); line-height: 1; letter-spacing: -.02em; margin: 18px 0 14px; }
  .personas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 30px; }
  .persona { text-align: left; background: var(--white); border: 1px solid var(--line-2); border-radius: 8px; padding: 20px; cursor: pointer; display: grid; gap: 8px; align-content: start; min-height: 190px; }
  .persona:hover, .persona:focus-visible { border-color: var(--basalt); }
  .persona .chip { justify-self: start; }
  .persona .n { font-family: var(--serif); font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
  .real-login { margin-top: 36px; padding: 22px; border: 1px dashed var(--line-2); border-radius: 8px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .p-inp { width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--white); font-size: 16px; }
  textarea.p-inp { padding: 10px 12px; min-height: 96px; resize: vertical; }
  .p-label { display: block; font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .p-label .opt { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .p-inp[aria-invalid="true"] { border-color: var(--red); }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding: 10px 0; align-items: start; border-bottom: 1px solid var(--line); }
  .timeline li:last-child { border-bottom: 0; }
  .timeline .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--basalt); margin-top: 4px; }
  .timeline li.done .dot { background: var(--vine-ink); border-color: var(--vine-ink); }
  .timeline li.done .t { color: var(--muted); text-decoration: line-through; }
  @media (max-width: 900px) {
    .p-shell { grid-template-columns: minmax(0, 1fr); }
    .p-side { display: none; }
    .p-main { padding: 22px 16px 110px; }
    .pgrid { grid-template-columns: 1fr; }
    .visit-hero { grid-template-columns: 1fr; } .visit-hero .ph { min-height: 160px; }
    .personas { grid-template-columns: 1fr; }
    .persona { min-height: 0; }
    .real-login { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .stamp { grid-template-columns: 1fr; } .stamp .side-l { border-radius: 8px 8px 0 0; flex-direction: row; align-items: center; gap: 14px; } .stamp .side-r { border-radius: 0 0 8px 8px; }
    .demo-bar { position: static; }
  }
  .mtop { display: none; }
  @media (max-width: 900px) { .mtop { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--paper); } .mtop img { width: 96px; height: auto; } }
</style>
<!--
  MY VASSALTIS — guest / member / event-client portal concept · Williams Digital
  ALL PEOPLE, VISITS, MESSAGES AND NOTES ARE FICTIONAL SAMPLE DATA.
  Sign-in is simulated. Production would use verified email links or one-time codes.
-->
</head>
<body>
<div class="demo-bar" role="note"><span><b>Concept · sample guests.</b> Sign-in is simulated and data stays in this browser. No bookings, emails or payments happen.</span> <a href="dashboard.html">Staff dashboard</a> <a href="index.html">Public site</a> <button type="button" id="reset">Reset demo data</button></div>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = VXS.esc, S = () => VXS.get(), T = () => VXS.today();
  const params = new URLSearchParams(location.search);
  let gid = null;
  try { gid = sessionStorage.getItem('vassaltis.portal.guest'); } catch (e) {}

  const I = {
    home: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
    visits: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    wines: '<path d="M8 3h8l-.5 6a3.5 3.5 0 0 1-7 0L8 3Z"/><path d="M12 12.5V20M8.5 21h7"/>',
    member: '<path d="M12 3 4 7v5c0 5 3.5 8 8 9 4.5-1 8-4 8-9V7l-8-4Z"/>',
    event: '<path d="M12 3c-3 3-5 6-5 9a5 5 0 0 0 10 0c0-3-2-6-5-9Z"/><path d="M12 17v4"/>',
    account: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'
  };
  const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3400); }

  const me = () => S().guests.find(x => x.id === gid);
  const myRes = () => S().reservations.filter(r => r.guestId === gid).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const myEvent = () => S().events.find(e => e.clientId === gid && !['lost'].includes(e.stage));
  const guestStatus = st => ({ 'Requested': ['requested', 'Request received'], 'Confirmed': ['confirmed', 'Confirmed'], 'Checked in': ['completed', 'Visited'], 'Completed': ['completed', 'Visited'], 'Cancelled': ['cancelled', 'Cancelled'], 'No-show': ['cancelled', 'Missed'] }[st] || ['neutral', st]);
  const gchip = st => { const [c, l] = guestStatus(st); return `<span class="chip ${c}">${l}</span>`; };
  const expImg = id => (VX.exp(id) || {}).img || 'img/athens-table.jpg';
  const venueLine = r => r.venue === 'athens' ? 'Vassaltis Downtown · Eschilou 44, Psyrri, Athens' : 'Vassaltis Vineyards · Vourvoulos, Santorini';
  const bottle = w => VX.bottle(w) ? `<img src="${VX.bottle(w)}" alt="">` : `<img class="l" src="img/l-${w.id}.jpg" alt="">`;
  const longDate = d => VXS.fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  function allowed() {
    const v = ['home', 'visits', 'wines'];
    if (me() && me().member) v.push('member');
    if (myEvent()) v.push('event');
    v.push('account');
    return v;
  }
  const LABEL = { home: 'Home', visits: 'My visits', wines: 'My wines', member: 'Club', event: 'My event', account: 'Account' };

  /* ---------------- login ---------------- */
  function login() {
    document.title = 'Sign in — My Vassaltis (concept)';
    const P = [
      ['g1', 'First visit coming up', 'A confirmed tasting today, one saved wine and no history yet.'],
      ['g2', 'Club member', 'Past tastings with a Wine Passport, private notes and club access.'],
      ['g3', 'Planning a wedding', 'An event project: menu v2 is waiting for approval.']
    ];
    $('#app').innerHTML = `
      <main class="login" id="main">
        <img src="img/logo.png" alt="Vassaltis Vineyards" width="160" style="height:auto">
        <h1>My Vassaltis</h1>
        <p class="p-lede" style="max-width:36em;font-size:18px">Your visits, the wines you tasted and your private notes, all in one place. For event clients, your planning space too.</p>
        ${params.get('request') || params.get('save') ? `<p class="status-note ok" style="max-width:40em">Choose a sample guest to continue ${params.get('request') ? 'your visit request' : 'saving that wine'}.</p>` : ''}
        <p class="eyebrow" style="margin-top:30px">Concept · choose a sample guest</p>
        <div class="personas">${P.map(([id, k, d]) => { const x = S().guests.find(y => y.id === id); return `<button class="persona" data-login="${id}"><span class="chip neutral">${k}</span><span class="n">${esc(x.name)}</span><span class="small muted">${d}</span></button>`; }).join('')}</div>
        <form class="real-login" id="magic" novalidate>
          <div><label class="p-label" for="ml">Email a sign-in link</label><input class="p-inp" id="ml" type="email" placeholder="you@example.com" autocomplete="email"><p class="hint" id="ml-h">In production, guests sign in with a one-time link or code, with no password to remember.</p></div>
          <button class="btn lg" type="submit">Send link</button>
        </form>
      </main>`;
    document.querySelectorAll('[data-login]').forEach(b => b.onclick = () => { gid = b.dataset.login; try { sessionStorage.setItem('vassaltis.portal.guest', gid); } catch (e) {} afterLogin(); });
    $('#magic').onsubmit = e => { e.preventDefault(); $('#ml-h').innerHTML = '<span style="color:var(--amber)">Concept: no email is sent. Choose a sample guest above to explore the portal.</span>'; };
  }
  function afterLogin() {
    const save = params.get('save'), req = params.get('request');
    history.replaceState(null, '', location.pathname + (req ? '#request/' + req : save ? '#wines/saved' : location.hash || '#home'));
    if (save && VX.wine(save)) { VXS.update(s => { s.saved[gid] = s.saved[gid] || []; if (!s.saved[gid].includes(save)) s.saved[gid].push(save); }); toast(VX.wine(save).name + ' saved to My Wines'); }
    params.delete('save'); params.delete('request');
    render();
  }

  /* ---------------- shell ---------------- */
  function shell(active, inner) {
    const x = me(), av = allowed();
    const mob = ['home', 'visits', 'wines'];
    $('#app').innerHTML = `
      <div class="mtop"><a href="#home"><img src="img/logo.png" alt="Vassaltis — My Vassaltis home" width="96"></a><span class="avatar" aria-hidden="true">${esc(x.name.split(/\s+/).map(p => p[0]).slice(0, 2).join(''))}</span></div>
      <div class="p-shell">
        <aside class="p-side" aria-label="My Vassaltis">
          <a class="brand" href="index.html"><img src="img/logo.png" alt="Vassaltis Vineyards" width="118"><span>My Vassaltis</span></a>
          <nav>${av.map(v => `<a class="nv" href="#${v}"${active === v ? ' aria-current="page"' : ''}>${icon(v === 'wines' ? 'wines' : v)}${LABEL[v]}</a>`).join('')}</nav>
          <div class="foot"><b style="display:block;overflow-wrap:anywhere">${esc(x.name)}</b><span class="muted xs">${x.member ? 'Club member' : myEvent() ? 'Event client' : 'Guest'}</span><br><button class="link small" id="signout" style="margin-top:6px">Sign out</button></div>
        </aside>
        <main class="p-main" id="main" tabindex="-1">${inner}</main>
      </div>
      <nav class="bnav" aria-label="My Vassaltis">${mob.map(v => `<a href="#${v}"${active === v ? ' aria-current="page"' : ''}>${icon(v)}${v === 'wines' ? 'My Wines' : v === 'visits' ? 'Visits' : 'Home'}</a>`).join('')}<a href="#more"${!mob.includes(active) ? ' aria-current="page"' : ''}>${icon('more')}More</a></nav>`;
    const so = $('#signout'); if (so) so.onclick = signOut;
  }
  function signOut() { gid = null; try { sessionStorage.removeItem('vassaltis.portal.guest'); } catch (e) {} history.replaceState(null, '', location.pathname); render(); }

  /* ---------------- views ---------------- */
  const V = {};

  V.home = () => {
    const x = me(), rs = myRes(), t = T();
    const upcoming = rs.filter(r => r.date >= t && ['Requested', 'Confirmed'].includes(r.status));
    const next = upcoming.find(r => r.status === 'Confirmed');
    const pending = upcoming.filter(r => r.status === 'Requested');
    const saved = (S().saved[gid] || []).map(VX.wine).filter(Boolean);
    const tastedCount = new Set(rs.flatMap(r => r.winesServed)).size;
    const ev = myEvent();
    const lastMsg = ev && ev.thread.filter(m => m.from === 'staff').slice(-1)[0];
    const openDec = ev ? ev.decisions.filter(d => !d.done) : [];
    const post = VX.post[0];
    document.title = 'Home — My Vassaltis (concept)';
    shell('home', `
      <p class="eyebrow">Γεια σας · Welcome back</p>
      <h1 class="p-h1">Hello, ${esc(x.name.split(' ')[0])}.</h1>
      <p class="p-lede">${next ? 'Your next visit is coming up.' : ev ? 'Here’s where your event planning stands.' : 'Here’s everything from your time with us.'}</p>
      <div class="pgrid">
        <div class="stack">
          ${next ? `<section class="card visit-hero"><div class="ph" style="background-image:url('${expImg(next.exp)}')" role="img" aria-label="${esc(VXS.exp(next.exp).name)}"></div><div class="card-b">
              <p class="eyebrow">Next visit · ${gchip(next.status)}</p>
              <div class="when">${longDate(next.date)}<br>${next.time} <span class="small muted" style="font-family:var(--sans)">Athens time</span></div>
              <p style="margin:10px 0 4px"><b>${esc(VXS.exp(next.exp).name)}</b> · ${next.party} guests</p>
              <p class="small muted" style="margin:0 0 14px">${esc(venueLine(next))}</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#visits">Visit details</a><button class="btn ghost" data-ics="${next.id}">Add to calendar</button></div>
            </div></section>`
          : ev ? `<section class="card"><div class="card-b"><p class="eyebrow">My event</p><div class="serif" style="font-size:30px;line-height:1.1">${esc(ev.title)}</div><p class="muted" style="margin:6px 0 14px">${longDate(ev.date)} · ${ev.guests} guests</p>${openDec.length ? `<div class="status-note req"><span>●</span><span><b>${openDec.length} decision${openDec.length > 1 ? 's' : ''} waiting on you</b>, starting with “${esc(openDec[0].text)}”.</span></div>` : ''}<a class="btn" href="#event">Open planning space</a></div></section>`
          : `<section class="card"><div class="card-b"><p class="eyebrow">Plan a visit</p><div class="serif" style="font-size:30px;line-height:1.1">Come and taste where it’s made.</div><p class="muted" style="margin:8px 0 16px">Tastings from €40, cellar tours daily at 16:00, lunch and dinner at the winery.</p><a class="btn" href="#request">Request a visit</a> <a class="btn ghost" href="visit.html">See experiences</a></div></section>`}
          ${pending.length ? `<section class="card"><div class="card-h"><h2>Requests</h2></div><div class="card-b">${pending.map(r => `<div class="rows"><div><span>${esc(VXS.exp(r.exp).name)} · ${VXS.fmtDate(r.date)} ${r.time}</span>${gchip(r.status)}</div></div><p class="small muted" style="margin:6px 0 0">Not yet a booking. The team will confirm it.</p>`).join('')}</div></section>` : ''}
          ${lastMsg ? `<section class="card"><div class="card-h"><h2>Latest message</h2><a class="link small" href="#event">Reply</a></div><div class="card-b"><p class="small muted" style="margin:0 0 6px">${esc(lastMsg.name)} · ${VXS.fmtStamp(lastMsg.at)}</p><p style="margin:0">${esc(lastMsg.text)}</p></div></section>` : ''}
        </div>
        <div class="stack">
          <section class="card"><div class="card-h"><h2>My wines</h2><a class="link small" href="#wines">All</a></div><div class="card-b">
            ${tastedCount ? `<div class="rows"><div><span>Wine Passport</span><b>${tastedCount} wines tasted</b></div></div>` : ''}
            ${saved.length ? saved.slice(0, 3).map(w => `<a class="wine-mini" href="wine.html?w=${w.id}"><span class="b">${bottle(w)}</span><span><span class="n">${esc(w.name)}</span><br><span class="small muted">${esc(w.style)}</span></span><span class="chip neutral">Saved</span></a>`).join('') : `<p class="small muted" style="margin:0">Save wines from any wine page to keep them here.</p>`}
          </div></section>
          <section class="card"><div class="card-b"><p class="eyebrow">From the Vassaltis Post</p><div class="serif" style="font-size:24px">Issue №${post.n} · ${esc(post.season)}</div><p style="margin:12px 0 0;display:flex;gap:14px"><a class="link" href="${post.en}" target="_blank" rel="noopener">Read in English ↗</a>${post.el ? `<a class="link" lang="el" href="${post.el}" target="_blank" rel="noopener">Ελληνικά ↗</a>` : ''}</p></div></section>
        </div>
      </div>`);
  };

  V.visits = () => {
    const rs = myRes(), t = T();

        <div class="stack">
          <section class="card"><div class="card-h"><h2>Decisions & timeline</h2></div><div class="card-b"><ul class="timeline">${ev.decisions.map(d => `<li class="${d.done ? 'done' : ''}"><span class="dot" aria-hidden="true"></span><span class="t">${esc(d.text)}</span><span class="small ${!d.done && d.due < t ? 'err' : 'muted'}">${d.done ? 'Done' : 'By ' + VXS.fmtDate(d.due)}</span></li>`).join('')}<li><span class="dot" aria-hidden="true" style="border-color:var(--wine)"></span><span class="t"><b>Your ${esc(ev.type.toLowerCase())}</b></span><span class="small muted">${VXS.fmtDate(ev.date, { year: 'numeric' })}</span></li></ul></div></section>
          <section class="card"><div class="card-h"><h2>Shared documents</h2></div><div class="card-b">${ev.docs.map(d => `<div class="rows"><div><span style="color:var(--basalt)">${esc(d.name)} <span class="muted">v${d.v}</span></span><span class="small muted">${VXS.fmtDate(d.at)}</span></div></div>`).join('') || '<p class="muted small" style="margin:0">None yet.</p>'}<p class="hint">Documents open through private, time-limited links in the full version.</p></div></section>
          ${ev.runOfShow.length ? `<section class="card"><div class="card-h"><h2>Draft run of show</h2></div><div class="card-b">${ev.runOfShow.map(r => `<div class="rows"><div><span>${r.t}</span><span>${esc(r.what)}</span></div></div>`).join('')}</div></section>` : ''}
          <section class="card"><div class="card-b"><p class="small" style="margin:0"><b>Planning with someone else?</b> Your coordinator can invite them with their own sign-in. We never share project links publicly.</p></div></section>
        </div>
      </div>`);
    const af = $('#approve');
    if (af) af.onsubmit = e => {
      e.preventDefault(); if (!$('#ap-ok').checked) { $('#ap-e').textContent = 'Tick the box to confirm which version you’re approving.'; $('#ap-ok').focus(); return; }
      VXS.update(s => { const E = s.events.find(y => y.id === ev.id); const m = E.menus.find(y => y.v === current.v); m.status = 'Approved'; E.approvals.push({ v: current.v, by: x.name, at: VXS.nowStamp() }); E.decisions.forEach(d => { if (/menu/i.test(d.text) && d.text.includes('v' + current.v)) d.done = true; }); s.tasks.unshift({ id: VXS.uid('t'), text: `${x.name} approved menu v${current.v}. Brief the kitchen`, due: T(), done: false, who: E.coordinator, link: E.id }); }, `Menu v${current.v} approved (${ev.id})`, x.name);
      toast('Menu approved. Your coordinator can see it now.'); V.event();
    };
    $('#msg').onsubmit = e => { e.preventDefault(); const v = $('#mt').value.trim(); if (!v) { $('#mt').focus(); return; } VXS.update(s => s.events.find(y => y.id === ev.id).thread.push({ at: VXS.nowStamp(), from: 'client', name: x.name, text: v }), 'Client message', x.name); toast('Message sent to your coordinator'); V.event(); };
  };

  V.account = () => {
    const x = me();
    document.title = 'Account — My Vassaltis (concept)';
    shell('account', `
      <h1 class="p-h1">Account</h1>
      <p class="p-lede">Your details and how we contact you.</p>
      <div class="pgrid">
        <div class="stack">
          <section class="card"><div class="card-h"><h2>Your details</h2></div><div class="card-b"><div class="rows"><div><span>Name</span><span style="text-align:right;overflow-wrap:anywhere">${esc(x.name)}</span></div><div><span>Email</span><span>${esc(x.email)} <span class="chip confirmed" style="margin-left:6px">Verified</span></span></div><div><span>Phone</span><span>${esc(x.phone || '—')}</span></div></div>
            <div style="margin-top:16px"><label class="p-label" for="ac-lang">Preferred language</label><select class="p-inp" id="ac-lang">${['English', 'Ελληνικά', 'Italiano', 'Français', 'Deutsch'].map(l => `<option${l === x.lang ? ' selected' : ''}>${l}</option>`).join('')}</select><p class="hint">We’ll write to you in English or Greek, and note your language for your hosts.</p></div></div></section>
          <section class="card"><div class="card-h"><h2>Communication</h2></div><div class="card-b" style="display:grid;gap:14px">
            <label style="display:flex;gap:12px;align-items:flex-start"><input type="checkbox" checked disabled style="margin-top:4px"><span><b>Visit messages</b><br><span class="small muted">Confirmations and reminders about bookings you make. Always on while you have a visit.</span></span></label>
            <label style="display:flex;gap:12px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="ac-mk" ${x.marketing ? 'checked' : ''} style="margin-top:4px;accent-color:var(--vine)"><span><b>The Vassaltis Post &amp; news</b><br><span class="small muted">${x.marketing && x.marketingAt ? 'You opted in on ' + VXS.fmtDate(x.marketingAt, { year: 'numeric' }) + '. ' : ''}Occasional newsletters and releases. Unsubscribe any time.</span></span></label>
          </div></section>
        </div>
        <div class="stack">
          <section class="card"><div class="card-h"><h2>Privacy</h2></div><div class="card-b"><p class="small" style="margin:0 0 12px">Ask for a copy of your data, or ask us to delete it.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-priv="access">Request my data</button><button class="btn ghost" data-priv="erasure">Delete my account</button></div><p class="hint" id="priv-h">Handled by the Vassaltis team under their <a href="https://vassaltis.com/gdpr/" target="_blank" rel="noopener">privacy policy</a>.</p>
            ${x.dietary ? `<div class="rows" style="margin-top:10px"><div><span>Dietary note on file</span><span>${esc(x.dietary)}</span></div></div><button class="link small" id="rm-diet">Remove dietary note</button>` : ''}</div></section>
          <section class="card"><div class="card-b"><p class="small muted" style="margin:0 0 10px">Signed in on this device.</p><button class="btn ghost" id="so2">Sign out</button></div></section>
        </div>
      </div>`);
    $('#ac-lang').onchange = e => { VXS.update(s => { s.guests.find(y => y.id === gid).lang = e.target.value; }); toast('Language updated'); };
    $('#ac-mk').onchange = e => { const on = e.target.checked; VXS.update(s => { const y = s.guests.find(z => z.id === gid); y.marketing = on; y.marketingAt = on ? T() : null; }, on ? 'Marketing consent given' : 'Marketing consent withdrawn', x.name); toast(on ? 'Subscribed to the Vassaltis Post' : 'Unsubscribed'); };
    document.querySelectorAll('[data-priv]').forEach(b => b.onclick = () => { VXS.update(s => s.tasks.unshift({ id: VXS.uid('t'), text: `Privacy request (${b.dataset.priv === 'access' ? 'data access' : 'erasure'}) from ${x.name}`, due: VXS.addDays(T(), 3), done: false, who: 'Yannis V.', link: '' }), 'Privacy request', x.name); $('#priv-h').textContent = 'Request sent. The team will verify it’s you and reply by email. (Concept: nothing was sent.)'; });
    const rd = $('#rm-diet'); if (rd) rd.onclick = () => { VXS.update(s => { s.guests.find(y => y.id === gid).dietary = ''; }, 'Dietary note removed', x.name); toast('Dietary note removed'); V.account(); };
    $('#so2').onclick = signOut;
  };

  V.more = () => {
    shell('more', `<h1 class="p-h1">More</h1><section class="card" style="margin-top:18px">${allowed().filter(v => !['home', 'visits', 'wines'].includes(v)).map(v => `<a href="#${v}" style="display:flex;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);text-decoration:none;font-size:17px">${icon(v)}${LABEL[v]}<span class="muted" style="margin-left:auto">›</span></a>`).join('')}<a href="index.html" style="display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);text-decoration:none;font-size:17px">Vassaltis website<span class="muted" style="margin-left:auto">↗</span></a><button class="link" id="so3" style="padding:16px 20px;font-size:16px">Sign out</button></section>`);
    $('#so3').onclick = signOut;
  };

  function denied(what) {
    shell('home', `<section class="card" style="max-width:620px"><div class="empty"><span class="serif">This isn’t part of your account.</span>You don’t have access to ${esc(what)}. If you think that’s wrong, contact the winery.<br><br><a class="btn ghost" href="#home">Back to home</a></div></section>`);
  }

  /* ---------------- calendar file ---------------- */
  function ics(id) {
    const r = S().reservations.find(x => x.id === id); if (!r) return;
    const x = VXS.exp(r.exp);
    const dur = r.exp === 'dinner' ? 120 : r.exp === 'cellar' ? 60 : 90;
    const [h, m] = r.time.split(':').map(Number); const end = h * 60 + m + dur;
    const d = r.date.replace(/-/g, ''), pad = n => String(n).padStart(2, '0');
    const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Vassaltis concept//My Vassaltis//EN', 'BEGIN:VEVENT', `UID:${r.id}@vassaltis-concept`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
      `DTSTART;TZID=Europe/Athens:${d}T${pad(h)}${pad(m)}00`, `DTEND;TZID=Europe/Athens:${d}T${pad(Math.floor(end / 60))}${pad(end % 60)}00`,
      `SUMMARY:${x.name} · Vassaltis`, `LOCATION:${venueLine(r).replace(/,/g, '\\,')}`, `DESCRIPTION:${r.party} guests · ref ${r.ref} · +30 22860 22211`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = `vassaltis-${r.ref}.ics`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Calendar file downloaded (times in Europe/Athens)');
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-ics]'); if (b) ics(b.dataset.ics); });

  /* ---------------- router ---------------- */
  function render() {
    if (!gid || !me()) return login();
    const [v, arg] = (location.hash.slice(1) || 'home').split('/');
    if (v === 'request') return V.request(arg);
    if (v === 'wines') return V.wines(arg);
    if (v === 'more') return V.more();
    if (!V[v]) return V.home();
    if (!allowed().includes(v)) return denied(v === 'member' ? 'the club area' : v === 'event' ? 'an event planning space' : v);
    V[v]();
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); const m = $('#main'); if (m) m.focus({ preventScroll: true }); });
  VXS.onChange(() => {});
  window.addEventListener('storage', e => { if (e.key === 'vassaltis.demo.v1' && gid && !document.activeElement.matches('textarea,input')) render(); });
  $('#reset').onclick = () => { if (confirm('Reset all demo data to the original sample?')) { VXS.reset(); toast('Demo data reset'); render(); } };
  if (gid && (params.get('request') || params.get('save'))) afterLogin(); else render();
})();
</script>
</body>
</html>
