<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Journal — Vassaltis Vineyards</title>
<meta name="theme-color" content="#F6F3ED">
<link rel="icon" href="https://vassaltis.com/wp-content/uploads/2020/11/cropped-Vassaltis_favicon-1-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif+Display:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vx.css">
<!-- Vassaltis redesign concept · Williams Digital · content from vassaltis.com, see SOURCES.md -->
</head>
<body data-page="journal">
<div data-vx-header></div>
<main id="main">
  <section class="page-head">
    <div class="wrap">
      <div class="grid">
        <div>
          <p class="eyebrow"><span class="hex"></span>Journal</p>
          <h1 class="d1">The Vassaltis <span class="i">Post.</span></h1>
        </div>
        <p class="lede">The winery’s newspaper, published in English and Greek since the summer of 2022. Each issue opens as a PDF from the Vassaltis club archive.</p>
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:clamp(40px,5vw,72px)">
    <div class="wrap journal">
      <div>
        <div class="frame" style="aspect-ratio:4/5;position:sticky;top:110px"><img src="img/harvest.jpg" alt="Harvesting grapes in a Vassaltis vineyard" width="2000" height="2000"></div>
      </div>
      <div>
        <ul class="issues" id="issues"></ul>
        <p class="small muted" style="margin-top:24px"><span class="confirm">Article-level web versions to confirm</span></p>
      </div>
    </div>
  </section>
</main>

<div data-vx-footer></div>
<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/site.js"></script>
<script>
document.getElementById('issues').innerHTML = VX.post.map(p => `<li><span class="no">№${p.n}</span><span class="t">${VX.esc(p.season)}</span><span class="l"><a href="${p.en}" target="_blank" rel="noopener">English ↗</a>${p.el ? `<a href="${p.el}" target="_blank" rel="noopener" lang="el">Ελληνικά ↗</a>` : '<span class="muted">English only</span>'}</span></li>`).join('');
</script>
</body>
</html>
