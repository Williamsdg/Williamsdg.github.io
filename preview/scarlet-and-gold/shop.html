<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Auburn · Scarlet &amp; Gold</title>
<meta name="description" content="Shop officially licensed Auburn game day apparel designed in-house in Auburn, a few miles from Jordan-Hare, plus every school we make.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7C1019">
<script>
/* Season theme before first paint: sets <html data-chapter>, which assets/sg-themes.css keys off.
   MUST match SG.currentChapter() + the chapter date ranges in assets/sg-chapters.js:
   ?chapter= (auto/today clears the override) → sessionStorage sg_chapter → America/Chicago date. */
(function () {
  var R = { football: [815, 1115], christmas: [1116, 1231], hoops: [101, 315], spring: [316, 814] }, c = null, q = null, s = null;
  try { q = new URLSearchParams(location.search).get('chapter'); } catch (e) {}
  if (q === 'auto' || q === 'today') { try { sessionStorage.removeItem('sg_chapter'); } catch (e) {} }
  else if (q && R.hasOwnProperty(q)) c = q;
  if (!c) { try { s = sessionStorage.getItem('sg_chapter'); } catch (e) {} if (s && R.hasOwnProperty(s)) c = s; }
  if (!c) {
    try {
      var m = 0, d = 0;
      new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', month: 'numeric', day: 'numeric' }).formatToParts(new Date())
        .forEach(function (p) { if (p.type === 'month') m = +p.value; if (p.type === 'day') d = +p.value; });
      for (var k in R) if (m * 100 + d >= R[k][0] && m * 100 + d <= R[k][1]) c = k;
    } catch (e) {}
  }
  document.documentElement.setAttribute('data-chapter', c || 'christmas');
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%237C1019'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' font-style='italic' text-anchor='middle' fill='%23E2BE77'%3E%26%3C/text%3E%3C/svg%3E">
<script>/* browser-bar tint + favicon follow the season before any deferred JS runs (values match sg-chapters.js themeColor + applyChapterTheme) */(function(){var m={football:['#0C2340','#F59A4A'],hoops:['#13294B','#F2B36B'],spring:['#2F5D50','#F7E08F']}[document.documentElement.getAttribute('data-chapter')];if(!m)return;var t=document.querySelector('meta[name="theme-color"]');if(t)t.setAttribute('content',m[0]);var i=document.querySelector('link[rel="icon"]');if(i)i.setAttribute('href',i.getAttribute('href').replace('%237C1019','%23'+m[0].slice(1)).replace('%23E2BE77','%23'+m[1].slice(1)));})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Graduate&display=swap">
<link rel="stylesheet" href="assets/sg.css?v=3">
<link rel="stylesheet" href="assets/shop.css?v=3">
<link rel="stylesheet" href="assets/sg-themes.css?v=1">
<script src="data.js?v=2" defer></script>
<script src="assets/sg-chapters.js?v=5" defer></script>
<script src="assets/sg.js?v=3" defer></script>
<script src="assets/shop.js?v=2" defer></script>
</head>
<body data-page="shop">
<div data-sg="header"></div>

<main id="main">

  <!-- Collection / school / search header (filled by shop.js from the URL) -->
  <section class="sh-head" data-sh="head" aria-labelledby="sh-h">
    <div class="wrap sh-head__grid">
      <div class="sh-head__copy">
        <nav class="sh-crumbs" aria-label="Breadcrumb" data-sh="crumbs"></nav>
        <p class="eyebrow" data-sh="eyebrow">Shop</p>
        <h1 class="display sh-head__h" id="sh-h" data-sh="title">Shop</h1>
        <p class="sh-head__lede" data-sh="lede" hidden></p>
        <form class="sh-q" role="search" action="shop.html" data-sh="qform" hidden>
          <label class="sr" for="sh-q">Search the shop</label>
          <input id="sh-q" name="q" type="search" autocomplete="off" placeholder="Search tees, cheer dresses, schools…">
          <button type="submit" class="btn btn--scarlet btn--sm">Search</button>
        </form>
        <div class="sh-head__meta" data-sh="meta"></div>
      </div>
      <div class="sh-head__media" data-sh="media" hidden></div>
    </div>
  </section>

  <!-- Collection switcher: the main Auburn collections + every school -->
  <nav class="sh-switch" aria-label="Shop Auburn collections">
    <div class="wrap sh-switch__in">
      <p class="sh-switch__label" aria-hidden="true">Shop Auburn</p>
      <ul class="sh-switch__chips" data-sh="chips"></ul>
    </div>
    <div class="wrap sh-schools" id="sh-schools" data-sh="schools" hidden></div>
  </nav>

  <!-- Listing: filter rail + grid (only when the catalogue has products for this view) -->
  <section class="sh-list" id="sh-list" data-sh="list" aria-label="Products" hidden>
    <div class="wrap sh-list__grid">
      <aside class="sh-rail" aria-labelledby="sh-rail-h">
        <div class="sh-rail__in">
          <div class="sh-rail__head">
            <h2 class="sh-rail__h" id="sh-rail-h">Filter</h2>
            <button type="button" class="tlink sh-rail__clear" data-sh-clear hidden>Clear all</button>
          </div>
          <form class="sh-filters" data-sh="rail" data-scope="live" aria-label="Filter products"></form>
        </div>
      </aside>

      <div class="sh-results">
        <div class="sh-bar">
          <div class="sh-bar__tools">
            <button type="button" class="sh-fbtn" data-sh-sheet aria-haspopup="dialog" aria-controls="sh-sheet" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke-linecap="round"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
              Filter<span class="sh-fbtn__n" data-sh="fcount" hidden></span>
            </button>
            <div class="sh-sort">
              <label class="sh-sort__l" for="sh-sort">Sort</label>
              <span class="sel"><select id="sh-sort" data-sh="sort">
                <option value="featured">Featured</option>
                <option value="new">Newest</option>
                <option value="price-asc">Price, low–high</option>
                <option value="price-desc">Price, high–low</option>
              </select></span>
            </div>
          </div>
        </div>
        <p class="sh-count" data-sh="count" aria-live="polite"></p>
        <ul class="sh-pills" data-sh="pills" aria-label="Active filters" hidden></ul>
        <div class="sh-grid" data-sh="grid"></div>
        <div class="sh-none" data-sh="none" hidden></div>
        <div class="sh-more" data-sh="more" hidden></div>
      </div>
    </div>
  </section>

  <!-- Honest empty state: this view has no products in the fetched catalogue -->
  <section class="band band--paper2 sh-cat" data-sh="cat" aria-labelledby="sh-cat-h" hidden></section>

  <!-- Photo-led Auburn departments (links to other collections) -->
  <section class="band band--cream sh-depts" id="sh-depts" data-sh="depts-band" aria-labelledby="sh-depts-h" hidden>
    <div class="wrap">
      <div class="sechead">
        <div>
          <p class="eyebrow"><span><span class="eyebrow__dot" aria-hidden="true"></span>Our home team</span></p>
          <h2 class="h2" id="sh-depts-h" data-sh="depts-title">Keep shopping <em>Auburn.</em></h2>
        </div>
        <div class="sechead__side"><a class="tlink" href="auburn.html">Visit the Auburn shop</a></div>
      </div>
      <ul data-sh="depts" aria-label="Auburn departments"></ul>
    </div>
  </section>

  <section data-sg="visit" aria-label="Visit our Auburn shop"></section>
</main>

<!-- Phone filter sheet (full height). Changes are staged until "Show N styles". -->
<div class="sh-sheet" id="sh-sheet" role="dialog" aria-modal="true" aria-labelledby="sh-sheet-h" hidden>
  <div class="sh-sheet__scrim" data-sh-close></div>
  <div class="sh-sheet__panel" tabindex="-1">
    <div class="sh-sheet__head">
      <h2 class="sh-sheet__h" id="sh-sheet-h">Filter</h2>
      <button type="button" class="sh-x" data-sh-close aria-label="Close filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg></button>
    </div>
    <form class="sh-filters sh-sheet__body" data-sh="sheet" data-scope="draft" aria-label="Filter products"></form>
    <div class="sh-sheet__foot">
      <button type="button" class="btn btn--line-ink" data-sh-sheet-clear>Clear</button>
      <button type="button" class="btn btn--scarlet" data-sh-apply>Show results</button>
    </div>
  </div>
</div>

<div data-sg="footer"></div>
</body>
</html>
