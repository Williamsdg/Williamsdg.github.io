<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Williams Digital Command Center</title>
<style>
  :root {
    --paper: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #22262E;
    --ink-soft: #565B66;
    --line: #DEDCD4;
    --accent: #2A5D57;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4ECEA;
    --side: #1E332F;
    --side-ink: #C9D6D3;
    --side-active: #2A5D57;
    --go: #2E7D32;
    --go-bg: #E7F1E7;
    --caution: #A66A12;
    --caution-bg: #F6EEDD;
    --stop: #B3382F;
    --stop-bg: #F6E5E3;
    --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 3px rgba(20,25,23,.07), 0 4px 14px rgba(20,25,23,.05);
    --c1-bg:#E7EEF6; --c1-fg:#2B5B8F;
    --c2-bg:#F0EAF6; --c2-fg:#5D4A8A;
    --c3-bg:#F6EEDD; --c3-fg:#A66A12;
    --c4-bg:#E7F1E7; --c4-fg:#2E7D32;
    --c5-bg:#F6E5E3; --c5-fg:#B3382F;
    --c6-bg:#E4ECEA; --c6-fg:#2A5D57;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #191C21; --surface: #22262E; --ink: #E8E7E2; --ink-soft: #A6AAB3;
      --line: #383D47; --accent: #6FB3A8; --accent-ink: #10201D; --accent-soft: #253833;
      --side: #14211E; --side-ink: #9FB4B0; --side-active: #2A5D57;
      --go: #7CC47F; --go-bg: #243224; --caution: #D9A555; --caution-bg: #3a2f1d;
      --stop: #E08078; --stop-bg: #3d2422;
      --shadow: 0 1px 3px rgba(0,0,0,.35);
      --c1-bg:#223140; --c1-fg:#8FB8DD;
      --c2-bg:#2E2839; --c2-fg:#B4A3D8;
      --c3-bg:#3a2f1d; --c3-fg:#D9A555;
      --c4-bg:#243224; --c4-fg:#7CC47F;
      --c5-bg:#3d2422; --c5-fg:#E08078;
      --c6-bg:#253833; --c6-fg:#6FB3A8;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
  }
  button { font: inherit; cursor: pointer; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  aside {
    background: var(--side);
    color: var(--side-ink);
    padding: 22px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { padding: 2px 12px 18px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 14px; }
  .brand .wd { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; opacity: .75; }
  .brand h1 { font-family: var(--serif); font-size: 19px; margin: 4px 0 0; color: #fff; font-weight: 700; line-height: 1.25; }
  .navgroup { margin-bottom: 14px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: none; border: 0; color: var(--side-ink);
    padding: 9px 12px; border-radius: 8px; font-size: 14px; font-weight: 500;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: var(--side-active); color: #fff; }
  .nav-item .ico { width: 18px; text-align: center; flex: none; opacity: .9; }
  .nav-item .badge {
    margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 2px 8px;
  }
  .nav-sep { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 12px 8px; }
  .side-foot { padding: 14px 12px 4px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; opacity: .55; }

  /* ---------- Main ---------- */
  main { padding: 28px 32px 80px; max-width: 1180px; }
  .view-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .view-head h2 { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 0; }
  .view-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }
  .view-head .spacer { flex: 1; }

  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 14px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.small { padding: 5px 12px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--stop); border: 1px solid var(--stop); }

  /* ---------- Filter bar ---------- */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filters input[type=search] { flex: 1; min-width: 200px; max-width: 380px; }
  .filters select { width: auto; }
  .filters .count { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-left: auto; }
  input[type=search], textarea, input[type=text], input[type=url], select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: inherit; padding: 8px 12px;
  }
  textarea, input[type=text], input[type=url] { width: 100%; }
  textarea { min-height: 70px; resize: vertical; background: var(--paper); }

  /* ---------- Cards / tiles ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .tile { padding: 16px 18px; }
  .tile .t-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .tile .t-num { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .t-hint { font-size: 12.5px; color: var(--ink-soft); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { padding: 18px 20px; }
  .panel h3 { margin: 0 0 12px; font-size: 15.5px; font-weight: 650; }

  .mini-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 8px; }

  /* ---------- Score / bars ---------- */
  .score-pill {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
    border-radius: 999px; padding: 3px 11px; white-space: nowrap;
  }
  .s-hot { background: var(--go-bg); color: var(--go); }
  .s-warm { background: var(--caution-bg); color: var(--caution); }
  .s-cold { background: var(--stop-bg); color: var(--stop); }
  .est { font-size: 10px; opacity: .75; font-weight: 500; }

  .bars { display: grid; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: 170px minmax(0,1fr) 52px; gap: 12px; align-items: center; font-size: 13.5px; }
  .bar-row .val { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-soft); }
  .bar-track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .bar-fill.opp { background: var(--caution); }

  /* ---------- Tables ---------- */
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th {
    text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600; padding: 10px 14px; border-bottom: 2px solid var(--line); white-space: nowrap;
  }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover td { background: var(--accent-soft); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .chip {
    display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 10px; font-weight: 550;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .chip.c1 { background: var(--c1-bg); color: var(--c1-fg); }
  .chip.c2 { background: var(--c2-bg); color: var(--c2-fg); }
  .chip.c3 { background: var(--c3-bg); color: var(--c3-fg); }
  .chip.c4 { background: var(--c4-bg); color: var(--c4-fg); }
  .chip.c5 { background: var(--c5-bg); color: var(--c5-fg); }
  .chip.c6 { background: var(--c6-bg); color: var(--c6-fg); }
  .stage-chip { font-size: 12px; border-radius: 6px; padding: 2px 9px; font-weight: 600; background: var(--paper); border: 1px solid var(--line); white-space: nowrap; }
  .stage-Won { color: var(--go); border-color: var(--go); }
  .stage-Lost { color: var(--stop); border-color: var(--stop); }

  /* ---------- Lead feed ---------- */
  .lead-row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .lead-row:first-of-type { border-top: 0; }
  .lead-row .l-main { flex: 1; min-width: 0; }
  .lead-row .l-name { font-weight: 650; }
  .lead-row .l-meta { font-size: 13px; color: var(--ink-soft); }
  .showmore { display: block; width: 100%; background: var(--paper); border: 0; border-top: 1px solid var(--line); padding: 12px; color: var(--accent); font-weight: 600; border-radius: 0 0 10px 10px; }

  /* ---------- Pipeline ---------- */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: 236px; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .col-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
  .col-head .c-name { font-weight: 650; font-size: 13.5px; }
  .col-head .c-count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .col-head .c-val { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; }
  .col-body { min-height: 60px; padding: 10px; display: grid; gap: 8px; }
  .col.dragover .col-body { background: var(--accent-soft); border-radius: 0 0 10px 10px; }
  .pcard {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; cursor: grab; font-size: 13.5px;
  }
  .pcard:active { cursor: grabbing; }
  .pcard .p-name { font-weight: 650; margin-bottom: 2px; }
  .pcard .p-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-soft); }
  .col-more { font-size: 12px; color: var(--ink-soft); text-align: center; padding: 4px 8px 8px; }

  /* ---------- Company detail ---------- */
  .backlink { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; margin-bottom: 14px; font-size: 14px; }
  .co-head { padding: 22px 24px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
  .co-head .co-id { flex: 1; min-width: 240px; }
  .co-head h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; }
  .co-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 22px; flex-basis: 100%; margin-top: 14px; }
  .fact .f-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .fact .f-val { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 14px; font-weight: 550; color: var(--ink-soft); }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .opps li { margin-bottom: 6px; }
  .opps { list-style: none; padding: 0; margin: 0; }
  .opps .ok { color: var(--go); font-weight: 700; margin-right: 8px; }

  .note { border-top: 1px solid var(--line); padding: 12px 2px; }
  .note:first-of-type { border-top: 0; }
  .note .n-date { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 3px; }
  .note.imported .n-date { color: var(--caution); }
  .note-form { display: grid; gap: 8px; margin-top: 14px; }

  .timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
  .timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
  .timeline li:last-child { padding-bottom: 2px; }
  .timeline li::before {
    content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--surface);
  }
  .timeline .t-date { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .timeline .t-what { font-weight: 550; }

  .demo-asset {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; margin-bottom: 8px;
  }
  .demo-asset .what { font-weight: 600; min-width: 150px; }
  .demo-asset a { font-family: var(--mono); font-size: 12.5px; word-break: break-all; text-decoration: none; }
  .demo-asset a:hover { text-decoration: underline; }

  .reco {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    border-radius: 0 8px 8px 0; padding: 14px 18px; margin-top: 6px;
  }
  .reco .r-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .reco ul { margin: 0 0 8px; padding-left: 20px; }
  .reco .r-val { font-family: var(--mono); font-weight: 700; color: var(--accent); }

  /* ---------- Tasks ---------- */
  .task { display: flex; gap: 12px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); }
  .task:first-of-type { border-top: 0; }
  .task input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  .task .t-text { flex: 1; }
  .task.done .t-text { text-decoration: line-through; color: var(--ink-soft); }
  .task .t-due { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

  /* ---------- Funnel ---------- */
  .funnel { display: grid; gap: 10px; }
  .f-row { display: grid; grid-template-columns: 150px minmax(0,1fr) 110px; gap: 12px; align-items: center; font-size: 14px; }
  .f-track { height: 26px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .f-fill { height: 100%; background: var(--accent); opacity: .9; }
  .f-nums { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); }

  /* ---------- Scanner ---------- */
  .future-note {
    border: 1px dashed var(--caution); background: var(--caution-bg); color: var(--caution);
    border-radius: 8px; padding: 10px 14px; font-size: 13.5px; font-weight: 550; margin-bottom: 18px;
  }
  .scan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .scan-tile { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-align: center; }
  .scan-tile .g { font-size: 24px; font-weight: 700; font-family: var(--mono); }
  .scan-tile .l { font-size: 12px; color: var(--ink-soft); }

  /* ---------- Proposal overlay ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(15,20,18,.55); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto; z-index: 50; }
  .proposal { background: var(--surface); border-radius: 12px; max-width: 720px; width: 100%; padding: 40px 46px; }
  .proposal .p-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .proposal h2 { font-family: var(--serif); font-size: 28px; margin: 0 0 4px; }
  .proposal h3 { font-size: 15.5px; margin: 24px 0 8px; }
  .proposal ul { margin: 0 0 8px; padding-left: 22px; font-size: 14.5px; }
  .proposal .price { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); }
  .proposal .p-actions { display: flex; gap: 10px; margin-top: 28px; }
  @media print {
    aside, .view-head .btn, .p-actions { display: none !important; }
    .overlay { position: static; padding: 0; background: none; }
    .proposal { box-shadow: none; max-width: none; }
    body > .app { display: none; }
  }

  .empty { color: var(--ink-soft); font-size: 14px; padding: 18px; text-align: center; }

  /* ---------- Mobile ---------- */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; padding: 14px; }
    .navgroup { display: flex; flex-wrap: wrap; gap: 4px; }
    .nav-item { width: auto; padding: 7px 12px; }
    .nav-item .badge { margin-left: 6px; }
    .nav-sep { display: none; }
    .side-foot { display: none; }
    main { padding: 20px 16px 60px; }
    .bar-row { grid-template-columns: 110px minmax(0,1fr) 48px; }
    .filters .count { margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="wd">Williams Digital</div>
      <h1>Sales Command Center</h1>
    </div>
    <div class="navgroup" id="nav"></div>
    <hr class="nav-sep">
    <div class="side-foot" id="side-foot">INTERNAL</div>
  </aside>
  <main id="view"></main>
</div>

<script src="leads-data.js"></script>

const catCfg = cat => CATS[cat] || GENERIC_CAT;
const chipClass = cat => 'c' + ((Array.from(String(cat)).reduce((n,ch) => n + ch.charCodeAt(0), 0) % 6) + 1);

/* =============== State =============== */
const LEADS = (window.WDCC_LEADS || []).map(l => ({
  id: l.id, name: l.name, cat: l.cat, loc: l.loc, type: l.type, web: l.web, pitch: l.pitch,
  phone: l.phone, email: l.email, contact: l.contact, importNote: l.notes,
  score: { design: l.s[0], mobile: l.s[1], seo: l.s[2], portal: l.s[3], dashboard: l.s[4] },
  value: l.v, est: true,
}));

const OV_KEY = 'wdcc-ov-v2';
let ov = loadOv();
function loadOv() {
  try { const raw = localStorage.getItem(OV_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { rep: 'Sales Rep', tasks: [], leads: {}, custom: [] };
}
function save() { try { localStorage.setItem(OV_KEY, JSON.stringify(ov)); } catch (e) { alert('Could not save — browser storage full or blocked.'); } }
function leadOv(id) { return ov.leads[id] || (ov.leads[id] = { stage: 'Prospect', notes: [], outreach: [], opps: [], lastContact: '—' }); }

function companies() {
  const merged = LEADS.map(l => {
    const o = ov.leads[l.id];
    return Object.assign({}, l, {
      stage: o?.stage || 'Prospect',
      lastContact: o?.lastContact || '—',
      notes: o?.notes || [],
      outreach: o?.outreach || [],
      userOpps: o?.opps || [],
    });
  });
  return merged.concat(ov.custom.map(c => Object.assign({ userOpps: c.opps || [], notes: c.notes || [], outreach: c.outreach || [], est: false }, c)));
}
function byId(id) { return companies().find(c => c.id === id); }
function mutate(c, fn) {
  if (c.custom) {
    const target = ov.custom.find(x => x.id === c.id);
    if (target) fn(target, true);
  } else {
    fn(leadOv(c.id), false);
  }
  save(); render();
}

/* =============== Helpers =============== */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total = c => SCORE_KEYS.reduce((n,[k]) => n + (c.score[k]||0), 0);
const money = n => '$' + n.toLocaleString();
const scoreClass = n => n >= 80 ? 's-hot' : n >= 60 ? 's-warm' : 's-cold';
function derivedOpps(c) {
  const out = [];
  if (/no site/i.test(c.web || '')) out.push('No website found');
  else if (c.web && c.web !== 'Has site') out.push(c.web);
  if (c.pitch) out.push('Pitch angle: ' + c.pitch);
  return out.concat(c.userOpps || []);
}
function pkg(c) {
  const cfg = catCfg(c.cat);
  const parts = ['Website ' + (/no site/i.test(c.web||'') ? 'build (net-new)' : 'refresh')];
  if (c.score.portal >= 14) parts.push(cfg.portalWord);
  if (c.score.dashboard >= 14) parts.push(cfg.dashWord);
  const range = parts.length >= 3 ? '$7,500 – $10,000' : parts.length === 2 ? '$3,500 – $8,000' : '$1,500 – $4,000';
  return { parts, range };
}
function today() { const d = new Date(); return (d.getMonth()+1) + '/' + d.getDate(); }
const stageIdx = s => STAGES.indexOf(s);

function render() {

/* =============== Filtering =============== */
function filtered(list) {
  let out = list;
  if (filterCat) out = out.filter(c => c.cat === filterCat);
  if (filterQ) {
    const q = filterQ.toLowerCase();
    out = out.filter(c => [c.name, c.loc, c.type, c.contact, c.email, c.phone, c.importNote, c.pitch].join(' ').toLowerCase().includes(q));
  }
  return out;
}
function filterBar(shown, totalN) {
  const cats = [...new Set(companies().map(c => c.cat))].sort();
  return `<div class="filters">
    <input type="search" id="f-q" placeholder="Search name, city, contact, notes…" value="${esc(filterQ)}">
    <select id="f-cat">
      <option value="">All categories</option>
      ${cats.map(c => `<option ${filterCat===c?'selected':''}>${esc(c)}</option>`).join('')}
    </select>
    <span class="count">${shown.toLocaleString()} of ${totalN.toLocaleString()}</span>
  </div>`;
}

function viewPipeline() {
  const cos = companies();
  const PROSPECT_CAP = 12;
  const cols = STAGES.map(stage => {
    let list = cos.filter(c => c.stage === stage);
    const val = list.reduce((n,c) => n + c.value, 0);
    let more = 0;
    if (stage === 'Prospect') {
      list = list.sort((a,b) => total(b)-total(a));
      more = Math.max(0, list.length - PROSPECT_CAP);
      list = list.slice(0, PROSPECT_CAP);
    }
    return `<div class="col" data-stage="${stage}">
      <div class="col-head"><span class="c-name">${stage}</span><span class="c-count">${cos.filter(c=>c.stage===stage).length.toLocaleString()}</span>${val?`<span class="c-val">${money(val)}</span>`:''}</div>

        ${list.map(c => `<div class="pcard" draggable="true" data-drag="${c.id}">
          <div class="p-name">${esc(c.name)}</div>
          <div class="p-meta"><span class="score-pill ${scoreClass(total(c))}" style="font-size:11px;padding:1px 8px">${total(c)}</span> ${money(c.value)}</div>
        </div>`).join('')}
      </div>
      ${more ? `<div class="col-more">+${more.toLocaleString()} more — work them in the <a href="#" data-nav="leads">Lead Feed</a></div>` : ''}

  }).join('');
  return `

    <p class="view-sub">Drag a card between stages. Double-click opens the company. Prospect column shows the top ${12} by score.</p>

        </div>`).join('')}
      <div class="card panel">
        <h3><span class="chip">Everything else</span> &nbsp;Portfolio-led ${['Museum','Shopify','YouTubers'].map(c=>counts[c]||0).reduce((a,b)=>a+b,0) ? `<span style="font-weight:400;color:var(--ink-soft);font-size:12.5px">· Museum, Shopify, YouTubers…</span>`:''}</h3>
        ${GENERIC_CAT.demos.map(([what,url],i) => `<div class="demo-asset"><span class="what">${i+1}. ${esc(what)}</span><a href="${url}" target="_blank" rel="noopener">${url.replace('https://','')}</a></div>`).join('')}
      </div>
    </div>`;
}

function viewOutreach() {
  const events = [];
  companies().forEach(c => c.outreach.forEach(([d,w]) => events.push({d, w, c})));
  return `
    <div class="view-head"><h2>Outreach</h2></div>
    <p class="view-sub">Every touch across every company. Log new outreach from a company's page.</p>
    <div class="card panel">
      ${events.length ? `<ul class="timeline">${events.map(e =>
        `<li><div class="t-date">${esc(e.d)}</div><div class="t-what">${esc(e.w)} — <a href="#" data-open="${e.c.id}">${esc(e.c.name)}</a></div></li>`).join('')}</ul>`
      : '<div class="empty">No outreach logged yet. Open a company and log the first touch.</div>'}
    </div>`;
}

function taskRow(t) {
  const co = t.co ? byId(t.co) : null;
  return `<div class="task ${t.done?'done':''}">
    <input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}>
    <span class="t-text">${esc(t.text)}${co?` — <a href="#" data-open="${co.id}">${esc(co.name)}</a>`:''}</span>
    <span class="t-due">${esc(t.due)}</span>
  </div>`;
}

function viewTasks() {
  const open = ov.tasks.filter(t=>!t.done), done = ov.tasks.filter(t=>t.done);
  return `
    <div class="view-head"><h2>Tasks</h2></div>
    <p class="view-sub">Follow-ups and to-dos. Nothing falls through.</p>
    <div class="card">${open.map(taskRow).join('') || '<div class="empty">No open tasks.</div>'}</div>
    ${done.length ? `<div class="mini-label">Done</div><div class="card">${done.map(taskRow).join('')}</div>` : ''}
    <div class="note-form" style="max-width:560px">
      <input type="text" id="task-text" placeholder="New task (e.g. Call top 5 tourism leads)">
      <div style="display:flex;gap:8px"><input type="text" id="task-due" placeholder="Due (e.g. 7/22)" style="max-width:140px"><button class="btn small" id="add-task">Add task</button></div>
    </div>`;
}

function viewReports() {
  const cos = companies();
  const past = i => cos.filter(c => c.stage !== 'Lost' && stageIdx(c.stage) >= i).length;
  const funnel = [
    ['In database', cos.length],
    ['Contacted', past(1)],
    ['Discovery', past(2)],
    ['Proposal', past(3)],
    ['Negotiation', past(4)],
    ['Won', cos.filter(c => c.stage === 'Won').length],
  ];
  const lost = cos.filter(c => c.stage === 'Lost').length;
  const max = funnel[0][1] || 1;
  return `
    <div class="view-head"><h2>Reports</h2></div>
    <p class="view-sub">Live funnel, computed from actual stages — it updates as you work the pipeline.</p>
    <div class="card panel">
      <div class="funnel">
        ${funnel.map(([label,n],i) => {
          const prev = i ? funnel[i-1][1] : n;
          const conv = i && prev ? Math.round((n/prev)*100) : 100;
          return `<div class="f-row"><span>${label}</span>
            <div class="f-track"><div class="f-fill" style="width:${Math.max(0.5,(n/max)*100)}%"></div></div>
            <span class="f-nums">${n.toLocaleString()}${i?` · ${conv}%`:''}</span></div>`;
        }).join('')}
      </div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:16px 0 0;">Lost: ${lost}. Percentages are stage-to-stage conversion. With a database this size, the game is volume at the top — pick a category, work the Lead Feed in score order.</p>
    </div>`;
}

function viewScanner() {
  return `
    <div class="view-head"><h2>AI Website Scanner</h2></div>
    <p class="view-sub">Enter a prospect's URL, get a score, grades, and the recommended package with demo links.</p>
    <div class="future-note">Concept preview — scoring below is simulated. The production version will wire into the Lead Finder's Lighthouse + Claude pipeline.</div>
    <div class="card panel" style="max-width:640px">
      <div class="note-form">
        <input type="url" id="scan-url" placeholder="https://prospect-website.com">
        <div><button class="btn" id="run-scan">Scan website</button></div>
      </div>
      <div id="scan-result"></div>
    </div>`;
}

function scanResultHTML(url) {
  let h = 0; for (const ch of url) h = (h * 31 + ch.charCodeAt(0)) % 997;
  const score = 45 + (h % 40);
  const grade = n => n >= 80 ? 'A' : n >= 65 ? 'B' : n >= 50 ? 'C' : 'D';
  const mob = 40 + (h % 45), seo = 30 + ((h*7) % 50), perf = 35 + ((h*13) % 50);
  const catKeys = Object.keys(CATS);
  const cat = catKeys[h % catKeys.length];
  const cfg = CATS[cat];
  return `
    <div class="mini-label">Scan result — simulated</div>
    <div class="scan-grid">
      <div class="scan-tile"><div class="g">${score}<span style="font-size:13px;color:var(--ink-soft)">/100</span></div><div class="l">Website score</div></div>
      <div class="scan-tile"><div class="g">${grade(mob)}</div><div class="l">Mobile</div></div>
      <div class="scan-tile"><div class="g">${grade(seo)}</div><div class="l">SEO</div></div>
      <div class="scan-tile"><div class="g">${grade(perf)}</div><div class="l">Performance</div></div>
      <div class="scan-tile"><div class="g" style="color:var(--go)">High</div><div class="l">Portal opportunity</div></div>
      <div class="scan-tile"><div class="g" style="color:var(--go)">High</div><div class="l">Dashboard opportunity</div></div>
    </div>
    <div class="reco" style="margin-top:16px">
      <div class="r-label">Recommended: ${esc(cat)} package</div>
      <ul>
        <li>Website refresh</li>
        <li>${esc(cfg.portalWord)}</li>
        <li>${esc(cfg.dashWord)}</li>
      </ul>
      <div style="margin-bottom:8px">Show: <strong>${esc(cfg.demoName)}</strong></div>
      ${cfg.demos.map(([what,u]) => `<div style="font-size:13px">→ <a href="${u}" target="_blank" rel="noopener">${esc(what)}</a></div>`).join('')}
    </div>`;
}

function viewSettings() {
  return `
    <div class="view-head"><h2>Settings</h2></div>
    <p class="view-sub">Lead data ships with the page; your notes, stages, and tasks live in this browser's localStorage.</p>
    <div class="card panel" style="max-width:560px">
      <h3>Sales rep name</h3>
      <div class="note-form" style="max-width:340px">
        <input type="text" id="rep-name" value="${esc(ov.rep)}">
        <div><button class="btn small" id="save-rep">Save</button></div>
      </div>
      <div class="mini-label">Data</div>
      <p style="font-size:13.5px;color:var(--ink-soft)">${LEADS.length.toLocaleString()} imported leads (read-only base data) + ${ov.custom.length} added here. Source: the Prospect Pipeline research database.</p>
      <div class="mini-label">Danger zone</div>
      <button class="btn danger small" id="reset-demo">Clear my edits</button>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;">Removes your notes, stage changes, tasks, and added companies. The ${LEADS.length.toLocaleString()} imported leads are unaffected.</p>
    </div>`;
}

/* =============== Proposal =============== */
function showProposal(c) {
  const cfg = catCfg(c.cat);
  const p = pkg(c);
  const opps = derivedOpps(c);
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `
    <div class="proposal">
      <div class="p-kicker">Williams Digital · Proposal</div>
      <h2>Proposal for ${esc(c.name)}</h2>
      <div style="color:var(--ink-soft);font-size:14px">${esc(c.loc)}${c.contact ? ' · Prepared for ' + esc(c.contact) : ''}</div>

      <h3>Current website issues</h3>
      <ul>${opps.filter(o => !o.startsWith('Pitch angle')).map(o=>`<li>${esc(o)}</li>`).join('') || '<li>Assessment pending</li>'}</ul>

      <h3>Recommended improvements</h3>
      <ul>${p.parts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>

      ${p.parts.length > 1 ? `<h3>${esc(cfg.portalWord)} features</h3>
      <ul>${cfg.pf.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>` : ''}

      ${p.parts.length > 2 ? `<h3>${esc(cfg.dashWord)} features</h3>
      <ul>${cfg.df.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>` : ''}

      <h3>See it working today</h3>
      <ul>${cfg.demos.map(([what,u]) => `<li>${esc(what)}: <a href="${u}" target="_blank" rel="noopener">${u.replace('https://','')}</a></li>`).join('')}</ul>

      <h3>Investment</h3>
      <div class="price">${p.range}</div>

      <div class="p-actions">
        <button class="btn" onclick="window.print()">Print / save PDF</button>
        <button class="btn ghost" data-close>Close</button>
      </div>
    </div>`;
  el.addEventListener('click', e => {
    if (e.target === el || e.target.closest('[data-close]')) el.remove();
  });
  document.body.appendChild(el);
}

/* =============== Events =============== */
function wire() {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = e => { e.preventDefault(); go(b.dataset.nav); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = e => { e.preventDefault(); go('companies', b.dataset.open); });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { companyTab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { listLimit += 100; render(); });

  const fq = $('#f-q');
  if (fq) {
    fq.oninput = () => { filterQ = fq.value; listLimit = 50; render(); const el = $('#f-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
  }
  const fc = $('#f-cat');
  if (fc) fc.onchange = () => { filterCat = fc.value; listLimit = 50; render(); };

  const c = currentCompany ? byId(currentCompany) : null;

  const stageSel = $('#stage-select');
  if (stageSel && c) stageSel.onchange = () => mutate(c, o => { o.stage = stageSel.value; o.lastContact = today(); });

  const addNote = $('#add-note');
  if (addNote && c) addNote.onclick = () => {
    const t = $('#note-text').value.trim();
    if (!t) return;
    mutate(c, o => { (o.notes = o.notes || []).unshift({date: today(), text: t}); o.lastContact = today(); });
  };
  const addOpp = $('#add-opp');
  if (addOpp && c) addOpp.onclick = () => {
    const t = $('#opp-text').value.trim();
    if (!t) return;
    mutate(c, (o, isCustom) => { const k = isCustom ? 'opps' : 'opps'; (o[k] = o[k] || []).push(t); });
  };
  const addOut = $('#add-outreach');
  if (addOut && c) addOut.onclick = () => {
    const t = $('#outreach-text').value.trim();
    if (!t) return;
    mutate(c, o => { (o.outreach = o.outreach || []).push([today(), t]); o.lastContact = today(); });
  };
  const gen = $('#gen-proposal');
  if (gen && c) gen.onclick = () => showProposal(c);

  const addCo = $('#add-co');
  if (addCo) addCo.onclick = () => {
    const name = prompt('Company name?');
    if (!name) return;
    const cat = prompt('Category? (' + Object.keys(CATS).join(', ') + ', or anything else)', 'Tourism') || 'Other';
    const co = {
      custom: true,
      id: 'c' + Math.random().toString(36).slice(2, 9),
      name, cat,
      loc: prompt('Location?', 'Birmingham, AL') || '—',
      type: '', web: prompt('Website / web presence?', 'Has site') || '—',
      pitch: '', phone: prompt('Phone?', '') || '', email: prompt('Email?', '') || '',
      contact: prompt('Contact person?', '') || '',
      importNote: '',
      stage: 'Prospect', lastContact: '—', value: 3500, est: true,
      score: { design: 12, mobile: 12, seo: 10, portal: 15, dashboard: 15 },
      notes: [], outreach: [], opps: [],
    };
    ov.custom.unshift(co); save(); go('companies', co.id);
  };

  document.querySelectorAll('[data-task]').forEach(cb => cb.onchange = () => {
    const t = ov.tasks.find(x => x.id === cb.dataset.task);
    if (t) { t.done = cb.checked; save(); render(); }
  });
  const addTask = $('#add-task');
  if (addTask) addTask.onclick = () => {
    const text = $('#task-text').value.trim();
    if (!text) return;
    ov.tasks.push({id: 't' + Math.random().toString(36).slice(2,8), text, due: $('#task-due').value.trim() || '—', done: false});
    save(); render();
  };

  const saveRep = $('#save-rep');
  if (saveRep) saveRep.onclick = () => { ov.rep = $('#rep-name').value.trim() || 'Sales Rep'; save(); render(); };
  const reset = $('#reset-demo');
  if (reset) reset.onclick = () => {
    if (confirm('Clear all your edits (notes, stages, tasks, added companies)? Imported leads are kept.')) {
      ov = { rep: 'Sales Rep', tasks: [], leads: {}, custom: [] };
      save(); go('dashboard');
    }
  };

  const runScan = $('#run-scan');
  if (runScan) runScan.onclick = () => {
    const url = $('#scan-url').value.trim();
    if (!url) return;
    const out = $('#scan-result');
    out.innerHTML = '<div class="empty">Scanning…</div>';
    setTimeout(() => { out.innerHTML = scanResultHTML(url); }, 700);
  };

  // Pipeline drag & drop
  document.querySelectorAll('[data-drag]').forEach(card => {
    card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', card.dataset.drag));
    card.addEventListener('dblclick', () => go('companies', card.dataset.drag));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const co = byId(id);
      if (co && co.stage !== col.dataset.stage) mutate(co, o => { o.stage = col.dataset.stage; o.lastContact = today(); });
    });
  });
}

render();
</script>
</body>
</html>
