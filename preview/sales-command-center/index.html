<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Williams Digital Command Center</title>
<style>
  :root {
    --paper: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #22262E;
    --ink-soft: #565B66;
    --line: #DEDCD4;
    --accent: #2A5D57;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4ECEA;
    --side: #1E332F;
    --side-ink: #C9D6D3;
    --side-active: #2A5D57;
    --go: #2E7D32;
    --go-bg: #E7F1E7;
    --caution: #A66A12;
    --caution-bg: #F6EEDD;
    --stop: #B3382F;
    --stop-bg: #F6E5E3;
    --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 3px rgba(20,25,23,.07), 0 4px 14px rgba(20,25,23,.05);
    --c1-bg:#E7EEF6; --c1-fg:#2B5B8F;
    --c2-bg:#F0EAF6; --c2-fg:#5D4A8A;
    --c3-bg:#F6EEDD; --c3-fg:#A66A12;
    --c4-bg:#E7F1E7; --c4-fg:#2E7D32;
    --c5-bg:#F6E5E3; --c5-fg:#B3382F;
    --c6-bg:#E4ECEA; --c6-fg:#2A5D57;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #191C21; --surface: #22262E; --ink: #E8E7E2; --ink-soft: #A6AAB3;
      --line: #383D47; --accent: #6FB3A8; --accent-ink: #10201D; --accent-soft: #253833;
      --side: #14211E; --side-ink: #9FB4B0; --side-active: #2A5D57;
      --go: #7CC47F; --go-bg: #243224; --caution: #D9A555; --caution-bg: #3a2f1d;
      --stop: #E08078; --stop-bg: #3d2422;
      --shadow: 0 1px 3px rgba(0,0,0,.35);
      --c1-bg:#223140; --c1-fg:#8FB8DD;
      --c2-bg:#2E2839; --c2-fg:#B4A3D8;
      --c3-bg:#3a2f1d; --c3-fg:#D9A555;
      --c4-bg:#243224; --c4-fg:#7CC47F;
      --c5-bg:#3d2422; --c5-fg:#E08078;
      --c6-bg:#253833; --c6-fg:#6FB3A8;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
  }
  button { font: inherit; cursor: pointer; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  aside {
    background: var(--side);
    color: var(--side-ink);
    padding: 22px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { padding: 2px 12px 18px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 14px; }
  .brand .wd { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; opacity: .75; }
  .brand h1 { font-family: var(--serif); font-size: 19px; margin: 4px 0 0; color: #fff; font-weight: 700; line-height: 1.25; }
  .navgroup { margin-bottom: 14px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: none; border: 0; color: var(--side-ink);
    padding: 9px 12px; border-radius: 8px; font-size: 14px; font-weight: 500;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: var(--side-active); color: #fff; }
  .nav-item .ico { width: 18px; text-align: center; flex: none; opacity: .9; }
  .nav-item .badge {
    margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 2px 8px;
  }
  .nav-sep { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 12px 8px; }
  .side-foot { padding: 14px 12px 4px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; opacity: .55; }

  /* ---------- Main ---------- */
  main { padding: 28px 32px 80px; max-width: 1180px; }
  .view-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .view-head h2 { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 0; }
  .view-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }
  .view-head .spacer { flex: 1; }

  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 14px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.small { padding: 5px 12px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--stop); border: 1px solid var(--stop); }

  /* ---------- Filter bar ---------- */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filters input[type=search] { flex: 1; min-width: 200px; max-width: 380px; }
  .filters select { width: auto; }
  .filters .count { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-left: auto; }
  input[type=search], textarea, input[type=text], input[type=url], select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: inherit; padding: 8px 12px;
  }
  textarea, input[type=text], input[type=url] { width: 100%; }
  textarea { min-height: 70px; resize: vertical; background: var(--paper); }

  /* ---------- Cards / tiles ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .tile { padding: 16px 18px; }
  .tile .t-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .tile .t-num { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .t-hint { font-size: 12.5px; color: var(--ink-soft); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { padding: 18px 20px; }
  .panel h3 { margin: 0 0 12px; font-size: 15.5px; font-weight: 650; }

  .mini-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 8px; }

  /* ---------- Score / bars ---------- */
  .score-pill {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
    border-radius: 999px; padding: 3px 11px; white-space: nowrap;
  }
  .s-hot { background: var(--go-bg); color: var(--go); }
  .s-warm { background: var(--caution-bg); color: var(--caution); }
  .s-cold { background: var(--stop-bg); color: var(--stop); }
  .est { font-size: 10px; opacity: .75; font-weight: 500; }

  .bars { display: grid; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: 170px minmax(0,1fr) 52px; gap: 12px; align-items: center; font-size: 13.5px; }
  .bar-row .val { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-soft); }
  .bar-track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .bar-fill.opp { background: var(--caution); }

  /* ---------- Tables ---------- */
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th {
    text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600; padding: 10px 14px; border-bottom: 2px solid var(--line); white-space: nowrap;
  }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover td { background: var(--accent-soft); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .chip {
    display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 10px; font-weight: 550;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .chip.c1 { background: var(--c1-bg); color: var(--c1-fg); }
  .chip.c2 { background: var(--c2-bg); color: var(--c2-fg); }
  .chip.c3 { background: var(--c3-bg); color: var(--c3-fg); }
  .chip.c4 { background: var(--c4-bg); color: var(--c4-fg); }
  .chip.c5 { background: var(--c5-bg); color: var(--c5-fg); }
  .chip.c6 { background: var(--c6-bg); color: var(--c6-fg); }
  .stage-chip { font-size: 12px; border-radius: 6px; padding: 2px 9px; font-weight: 600; background: var(--paper); border: 1px solid var(--line); white-space: nowrap; }
  .stage-Won { color: var(--go); border-color: var(--go); }
  .stage-Lost { color: var(--stop); border-color: var(--stop); }

  /* ---------- Lead feed ---------- */
  .lead-row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .lead-row:first-of-type { border-top: 0; }
  .lead-row .l-main { flex: 1; min-width: 0; }
  .lead-row .l-name { font-weight: 650; }
  .lead-row .l-meta { font-size: 13px; color: var(--ink-soft); }
  .showmore { display: block; width: 100%; background: var(--paper); border: 0; border-top: 1px solid var(--line); padding: 12px; color: var(--accent); font-weight: 600; border-radius: 0 0 10px 10px; }

  /* ---------- Pipeline ---------- */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: 236px; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .col-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
  .col-head .c-name { font-weight: 650; font-size: 13.5px; }
  .col-head .c-count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .col-head .c-val { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; }
  .col-body { min-height: 60px; padding: 10px; display: grid; gap: 8px; }
  .col.dragover .col-body { background: var(--accent-soft); border-radius: 0 0 10px 10px; }
  .pcard {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; cursor: grab; font-size: 13.5px;
  }
  .pcard:active { cursor: grabbing; }
  .pcard .p-name { font-weight: 650; margin-bottom: 2px; }
  .pcard .p-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-soft); }
  .col-more { font-size: 12px; color: var(--ink-soft); text-align: center; padding: 4px 8px 8px; }

  /* ---------- Company detail ---------- */
  .backlink { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; margin-bottom: 14px; font-size: 14px; }
  .co-head { padding: 22px 24px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
  .co-head .co-id { flex: 1; min-width: 240px; }
  .co-head h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; }
  .co-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 22px; flex-basis: 100%; margin-top: 14px; }
  .fact .f-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .fact .f-val { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 14px; font-weight: 550; color: var(--ink-soft); }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .opps li { margin-bottom: 6px; }
  .opps { list-style: none; padding: 0; margin: 0; }
  .opps .ok { color: var(--go); font-weight: 700; margin-right: 8px; }

  .note { border-top: 1px solid var(--line); padding: 12px 2px; }
  .note:first-of-type { border-top: 0; }
  .note .n-date { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 3px; }
  .note.imported .n-date { color: var(--caution); }
  .note-form { display: grid; gap: 8px; margin-top: 14px; }

  .timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
  .timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
  .timeline li:last-child { padding-bottom: 2px; }
  .timeline li::before {
    content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--surface);
  }
  .timeline .t-date { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .timeline .t-what { font-weight: 550; }

  .demo-asset {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; margin-bottom: 8px;
  }
  .demo-asset .what { font-weight: 600; min-width: 150px; }
  .demo-asset a { font-family: var(--mono); font-size: 12.5px; word-break: break-all; text-decoration: none; }
  .demo-asset a:hover { text-decoration: underline; }

  .reco {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    border-radius: 0 8px 8px 0; padding: 14px 18px; margin-top: 6px;
  }
  .reco .r-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .reco ul { margin: 0 0 8px; padding-left: 20px; }
  .reco .r-val { font-family: var(--mono); font-weight: 700; color: var(--accent); }

  /* ---------- Tasks ---------- */
  .task { display: flex; gap: 12px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); }
  .task:first-of-type { border-top: 0; }
  .task input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  .task .t-text { flex: 1; }
  .task.done .t-text { text-decoration: line-through; color: var(--ink-soft); }
  .task .t-due { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

  /* ---------- Funnel ---------- */
  .funnel { display: grid; gap: 10px; }
  .f-row { display: grid; grid-template-columns: 150px minmax(0,1fr) 110px; gap: 12px; align-items: center; font-size: 14px; }
  .f-track { height: 26px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .f-fill { height: 100%; background: var(--accent); opacity: .9; }
  .f-nums { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); }

  /* ---------- Scanner ---------- */
  .future-note {
    border: 1px dashed var(--caution); background: var(--caution-bg); color: var(--caution);
    border-radius: 8px; padding: 10px 14px; font-size: 13.5px; font-weight: 550; margin-bottom: 18px;
  }
  .scan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .scan-tile { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-align: center; }
  .scan-tile .g { font-size: 24px; font-weight: 700; font-family: var(--mono); }
  .scan-tile .l { font-size: 12px; color: var(--ink-soft); }

  /* ---------- AI Auditor ---------- */
  .aud-mode { display: flex; gap: 6px; margin-bottom: 14px; }
  .aud-mode button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 13.5px; font-weight: 550; color: var(--ink-soft); }
  .aud-mode button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .aud-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .aud-form input { flex: 1; min-width: 220px; }
  .pipeline { display: grid; gap: 8px; margin: 18px 0 4px; }
  .pl-step { display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: var(--ink-soft); }
  .pl-step .dot2 { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .pl-step.done { color: var(--ink); }
  .pl-step.done .dot2 { background: var(--go); border-color: var(--go); color: #fff; }
  .pl-step.active .dot2 { border-color: var(--accent); border-top-color: transparent; animation: spin .7s linear infinite; }
  .pl-step .tool { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-left: auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .pl-step.active .dot2 { animation: none; } }

  .report-head { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding: 20px 22px; margin-bottom: 16px; }
  .opp-ring { --p: 0; width: 108px; height: 108px; border-radius: 50%; flex: none;
    background: conic-gradient(var(--ring) calc(var(--p)*1%), var(--line) 0);
    display: grid; place-items: center; position: relative; }
  .opp-ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--surface); }
  .opp-ring .rv { position: relative; z-index: 1; text-align: center; }
  .opp-ring .rn { font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1; }
  .opp-ring .rl { font-size: 10px; color: var(--ink-soft); font-family: var(--mono); letter-spacing: .08em; }
  .report-head .rh-main { flex: 1; min-width: 220px; }
  .report-head h3 { margin: 0 0 2px; font-family: var(--serif); font-size: 21px; }
  .verdict-pill { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 3px 12px; margin-top: 6px; }

  .dim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
  .dim { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .dim .dh { display: flex; justify-content: space-between; align-items: baseline; }
  .dim .dn { font-size: 12.5px; color: var(--ink-soft); font-weight: 550; }
  .dim .dg { font-family: var(--mono); font-weight: 700; font-size: 18px; }
  .dim .dbar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .dim .dbar > i { display: block; height: 100%; border-radius: 999px; }

  .findings { list-style: none; margin: 0; padding: 0; }
  .findings li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .findings li:first-child { border-top: 0; }
  .findings .sev { font-size: 10px; font-weight: 700; font-family: var(--mono); letter-spacing: .06em; border-radius: 4px; padding: 2px 7px; height: fit-content; white-space: nowrap; }
  .sev-high { background: var(--stop-bg); color: var(--stop); }
  .sev-med { background: var(--caution-bg); color: var(--caution); }
  .sev-low { background: var(--accent-soft); color: var(--accent); }
  .vision-tag { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); }

  .gen-block { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 12px; margin-bottom: 12px; }
  .gen-block .gb-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; }
  .gen-block .gb-title { font-weight: 650; font-size: 14px; }
  .gen-block pre { margin: 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .copy-btn { margin-left: auto; }

  /* ---------- Proposal overlay ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(15,20,18,.55); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto; z-index: 50; }
  .proposal { background: var(--surface); border-radius: 12px; max-width: 720px; width: 100%; padding: 40px 46px; }
  .proposal .p-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .proposal h2 { font-family: var(--serif); font-size: 28px; margin: 0 0 4px; }
  .proposal h3 { font-size: 15.5px; margin: 24px 0 8px; }
  .proposal ul { margin: 0 0 8px; padding-left: 22px; font-size: 14.5px; }
  .proposal .price { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); }

<script>

const CATS = {

  'Landscaping': { demoName:'Summit Home Services', portalWord:'Customer portal', dashWord:'Operations dashboard',

  'Kids Activities': { demoName:'Lilly Pad Village', portalWord:'Online booking & waivers', dashWord:'Owner dashboard',
    demos:[['Public website + booking',W+'lilly-pad-village/'],['Owner dashboard',W+'lilly-pad-village/dashboard.html']],
    pf:['Party & activity booking','Digital waivers','Reminders','Payments'],
    df:['Booking calendar','Staffing','Revenue','Reviews'] },
  'Coffee': { demoName:'Iron Oak Hospitality', portalWord:'Online ordering', dashWord:'"The Pass" operations console',
    demos:[['Public website',W+'iron-oak-hospitality/'],['"The Pass" ops console',W+'iron-oak-hospitality/dashboard.html']],
    pf:['Online ordering','Loyalty & gift cards','Catering requests','Events'],
    df:['Daily sales','Inventory & ordering','Staff scheduling','Multi-location view'] },
  'Restaurants': { demoName:'Iron Oak Hospitality', portalWord:'Online ordering & reservations', dashWord:'"The Pass" operations console',
    demos:[['Public website',W+'iron-oak-hospitality/'],['"The Pass" ops console',W+'iron-oak-hospitality/dashboard.html']],
    pf:['Online ordering','Reservations & waitlist','Catering & private events','Gift cards & loyalty'],
    df:['Daily sales','Inventory & ordering','Staff scheduling','Reservations overview'] },
  'Dog Breeders': { demoName:'Deep South Retrievers', portalWord:'Puppy waitlist & owner portal', dashWord:'Breeder operations dashboard',
    demos:[['Public website',W+'deep-south-retrievers/'],['Owner portal',W+'deep-south-retrievers/portal.html'],['Breeder dashboard',W+'deep-south-retrievers/dashboard.html']],
    pf:['Litter announcements & waitlist','Deposit & reservation payments','Puppy update photos','Health records & documents'],
    df:['Waitlist & deposits','Litter management','Automated weekly owner updates','Revenue'] },
};
const GENERIC_CAT = { demoName:'Williams Digital portfolio', portalWord:'Customer portal', dashWord:'Operations dashboard',
  demos:[['Portfolio — live client work',W+'portfolio/'],['Sales Playbook',W+'sales-playbook/']],
  pf: GENERIC_PF, df: GENERIC_DF };
const catCfg = cat => CATS[cat] || GENERIC_CAT;
const chipClass = cat => 'c' + ((Array.from(String(cat)).reduce((n,ch) => n + ch.charCodeAt(0), 0) % 6) + 1);

/* =============== State =============== */
const LEADS = (window.WDCC_LEADS || []).map(l => ({
  id: l.id, name: l.name, cat: l.cat, loc: l.loc, type: l.type, web: l.web, pitch: l.pitch,
  phone: l.phone, email: l.email, contact: l.contact, importNote: l.notes,
  score: { design: l.s[0], mobile: l.s[1], seo: l.s[2], portal: l.s[3], dashboard: l.s[4] },
  value: l.v, est: true,
}));

/* =============== Cloud + local persistence =============== */
const SB_URL = 'https://tkkhvbkocumyxpgsrpxv.supabase.co';
const SB_KEY = 'sb_publishable_4_xgRNDnzXimaykbC6YBwg_E2aYxgzz';
const SB_TABLE = 'wdcc_overrides';
const OV_KEY = 'wdcc-ov-v2';
const META_KEY = '__meta__', TASKS_KEY = '__tasks__';

let ov = loadOv();          // in-memory state, seeded from local cache for instant paint
let syncState = 'local';    // 'local' | 'syncing' | 'synced' | 'offline'

function loadOv() {
  try { const raw = localStorage.getItem(OV_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { rep: 'Sales Rep', tasks: [], leads: {}, custom: [] };
}

// Live research config (AI Auditor -> Lead Finder backend). Token is stored per
// browser (localStorage), never committed to the page, and synced to the shared
// meta row so it follows you across devices.
const AUD_ENDPOINT = 'https://leads.williamsdigital.io/api/external';
function audToken() { return ov.audToken || ''; }
function audLive() { return !!ov.audToken; }
function saveLocal() { try { localStorage.setItem(OV_KEY, JSON.stringify(ov)); } catch (e) {} }
function leadOv(id) { return ov.leads[id] || (ov.leads[id] = { stage: 'Prospect', notes: [], outreach: [], opps: [], lastContact: '—' }); }

function setSync(s) { syncState = s; const el = document.getElementById('sync-badge'); if (el) el.outerHTML = syncBadge(); }
function syncBadge() {
  const map = { local:['Local only','var(--ink-soft)','◍'], syncing:['Saving…','var(--caution)','◍'],
    synced:['Synced','var(--go)','●'], offline:['Offline — saved locally','var(--stop)','○'] };
  const [txt,color,dot] = map[syncState] || map.local;
  return `<span id="sync-badge" title="Your edits sync to Supabase so they follow you across devices" style="font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:${color};display:inline-flex;align-items:center;gap:5px;"><span style="color:${color}">${dot}</span>${txt}</span>`;
}

// Fire-and-forget upsert of one logical row to Supabase; always cache locally first.
async function sbUpsert(key, data) {
  saveLocal();
  if (!window.fetch) return;
  setSync('syncing');
  try {
    const res = await fetch(`${SB_URL}/rest/v1/${SB_TABLE}`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ key, data }),
    });
    setSync(res.ok ? 'synced' : 'offline');
  } catch (e) { setSync('offline'); }
}
function syncLead(id) { sbUpsert(id, ov.leads[id] || {}); }
function syncMeta() { sbUpsert(META_KEY, { rep: ov.rep, custom: ov.custom, audToken: ov.audToken || '' }); }
function syncTasks() { sbUpsert(TASKS_KEY, { tasks: ov.tasks }); }

async function resetAllOverrides() {
  ov = { rep: 'Sales Rep', tasks: [], leads: {}, custom: [] };
  saveLocal();
  go('dashboard');
  if (!window.fetch) return;
  setSync('syncing');
  try {
    const res = await fetch(`${SB_URL}/rest/v1/${SB_TABLE}?key=neq.__never__`, {
      method: 'DELETE', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY },
    });
    setSync(res.ok ? 'synced' : 'offline');
  } catch (e) { setSync('offline'); }
}

// Pull the whole override set from Supabase on startup and merge over the local cache.
async function cloudLoad() {
  if (!window.fetch) return;
  setSync('syncing');
  try {
    const res = await fetch(`${SB_URL}/rest/v1/${SB_TABLE}?select=key,data`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY },
    });
    if (!res.ok) { setSync('offline'); return; }
    const rows = await res.json();
    const next = { rep: 'Sales Rep', tasks: [], leads: {}, custom: [] };
    for (const row of rows) {
      if (row.key === META_KEY) { next.rep = row.data.rep || 'Sales Rep'; next.custom = row.data.custom || []; next.audToken = row.data.audToken || ''; }
      else if (row.key === TASKS_KEY) { next.tasks = row.data.tasks || []; }
      else { next.leads[row.key] = row.data; }
    }
    ov = next; saveLocal(); setSync('synced'); render();
  } catch (e) { setSync('offline'); }
}

function companies() {
  const merged = LEADS.map(l => {
    const o = ov.leads[l.id];
    return Object.assign({}, l, {
      stage: o?.stage || 'Prospect',
      lastContact: o?.lastContact || '—',
      notes: o?.notes || [],
      outreach: o?.outreach || [],
      userOpps: o?.opps || [],
      preview: o?.preview || null,
    });
  });
  return merged.concat(ov.custom.map(c => Object.assign({ userOpps: c.opps || [], notes: c.notes || [], outreach: c.outreach || [], est: false }, c)));
}
function byId(id) { return companies().find(c => c.id === id); }
function mutate(c, fn) {
  if (c.custom) {
    const target = ov.custom.find(x => x.id === c.id);
    if (target) fn(target, true);
    syncMeta();
  } else {
    fn(leadOv(c.id), false);
    syncLead(c.id);
  }
  render();
}

/* =============== Helpers =============== */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total = c => SCORE_KEYS.reduce((n,[k]) => n + (c.score[k]||0), 0);
const money = n => '$' + n.toLocaleString();
const scoreClass = n => n >= 80 ? 's-hot' : n >= 60 ? 's-warm' : 's-cold';
function derivedOpps(c) {
  const out = [];
  if (/no site/i.test(c.web || '')) out.push('No website found');
  else if (c.web && c.web !== 'Has site') out.push(c.web);
  if (c.pitch) out.push('Pitch angle: ' + c.pitch);
  return out.concat(c.userOpps || []);
}
function pkg(c) {
  const cfg = catCfg(c.cat);
  const parts = ['Website ' + (/no site/i.test(c.web||'') ? 'build (net-new)' : 'refresh')];
  if (c.score.portal >= 14) parts.push(cfg.portalWord);
  if (c.score.dashboard >= 14) parts.push(cfg.dashWord);
  const range = parts.length >= 3 ? '$7,500 – $10,000' : parts.length === 2 ? '$3,500 – $8,000' : '$1,500 – $4,000';
  return { parts, range };
}
function today() { const d = new Date(); return (d.getMonth()+1) + '/' + d.getDate(); }
const stageIdx = s => STAGES.indexOf(s);
const slugify = s => String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const previewUrl = c => (c.preview && c.preview.url) || '';

/* =============== Router =============== */
const VIEWS = [
  ['dashboard','Dashboard','◧'],
  ['leads','Lead Feed','◉'],
  ['companies','Companies','▤'],
  ['pipeline','Pipeline','⇶'],
  ['playbooks','Playbooks','✎'],
  ['outreach','Outreach','✉'],
  ['tasks','Tasks','☑'],
  ['reports','Reports','∿'],
  ['scanner','AI Auditor','✦','BETA'],
  ['settings','Settings','⚙'],
];
let current = 'dashboard';
let currentCompany = null;
let companyTab = 'overview';
let filterQ = '', filterCat = '', listLimit = 50;

function go(view, coId) {
  current = view;
  currentCompany = coId || null;
  if (coId) companyTab = 'overview';
  listLimit = 50;
  render();
  window.scrollTo(0,0);
}

function render() {
  $('#nav').innerHTML = VIEWS.map(([id,label,ico,badge]) =>
    `<button class="nav-item ${current===id?'active':''}" data-nav="${id}">
      <span class="ico">${ico}</span>${label}${badge?`<span class="badge">${badge}</span>`:''}
    </button>`).join('');
  $('#side-foot').innerHTML = `INTERNAL · ${LEADS.length + ov.custom.length} COMPANIES<br>${syncBadge()}`;
  const v = $('#view');
  if (current === 'companies' && currentCompany) v.innerHTML = viewCompany(byId(currentCompany));
  else v.innerHTML = ({dashboard:viewDashboard, leads:viewLeads, companies:viewCompanies, pipeline:viewPipeline,
    playbooks:viewPlaybooks, outreach:viewOutreach, tasks:viewTasks, reports:viewReports,
    scanner:viewScanner, settings:viewSettings}[current] || viewDashboard)();
  wire();
}

/* =============== Filtering =============== */
function filtered(list) {
  let out = list;
  if (filterCat) out = out.filter(c => c.cat === filterCat);
  if (filterQ) {
    const q = filterQ.toLowerCase();
    out = out.filter(c => [c.name, c.loc, c.type, c.contact, c.email, c.phone, c.importNote, c.pitch].join(' ').toLowerCase().includes(q));
  }
  return out;
}
function filterBar(shown, totalN) {
  const cats = [...new Set(companies().map(c => c.cat))].sort();
  return `<div class="filters">
    <input type="search" id="f-q" placeholder="Search name, city, contact, notes…" value="${esc(filterQ)}">
    <select id="f-cat">
      <option value="">All categories</option>
      ${cats.map(c => `<option ${filterCat===c?'selected':''}>${esc(c)}</option>`).join('')}
    </select>
    <span class="count">${shown.toLocaleString()} of ${totalN.toLocaleString()}</span>
  </div>`;
}

/* =============== Views =============== */
function viewDashboard() {
  const cos = companies();
  const prospects = cos.filter(c => c.stage === 'Prospect');
  const working = cos.filter(c => !['Prospect','Won','Lost'].includes(c.stage));
  const workingVal = working.reduce((n,c) => n + c.value, 0);
  const due = ov.tasks.filter(t => !t.done).length;
  const top = prospects.slice().sort((a,b) => total(b)-total(a)).slice(0,5);
  const td = today();
  const previews = cos.filter(c => c.preview).length;
  const prevsToday = cos.filter(c => c.preview && c.preview.date === td).length;
  const msgsToday = cos.reduce((n,c) => n + c.outreach.filter(([d]) => d === td).length, 0);
  return `
    <div class="view-head"><h2>Dashboard</h2></div>
    <p class="view-sub">The day at a glance across all ${cos.length.toLocaleString()} companies.</p>
    <div class="tiles">
      <div class="card tile"><div class="t-label">New leads</div><div class="t-num">${prospects.length.toLocaleString()}</div><div class="t-hint">untouched, in the feed</div></div>
      <div class="card tile"><div class="t-label">In progress</div><div class="t-num">${working.length}</div><div class="t-hint">contacted → negotiation</div></div>
      <div class="card tile"><div class="t-label">Working pipeline</div><div class="t-num">${money(workingVal)}</div><div class="t-hint">est. value in progress</div></div>
      <div class="card tile"><div class="t-label">Previews built</div><div class="t-num">${previews}</div><div class="t-hint">${prevsToday} today · ${msgsToday} msgs logged today</div></div>
      <div class="card tile"><div class="t-label">Tasks due</div><div class="t-num">${due}</div><div class="t-hint">open follow-ups</div></div>
    </div>
    <div class="grid-2">
      <div class="card panel">
        <h3>Hottest new leads</h3>
        ${top.map(leadRow).join('') || '<div class="empty">No prospects in the feed.</div>'}
      </div>
      <div class="card panel">
        <h3>Open tasks</h3>
        ${ov.tasks.filter(t=>!t.done).slice(0,6).map(taskRow).join('') || '<div class="empty">No open tasks. Add follow-ups from the Tasks view.</div>'}
      </div>
    </div>`;
}

function leadRow(c) {
  const t = total(c);
  return `<div class="lead-row">
    <div class="l-main">
      <div class="l-name">${esc(c.name)}</div>
      <div class="l-meta"><span class="chip ${chipClass(c.cat)}">${esc(c.cat)}</span> · ${esc(c.loc)} · ${esc(c.pitch || c.type)}${c.preview ? ' · <span style="color:var(--go);font-weight:600">▶ preview live</span>' : ''}</div>
    </div>
    <span class="score-pill ${scoreClass(t)}">${t}${c.est?' <span class="est">est</span>':''}</span>
    <button class="btn small ghost" data-open="${c.id}">Open</button>
  </div>`;
}

function viewLeads() {
  const all = companies().filter(c => c.stage === 'Prospect').sort((a,b) => total(b)-total(a));
  const list = filtered(all);
  const page = list.slice(0, listLimit);
  return `
    <div class="view-head"><h2>Lead Feed</h2></div>
    <p class="view-sub">Your inbox — every untouched lead, highest score first. Scores are auto-estimated from research data until you refine them.</p>
    ${filterBar(list.length, all.length)}
    <div class="card">
      ${page.map(leadRow).join('') || '<div class="empty">No leads match.</div>'}
      ${list.length > listLimit ? `<button class="showmore" data-more>Show ${Math.min(100, list.length - listLimit)} more</button>` : ''}
    </div>`;
}

function viewCompanies() {
  const all = companies();
  const list = filtered(all).sort((a,b) => total(b)-total(a));
  const page = list.slice(0, listLimit);
  const rows = page.map(c => {
    const t = total(c);
    return `<tr class="rowlink" data-open="${c.id}">
      <td><strong>${esc(c.name)}</strong><div style="font-size:12.5px;color:var(--ink-soft)">${esc(c.type || '')}</div></td>
      <td><span class="chip ${chipClass(c.cat)}">${esc(c.cat)}</span></td>
      <td>${esc(c.loc)}</td>
      <td>${esc(c.contact || '—')}</td>
      <td><span class="stage-chip stage-${c.stage}">${c.stage}</span></td>
      <td class="num"><span class="score-pill ${scoreClass(t)}">${t}</span></td>
      <td class="num">${money(c.value)}</td>
      <td class="num">${esc(c.lastContact)}</td>
    </tr>`;
  }).join('');
  return `
    <div class="view-head"><h2>Companies</h2><div class="spacer"></div><button class="btn" id="add-co">+ Add company</button></div>
    <p class="view-sub">The master database — every lead from the prospect pipeline, plus anything you add.</p>
    ${filterBar(list.length, all.length)}
    <div class="card table-scroll">
      <table>
        <thead><tr><th>Company</th><th>Category</th><th>Location</th><th>Contact</th><th>Status</th><th>Score</th><th>Est. value</th><th>Last contact</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${list.length > listLimit ? `<button class="showmore" data-more>Show ${Math.min(100, list.length - listLimit)} more</button>` : ''}
    </div>`;
}

function viewCompany(c) {
  if (!c) return '<div class="empty">Company not found.</div>';
  const t = total(c);
  const cfg = catCfg(c.cat);
  const p = pkg(c);
  const opps = derivedOpps(c);
  const tabs = [['overview','Overview'],['notes',`Notes (${c.notes.length + (c.importNote?1:0)})`],['opps','Opportunities'],['demos','Playbook & Demos'],['preview',`Preview${c.preview?' ✓':''}`],['outreach','Outreach'],['contact','Contact']];
  let body = '';
  if (companyTab === 'overview') {
    body = `
      <div class="grid-2">
        <div class="card panel">
          <h3>Prospect score — ${t}/100 ${c.est?'<span style="font-weight:400;font-size:12px;color:var(--caution)">auto-estimated</span>':''}</h3>
          <div class="bars">
            ${SCORE_KEYS.map(([k,label]) => `

function viewPipeline() {
  const cos = companies();
  const PROSPECT_CAP = 12;
  const cols = STAGES.map(stage => {
    let list = cos.filter(c => c.stage === stage);
    const val = list.reduce((n,c) => n + c.value, 0);
    let more = 0;
    if (stage === 'Prospect') {
      list = list.sort((a,b) => total(b)-total(a));
      more = Math.max(0, list.length - PROSPECT_CAP);
      list = list.slice(0, PROSPECT_CAP);
    }
    return `<div class="col" data-stage="${stage}">
      <div class="col-head"><span class="c-name">${stage}</span><span class="c-count">${cos.filter(c=>c.stage===stage).length.toLocaleString()}</span>${val?`<span class="c-val">${money(val)}</span>`:''}</div>
      <div class="col-body">
        ${list.map(c => `<div class="pcard" draggable="true" data-drag="${c.id}">
          <div class="p-name">${esc(c.name)}</div>
          <div class="p-meta"><span class="score-pill ${scoreClass(total(c))}" style="font-size:11px;padding:1px 8px">${total(c)}</span> ${money(c.value)}${c.preview ? ' <span style="color:var(--go)" title="Preview site live">▶</span>' : ''}</div>
        </div>`).join('')}
      </div>
      ${more ? `<div class="col-more">+${more.toLocaleString()} more — work them in the <a href="#" data-nav="leads">Lead Feed</a></div>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="view-head"><h2>Pipeline</h2></div>
    <p class="view-sub">Drag a card between stages. Double-click opens the company. Prospect column shows the top ${12} by score.</p>
    <div class="board">${cols}</div>`;
}

function viewReports() {
  const cos = companies();
  const past = i => cos.filter(c => c.stage !== 'Lost' && stageIdx(c.stage) >= i).length;
  const funnel = [
    ['In database', cos.length],
    ['Contacted', past(1)],
    ['Discovery', past(2)],
    ['Proposal', past(3)],
    ['Negotiation', past(4)],
    ['Won', cos.filter(c => c.stage === 'Won').length],
  ];
  const lost = cos.filter(c => c.stage === 'Lost').length;
  const max = funnel[0][1] || 1;
  return `
    <div class="view-head"><h2>Reports</h2></div>
    <p class="view-sub">Live funnel, computed from actual stages — it updates as you work the pipeline.</p>
    <div class="card panel">
      <div class="funnel">
        ${funnel.map(([label,n],i) => {
          const prev = i ? funnel[i-1][1] : n;
          const conv = i && prev ? Math.round((n/prev)*100) : 100;
          return `<div class="f-row"><span>${label}</span>
            <div class="f-track"><div class="f-fill" style="width:${Math.max(0.5,(n/max)*100)}%"></div></div>
            <span class="f-nums">${n.toLocaleString()}${i?` · ${conv}%`:''}</span></div>`;
        }).join('')}
      </div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:16px 0 0;">Lost: ${lost}. Percentages are stage-to-stage conversion. With a database this size, the game is volume at the top — pick a category, work the Lead Feed in score order.</p>
    </div>`;
}

function auditListHTML(list) {
  if (!list.length) return '<div class="card panel"><div class="empty">No businesses found for that search.</div></div>';
  return `<div style="display:flex;align-items:center;gap:12px;margin:0 0 8px"><div class="mini-label" style="margin:0">Search results — ${list.length} researched</div><div style="flex:1"></div><button class="btn small" id="aud-save-all">Save all ${list.length} to Companies</button></div>
    <div class="card">${list.map((rep,i) => {
      const opp = rep.opportunity;
      const rc = opp >= 75 ? 'var(--go)' : opp >= 55 ? 'var(--caution)' : 'var(--stop)';
      const name = rep.company ? rep.company.name : (rep.displayName || rep.url);
      return `<div class="lead-row">
        <div class="l-main"><div class="l-name">${esc(name)}</div>
          <div class="l-meta">${esc(rep.url||'')}${rep.cat?` · ${esc(rep.cat)}`:''} · ${rep.live?'<span style="color:var(--go)">live</span>':'est'}</div></div>
        <span class="score-pill" style="background:transparent;color:${rc};border:1px solid ${rc}">${opp}</span>
        <button class="btn small ghost" data-aud-view="${i}">View report</button>
      </div>`;
    }).join('')}</div>`;
}

function pipelineHTML(activeIdx, steps, subtitle) {
  steps = steps || PIPELINE_STEPS;
  return `<div class="card panel"><div class="mini-label" style="margin-top:0">Running pipeline${subtitle?` — ${esc(subtitle)}`:''}</div>
    <div class="pipeline">
      ${steps.map(([label,tool],i) => {
        const cls = i < activeIdx ? 'done' : i === activeIdx ? 'active' : '';
        return `<div class="pl-step ${cls}"><span class="dot2">${i<activeIdx?'✓':''}</span>${esc(label)}<span class="tool">${esc(tool)}</span></div>`;
      }).join('')}
    </div></div>`;

// deterministic pseudo-random from a seed string
function seedNum(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0); }

function buildAudit(seedStr, opts) {
  opts = opts || {};
  const h = seedNum(seedStr);
  const r = n => (seedNum(seedStr + '::' + n) % 1000) / 1000; // 0..1 stream
  // If we know the company's web status, bias scores: weak presence => lower site scores => higher opportunity
  const weak = opts.weakWeb;
  const base = weak ? 22 : 40;
  const span = weak ? 34 : 50;
  const dims = {};
  AUD_DIMENSIONS.forEach(([k],i) => { dims[k] = Math.max(8, Math.min(98, Math.round(base + r(k)*span))); });
  if (weak) { dims.mobile = Math.min(dims.mobile, 45); dims.conversion = Math.min(dims.conversion, 40); }
  // opportunity = inverse of average site quality, weighted toward conversion + mobile gaps
  const avg = (dims.performance + dims.seo + dims.accessibility + dims.mobile + dims.conversion + dims.design) / 6;
  const opportunity = Math.max(20, Math.min(99, Math.round(100 - avg + (weak ? 12 : 0))));
  return { dims, opportunity, seedStr, h };
}

function auditGrade(n) { return n >= 90 ? 'A' : n >= 75 ? 'B' : n >= 55 ? 'C' : n >= 40 ? 'D' : 'F'; }
function dimColor(n) { return n >= 75 ? 'var(--go)' : n >= 50 ? 'var(--caution)' : 'var(--stop)'; }

const FINDING_POOL = {
  performance: [['high','Largest Contentful Paint over 4s — homepage feels slow on mobile data.'],['med','Unoptimized images add ~2.3MB to initial load.'],['med','No caching headers; repeat visits re-download everything.']],
  seo: [['high','Missing meta descriptions and Open Graph tags on key pages.'],['med','No structured data (LocalBusiness schema) — hurts map/rich results.'],['low','Thin or duplicate title tags across pages.']],
  accessibility: [['high','Multiple images missing alt text; fails WCAG for screen readers.'],['med','Low color contrast on buttons and body text.'],['med','Form fields lack associated labels.']],
  mobile: [['high','Tap targets too small and text requires pinch-zoom on phones.'],['med','Horizontal scroll on mobile — layout not responsive.'],['low','Click-to-call number is plain text, not a tel: link.']],
  conversion: [['high','No clear call-to-action above the fold.'],['high','No online booking / ordering / lead form — every inquiry is a phone call.'],['med','No visible reviews or trust signals.']],
  design: [['high','Cluttered layout with weak visual hierarchy (vision model).'],['med','Dated color palette and default fonts read as early-2010s (vision model).'],['med','Inconsistent branding between pages (vision model).'],['low','Hero image is low-resolution / stretched (vision model).']],
};
function findingsFor(dims, seedStr) {
  const out = [];
  AUD_DIMENSIONS.forEach(([k,label]) => {
    const score = dims[k];
    const pool = FINDING_POOL[k] || [];
    if (!pool.length) return;
    // worse score => surface more findings
    const n = score < 40 ? 2 : score < 60 ? 1 : (seedNum(seedStr+k) % 2);
    for (let i=0;i<n && i<pool.length;i++) out.push({ dim: label, sev: pool[i][0], text: pool[i][1], vision: k==='design' });
  });
  const order = {high:0, med:1, low:2};
  return out.sort((a,b)=>order[a.sev]-order[b.sev]);
}

// Convert a Lighthouse (0-100) + Claude score (1-10) API result into the
// report shape the UI renders. Real numbers where we have them; conversion and
// design are inferred from Claude's 1-10 score since Lighthouse doesn't measure them.
function apiToReport(item, catHint) {
  const a = item.audit || {};
  const has = n => (n == null ? null : n);
  const claude = item.score || null;
  const claude10 = claude ? Number(claude.score) || 0 : null;
  const noSite = !item.website;
  // dimensions on 0-100
  const dims = {
    performance: noSite ? 5 : (has(a.perf_score) ?? 45),
    seo: noSite ? 8 : (has(a.seo_score) ?? 45),
    accessibility: noSite ? 10 : (has(a.a11y_score) ?? 50),
    mobile: noSite ? 8 : (has(a.perf_score) != null ? Math.max(10, a.perf_score - 8) : 45),
    conversion: claude10 != null ? Math.max(8, 100 - claude10 * 8) : (noSite ? 20 : 45),
    design: claude10 != null ? Math.max(8, 100 - claude10 * 7) : (noSite ? 25 : 50),
  };
  // opportunity: prefer Claude's 1-10 (x10); else inverse of site quality
  const avg = (dims.performance + dims.seo + dims.accessibility + dims.mobile + dims.conversion + dims.design) / 6;
  const opportunity = claude10 != null ? Math.min(99, Math.max(20, claude10 * 10)) : Math.round(100 - avg);

  // findings: real Lighthouse issues + Claude's angle
  const findings = [];
  if (noSite) findings.push({ dim: 'Website', sev: 'high', text: 'No website found — needs one built from scratch.', vision: false });
  (a.issues || []).forEach(iss => findings.push({ dim: 'Lighthouse', sev: 'med', text: iss, vision: false }));
  if (a.perf_score != null && a.perf_score < 50) findings.push({ dim: 'Performance', sev: 'high', text: `Low Lighthouse performance (${a.perf_score}/100) — slow on mobile.`, vision: false });
  if (a.seo_score != null && a.seo_score < 70) findings.push({ dim: 'SEO', sev: 'med', text: `Weak SEO score (${a.seo_score}/100).`, vision: false });
  if (claude && claude.outreach_angle) findings.push({ dim: 'Opportunity', sev: 'high', text: claude.outreach_angle, vision: false });
  const order = {high:0, med:1, low:2};
  findings.sort((x,y)=>order[x.sev]-order[y.sev]);

  return {
    live: true, dims, opportunity, findings,
    company: null,
    url: item.website || '',
    displayName: item.business_name || item.website || '',
    cat: catHint || null,
    loc: [item.city, item.state].filter(Boolean).join(', '),
    apiScore: claude, // Claude's real proposal (email/dm/value)
    apiItem: item,
  };
}

async function callBackend(payload) {
  const res = await fetch(AUD_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + audToken() },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function runAudit() {
  const out = $('#aud-output');
  const inputCard = $('#aud-input');
  const live = audLive();
  audResults = null; audReport = null;

  // Gather inputs per mode
  let payload = null, company = null, seedStr = '', displayName = '', url = '', cat = null, loc = '', weakWeb = false, catHint = null;
  if (audMode === 'company') {
    const id = $('#aud-company') ? $('#aud-company').value : '';
    company = id ? byId(id) : null;
    if (!company) return;
    seedStr = company.id; url = company.web; cat = company.cat; loc = company.loc; catHint = company.cat;
    weakWeb = /no site|facebook|outdated|dated|square site/i.test(company.web || '');
    payload = { mode: 'audit', query: company.web };
  } else if (audMode === 'search') {
    const industry = $('#aud-industry') ? $('#aud-industry').value.trim() : '';
    const city = $('#aud-city') ? $('#aud-city').value.trim() : '';
    if (!industry || !city) return;
    seedStr = (industry + city).toLowerCase();
    payload = { mode: 'search', industry, location: city, maxResults: 10 };
  } else { // url
    const raw = $('#aud-url') ? $('#aud-url').value.trim() : '';
    if (!raw) return;
    const isUrl = /^https?:\/\/|\.[a-z]{2,}/i.test(raw);
    url = isUrl ? raw : '';
    displayName = isUrl ? raw.replace(/^https?:\/\//,'').replace(/\/.*$/,'') : raw;
    seedStr = raw.toLowerCase();
    payload = { mode: 'audit', query: raw };
  }

  if (inputCard) inputCard.style.opacity = '.5';

  // ---- LIVE path: hit the real backend ----
  if (live) {
    const steps = PIPELINE_STEPS_LIVE;
    let step = 0;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    out.innerHTML = pipelineHTML(reduce ? steps.length-1 : 0, steps, 'live — this can take 20–60s');
    let timer = null;
    if (!reduce) {
      const advance = () => { if (step < steps.length - 1) { step++; out.innerHTML = pipelineHTML(step, steps, 'live — this can take 20–60s'); timer = setTimeout(advance, 6000); } };
      timer = setTimeout(advance, 4000);
    }
    callBackend(payload).then(data => {
      if (timer) clearTimeout(timer);
      const items = data.results || [];
      if (audMode === 'search') {
        audResults = items.map(it => apiToReport(it, catHint));
        if (inputCard) inputCard.style.opacity = '';
        render();
      } else {
        const rep = items[0] ? apiToReport(items[0], catHint) : null;
        if (!rep) { out.innerHTML = `<div class="card panel"><div class="empty">No result returned.</div></div>`; return; }
        if (company) { rep.company = company; rep.cat = company.cat; }
        audReport = rep;
        if (inputCard) inputCard.style.opacity = '';
        render();
      }
    }).catch(err => {
      if (timer) clearTimeout(timer);
      if (inputCard) inputCard.style.opacity = '';
      out.innerHTML = `<div class="card panel"><div class="future-note" style="margin:0">Live research failed: ${esc(err.message)}. ${/unauthor/i.test(err.message)?'Check your token in Settings.':'The backend may be warming up — try again.'}</div></div>`;
    });
    return;
  }

  // ---- DEMO path: simulated (existing behavior) ----
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish = () => {
    audReport = buildAudit(seedStr, { weakWeb });
    audReport.company = company; audReport.url = url; audReport.displayName = displayName; audReport.cat = cat; audReport.loc = loc;
    if (inputCard) inputCard.style.opacity = '';
    render();
  };
  if (reduce) { out.innerHTML = pipelineHTML(PIPELINE_STEPS.length, PIPELINE_STEPS); finish(); return; }
  let step = 0;
  out.innerHTML = pipelineHTML(0, PIPELINE_STEPS);
  const tick = () => {
    step++;
    if (step >= PIPELINE_STEPS.length) { finish(); return; }
    out.innerHTML = pipelineHTML(step, PIPELINE_STEPS);
    setTimeout(tick, 380 + (seedNum(seedStr+step) % 260));
  };
  setTimeout(tick, 420);
}

/* =============== Proposal =============== */
function showProposal(c) {
  const cfg = catCfg(c.cat);
  const p = pkg(c);
  const opps = derivedOpps(c);
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `
    <div class="proposal">
      <div class="p-kicker">Williams Digital · Proposal</div>
      <h2>Proposal for ${esc(c.name)}</h2>
      <div style="color:var(--ink-soft);font-size:14px">${esc(c.loc)}${c.contact ? ' · Prepared for ' + esc(c.contact) : ''}</div>

      <h3>Current website issues</h3>
      <ul>${opps.filter(o => !o.startsWith('Pitch angle')).map(o=>`<li>${esc(o)}</li>`).join('') || '<li>Assessment pending</li>'}</ul>

      <h3>Recommended improvements</h3>
      <ul>${p.parts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>

      ${p.parts.length > 1 ? `<h3>${esc(cfg.portalWord)} features</h3>
      <ul>${cfg.pf.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>` : ''}

      ${p.parts.length > 2 ? `<h3>${esc(cfg.dashWord)} features</h3>
      <ul>${cfg.df.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>` : ''}

      <h3>See it working today</h3>
      <ul>${cfg.demos.map(([what,u]) => `<li>${esc(what)}: <a href="${u}" target="_blank" rel="noopener">${u.replace('https://','')}</a></li>`).join('')}</ul>

      <h3>Investment</h3>
      <div class="price">${p.range}</div>

      <div class="p-actions">
        <button class="btn" onclick="window.print()">Print / save PDF</button>
        <button class="btn ghost" data-close>Close</button>
      </div>
    </div>`;
  el.addEventListener('click', e => {
    if (e.target === el || e.target.closest('[data-close]')) el.remove();
  });
  document.body.appendChild(el);
}

/* =============== Events =============== */
function wire() {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = e => { e.preventDefault(); go(b.dataset.nav); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = e => { e.preventDefault(); go('companies', b.dataset.open); });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { companyTab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { listLimit += 100; render(); });

  const fq = $('#f-q');
  if (fq) {
    fq.oninput = () => { filterQ = fq.value; listLimit = 50; render(); const el = $('#f-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
  }
  const fc = $('#f-cat');
  if (fc) fc.onchange = () => { filterCat = fc.value; listLimit = 50; render(); };

  const c = currentCompany ? byId(currentCompany) : null;

  const stageSel = $('#stage-select');
  if (stageSel && c) stageSel.onchange = () => mutate(c, o => { o.stage = stageSel.value; o.lastContact = today(); });

  const addNote = $('#add-note');
  if (addNote && c) addNote.onclick = () => {
    const t = $('#note-text').value.trim();
    if (!t) return;
    mutate(c, o => { (o.notes = o.notes || []).unshift({date: today(), text: t}); o.lastContact = today(); });
  };
  const addOpp = $('#add-opp');
  if (addOpp && c) addOpp.onclick = () => {
    const t = $('#opp-text').value.trim();
    if (!t) return;
    mutate(c, (o, isCustom) => { const k = isCustom ? 'opps' : 'opps'; (o[k] = o[k] || []).push(t); });
  };
  const addOut = $('#add-outreach');
  if (addOut && c) addOut.onclick = () => {
    const t = $('#outreach-text').value.trim();
    if (!t) return;
    mutate(c, o => { (o.outreach = o.outreach || []).push([today(), t]); o.lastContact = today(); });
  };
  const gen = $('#gen-proposal');
  if (gen && c) gen.onclick = () => showProposal(c);

  // Preview workflow
  const savePrev = $('#save-preview');
  if (savePrev && c) savePrev.onclick = () => {
    const u = ($('#preview-url').value || '').trim();
    if (!u) return;
    mutate(c, o => { o.preview = { url: u, date: today() }; });
  };
  const useSug = $('#use-suggested');
  if (useSug && c) useSug.onclick = () => {
    mutate(c, o => { o.preview = { url: W + slugify(c.name) + '/', date: today() }; });
  };
  const delPrev = $('#del-preview');
  if (delPrev && c) delPrev.onclick = () => mutate(c, o => { o.preview = null; });
  document.querySelectorAll('[data-logsend]').forEach(b => b.onclick = () => {
    if (!c) return;
    mutate(c, o => { (o.outreach = o.outreach || []).push([today(), b.dataset.logsend + ' sent']); o.lastContact = today(); });
  });

  const addCo = $('#add-co');
  if (addCo) addCo.onclick = () => {
    const name = prompt('Company name?');
    if (!name) return;
    const cat = prompt('Category? (' + Object.keys(CATS).join(', ') + ', or anything else)', 'Tourism') || 'Other';
    const co = {
      custom: true,
      id: 'c' + Math.random().toString(36).slice(2, 9),
      name, cat,
      loc: prompt('Location?', 'Birmingham, AL') || '—',
      type: '', web: prompt('Website / web presence?', 'Has site') || '—',
      pitch: '', phone: prompt('Phone?', '') || '', email: prompt('Email?', '') || '',
      contact: prompt('Contact person?', '') || '',
      importNote: '',
      stage: 'Prospect', lastContact: '—', value: 3500, est: true,
      score: { design: 12, mobile: 12, seo: 10, portal: 15, dashboard: 15 },
      notes: [], outreach: [], opps: [],
    };
    ov.custom.unshift(co); syncMeta(); go('companies', co.id);
  };

  document.querySelectorAll('[data-task]').forEach(cb => cb.onchange = () => {
    const t = ov.tasks.find(x => x.id === cb.dataset.task);
    if (t) { t.done = cb.checked; syncTasks(); render(); }
  });
  const addTask = $('#add-task');
  if (addTask) addTask.onclick = () => {
    const text = $('#task-text').value.trim();
    if (!text) return;
    ov.tasks.push({id: 't' + Math.random().toString(36).slice(2,8), text, due: $('#task-due').value.trim() || '—', done: false});
    syncTasks(); render();
  };

  const saveRep = $('#save-rep');
  if (saveRep) saveRep.onclick = () => { ov.rep = $('#rep-name').value.trim() || 'Sales Rep'; syncMeta(); render(); };
  const saveToken = $('#save-token');
  if (saveToken) saveToken.onclick = () => { ov.audToken = ($('#aud-token').value || '').trim(); syncMeta(); render(); };
  const clearToken = $('#clear-token');
  if (clearToken) clearToken.onclick = () => { ov.audToken = ''; syncMeta(); render(); };
  const reset = $('#reset-demo');
  if (reset) reset.onclick = () => {
    if (confirm('Clear all your edits (notes, stages, tasks, added companies) on ALL your devices? Imported leads are kept.')) {
      resetAllOverrides();
    }
  };

  // ---- AI Auditor ----
  document.querySelectorAll('[data-audmode]').forEach(b => b.onclick = () => { audMode = b.dataset.audmode; render(); });
  const audReset = $('#aud-reset');
  if (audReset) audReset.onclick = () => { audReport = null; audResults = null; render(); };

  const runAud = $('#run-aud');
  if (runAud) runAud.onclick = () => runAudit();
  document.querySelectorAll('[data-aud-view]').forEach(b => b.onclick = () => {
    const rep = audResults && audResults[+b.dataset.audView];
    if (rep) { audReport = rep; audResults = null; render(); }
  });
  const audSaveAll = $('#aud-save-all');
  if (audSaveAll) audSaveAll.onclick = () => {
    if (!audResults) return;
    audResults.forEach(rep => addAuditedCompany(rep, false));
    const n = audResults.length; audResults = null; audReport = null;
    go('companies');
  };

  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.copy);
    if (!el) return;
    navigator.clipboard?.writeText(el.textContent).then(() => { const t = b.textContent; b.textContent = 'Copied ✓'; setTimeout(()=>b.textContent=t, 1400); });
  });
  document.querySelectorAll('[data-aud-save]').forEach(b => b.onclick = () => {
    const co = byId(b.dataset.audSave);
    if (!co || !audReport) return;
    const line = `AI audit: opportunity ${audReport.opportunity}/100. ` +
      AUD_DIMENSIONS.map(([k,l]) => `${l} ${auditGrade(audReport.dims[k])}`).join(', ') + '.';
    mutate(co, o => { (o.notes = o.notes || []).unshift({date: today(), text: line}); });
    b.textContent = 'Saved ✓'; b.disabled = true;
  });
  const audAdd = $('#aud-add');
  if (audAdd) audAdd.onclick = () => addAuditedCompany(audReport);

  // Pipeline drag & drop
  document.querySelectorAll('[data-drag]').forEach(card => {
    card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', card.dataset.drag));
    card.addEventListener('dblclick', () => go('companies', card.dataset.drag));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const co = byId(id);
      if (co && co.stage !== col.dataset.stage) mutate(co, o => { o.stage = col.dataset.stage; o.lastContact = today(); });
    });
  });
}

render();
cloudLoad();
</script>
</body>
</html>
