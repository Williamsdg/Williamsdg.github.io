<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reserve — Maison Verre</title>
<meta name="theme-color" content="#070b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
    --gold:#d4af37;--gold-soft:#b8941f;--gold-glow:rgba(212,175,55,0.18);
    --primary:#7c1d3a;--green:#34d399;--red:#f87171;
    --bg:#070b1a;
    --canvas:radial-gradient(900px 600px at 80% -10%, rgba(124,29,58,0.20), transparent 60%), radial-gradient(700px 500px at -10% 110%, rgba(212,175,55,0.06), transparent 70%), #070b1a;
    --surface:rgba(255,255,255,0.04);
    --text:#f1f3f9;--text-soft:#c8cfdb;--text-mute:#7a86a0;
    --border:rgba(255,255,255,0.10);--border-soft:rgba(255,255,255,0.06);
    --serif:'Fraunces',Georgia,serif;
}
html,body{background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas) fixed;color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em;padding:32px 16px 56px}
::selection{background:var(--gold-glow);color:var(--text)}
.wrap{max-width:560px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding:6px 4px}
.brand .biz{font-family:var(--serif);font-size:1.1rem;font-weight:500;letter-spacing:-0.01em}
.brand .biz em{font-style:italic;color:var(--gold);font-weight:400}
.brand .meta{font-size:.7rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.8px;font-weight:600}
.hero{background:linear-gradient(135deg, rgba(124,29,58,0.25), rgba(15,21,40,0.85));border:1px solid var(--border);padding:32px 26px;border-radius:18px;margin-bottom:18px;box-shadow:0 24px 64px -24px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.06);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);opacity:0.6}
.hero .eye{font-size:.7rem;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:2rem;margin-top:6px;letter-spacing:-0.02em;line-height:1.15}
.hero h1 em{font-style:italic;color:var(--gold);font-weight:400}
.hero p{font-size:.88rem;color:var(--text-soft);margin-top:8px;font-style:italic}
.card{background:var(--surface);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:14px}
.card h3{font-size:.7rem;color:var(--gold);text-transform:uppercase;letter-spacing:2.2px;font-weight:600;margin-bottom:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.74rem;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:.92rem;font-family:inherit;color:var(--text);background:rgba(255,255,255,0.025);outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.party-pills{display:flex;gap:6px;flex-wrap:wrap}
.party-pill{flex:1;min-width:48px;padding:10px;background:rgba(255,255,255,0.025);border:1px solid var(--border-soft);border-radius:10px;color:var(--text-soft);font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.party-pill:hover{border-color:var(--gold)}
.party-pill.active{background:linear-gradient(135deg, var(--gold), var(--gold-soft));color:#070b1a;border-color:var(--gold);font-weight:700}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.time-pill{padding:10px 6px;background:rgba(255,255,255,0.025);border:1px solid var(--border-soft);border-radius:8px;color:var(--text-soft);font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.time-pill:hover{border-color:var(--gold)}
.time-pill.active{background:linear-gradient(135deg, var(--gold), var(--gold-soft));color:#070b1a;border-color:var(--gold);font-weight:700}
.time-pill.unavailable{opacity:0.35;pointer-events:none;text-decoration:line-through}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:10px;font-weight:600;font-size:.92rem;letter-spacing:0.02em;font-family:inherit;cursor:pointer;border:1px solid transparent;width:100%;transition:all .25s;text-decoration:none}
.btn-gold{background:linear-gradient(135deg, var(--gold), var(--gold-soft));color:#070b1a;border-color:rgba(255,255,255,0.18);box-shadow:0 8px 24px -8px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,0.3);font-weight:700}
.btn-gold:disabled{opacity:0.4;cursor:not-allowed}
.btn-outline{background:rgba(255,255,255,0.04);color:var(--text-soft);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.confirmed{background:linear-gradient(135deg, rgba(52,211,153,0.18), rgba(15,21,40,0.92));border:1px solid rgba(52,211,153,0.35);border-radius:16px;padding:32px 26px;text-align:center}
.confirmed h2{font-family:var(--serif);font-weight:400;font-size:1.6rem;color:var(--text);margin-bottom:10px;letter-spacing:-0.01em}
.confirmed h2 em{font-style:italic;color:var(--gold);font-weight:400}
.confirmed p{color:var(--text-soft);margin-bottom:14px}
.confirmed .res-num{font-family:var(--serif);font-size:1.4rem;color:var(--green);margin:14px 0;letter-spacing:0.02em;font-weight:500}
.footer{text-align:center;font-size:.7rem;color:var(--text-mute);margin-top:24px;letter-spacing:0.04em;text-transform:uppercase;font-weight:500}
.footer a{color:var(--gold);text-decoration:none;letter-spacing:0.02em;text-transform:none;font-weight:600}
@media(max-width:480px){body{padding:20px 14px 40px}.hero{padding:24px 22px}.hero h1{font-size:1.65rem}.card{padding:20px 18px}.form-row{grid-template-columns:1fr}.time-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
    <div class="brand"><div class="biz">Maison <em>Verre</em></div><div class="meta">Reservations</div></div>

    <div class="hero">
        <div class="eye">Reserve</div>
        <h1>An <em>evening</em> at the bistro.</h1>
        <p>Wine-forward dinner service · 5:00 to close.</p>
    </div>

    <div id="formView">
        <div class="card">
            <h3>Date &amp; Party</h3>
            <div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="rDate"></div><div class="form-group"><label>Time</label><div class="time-grid" id="timeGrid"></div></div></div>
            <div class="form-group"><label>Party Size</label><div class="party-pills" id="partyPills"></div></div>
        </div>
        <div class="card">
            <h3>Your Details</h3>
            <div class="form-row"><div class="form-group"><label>Name</label><input type="text" id="rName" placeholder="Last name"></div><div class="form-group"><label>Phone</label><input type="tel" id="rPhone" placeholder="(205) 555-…"></div></div>
            <div class="form-group"><label>Email (optional)</label><input type="email" id="rEmail" placeholder="for confirmation"></div>
            <div class="form-group"><label>Occasion / Notes</label><input type="text" id="rNotes" placeholder="Anniversary, allergies, seat preference…"></div>
        </div>
        <button class="btn btn-gold" id="submitBtn" onclick="submitRes()" disabled>Confirm Reservation</button>
    </div>

    <div id="confirmedView" style="display:none">
        <div class="confirmed">
            <h2>Booked. <em>Merci.</em></h2>
            <p>We've confirmed your table at Maison Verre.</p>
            <div class="res-num" id="resNum">R-XXX</div>
            <p id="confirmDetails" style="font-size:.88rem"></p>
            <button class="btn btn-gold" style="margin-top:18px" onclick="location.reload()">Make Another Reservation</button>
        </div>
    </div>

    <div class="footer">Powered by <a href="https://williamsdigital.io">Williams Digital</a></div>
</div>

<script>
const STORAGE_KEY='wd-dash-maisonverre';
const TIMES=['17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00'];
const PARTY=[1,2,3,4,5,6,7,8];
let date=new Date().toISOString().slice(0,10);
let time='19:00';
let party=2;
document.getElementById('rDate').value=date;
document.getElementById('rDate').min=date;
document.getElementById('rDate').addEventListener('change',e=>{date=e.target.value;render();update()});

function renderParty(){document.getElementById('partyPills').innerHTML=PARTY.map(p=>`<button class="party-pill ${p===party?'active':''}" onclick="setParty(${p})">${p===8?'8+':p}</button>`).join('')}
function setParty(p){party=p;renderParty();update()}
function renderTimes(){
    // Random subset gets 'unavailable' to feel real
    const seed=date.split('-').join('');
    const unavail=new Set();
    TIMES.forEach((t,i)=>{const h=(parseInt(seed)+i*31)%TIMES.length;if(h<2)unavail.add(t)});
    document.getElementById('timeGrid').innerHTML=TIMES.map(t=>{const ua=unavail.has(t);const click=ua?'':"setTime('"+t+"')";return `<button class="time-pill ${t===time&&!ua?'active':''} ${ua?'unavailable':''}" onclick="${click}">${fmtT(t)}</button>`}).join('');
}
function setTime(t){time=t;renderTimes();update()}
function fmtT(t){let h=parseInt(t.split(':')[0]),m=t.split(':')[1],ap=h>=12?'p':'a';h=h%12||12;return h+(m==='00'?'':':'+m)+ap}
function update(){const ok=document.getElementById('rName').value.trim()&&document.getElementById('rPhone').value.trim();document.getElementById('submitBtn').disabled=!ok}
function render(){renderParty();renderTimes()}
['rName','rPhone'].forEach(i=>document.getElementById(i).addEventListener('input',update));
function submitRes(){
    const name=document.getElementById('rName').value.trim();
    const phone=document.getElementById('rPhone').value.trim();
    if(!name||!phone)return;
    const notes=document.getElementById('rNotes').value.trim();
    const id='R-'+Math.floor(500+Math.random()*500);
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(raw){
            const d=JSON.parse(raw);
            if(!d.res)d.res=[];
            d.res.push({id,date,time,name,size:party,phone,table:'',status:'Confirmed',notes,allergens:[]});
            localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
        }
    }catch(e){}
    document.getElementById('formView').style.display='none';
    document.getElementById('confirmedView').style.display='block';
    document.getElementById('resNum').textContent=id;
    const dt=new Date(date+'T00:00:00');
    const dateStr=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    document.getElementById('confirmDetails').innerHTML=name+'<br>'+dateStr+' at '+fmtT(time)+'<br>'+party+' guest'+(party===1?'':'s')+(notes?'<br><em style="color:var(--text-mute)">"'+notes+'"</em>':'');
    window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
