<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Crew view | Let It Glow (Concept)</title>
<meta name="theme-color" content="#0E1118">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FBF6EC'/%3E%3Cellipse cx='16' cy='14' rx='6' ry='8' fill='none' stroke='%2321883F' stroke-width='3'/%3E%3Crect x='12.5' y='22' width='7' height='6' fill='none' stroke='%2321883F' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EC;--cream-2:#F4ECDB;--rule:#E6DBC5;--rule-2:#CFC4AE;--ink:#1A1A1A;--body:#4A4658;--quiet:#6A6577;--red:#C22E20;--red-text:#B0261A;--green:#1B7A36;--night:#0E1118;--slab:"Roboto Slab",Georgia,serif;--sans:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--body);font-family:var(--sans);font-weight:500;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--slab);font-weight:800;margin:0;color:var(--ink)}
p{margin:0}
:focus-visible{outline:3px solid #21883F;outline-offset:2px;border-radius:6px}
.top{background:var(--night);color:#C6CAD6;padding:14px 16px 16px;position:sticky;top:0;z-index:20}
.top .r{display:flex;align-items:center;gap:12px;max-width:620px;margin:0 auto}
.top img{height:26px;width:auto;flex:none}
.top select{min-width:0;flex:0 1 auto}
@media (max-width:360px){.top img{height:20px}.top .r{gap:8px}}
.top a{margin-left:auto;color:#F7F3EA;font-size:14px;font-weight:700;padding:10px 0}
.top select{appearance:none;-webkit-appearance:none;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:#1B2233 linear-gradient(45deg,transparent 50%,#fff 50%) no-repeat calc(100% - 18px) 19px/6px 6px;padding:0 34px 0 12px;font-size:16px;font-weight:700;color:#fff;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 12px) 19px;background-size:6px 6px;background-repeat:no-repeat}
.days{display:flex;gap:8px;overflow-x:auto;max-width:620px;margin:12px auto 0;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dayb{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#F7F3EA;font-weight:700;font-size:14.5px;cursor:pointer}
.dayb[aria-pressed="true"]{background:#FFBA43;border-color:#FFBA43;color:#2A1B00}
main{max-width:620px;margin:0 auto;padding:16px 14px 80px}
.demo{background:#EEF0FF;border:1px solid #C3C8F5;color:#2F3470;font-size:13.5px;padding:9px 12px;border-radius:10px;margin-bottom:14px}
h1{font-size:24px;margin-bottom:2px}
.cnt{margin-bottom:14px}
.job{background:#fff;border:1px solid var(--rule);border-radius:16px;margin-bottom:14px;overflow:hidden}
.job>summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.job>summary::-webkit-details-marker{display:none}
.job h2{font-size:19px}
.job .meta{font-size:14.5px;grid-column:1/-1}
.kind{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700}
.k-install{background:#E1ECFA;color:#174A85}.k-takedown{background:#EDE4F7;color:#553088}.k-service{background:#FBE3DF;color:#8E1B10}.k-done{background:#DFF2E3;color:#14602A}
.in{padding:0 16px 18px;border-top:1px solid var(--rule)}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--rule-2);background:#fff;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:center}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;width:100%;margin-top:16px;min-height:54px;font-family:var(--slab);font-size:17px}
.sec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red-text);margin:18px 0 6px}
.notes{background:#FFF6E1;border:1px solid #E7C98B;border-radius:12px;padding:12px 14px;color:var(--ink);font-size:15.5px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--rule);font-size:15.5px;cursor:pointer;color:var(--ink);font-weight:600}
.chk:last-child{border-bottom:0}
.chk input{width:24px;height:24px;accent-color:#1B7A36;flex:none}
.chk small{display:block;font-size:13px;color:var(--quiet);font-weight:500}
.chk input:checked+span{color:var(--quiet);text-decoration:line-through}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:92px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--rule-2)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.empty{background:#fff;border:1px dashed var(--rule-2);border-radius:16px;padding:28px 18px;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;font-size:14.5px;z-index:99;width:max-content;max-width:92vw;visibility:hidden;opacity:0;transition:opacity .2s}
.toast.on{visibility:visible;opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="r"><img src="../img/logo-dark.png" alt="Let It Glow" width="137" height="26"><select id="crewSel" aria-label="Crew"></select><a href="../admin/">Office</a></div>
  <div class="days" id="days"></div>
</div>
<main>
  <div class="demo">Crew view concept. Sample jobs only. In the live build each installer signs in and sees just their own crew's day.</div>
  <h1 id="dayTitle"></h1>
  <p class="cnt" id="dayCount"></p>
  <div id="jobs"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="../admin/data.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var G=window.LIG,esc=G.esc,day=G.day,money=G.money;
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},4200)}
var S=G.load(),today=G.plus(0),sel=today,crew=G.LS.get('lig_crew','Crew 1'),openId='';
function job(id){return S.jobs.filter(function(j){return j.id===id})[0]}

$('#crewSel').innerHTML=['Crew 1','Crew 2','All crews'].map(function(c){return '<option'+(c===crew?' selected':'')+'>'+c+'</option>'}).join('');
$('#crewSel').addEventListener('change',function(){crew=this.value;G.LS.set('lig_crew',crew);draw()});
function mine(j){return crew==='All crews'||(j.crew||'Unassigned')===crew}
/* work for a day: installs, takedowns, and open Stay-Lit calls on this crew's installs (shown today) */
function work(d){
  var out=[];
  S.jobs.forEach(function(j){
    if(!mine(j))return;
    if(j.date===d&&(j.stage==='scheduled'||(j.stage==='installed'&&j.doneAt===d)))out.push({t:'install',j:j,done:j.stage==='installed'});
    if(j.down===d&&(j.stage==='installed'||j.stage==='takedown'||(j.stage==='stored'&&j.downAt===d)))out.push({t:'takedown',j:j,done:j.stage==='stored'});
  });
  if(d===today)S.tickets.forEach(function(t){var j=t.job&&job(t.job);if(j&&mine(j)&&(t.status==='open'||t.fixedAt===d))out.push({t:'service',j:j,tk:t,done:t.status!=='open'})});
  return out;
}
function drawDays(){
  var ds={};ds[today]=1;
  S.jobs.forEach(function(j){if(!mine(j))return;if(j.stage==='scheduled'&&j.date>=today)ds[j.date]=1;if((j.stage==='installed'||j.stage==='takedown')&&j.down>=today)ds[j.down]=1});
  var list=Object.keys(ds).sort().slice(0,7);if(list.indexOf(sel)<0)sel=today;
  $('#days').innerHTML=list.map(function(d){return '<button class="dayb" type="button" data-d="'+d+'" aria-pressed="'+(d===sel)+'">'+(d===today?'Today':day(d))+'</button>'}).join('');
}
$('#days').addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b)return;sel=b.getAttribute('data-d');openId='';draw()});

function dir(j){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(j.ll?j.ll.join(','):((j.address&&j.address.charAt(0)!=='('?j.address:j.area+', AL')))}
function tel(j){return (j.phone||'').replace(/\D/g,'')}
function card(w){
  var j=w.j,key=w.t+'-'+(w.tk?w.tk.id:j.id),lab={install:'Install',takedown:'Takedown',service:'Stay-Lit call'}[w.t];
  var h='<details class="job" data-key="'+esc(key)+'"'+(openId===key?' open':'')+'><summary><h2>'+esc(j.name)+'</h2><span class="kind '+(w.done?'k-done':'k-'+w.t)+'">'+(w.done?'Done':lab)+'</span>'+
    '<span class="meta">'+esc(j.address&&j.address.charAt(0)!=='('?j.address:j.area)+' · '+esc(w.t==='service'?w.tk.issue+(w.tk.where?', '+w.tk.where:''):j.q.pkg+(j.feet?' · '+j.feet+' ft':''))+'</span></summary><div class="in">';
  h+='<div class="btns"><a class="btn" href="'+dir(j)+'" target="_blank" rel="noopener">Directions</a><a class="btn" href="tel:'+tel(j)+'">Call</a><a class="btn" href="sms:'+tel(j)+'">Text</a></div>';
  if(j.notes)h+='<div class="sec">Property notes</div><div class="notes">'+esc(j.notes)+'</div>';
  if(j.design)h+='<div class="sec">Approved design</div><p style="color:var(--ink)">'+esc(j.design)+'</p>';
  if(w.t==='service'){
    h+='<div class="sec">What was reported</div><p style="color:var(--ink)">'+esc(w.tk.issue)+(w.tk.where?' · '+esc(w.tk.where):'')+'</p><p style="font-size:14px">Installed '+day(j.date)+' by '+esc(j.crew||'crew')+(j.bin?' · spares in bin '+esc(j.bin):'')+'</p>';
    if(!w.done)h+='<button class="btn btn-red" type="button" data-fix="'+esc(w.tk.id)+'">Mark fixed</button>';
  }else{
    if(w.t==='install'){
      var items=S.items.filter(function(i){return j.items&&j.items[i.k]});
      h+='<div class="sec">Load list</div>'+(items.length?items.map(function(i){return '<label class="chk"><input type="checkbox" data-load="'+i.k+'" data-j="'+esc(j.id)+'"'+((j.loaded||{})[i.k]?' checked':'')+(w.done?' disabled':'')+'><span>'+j.items[i.k].toLocaleString('en-US')+(i.u?' '+i.u:'')+' · '+esc(i.n)+'<small>'+esc(i.loc)+'</small></span></label>'}).join(''):'<p>No load list yet. Ask the office.</p>');
    }else h+='<div class="sec">Storage</div><p style="color:var(--ink)">'+(j.bin?'Goes back in bin '+esc(j.bin)+'.':'No bin yet. The office assigns one before storage.')+'</p>';
    h+='<div class="sec">'+(w.t==='install'?'Install':'Takedown')+' checklist</div>'+G.CHECK[w.t].map(function(c,i){return '<label class="chk"><input type="checkbox" data-chk="'+w.t+i+'" data-j="'+esc(j.id)+'"'+((j.check||{})[w.t+i]?' checked':'')+(w.done?' disabled':'')+'><span>'+esc(c)+'</span></label>'}).join('');
    if(w.t==='install'){
      h+='<div class="sec">Completion photos</div><div class="thumbs">'+(j.photos||[]).map(function(p){return '<img src="'+p+'" alt="Completion photo">'}).join('')+'</div>';
      if(!w.done)h+='<label class="btn file" style="margin-top:8px">Add a photo<input type="file" accept="image/*" capture="environment" data-photo="'+esc(j.id)+'" aria-label="Add a completion photo"></label>';
    }
    if(!w.done)h+='<button class="btn btn-red" type="button" data-done="'+w.t+'" data-j="'+esc(j.id)+'">'+(w.t==='install'?'Mark install complete':'Mark taken down')+'</button>';
    else if(w.t==='install'&&G.due(j))h+='<p style="margin-top:14px;font-size:14.5px">Balance of '+money(G.due(j))+' is due. The office sends the pay link.</p>';
  }
  return h+'</div></details>';
}
function draw(){
  drawDays();
  var w=work(sel).sort(function(a,b){return a.done-b.done});
  $('#dayTitle').textContent=(sel===today?'Today, ':'')+day(sel);
  var left=w.filter(function(x){return !x.done}).length;
  $('#dayCount').textContent=w.length?(left?left+(left===1?' stop':' stops')+' to go':'All done for the day.')+' · '+crew:crew;
  $('#jobs').innerHTML=w.length?w.map(card).join(''):'<div class="empty"><h2 style="font-size:19px">Nothing on the board.</h2><p style="margin-top:6px">No installs, takedowns or service calls for '+esc(crew)+' on this day.</p></div>';
}
var box=$('#jobs');
box.addEventListener('toggle',function(e){if(e.target.open)openId=e.target.getAttribute('data-key')},true);
box.addEventListener('change',function(e){
  var t=e.target,j=t.getAttribute('data-j')&&job(t.getAttribute('data-j'));
  if(t.hasAttribute('data-load')){j.loaded=j.loaded||{};j.loaded[t.getAttribute('data-load')]=t.checked;G.save(S)}
  else if(t.hasAttribute('data-chk')){j.check=j.check||{};j.check[t.getAttribute('data-chk')]=t.checked;G.save(S)}
  else if(t.hasAttribute('data-photo')&&t.files&&t.files[0]){
    var jj=job(t.getAttribute('data-photo')),img=new Image(),url=URL.createObjectURL(t.files[0]);
    img.onload=function(){ /* shrink before saving; the live build uploads the full photo */
      var k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      jj.photos=(jj.photos||[]).concat(c.toDataURL('image/jpeg',.6)).slice(-3);
      if(!G.save(S)){jj.photos.pop();toast('That photo is too large to keep in this demo.')}else toast('Photo added. The office sees it on the job.');
      draw();
    };
    img.onerror=function(){toast('That file could not be read as a photo.')};
    img.src=url;
  }
});
box.addEventListener('click',function(e){
  var f=e.target.closest('[data-fix]'),d=e.target.closest('[data-done]');
  if(f){var tk=S.tickets.filter(function(x){return x.id===f.getAttribute('data-fix')})[0];tk.status='done';tk.fixedAt=today;G.save(S);draw();toast('Marked fixed. The office and the customer are told.');return}
  if(!d)return;
  var j=job(d.getAttribute('data-j')),t=d.getAttribute('data-done'),miss=G.CHECK[t].filter(function(c,i){return !(j.check||{})[t+i]}).length;
  if(miss){toast(miss+(miss===1?' checklist item is':' checklist items are')+' still open.');return}
  if(t==='install'){j.stage='installed';j.doneAt=sel;toast(j.name+' is installed. Stay-Lit is active.')}
  else{if(!j.bin){toast('No storage bin on this job yet. Ask the office for one first.');return}j.stage='stored';j.downAt=sel;toast(j.name+' is down and stored in bin '+j.bin+'.')}
  G.save(S);draw();
});
draw();
window.addEventListener('focus',function(){S=G.load();draw()});
})();
</script>
</body>
</html>
