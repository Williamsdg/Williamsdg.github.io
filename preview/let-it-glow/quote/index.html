<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your lighting quote | Let It Glow (Concept)</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FBF6EC'/%3E%3Cellipse cx='16' cy='14' rx='6' ry='8' fill='none' stroke='%2321883F' stroke-width='3'/%3E%3Crect x='12.5' y='22' width='7' height='6' fill='none' stroke='%2321883F' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EC;--cream-2:#F4ECDB;--rule:#E6DBC5;--rule-2:#CFC4AE;--ink:#1A1A1A;--body:#4A4658;--quiet:#6A6577;--red:#C22E20;--red-hi:#A92316;--red-text:#B0261A;--green:#1B7A36;--slab:"Roboto Slab",Georgia,serif;--sans:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--body);font-family:var(--sans);font-weight:500;font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--slab);font-weight:800;margin:0;color:var(--ink);line-height:1.15}
p{margin:0}
:focus-visible{outline:3px solid #21883F;outline-offset:3px;border-radius:6px}
.ribbon{background:#0E0E1C;color:#B4B4C0;font-size:12.5px;text-align:center;padding:7px 16px}
.ribbon a{color:#A5B4FC;font-weight:700;text-decoration:none}
header{padding:22px 18px 0;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:34px;width:auto}
header a{font-weight:700;color:var(--ink);text-decoration:none;font-size:15px;padding:10px 0}
main{max-width:640px;margin:0 auto;padding:22px 18px 70px}
h1{font-size:clamp(27px,6vw,36px)}
.lede{margin-top:8px;font-size:17px}
.card{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:22px;margin-top:18px}
.topper{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red-text);margin-bottom:8px}
.line{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule);color:var(--ink)}
.line span:last-child{white-space:nowrap;font-weight:700}
.line.t{border-bottom:0;padding-top:16px;font-family:var(--slab);font-size:22px;font-weight:800}
.line.s{border-bottom:0;padding:4px 0;color:var(--body);font-size:15.5px}
.incl{margin:14px 0 0;padding:0;list-style:none;font-size:15.5px}
.incl li{padding:5px 0 5px 26px;position:relative}
.incl li::before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-family:var(--slab);font-weight:700;font-size:17.5px;cursor:pointer;text-decoration:none;margin-top:16px}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-hi)}
.btn-line{background:#fff;border-color:var(--ink);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px}
.steps div{font-size:12.5px;font-weight:700;text-align:center;color:var(--quiet);padding-top:10px;border-top:4px solid var(--rule)}
.steps div.on{border-color:#21883F;color:var(--ink)}
.ok{background:#EAF6EC;border-color:#9CCBA6}
.warn{background:#FFF6E1;border-color:#E7C98B}
.fine{font-size:13.5px;color:var(--quiet);margin-top:12px}
.demo{font-size:13.5px;color:#2F3470;background:#EEF0FF;border:1px solid #C3C8F5;padding:9px 12px;border-radius:10px;margin-top:14px}
</style>
</head>
<body>
<div class="ribbon">Customer quote page, concept by Williams Digital. No payment is taken here. · <a href="../admin/">Back to the dashboard</a></div>
<header><img src="../img/logo.png" alt="Let It Glow" width="178" height="34"><a href="tel:+12055668373">(205) 566-8373</a></header>
<main id="main"></main>

<script src="../admin/data.js"></script>
<script>
(function(){
'use strict';
var G=window.LIG,esc=G.esc,money=G.money,day=G.day,S=G.load();
var id=(location.search.match(/[?&]id=([^&]+)/)||[])[1];id=id?decodeURIComponent(id):'';
var j=S.jobs.filter(function(x){return x.id===id})[0];
var el=document.getElementById('main');
function draw(){
  if(!j||!G.total(j)||j.q.status==='draft'){el.innerHTML='<h1>We couldn\'t find that quote.</h1><p class="lede">The link may be out of date. Call or text us at (205) 566-8373 and we\'ll send a fresh one.</p>';return}
  var t=G.total(j),dep=G.deposit(j),paid=j.paid||0,p=G.pay(j)[0],first=esc(j.name.replace(/^Sample · /,'').split(' ')[0]);
  var step=p==='sent'||p==='expired'?0:p==='dep'?1:j.stage==='quoted'?2:3;
  var h='<h1>'+(step===0?'Your lighting quote':step===1?'Approved. One step left.':'You\'re on the calendar.')+'</h1>'+
    '<p class="lede">'+esc(j.name)+' · '+esc(j.area)+' · Quote '+esc(j.inv||'')+'</p>'+
    '<div class="steps">'+['Review','Approve','Deposit','Install'].map(function(s,i){return '<div class="'+(i<=step?'on':'')+'">'+s+'</div>'}).join('')+'</div>';
  if(j.design)h+='<div class="card"><div class="topper">Your design</div><p style="color:var(--ink);font-size:17.5px">'+esc(j.design)+'</p>'+(j.feet?'<p class="fine" style="margin-top:6px">Measured from the satellite view: about '+j.feet+' ft.</p>':'')+'</div>';
  h+='<div class="card"><div class="topper">What\'s included</div>'+
    '<div class="line"><span>'+esc(j.q.pkg)+'</span><span>'+money(j.q.base)+'</span></div>'+
    (j.q.extras||[]).map(function(x){return '<div class="line"><span>'+esc(x[0])+'</span><span>'+money(x[1])+'</span></div>'}).join('')+
    '<div class="line t"><span>Total</span><span>'+money(t)+'</span></div>'+
    '<div class="line s"><span>Deposit to book ('+G.DEP+'%)</span><span>'+money(dep)+'</span></div>'+
    (paid?'<div class="line s"><span>Paid so far</span><span>'+money(paid)+'</span></div><div class="line s"><span>Balance</span><span>'+money(t-paid)+'</span></div>':'')+
    '<ul class="incl"><li>Custom design and commercial-grade lights</li><li>Professional installation</li><li>In-season maintenance, backed by the Stay-Lit Guarantee</li><li>Takedown after the season</li></ul></div>';
  if(p==='expired')h+='<div class="card warn"><h3>This quote expired '+day(j.q.expires)+'.</h3><p style="margin-top:6px">Call or text (205) 566-8373 and we\'ll refresh it.</p></div>';
  else if(p==='sent')h+='<div class="card"><h3>Look right?</h3><p style="margin-top:6px">Approve the design and price to hold your spot.'+(j.q.expires?' This quote is good until '+day(j.q.expires)+'.':'')+'</p><button class="btn btn-red" type="button" data-a="approve">Approve this quote</button><a class="btn btn-line" href="sms:+12055668373">Text us a question</a></div>';
  else if(p==='dep')h+='<div class="card"><h3>Pay your deposit to book.</h3><p style="margin-top:6px">'+money(dep)+' today. The balance of '+money(t-dep)+' is due when your lights are up.</p><button class="btn btn-red" type="button" data-a="dep">Pay '+money(dep)+' deposit</button><div class="demo">Concept only: this button marks the deposit paid. The live page opens a secure card or bank checkout.</div></div>';
  else{
    h+='<div class="card ok"><h3>'+(j.stage==='installed'||j.stage==='takedown'?'Your lights are up.':j.date&&j.stage==='scheduled'?'Install day: '+day(j.date)+'.':'Thanks, '+first+'. Your deposit is in.')+'</h3><p style="margin-top:6px">'+
      (j.stage==='installed'||j.stage==='takedown'?'Covered by the Stay-Lit Guarantee all season.'+(j.down?' Takedown is planned for '+day(j.down)+'.':''):j.date&&j.stage==='scheduled'?'We\'ll text you the day before with an arrival window.':'We\'ll text you an install date shortly.')+'</p></div>';
    if(t-paid>0)h+='<div class="card"><h3>Balance: '+money(t-paid)+'</h3><p style="margin-top:6px">Due once your lights are installed.</p><button class="btn btn-red" type="button" data-a="bal">Pay '+money(t-paid)+' balance</button><div class="demo">Concept only: no payment is taken.</div></div>';
    else h+='<div class="card"><h3>Paid in full. Thank you.</h3></div>';
    if(j.stage==='installed')h+='<a class="btn btn-line" href="../#why">Something out? Send a Stay-Lit request</a>';
  }
  el.innerHTML=h+'<p class="fine">Let It Glow · Homewood, AL · Fully insured, locally owned and operated.</p>';
}
el.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');
  S=G.load();j=S.jobs.filter(function(x){return x.id===id})[0];
  if(a==='approve')j.q.status='approved';else if(a==='dep')j.paid=G.deposit(j);else j.paid=G.total(j);
  G.save(S);draw();window.scrollTo(0,0);
});
draw();
})();
</script>
</body>
</html>
