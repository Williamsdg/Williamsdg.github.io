<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your HVAC | Climate Air Pros</title>
<meta name="theme-color" content="#070b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
    --primary:#2563eb;--primary-dark:#1a2a5e;
    --gold:#d4af37;--gold-glow:rgba(212,175,55,0.18);
    --green:#34d399;
    --red:#f87171;
    --bg:#070b1a;
    --canvas:radial-gradient(900px 600px at 80% -10%, rgba(37,99,235,0.20), transparent 60%), radial-gradient(700px 500px at -10% 110%, rgba(212,175,55,0.06), transparent 70%), #070b1a;
    --surface:rgba(255,255,255,0.04);
    --text:#f1f3f9;--text-soft:#c8cfdb;--text-mute:#7a86a0;
    --border:rgba(255,255,255,0.10);--border-soft:rgba(255,255,255,0.06);
    --serif:'Fraunces',Georgia,serif;
}
html,body{background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas) fixed;color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em;padding:32px 16px 56px}
::selection{background:var(--gold-glow);color:var(--text)}
.wrap{max-width:780px;margin:0 auto}
.brand-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:10px 4px}
.brand-bar .biz{font-family:var(--serif);font-size:1.1rem;font-weight:500;letter-spacing:-0.01em;color:var(--text)}
.brand-bar .meta{font-size:.72rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.8px;font-weight:600}
.hero{background:linear-gradient(135deg, color-mix(in srgb, var(--primary) 28%, rgba(15,21,40,0.8)), rgba(15,21,40,0.85));backdrop-filter:blur(20px);border:1px solid var(--border);color:#fff;padding:34px 28px;border-radius:18px;margin-bottom:18px;box-shadow:0 24px 64px -24px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.06);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);opacity:0.6}
.hero h1{font-size:.7rem;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.hero h2{font-family:var(--serif);font-weight:400;font-size:1.85rem;margin-top:6px;letter-spacing:-0.02em;line-height:1.2}
.hero p{font-size:.88rem;color:var(--text-soft);margin-top:8px}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.summary-cell{background:rgba(255,255,255,0.04);border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px}
.summary-cell .lbl{font-size:.66rem;color:var(--gold);text-transform:uppercase;letter-spacing:1.8px;font-weight:600}
.summary-cell .val{font-family:var(--serif);font-size:1.4rem;color:var(--text);margin-top:4px;letter-spacing:-0.01em;font-weight:500}
.equip{background:var(--surface);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:14px}
.equip-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.equip-name{font-family:var(--serif);font-size:1.3rem;font-weight:500;color:var(--text);letter-spacing:-0.01em}
.equip-customer{font-size:.7rem;color:var(--gold);text-transform:uppercase;letter-spacing:1.8px;font-weight:600;margin-top:4px}
.badge{display:inline-block;padding:4px 12px;border-radius:50px;font-size:.7rem;font-weight:600;letter-spacing:0.02em;border:1px solid transparent}
.badge-active{background:rgba(52,211,153,0.14);color:var(--green);border-color:rgba(52,211,153,0.3)}
.badge-pending{background:rgba(251,191,36,0.14);color:#fbbf24;border-color:rgba(251,191,36,0.3)}
.badge-warn{background:rgba(248,113,113,0.12);color:var(--red);border-color:rgba(248,113,113,0.3)}
.equip-spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;padding:14px 16px;background:rgba(255,255,255,0.025);border-radius:10px;margin-bottom:14px}
.equip-spec .lbl{font-size:.66rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:3px}
.equip-spec .val{font-size:.92rem;color:var(--text);font-weight:500}
.equip-spec .val.serial{font-family:'SFMono-Regular',monospace;font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:10px;font-weight:600;font-size:.88rem;letter-spacing:0.02em;font-family:inherit;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:all .25s}
.btn-primary{background:linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 75%, var(--primary-dark)));color:#fff;border-color:rgba(255,255,255,0.12);box-shadow:0 4px 14px -6px rgba(37,99,235,0.4),inset 0 1px 0 rgba(255,255,255,0.18);font-weight:700}
.btn-outline{background:rgba(255,255,255,0.04);color:var(--text-soft);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px}
.contact-card{background:linear-gradient(135deg, var(--gold-glow), rgba(212,175,55,0.04));border:1px solid rgba(212,175,55,0.3);border-radius:14px;padding:22px;margin-top:18px;text-align:center}
.contact-card h3{font-family:var(--serif);font-weight:500;color:var(--gold);font-size:1.1rem;margin-bottom:10px;letter-spacing:-0.01em}
.contact-card p{font-size:.88rem;color:var(--text-soft);margin-bottom:14px}
.contact-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.footer{text-align:center;font-size:.72rem;color:var(--text-mute);margin-top:24px;letter-spacing:0.04em;text-transform:uppercase;font-weight:500}
.footer a{color:var(--gold);text-decoration:none;letter-spacing:0.02em;text-transform:none;font-weight:600}
.empty{text-align:center;padding:48px 24px;color:var(--text-mute);font-style:italic}
@media(max-width:520px){body{padding:20px 14px 40px}.hero{padding:26px 22px}.hero h2{font-size:1.55rem}.equip{padding:20px 18px}.equip-name{font-size:1.15rem}.summary-row{grid-template-columns:1fr;gap:8px}.contact-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-bar">
        <div class="biz">Climate Air Pros</div>
        <div class="meta">Customer Portal</div>
    </div>

    <div class="hero">
        <h1>Your HVAC equipment</h1>
        <h2 id="customerName">Loading…</h2>
        <p id="customerAddr"></p>
        <div class="summary-row" id="summaryRow"></div>
    </div>

    <div id="equipmentList"></div>

    <div class="contact-card">
        <h3>Need anything?</h3>
        <p>Climate Air Pros · (205) 555-COOL · Birmingham Metro</p>
        <div class="contact-actions">
            <a class="btn btn-primary" href="tel:2055552665">📞 Call Service</a>
            <a class="btn btn-outline" href="mailto:service@climateairpros.com?subject=Service%20Request">✉ Email</a>
        </div>
    </div>

    <div class="footer">
        Powered by <a href="https://williamsdigital.io">Williams Digital</a>
    </div>
</div>

<script>
const SAMPLES={
    c1:{name:'Patterson Family',addr:'412 Brookwood Dr, Vestavia Hills, AL',plan:'Premium Annual',iaq:true,equipment:[
        {type:'AC Condenser',size:'3 ton',make:'Carrier',model:'24ACC636A003',serial:'4319K28411',refrig:'R-410A',install:'2019-06-12',warranty:'2029-06-12',lastService:'2026-03-15'},
        {type:'Air Handler',size:'3 ton',make:'Carrier',model:'FB4CNF036',serial:'4319M11982',refrig:'N/A',install:'2019-06-12',warranty:'2029-06-12',lastService:'2026-03-15'},
        {type:'Furnace',size:'80k BTU',make:'Carrier',model:'59SC5B080E17',serial:'4218C09812',refrig:'N/A',install:'2018-10-04',warranty:'2028-10-04',lastService:'2025-11-02'},
    ]},
    c2:{name:'Henderson Residence',addr:'188 Oakdale Ln, Mountain Brook, AL',plan:'Standard Bi-Annual',iaq:false,equipment:[
        {type:'Furnace',size:'100k BTU',make:'Lennox',model:'EL296V100',serial:'5604A22301',refrig:'N/A',install:'2004-03-10',warranty:'2014-03-10',lastService:'2026-01-08'},
        {type:'AC Condenser',size:'4 ton',make:'Trane',model:'XR16',serial:'TR2018-0481',refrig:'R-410A',install:'2018-04-22',warranty:'2028-04-22',lastService:'2026-04-12'},
    ]},
    c8:{name:'The Walkers',addr:'320 Camp Horner Rd, Mountain Brook, AL',plan:null,iaq:true,equipment:[
        {type:'AC Condenser',size:'3 ton',make:'Lennox',model:'XC25',serial:'LX25-2024-0341',refrig:'R-410A',install:'2024-04-18',warranty:'2034-04-18',lastService:'2026-04-22'},
    ]},
};
const params=new URLSearchParams(location.search);
const custKey=params.get('customer')||'c1';
const data=SAMPLES[custKey]||SAMPLES.c1;
const today=new Date();
const todayISO=today.toISOString().slice(0,10);
function fmtDate(iso){if(!iso)return '—';return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function ageYears(install){return ((today-new Date(install+'T00:00:00'))/86400000/365).toFixed(1)}

document.getElementById('customerName').textContent=data.name;
document.getElementById('customerAddr').textContent=data.addr;

const totalUnits=data.equipment.length;
const undWarr=data.equipment.filter(e=>daysBetween(todayISO,e.warranty)>0).length;
const lastService=data.equipment.map(e=>e.lastService).filter(Boolean).sort().slice(-1)[0];
document.getElementById('summaryRow').innerHTML=`
    <div class="summary-cell"><div class="lbl">Units on file</div><div class="val">${totalUnits}</div></div>
    <div class="summary-cell"><div class="lbl">Under warranty</div><div class="val">${undWarr} / ${totalUnits}</div></div>
    <div class="summary-cell"><div class="lbl">Last service</div><div class="val" style="font-size:1rem">${lastService?fmtDate(lastService):'—'}</div></div>
`;

const list=document.getElementById('equipmentList');
list.innerHTML=data.equipment.length?data.equipment.map(e=>{
    const days=daysBetween(todayISO,e.warranty);
    const badge=days<0?`<span class="badge badge-warn">Warranty expired</span>`:days<=180?`<span class="badge badge-pending">${days} days warranty</span>`:`<span class="badge badge-active">Under warranty</span>`;
    const subj=encodeURIComponent('Service request: '+e.type+' '+e.size+' ('+data.name+')');
    const body=encodeURIComponent('Hi Climate Air Pros,\n\nI\'d like to schedule service for my '+e.type+' '+e.size+' ('+e.make+' '+e.model+').\n\n— '+data.name+'\n'+data.addr);
    return `<div class="equip">
        <div class="equip-head"><div><div class="equip-name">${e.type} • ${e.size}</div><div class="equip-customer">${e.make} ${e.model}</div></div>${badge}</div>
        <div class="equip-spec">
            <div><div class="lbl">Serial</div><div class="val serial">${e.serial}</div></div>
            <div><div class="lbl">Refrigerant</div><div class="val">${e.refrig}</div></div>
            <div><div class="lbl">Installed</div><div class="val">${fmtDate(e.install)}</div></div>
            <div><div class="lbl">Age</div><div class="val">${ageYears(e.install)} yrs</div></div>
            <div><div class="lbl">Warranty Ends</div><div class="val">${fmtDate(e.warranty)}</div></div>
            <div><div class="lbl">Last Service</div><div class="val">${e.lastService?fmtDate(e.lastService):'—'}</div></div>
        </div>
        <div class="actions">
            <a class="btn btn-primary" href="mailto:service@climateairpros.com?subject=${subj}&body=${body}">Schedule Service</a>
            <a class="btn btn-outline" href="tel:2055552665">Call</a>
        </div>
    </div>`;
}).join(''):'<div class="empty">No equipment on file yet — your installer will register your units after their next visit.</div>';
</script>
</body>
</html>
