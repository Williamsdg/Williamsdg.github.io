<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | The Vestavia Voice</title>
<meta name="description" content="Upcoming events and meetings in Vestavia Hills.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.cat-chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem;font-family:'Inter',sans-serif}
.cat-chips button{padding:.45rem 1rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:100px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.cat-chips button:hover{border-color:var(--ink)}
.cat-chips button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.event-big{display:grid;grid-template-columns:100px 1fr auto;gap:1.25rem;padding:1.25rem 1.5rem;background:var(--paper);border:1px solid var(--rule);border-radius:4px;margin-bottom:.75rem;align-items:center;transition:all .2s;cursor:pointer}
.event-big:hover{border-color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.event-big-date{text-align:center;background:var(--ink);color:var(--paper);padding:.75rem;border-radius:4px}
.event-big-date .m{font-family:'Inter',sans-serif;font-size:.65rem;letter-spacing:1.5px;color:var(--gold);font-weight:700;text-transform:uppercase}
.event-big-date .d{font-family:'Playfair Display',serif;font-size:2rem;font-weight:800;line-height:1}
.event-big-date .t{font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:1px;color:var(--paper);opacity:.7;margin-top:.2rem}
.event-big-body h4{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:.35rem}
.event-big-meta{display:flex;gap:1rem;font-family:'Inter',sans-serif;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.event-pill{font-family:'Inter',sans-serif;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;padding:.3rem .65rem;border-radius:100px}
.p-civic{background:rgba(138,28,28,.1);color:var(--accent)}
.p-schools{background:rgba(45,106,79,.12);color:var(--green)}
.p-sports{background:rgba(26,74,122,.12);color:var(--blue)}
.p-community{background:rgba(184,103,31,.12);color:var(--orange)}
@media(max-width:600px){.event-big{grid-template-columns:70px 1fr;gap:.75rem;padding:1rem}.event-big-date{padding:.5rem}.event-big-date .d{font-size:1.5rem}.event-big>*:last-child{grid-column:1/-1}}
</style>
</head>
<body>

<div id="chrome"></div>

<section class="section-hero">
  <div class="section-hero-inner">
    <div class="section-hero-kicker">Section</div>
    <h1>Events</h1>
    <p>Meetings, games, festivals, and everything happening in Vestavia Hills this week.</p>
  </div>
</section>

<main class="page">

  <div class="cat-chips">
    <button class="active" onclick="filterEvents('all',this)">All events</button>
    <button onclick="filterEvents('civic',this)">City &amp; Civic</button>
    <button onclick="filterEvents('schools',this)">Schools</button>
    <button onclick="filterEvents('sports',this)">Sports</button>
    <button onclick="filterEvents('community',this)">Community</button>
  </div>

  <section>
    <h3 class="section-title">This week <span class="section-title-meta">Apr 22 – 28</span></h3>
    <div id="events-list"></div>
  </section>

  <section style="margin-top:3rem">
    <h3 class="section-title">Looking ahead <span class="section-title-meta">May</span></h3>
    <div id="events-may"></div>
  </section>

  <section style="margin-top:3rem;background:var(--paper-2);padding:1.75rem 2rem;border-radius:4px;border:1px solid var(--rule)">
    <h3 style="font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:800;margin-bottom:.5rem">Add your event</h3>
    <p style="color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:1rem">Non-profit and community events are free. Commercial events start at $25/week for prominent placement.</p>
    <a href="#" class="subscribe-btn" style="padding:.65rem 1.25rem;border-radius:4px">+ Submit an event</a>
  </section>

</main>

<div id="footer"></div>

<script src="shared.js"></script>
<script>
const events=[
  {m:'APR',d:'23',t:'Thu',cat:'civic',pill:'p-civic',title:'Council Work Session',where:'City Hall Chambers',time:'6:30 PM',note:'Corridor follow-up on agenda'},
  {m:'APR',d:'24',t:'Fri',cat:'sports',pill:'p-sports',title:'VHHS Track Meet vs. Spain Park',where:'VHHS Stadium',time:'4:00 PM',note:'Senior night'},
  {m:'APR',d:'25',t:'Sat',cat:'community',pill:'p-community',title:'Farmers Market Opening Day',where:'Wald Park',time:'8 AM–1 PM',note:'40+ vendors'},
  {m:'APR',d:'26',t:'Sun',cat:'schools',pill:'p-schools',title:'VHHS Spring Concert',where:'Performing Arts Center',time:'7:00 PM',note:'Band, choir, orchestra'},
  {m:'APR',d:'27',t:'Mon',cat:'community',pill:'p-community',title:'Library Book Sale',where:'Vestavia Library',time:'10 AM–4 PM',note:'Friends of the Library'},
  {m:'APR',d:'28',t:'Tue',cat:'sports',pill:'p-sports',title:'Softball vs. Oak Mountain',where:'VHHS Field',time:'5:00 PM',note:'Senior night'},
];
const may=[
  {m:'MAY',d:'01',t:'Fri',cat:'community',pill:'p-community',title:'Dogwood Festival — Day 1',where:'Wald Park',time:'All day',note:'200 vendors, music, food'},
  {m:'MAY',d:'02',t:'Sat',cat:'community',pill:'p-community',title:'Dogwood Festival 5K',where:'Wald Park',time:'7:00 AM',note:'Benefits library'},
  {m:'MAY',d:'07',t:'Wed',cat:'civic',pill:'p-civic',title:'Cahaba Heights Corridor Info Session',where:'Cahaba Hts Library',time:'7:00 PM',note:'Public Q&A'},
  {m:'MAY',d:'12',t:'Mon',cat:'civic',pill:'p-civic',title:'Budget Hearing (first reading)',where:'City Hall Chambers',time:'6:30 PM',note:'Public comment'},
  {m:'MAY',d:'13',t:'Tue',cat:'civic',pill:'p-civic',title:'Zoning: Crosshaven mixed-use vote',where:'City Hall Chambers',time:'7:00 PM',note:'Final vote expected'},
  {m:'MAY',d:'18',t:'Sun',cat:'community',pill:'p-community',title:'Chamber Small Biz Awards',where:'Country Club of Birmingham',time:'6:00 PM',note:'Tickets via chamber'},
];
function renderList(container,items){
  container.innerHTML=items.map(e=>`
    <article class="event-big" data-cat="${e.cat}">
      <div class="event-big-date"><div class="m">${e.m}</div><div class="d">${e.d}</div><div class="t">${e.t}</div></div>
      <div class="event-big-body"><h4>${e.title}</h4><div class="event-big-meta"><span>◷ ${e.time}</span><span>◉ ${e.where}</span><span>${e.note}</span></div></div>
      <span class="event-pill ${e.pill}">${e.cat}</span>
    </article>`).join('');
}
function filterEvents(cat,btn){
  document.querySelectorAll('.cat-chips button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('.event-big').forEach(el=>{el.style.display=(cat==='all'||el.dataset.cat===cat)?'':'none'});
}
document.getElementById('chrome').innerHTML=renderChrome('events');
document.getElementById('footer').innerHTML=renderFooter();
renderList(document.getElementById('events-list'),events);
renderList(document.getElementById('events-may'),may);
</script>
</body>
</html>
