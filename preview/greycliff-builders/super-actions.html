<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Action Items · The Site Office · Greycliff Builders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_dashboard.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="top">
      <button class="hamburger" aria-label="Open menu"><span></span></button>
      <div class="top-brand-mobile"><span class="mark">G</span>Greycliff <em>Builders</em></div>
      <div class="top-search"><input type="text" placeholder="Search tasks…"></div>
      <div class="top-actions"><div class="top-pill">7 open today</div></div>
    </div>
    <div class="page-head">
      <div class="page-crumbs">The Site Office · Field Operations · Friday, May 22, 2026</div>
      <div class="page-title-row">
        <div>
          <h1 class="page-title">Action <em>items.</em></h1>
          <div class="page-sub">What\u2019s waiting on me? Check it off, move on. Think Apple Reminders in work boots.</div>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">
        <button class="tf on" data-f="all" style="padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;cursor:pointer">Today (7)</button>
        <button class="tf" data-f="overdue" style="padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer">Overdue (1)</button>
        <button class="tf" data-f="waiting" style="padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer">Waiting (2)</button>
        <button class="tf" data-f="done" style="padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer">Completed (2)</button>
      </div>
      <div class="card">
<label class="td" data-t="all overdue" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox"  style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Submit Brook House daily log</b><div style="font-size:11px;color:var(--mute);margin-top:2px">due today · weekly cadence</div></div></label>
<label class="td" data-t="all" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox"  style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Upload roof tie-off photos</b><div style="font-size:11px;color:var(--mute);margin-top:2px">Cahaba · safety documentation · take at next break</div></div></label>
<label class="td" data-t="all" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox"  style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Meet Drexel crew — panel check</b><div style="font-size:11px;color:var(--mute);margin-top:2px">Cahaba · 2:00p walkthrough of first 22 panels</div></div></label>
<label class="td" data-t="all waiting" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox"  style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Confirm masons for Tuesday 7a</b><div style="font-size:11px;color:var(--mute);margin-top:2px">Sycamore threshold · they bring the stone</div></div></label>
<label class="td" data-t="all waiting" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox"  style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Confirm Whitlow roof walk 6:30a</b><div style="font-size:11px;color:var(--mute);margin-top:2px">waiting on Carter\u2019s reply</div></div></label>
<label class="td" data-t="all" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox"  style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Verify punch item — drywall repair</b><div style="font-size:11px;color:var(--mute);margin-top:2px">Sycamore upstairs hall · needs your ✓ + photo</div></div></label>
<label class="td" data-t="all" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox"  style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Prep Y2 walk list — Brook House</b><div style="font-size:11px;color:var(--mute);margin-top:2px">walk Jun 12 · fold in the 2 open tickets</div></div></label>
<label class="td" data-t="done" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Pre-roof inspection — passed ✓</b><div style="font-size:11px;color:var(--mute);margin-top:2px">Cahaba · 8:00a · Wallace, zero notes</div></div></label>
<label class="td" data-t="done" style="display:flex;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline;cursor:pointer"><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--sage-deep)"><div style="flex:1"><b>Receive copper delivery ✓</b><div style="font-size:11px;color:var(--mute);margin-top:2px">Cahaba · 8:14a · counted &amp; staged</div></div></label>
        <div style="padding:12px 22px;font-size:11.5px;color:var(--mute);background:var(--bone);border-top:1px solid var(--line-soft)">Check it off and it's gone. The office sees completion in real time — no end-of-day phone call.</div>
      </div>
    </div>
  </main>
</div>
<script src="_sidebar.js" data-active="actions"></script>
<script>
document.querySelectorAll('.tf').forEach(function(f){
  f.addEventListener('click', function(){
    document.querySelectorAll('.tf').forEach(function(x){x.classList.remove('on');x.style.background='var(--paper)';x.style.color='var(--ink-2)';});
    f.classList.add('on'); f.style.background='var(--ink)'; f.style.color='var(--paper)';
    var k=f.dataset.f;
    document.querySelectorAll('.td').forEach(function(r){
      r.style.display = (k==='all' ? (' '+r.dataset.t+' ').indexOf(' done ')===-1 : (' '+r.dataset.t+' ').indexOf(' '+k+' ')>-1) ? 'flex' : 'none';
    });
  });
});
document.querySelector('.tf').click();
</script>
</body>
</html>
