  return`<p class="eyebrow">My plan</p><h1>What we agreed</h1>
  <div class="cols c2" style="margin-top:16px">
    <div class="card"><h3>On the court</h3><ul class="plain">${p.court.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
    <div class="card"><h3>Off the court</h3><ul class="plain">${p.off.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>
  <div style="margin-top:14px">${courtCard(p,false)}</div><div style="margin-top:14px">${seasonLine(p.id)}</div>
  <div class="sec"><h2>Body and fuel</h2><div class="lock">${p.age<18?'<p>Body and fuel plans are switched off in the app for players under 18.</p>':!b.optIn?'<p>You have not opted in. You can change that on the Privacy tab at any time.</p>':b.lo&&b.entries.length?`<h3>${esc(b.goal)} · set with ${esc(MEDS)}</h3>${spark(b)}`:'<p>You have opted in. Performance staff will set a plan with you.</p>'}
    <p class="small" style="margin-top:8px">Coaches cannot see these numbers.</p></div></div>
  <div class="sec"><h2>Meetings</h2><div class="card">${S.meetings.filter(m=>m.pid===p.id).sort((a,b)=>b.d.localeCompare(a.d)).map(m=>`<div class="item"><div><div class="t">${esc(m.type)} · ${nice(m.d)}</div><div class="small muted">${esc(m.by)}</div><p class="small">${esc(m.text)}</p></div></div>`).join('')}</div></div>`;
}
function vPrivacy(){
  const p=P(S.role.pid),b=S.body[p.id],minor=p.age<18;
  return`<p class="eyebrow">Privacy</p><h1>Who sees what</h1>
  <div class="card scroll" style="margin-top:16px"><table><thead><tr><th>Your information</th><th>Coaches</th><th>Performance staff</th></tr></thead><tbody>
    <tr><td>Required work you check off</td><td>Yes</td><td>Treatment items only</td></tr>
    <tr><td>Suggested work you log</td><td>No</td><td>No</td></tr>
    <tr><td>Weight and body numbers</td><td>No</td><td>${b.optIn&&!minor?'Yes':'No'}</td></tr>
    <tr><td>Body and fuel status line</td><td>${b.share&&b.optIn?'Yes':'No'}</td><td>${b.optIn&&!minor?'Yes':'No'}</td></tr></tbody></table></div>
  <div class="card"><h3>Your choices</h3>${minor?'<p class="note" style="margin-top:8px">You are under 18, so body and fuel plans are switched off in the app.</p>':''}
    <div class="switch"><button role="switch" aria-checked="${b.optIn&&!minor}" data-a="sw" data-k="optIn" ${minor?'disabled':''} aria-label="Take part in a body and fuel plan"></button><div><b>Take part in a body and fuel plan</b><p class="small muted">Run by ${esc(MEDS)}. Opting out carries no penalty and you can change this at any time.</p></div></div>
    <div class="switch"><button role="switch" aria-checked="${b.share&&b.optIn&&!minor}" data-a="sw" data-k="share" ${minor||!b.optIn?'disabled':''} aria-label="Share a status line with coaches"></button><div><b>Share a status line with coaches</b><p class="small muted">A short sentence written by performance staff. Never your numbers.</p></div></div></div>
  <div class="card"><h3>Who has looked at your body and fuel data</h3>${S.audit.filter(a=>a.pid===p.id).map(a=>`<div class="item"><div><div class="t">${esc(a.who)}</div><div class="small muted">${esc(a.ts)} · ${esc(a.what)}</div></div></div>`).join('')||'<p class="muted" style="margin-top:6px">No one.</p>'}</div>`;
}

/* ---------- shell ---------- */
const NAV={coach:[['board','Team board'],['assign','Assign'],['settings','Season']],med:[['plans','Plans'],['requests','Requests'],['audit','Access log']],player:[['today','Today'],['myplan','My plan'],['privacy','Privacy']]};
const VIEWS={intro:vIntro,board:vBoard,player:vPlayer,assign:vAssign,settings:vSettings,plans:vPlans,plan:vPlan,requests:vRequests,audit:vAudit,today:vToday,myplan:vMyPlan,privacy:vPrivacy};
const PARENT={player:'board',plan:'plans'};
function render(){
  const root=document.documentElement.style;root.setProperty('--team',S.brand.color);root.setProperty('--team-ink',textOn(S.brand.color));root.setProperty('--team2',S.brand.color2||S.brand.color);
  if(U.view==='intro'){document.getElementById('app').innerHTML=vIntro();return}
  const r=S.role,rv=r.t==='player'?'player:'+r.pid:r.t,cur=PARENT[U.view]||U.view;
  document.getElementById('app').innerHTML=`<header class="top"><div class="wrap">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M7 14.5l4 4 8-10" fill="none" stroke="#F0824F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Follow Through<span class="tag">SAMPLE</span></div>
    <label>Viewing as<select data-c="role"><option value="coach" ${rv==='coach'?'selected':''}>${esc(CFG.coachLabel)}</option><option value="med" ${rv==='med'?'selected':''}>${esc(CFG.medLabel)}</option>
      ${S.players.map(p=>`<option value="player:${p.id}" ${rv==='player:'+p.id?'selected':''}>Player · ${esc(p.name)}</option>`).join('')}</select></label>
  </div></header>
  <div class="team"><div class="wrap"><span class="crest">${S.brand.logo?`<img src="${esc(S.brand.logo)}" alt="">`:esc(S.brand.crest||initials(S.brand.name))}</span><div><b>${esc(S.brand.name)} ${esc(S.brand.mascot)}</b><span class="sub">Men's basketball · ${PHASES[S.phase].label}</span></div></div></div>
  <nav class="tabs" aria-label="Sections"><div class="wrap">${NAV[r.t].map(([v,l])=>`<button data-a="go" data-v="${v}" ${cur===v?'aria-current="page"':''}>${l}</button>`).join('')}</div></nav>
  <main><div class="wrap">${VIEWS[U.view]()}</div></main>
  <footer><div class="wrap"><button class="link small" data-a="intro">About this sample</button> · ${esc(CFG.foot)} Hour limits are a planning aid; confirm them with your compliance office.</div></footer>`;
  if(U.view==='assign')assignPreview();
}
function go(v,pid){U={view:v,pid:pid||null,pre:U.pre};render();window.scrollTo(0,0)}
const commit=()=>{save();render()};

const A={
  go:el=>{U.pre=null;go(el.dataset.v)},
  player:el=>go('player',el.dataset.id),
  assignFor:el=>{U.pre=el.dataset.id;go('assign')},
  plan:el=>{log(MED,el.dataset.id,'Viewed plan');save();go('plan',el.dataset.id)},
  rm:el=>{S.items=S.items.filter(i=>i.id!==el.dataset.id);S.logs=S.logs.filter(l=>l.i!==el.dataset.id);commit()},
  unfocus:el=>{P(U.pid)[el.dataset.k].splice(+el.dataset.i,1);commit()},
  tog:el=>{const it=S.items.find(i=>i.id===el.dataset.id),has=l=>l.i===it.id&&(it.cad==='once'||l.d===T);
    if(S.logs.some(has))S.logs=S.logs.filter(l=>!has(l));else S.logs.push({i:it.id,d:T});commit()},
  plus:el=>{S.logs.push({i:el.dataset.id,d:T});commit()},
  minus:el=>{const k=S.logs.map(l=>l.i===el.dataset.id&&WEEK.includes(l.d)).lastIndexOf(true);if(k>=0)S.logs.splice(k,1);commit()},
  sw:el=>{const b=S.body[S.role.pid],k=el.dataset.k;b[k]=!b[k];if(k==='optIn'&&!b.optIn)b.share=false;commit()},
  tpl:el=>{const t=TEMPLATES[+el.dataset.i],f=document.getElementById('assignForm');for(const k of['title','cat','cad','n','unit','min'])f.elements[k].value=t[k];assignPreview()},
  all:()=>{document.querySelectorAll('#assignForm [name=pid]').forEach(c=>c.checked=true);assignPreview()},
  reset:()=>{S=seed();S.seen=true;S.tips=false;U={view:'board',pid:null};commit()},
  intro:()=>go('intro'),
  notips:()=>{S.tips=false;commit()},
  print:()=>window.print(),
  enter:el=>{const v=el.dataset.r;S.role=v.startsWith('player:')?{t:'player',pid:v.slice(7)}:{t:v};S.seen=true;save();U.pre=null;go(NAV[S.role.t][0][0])},
  unpin:el=>{P(U.pid).pins.splice(+el.dataset.i,1);commit()},
  rmLogo:()=>{S.brand.logo='';commit()},
  court:(el,e)=>{const sel=document.querySelector('[data-f=pin] [name=z]');if(!sel)return;
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*508-4,y=(e.clientY-r.top)/r.height*478-4;
    let best,bd=Infinity;for(const[k,z]of Object.entries(ZONES)){const d=(z[1]-x)**2+(z[2]-y)**2;if(d<bd){bd=d;best=k}}
    sel.value=best;document.querySelector('[data-f=pin] [name=t]').focus()}
};
const F={
  assign:d=>{const pids=d.getAll('pid');if(!pids.length){document.getElementById('assignPreview').innerHTML='<p class="note bad">Pick at least one player.</p>';return false}
    for(const pid of pids)S.items.push({id:'i'+(S.nid++),pid,title:d.get('title').trim(),cat:d.get('cat'),kind:d.get('kind'),cad:d.get('cad'),n:Math.max(1,+d.get('n')||1),unit:d.get('unit'),min:Math.max(0,+d.get('min')||0),due:d.get('due')||T,owner:d.get('owner')});
    save();go(pids.length===1?'player':'board',pids.length===1?pids[0]:null);return false},
  focus:(d,el)=>{P(U.pid)[el.dataset.k].push(d.get('text').trim())},
  pin:d=>{const p=P(U.pid),z=d.get('z');p.pins=p.pins.filter(x=>x.z!==z);p.pins.push({z,t:d.get('t').trim()})},
  brand:d=>{if(d.get('name').trim()!==S.brand.name)S.brand.crest='';S.brand.name=d.get('name').trim();S.brand.mascot=d.get('mascot').trim();const c=d.get('color');if(/^#[0-9a-f]{6}$/i.test(c))S.brand.color=c},
  meet:(d,el)=>{S.meetings.push({pid:el.dataset.id,d:T,type:d.get('type'),by:COACH,text:d.get('text').trim()})},
  note:(d,el)=>{S.notes.push({pid:el.dataset.id,d:T,from:COACH,text:d.get('text').trim()})},
  refer:(d,el)=>{S.referrals.unshift({id:'r'+(S.nid++),pid:el.dataset.id,from:COACH,d:T,status:'open',reply:'',text:d.get('text').trim()})},
  settings:d=>{S.phase=d.get('phase');S.dayOff=+d.get('dayOff');S.team[S.phase]=Math.max(0,+d.get('team')||0)},
  entry:(d,el)=>{S.body[el.dataset.id].entries.push({d:T,w:+d.get('w')});log(MED,el.dataset.id,'Recorded a weigh-in')},
  plan:(d,el)=>{const b=S.body[el.dataset.id],lo=+d.get('lo'),hi=+d.get('hi');Object.assign(b,{goal:d.get('goal'),lo:Math.min(lo,hi),hi:Math.max(lo,hi),status:d.get('status').trim()});log(MED,el.dataset.id,'Updated plan')},
  reply:(d,el)=>{const r=S.referrals.find(x=>x.id===el.dataset.id);r.reply=d.get('text').trim();r.status='answered'}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn){console.error('No action: '+el.dataset.a);return}fn(el,e)});
document.addEventListener('submit',e=>{const el=e.target.closest('[data-f]');if(!el)return;e.preventDefault();
  const fn=F[el.dataset.f];if(!fn){console.error('No form handler: '+el.dataset.f);return}
  if(fn(new FormData(el),el)!==false)commit()});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-c=role]')){const v=e.target.value;
    S.role=v.startsWith('player:')?{t:'player',pid:v.slice(7)}:{t:v};save();U.pre=null;go(NAV[S.role.t][0][0]);return}
  if(e.target.closest('#assignForm'))assignPreview();
  if(e.target.name==='logo'&&e.target.files[0]){const f=e.target.files[0],msg=document.getElementById('logoMsg');
    if(!f.type.startsWith('image/')||f.size>300*1024){msg.textContent='That file is not an image under 300 KB.';e.target.value='';return}
    const rd=new FileReader();rd.onload=()=>{S.brand.logo=rd.result;commit()};rd.readAsDataURL(f);return}
  // changing phase in settings shows that phase's team hours before saving
  if(e.target.name==='phase'&&e.target.form?.dataset.f==='settings')e.target.form.elements.team.value=S.team[e.target.value];
});
document.addEventListener('input',e=>{if(e.target.closest('#assignForm'))assignPreview()});
// ?as=coach|player|med opens straight into that seat and skips the intro
const AS=new URLSearchParams(location.search).get('as');
if(AS==='coach'||AS==='med'||AS==='player'){S.role=AS==='player'?{t:'player',pid:'p1'}:{t:AS};S.seen=true;save()}
U.view=S.seen?NAV[S.role.t][0][0]:'intro';
render();
</script>
</body>
</html>
