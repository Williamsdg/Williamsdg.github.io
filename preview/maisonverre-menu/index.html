<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Maison Verre — Menu</title>
<meta name="theme-color" content="#070b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
    --gold:#d4af37;--gold-soft:#b8941f;--gold-glow:rgba(212,175,55,0.18);
    --primary:#7c1d3a;--green:#34d399;--red:#f87171;
    --bg:#070b1a;
    --canvas:radial-gradient(1200px 800px at 90% -20%, rgba(124,29,58,0.18), transparent 60%), radial-gradient(900px 700px at -10% 100%, rgba(212,175,55,0.06), transparent 70%), #070b1a;
    --surface:rgba(255,255,255,0.04);
    --text:#f1f3f9;--text-soft:#c8cfdb;--text-mute:#7a86a0;
    --border:rgba(255,255,255,0.10);--border-soft:rgba(255,255,255,0.06);
    --serif:'Fraunces',Georgia,serif;
}
html,body{background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas) fixed;color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}
::selection{background:var(--gold-glow);color:var(--text)}
.wrap{max-width:780px;margin:0 auto;padding:48px 20px 64px}
.hero{text-align:center;margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.hero .eye{font-size:.7rem;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:3px;display:inline-flex;align-items:center;gap:14px}
.hero .eye::before,.hero .eye::after{content:'';width:24px;height:1px;background:var(--gold);opacity:0.6}
.hero h1{font-family:var(--serif);font-weight:300;font-size:3rem;margin-top:18px;letter-spacing:-0.02em;color:var(--text);line-height:1.05}
.hero h1 em{font-style:italic;color:var(--gold);font-weight:400}
.hero p{font-size:.92rem;color:var(--text-soft);margin-top:14px;letter-spacing:0.005em;font-style:italic}
.allergen-filter{margin:28px 0 14px;padding:14px 18px;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px}
.allergen-filter h3{font-size:.66rem;color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:10px}
.allergen-pills{display:flex;gap:6px;flex-wrap:wrap}
.allergen-pill{background:rgba(255,255,255,0.04);border:1px solid var(--border-soft);color:var(--text-soft);font-family:inherit;font-size:.74rem;font-weight:600;padding:5px 12px;border-radius:50px;cursor:pointer;transition:all .2s;text-transform:capitalize}
.allergen-pill:hover{border-color:var(--gold);color:var(--gold)}
.allergen-pill.active{background:rgba(248,113,113,0.14);border-color:var(--red);color:var(--red)}
.section{margin-bottom:36px}
.section h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;color:var(--gold);letter-spacing:-0.01em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border-soft);text-transform:capitalize}
.item{display:grid;grid-template-columns:1fr auto;gap:24px;padding:14px 0;border-bottom:1px solid var(--border-soft)}
.item:last-child{border-bottom:none}
.item.is-86{opacity:0.4}
.item.allergen-warn{opacity:0.5;background:rgba(248,113,113,0.04);border-radius:8px;padding:14px}
.item-name{font-family:var(--serif);font-weight:500;font-size:1.18rem;color:var(--text);letter-spacing:-0.005em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-name .badge-86{background:rgba(248,113,113,0.18);color:var(--red);font-size:.62rem;padding:2px 8px;border-radius:50px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;border:1px solid rgba(248,113,113,0.3)}
.item-name .badge-feat{background:var(--gold-glow);color:var(--gold);font-size:.62rem;padding:2px 8px;border-radius:50px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;border:1px solid rgba(212,175,55,0.3)}
.item-desc{font-size:.85rem;color:var(--text-mute);margin-top:4px;line-height:1.55;font-style:italic}
.item-allergens{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.item-allergen{font-size:.66rem;color:var(--red);background:rgba(248,113,113,0.10);border:1px solid rgba(248,113,113,0.25);padding:2px 8px;border-radius:50px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.item-price{font-family:var(--serif);font-size:1.15rem;font-weight:500;color:var(--gold);letter-spacing:-0.005em;align-self:start}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:10px;font-weight:600;font-size:.9rem;letter-spacing:0.02em;font-family:inherit;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:all .25s}
.btn-gold{background:linear-gradient(135deg, var(--gold), var(--gold-soft));color:#070b1a;border-color:rgba(255,255,255,0.18);font-weight:700}
.btn-outline{background:rgba(255,255,255,0.04);color:var(--text-soft);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.footer{text-align:center;font-size:.7rem;color:var(--text-mute);margin-top:32px;letter-spacing:0.04em;text-transform:uppercase;font-weight:500}
.footer a{color:var(--gold);text-decoration:none;letter-spacing:0.02em;text-transform:none;font-weight:600}
@media(max-width:560px){.wrap{padding:32px 16px 48px}.hero h1{font-size:2.2rem}.cta-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
    <div class="hero">
        <div class="eye">Maison Verre</div>
        <h1>The <em>menu</em>, tonight.</h1>
        <p>Modern French bistro · Wine-forward · Classics done right.</p>
    </div>

    <div class="allergen-filter">
        <h3>Hide dishes containing</h3>
        <div class="allergen-pills" id="allergenPills"></div>
    </div>

    <div id="menuList"></div>

    <div class="cta-row">
        <a class="btn btn-gold" href="../maisonverre-reserve/">Reserve a Table →</a>
        <a class="btn btn-outline" href="tel:2055558466">Call (205) 555-VINO</a>
    </div>

    <div class="footer">Powered by <a href="https://williamsdigital.io">Williams Digital</a></div>
</div>

<script>
const STORAGE_KEY='wd-dash-maisonverre';
const FALLBACK_MENU=[
    {id:'m1',cat:'Apéritif',name:'Oysters (6)',price:24,allergens:['shellfish'],is86:false,featured:false,desc:'East Coast selection, mignonette, lemon'},
    {id:'m2',cat:'Apéritif',name:'Gougères (4)',price:9,allergens:['gluten','dairy','eggs'],is86:false,featured:false,desc:'Gruyère cheese puffs'},
    {id:'m3',cat:'Apéritif',name:'Pissaladière (slice)',price:11,allergens:['gluten','fish'],is86:false,featured:false,desc:'Caramelized onion, anchovy, niçoise olives'},
    {id:'m4',cat:'1st Course',name:'Escargots de Bourgogne',price:18,allergens:['gluten','dairy','shellfish'],is86:false,featured:true,desc:'Garlic-parsley butter, baguette'},
    {id:'m5',cat:'1st Course',name:'Frisée aux Lardons',price:16,allergens:['eggs','pork'],is86:false,featured:false,desc:'Bacon, poached egg, mustard vinaigrette'},
    {id:'m6',cat:'1st Course',name:'Pâté en Croûte',price:21,allergens:['gluten','dairy','eggs'],is86:false,featured:false,desc:'Pork & duck, Dijon, cornichons'},
    {id:'m7',cat:'1st Course',name:'Crudo of the Day',price:24,allergens:['fish'],is86:false,featured:false,desc:'Ask your server'},
    {id:'m8',cat:'1st Course',name:'Foie Gras Torchon',price:32,allergens:['gluten'],is86:false,featured:false,desc:'Brioche, cherries, fleur de sel'},
    {id:'m9',cat:'2nd Course',name:'French Onion Soup',price:18,allergens:['gluten','dairy'],is86:false,featured:false,desc:'Comté, sourdough crouton'},
    {id:'m10',cat:'2nd Course',name:'Burrata, Peach & Prosciutto',price:22,allergens:['dairy','pork'],is86:false,featured:false,desc:'Honey, basil, balsamic'},
    {id:'m11',cat:'2nd Course',name:'Steak Tartare',price:26,allergens:['eggs'],is86:false,featured:false,desc:'Filet, capers, frites'},
    {id:'m12',cat:'2nd Course',name:'Bouillabaisse',price:38,allergens:['shellfish','fish'],is86:false,featured:false,desc:'Saffron, rouille, baguette'},
    {id:'m13',cat:'Mains',name:'Steak Frites',price:42,allergens:[],is86:false,featured:true,desc:'10oz hangar, béarnaise, frites'},
    {id:'m14',cat:'Mains',name:'Sole Meunière',price:48,allergens:['fish','dairy'],is86:false,featured:true,desc:'Brown butter, capers, lemon'},
    {id:'m15',cat:'Mains',name:'Coq au Vin',price:38,allergens:['dairy'],is86:false,featured:false,desc:'Burgundy, mushrooms, lardons'},
    {id:'m16',cat:'Mains',name:'Lamb Navarin',price:44,allergens:[],is86:false,featured:false,desc:'Spring vegetables, fines herbes'},
    {id:'m17',cat:'Mains',name:'Cassoulet',price:36,allergens:['gluten','pork'],is86:true,featured:false,desc:'Duck confit, sausage, white beans'},
    {id:'m18',cat:'Mains',name:'Vegetable Velouté',price:28,allergens:['dairy'],is86:false,featured:false,desc:'Seasonal vegetables, herb oil'},
    {id:'m19',cat:'Cheese',name:'Plateau de Fromages',price:24,allergens:['dairy'],is86:false,featured:false,desc:'Five French cheeses, fig jam, walnuts'},
    {id:'m20',cat:'Dessert',name:'Crème Brûlée',price:12,allergens:['dairy','eggs'],is86:false,featured:true,desc:'Madagascar vanilla'},
    {id:'m21',cat:'Dessert',name:'Tarte Tatin',price:14,allergens:['gluten','dairy','eggs'],is86:false,featured:false,desc:'Caramelized apples, crème fraîche'},
    {id:'m22',cat:'Dessert',name:'Mousse au Chocolat',price:13,allergens:['dairy','eggs'],is86:false,featured:false,desc:'70% Valrhona, sea salt'},
    {id:'m23',cat:'Dessert',name:'Cheese Soufflé',price:16,allergens:['dairy','eggs','gluten'],is86:true,featured:false,desc:'18-min wait. Worth it.'},
];
let menu=FALLBACK_MENU;
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(d.menu&&d.menu.length)menu=d.menu}}catch(e){}
const FMT=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const fmt=v=>FMT.format(v||0);
const allergens=[...new Set(menu.flatMap(m=>m.allergens||[]))].sort();
let hidden=new Set();

function renderPills(){document.getElementById('allergenPills').innerHTML=allergens.map(a=>`<button class="allergen-pill ${hidden.has(a)?'active':''}" onclick="toggleAllergen('${a}')">${a}</button>`).join('')}
function toggleAllergen(a){if(hidden.has(a))hidden.delete(a);else hidden.add(a);renderPills();renderMenu()}

function renderMenu(){
    const order=['Apéritif','1st Course','2nd Course','Mains','Cheese','Dessert'];
    const grouped={};
    menu.forEach(m=>{(grouped[m.cat]=grouped[m.cat]||[]).push(m)});
    document.getElementById('menuList').innerHTML=order.filter(c=>grouped[c]).map(cat=>{
        const items=grouped[cat].map(m=>{
            const hasHidden=(m.allergens||[]).some(a=>hidden.has(a));
            const cls=[m.is86?'is-86':'',hasHidden?'allergen-warn':''].filter(Boolean).join(' ');
            const badges=[m.is86?'<span class="badge-86">86\'d</span>':'',m.featured?'<span class="badge-feat">Chef\'s pick</span>':''].join('');
            const al=(m.allergens||[]).length?'<div class="item-allergens">'+m.allergens.map(x=>`<span class="item-allergen">${x}</span>`).join('')+'</div>':'';
            return `<div class="item ${cls}"><div><div class="item-name">${m.name} ${badges}</div><div class="item-desc">${m.desc||''}</div>${al}</div><div class="item-price">${fmt(m.price)}</div></div>`;
        }).join('');
        return `<div class="section"><h2>${cat}</h2>${items}</div>`;
    }).join('');
}
renderPills();renderMenu();
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){try{const d=JSON.parse(e.newValue);if(d.menu&&d.menu.length){menu=d.menu;renderMenu()}}catch(err){}}});
</script>
</body>
</html>
