<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Project Status · Williams Digital</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='50%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-weight='800' font-size='14' fill='white' text-anchor='middle'%3EWD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070710;--card:rgba(255,255,255,.03);--text:#fff;--soft:#a1a1aa;--mute:#71717a;
  --indigo:#6366f1;--purple:#8b5cf6;--cyan:#06b6d4;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);--ok:#4ade80}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 45% at 20% 0%,rgba(99,102,241,.13),transparent 60%),radial-gradient(50% 40% at 95% 10%,rgba(6,182,212,.09),transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:3.5rem 1.5rem 5rem}
.logo{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:.95rem;margin-bottom:2.5rem}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--grad);display:grid;place-items:center;font-size:.74rem;font-weight:800;box-shadow:0 0 26px rgba(99,102,241,.35)}
.eye{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin:.7rem 0 .4rem}
.sub{color:var(--soft);font-size:1rem}
.pctcard{margin-top:2.2rem;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:1.6rem}
.pctrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.9rem}
.pctnum{font-size:2.4rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.pctlbl{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--mute);letter-spacing:.05em}
.pbar{height:10px;background:rgba(255,255,255,.06);border-radius:20px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--grad);border-radius:20px;transition:width 1s cubic-bezier(.16,1,.3,1);box-shadow:0 0 16px rgba(99,102,241,.5)}
.stages{margin-top:2rem;display:grid;gap:.55rem}
.stage{display:flex;align-items:center;gap:.9rem;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:.85rem 1.05rem;transition:all .3s}
.stage .mark{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--bd2);display:grid;place-items:center;font-size:.8rem;transition:all .3s}
.stage.done{border-color:rgba(74,222,128,.28)}
.stage.done .mark{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.5);color:var(--ok)}
.stage.current{border-color:var(--purple);background:rgba(139,92,246,.08)}
.stage.current .mark{background:var(--grad);border-color:transparent;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.5)}50%{box-shadow:0 0 0 6px rgba(139,92,246,0)}}
.stage .txt{font-size:.95rem;font-weight:500}
.stage.done .txt{color:var(--soft)}
.stage.pending .txt{color:var(--mute)}
.stage .badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.note{margin-top:1.8rem;background:rgba(6,182,212,.05);border:1px solid rgba(6,182,212,.16);border-radius:14px;padding:1.1rem 1.3rem;color:var(--soft);font-size:.92rem}
.note b{color:var(--text)}
.meta{margin-top:2rem;font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.meta b{color:var(--soft)}
.foot{margin-top:2.5rem;text-align:center;font-size:.85rem;color:var(--mute)}
.foot a{color:var(--cyan);text-decoration:none}
.state{text-align:center;padding:4rem 1rem;color:var(--soft)}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--purple);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 1rem}
@keyframes sp{to{transform:rotate(360deg)}}
.preview-flag{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:60;font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--mute);background:rgba(7,7,16,.9);border:1px solid var(--bd);border-radius:20px;padding:.35rem .9rem}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="state"><div class="spin"></div>Loading your project…</div>
</div>
<div class="preview-flag">Preview · Project status</div>

<script>
const SUPABASE_URL="https://tkkhvbkocumyxpgsrpxv.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRra2h2YmtvY3VteXhwZ3NycHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NjYyNDAsImV4cCI6MjA5NzI0MjI0MH0.piSMSUJ427thN_sjCfgOp9lbnUsWGmYqQPRMlglfd6E";
const wrap=document.getElementById('wrap');
const id=new URLSearchParams(location.search).get('id');

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function load(){
  if(!id){ wrap.innerHTML=`<div class="state">No project link provided. Please use the personalized link from your intake confirmation.</div>`; return; }
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/project_status?submission_id=eq.${id}&select=*`,{
      headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`}
    });
    const rows=await res.json();
    if(!rows.length){ wrap.innerHTML=`<div class="state">We couldn't find that project yet. If you just submitted your questionnaire, give it a minute and refresh.</div>`; return; }
    render(rows[0]);
  }catch(e){
    wrap.innerHTML=`<div class="state">Couldn't load your project. Please try again shortly.</div>`;
  }
}

function render(p){
  const stages=p.stages||[];
  const doneCount=stages.filter(s=>s.done).length;
  const pct=stages.length? Math.round(doneCount/stages.length*100):0;
  const currentIdx=stages.findIndex(s=>!s.done);

  const stageHTML=stages.map((s,i)=>{
    let cls='pending',mark='',badge='';
    if(s.done){cls='done';mark='✓';}
    else if(i===currentIdx){cls='current';mark='●';badge='<span class="badge">In progress</span>';}
    return `<div class="stage ${cls}"><span class="mark">${mark}</span><span class="txt">${esc(s.label)}</span>${badge}</div>`;
  }).join('');

  const updated=p.updated_at? new Date(p.updated_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';

  wrap.innerHTML=`
    <div class="logo"><span class="logo-mark">WD</span> Williams Digital</div>
    <span class="eye">Project Status</span>
    <h1>${esc(p.project_name||'Your Project')}</h1>
    <div class="sub">Here's exactly where things stand — no need to ask.</div>

    <div class="pctcard">
      <div class="pctrow"><span class="pctnum">${pct}%</span><span class="pctlbl">${doneCount} of ${stages.length} stages complete</span></div>
      <div class="pbar"><i id="pbar"></i></div>
    </div>

    <div class="stages">${stageHTML}</div>

    ${p.public_note?`<div class="note"><b>From your team:</b> ${esc(p.public_note)}</div>`:''}

    <div class="meta">
      <span>Est. timeline <b>${esc(p.timeline_note||'2–4 weeks')}</b></span>
      <span>Last updated <b>${updated}</b></span>
    </div>

    <div class="foot">Questions? Email <a href="mailto:Dylan@williamsdigital.io">Dylan@williamsdigital.io</a></div>
  `;
  requestAnimationFrame(()=>{ setTimeout(()=>{ document.getElementById('pbar').style.width=pct+'%'; },120); });
}
load();
</script>
</body>
</html>
