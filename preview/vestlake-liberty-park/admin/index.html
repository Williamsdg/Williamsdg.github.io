<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vestlake Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F4434'/%3E%3Ctext x='16' y='22' font-family='serif' font-weight='800' font-size='14' fill='%23B8924A' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ===== Login ===== -->
<div id="loginView" class="login-wrap" hidden>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-bar"></span>
      <div><div class="brand-name">VESTLAKE</div><div class="brand-sub">AT LIBERTY PARK &middot; ADMIN</div></div>
    </div>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
      <p class="form-error" id="loginError" hidden></p>
      <button type="submit" class="btn btn-gold btn-block" id="loginBtn">Sign In</button>
    </form>
    <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
    <p class="field-hint" id="connStatus" style="margin-top:14px;"></p>
  </div>
</div>

<!-- ===== Set new password (after recovery link) ===== -->
<div id="recoveryView" class="login-wrap" hidden>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-bar"></span>
      <div><div class="brand-name">VESTLAKE</div><div class="brand-sub">SET A NEW PASSWORD</div></div>
    </div>
    <form id="recoveryForm">
      <label for="newPassword">New password (10+ characters)</label>
      <input type="password" id="newPassword" autocomplete="new-password" minlength="10" required>
      <p class="form-error" id="recoveryError" hidden></p>
      <button type="submit" class="btn btn-gold btn-block">Save Password</button>
    </form>
  </div>
</div>

<!-- ===== App shell ===== -->
<div id="appView" class="app" hidden>
  <header class="topbar">
    <button class="menu-btn" id="sidebarToggle" type="button" aria-label="Menu" aria-expanded="false">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h16M3 5h16M3 17h16"/></svg>
    </button>
    <div class="topbar-brand"><span class="brand-bar"></span> VESTLAKE ADMIN</div>
    <span class="topbar-user" id="whoami"></span>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar">
      <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#/events" data-nav="events">Calendar Events</a>
      <a href="#/newsletters" data-nav="newsletters">Newsletters</a>
      <a href="#/staff" data-nav="staff" id="staffNav" hidden>Staff Accounts</a>
      <a href="../" target="_blank" rel="noopener">View Website ↗</a>
      <button type="button" class="link-btn signout" id="signOutBtn">Sign Out</button>
    </nav>

    <main class="content" id="content" tabindex="-1"><!-- views render here --></main>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vl-client.js"></script>
<script src="admin.js"></script>
<script>
// If the app failed to boot (script blocked, old browser), say so instead of a dead page.
setTimeout(function () {
  if (document.getElementById('loginView').hidden && document.getElementById('appView').hidden && document.getElementById('recoveryView').hidden) {
    document.body.insertAdjacentHTML('afterbegin',
      '<p style="background:#B43F3F;color:#fff;padding:14px 20px;font-family:sans-serif;margin:0;">The admin app could not load. If you use an ad-blocker or privacy extension, allow this site and refresh.</p>');
  }
}, 4000);
</script>
</body>
</html>
