<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hoover Sun</title>
<meta name="description" content="Local news, schools, sports, business, events and people from Hoover, Alabama. Concept redesign preview.">
<meta name="theme-color" content="#8e2a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a19'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial' font-weight='900' font-size='44' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3Ccircle cx='49' cy='16' r='7' fill='%23e9a23b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1">
</head>
<body data-page="section">
<div id="chrome"></div>
<main id="main" class="wrap"></main>
<div id="foot"></div>
<script src="assets/seed.js?v=1"></script>
<script src="assets/store.js?v=1"></script>
<script src="assets/site.js?v=1"></script>
<script>
(function(){
  var H=HS,T=H.T,e=H.esc;
  var q=new URLSearchParams(location.search), s=q.get('s')||'', sub=q.get('sub')||'', term=(q.get('q')||'').trim(), shown=12;
  var BLURB={news:'City Hall, public safety, development and the stories shaping Hoover.',business:'Openings, closings, real estate and the people behind Hoover businesses.',schools:'Hoover City Schools and the private schools in our neighborhoods.',sports:'Hoover Bucs, Spain Park Jags and everything in between.',people:'Neighbors, milestones and celebrations from around Hoover.',opinion:'Columns from our editors, the mayor and community voices.',sponsored:'Partner content from local businesses.'};
  function render(){
    var pub=H.published(), title, list;
    if(term){
      var t=term.toLowerCase();
      list=pub.filter(function(a){ return (a.title+' '+a.dek+' '+a.author+' '+(a.body||[]).map(function(b){return b[1];}).join(' ')+' '+(a.html||'')).toLowerCase().indexOf(t)>=0; });
      title='Search: “'+e(term)+'”';
      document.title='Search · Hoover Sun';
    } else {
      list=pub.filter(function(a){return !s||a.section===s;});
      if(sub) list=list.filter(function(a){return a.subsection===sub||(sub==='Hoover'&&/Bucs/.test(a.title))||(sub==='Spain Park'&&/Jags|Spain Park/.test(a.title));});
      title=e(sub||H.sectionName(s)||'All stories');
      document.title=(sub||H.sectionName(s)||'Stories')+' · Hoover Sun';
    }
    var sec=H.SECTIONS.filter(function(x){return x.key===s;})[0];
    var chips=sec&&sec.subs?'<div class="schools-chips"><a class="chip '+(!sub?'on':'')+'" href="section.html?s='+s+'">All '+e(sec.name)+'</a>'+sec.subs.map(function(x){return '<a class="chip '+(sub===x?'on':'')+'" href="section.html?s='+s+'&sub='+encodeURIComponent(x)+'">'+e(x)+'</a>';}).join('')+'</div>':'';
    var html='<header class="sec-head"><span class="kicker">'+(term?list.length+' result'+(list.length===1?'':'s'):'Section')+'</span><h1>'+title+'</h1>'+(term?'':'<p>'+(BLURB[s]||'')+'</p>')+chips+'</header>';
    if(!list.length){
      html+='<div class="empty"><p>'+(term?'Nothing matched that search yet.':'No stories here yet. Check back soon.')+'</p><p style="margin-top:16px"><a class="btn" href="index.html">Front page</a></p></div>';
    } else {
      var lead=list[0], rest=list.slice(1,shown);
      html+='<a class="sec-lead" href="'+T.href(lead)+'">'+(lead.image?T.img(lead):'<div></div>')+'<div>'+T.kick(lead)+'<h2 class="hl">'+e(lead.title)+'</h2><p class="dek">'+e(lead.dek)+'</p>'+T.meta(lead)+'</div></a>';
      html+='<div class="card-grid sec-grid">'+rest.map(T.card).join('')+'</div>';
      if(list.length>shown) html+='<div class="loadmore"><button class="btn" id="more">Load more stories</button></div>'; else html+='<div style="height:60px"></div>';
    }
    document.getElementById('main').innerHTML=html;
    var m=document.getElementById('more'); if(m) m.onclick=function(){ shown+=12; render(); };
    H.hydrate();
  }
  render(); H.live(render);
})();
</script>

</body>
</html>
