<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Submit to the Sun · Hoover Sun</title>
<meta name="description" content="Local news, schools, sports, business, events and people from Hoover, Alabama. Concept redesign preview.">
<meta name="theme-color" content="#8e2a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a19'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial' font-weight='900' font-size='44' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3Ccircle cx='49' cy='16' r='7' fill='%23e9a23b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1">
</head>
<body data-page="submit">
<div id="chrome"></div>
<main class="wrap" id="main" style="max-width:860px">
  <header class="sec-head"><span class="kicker">Reader desk</span><h1>Send it to the Sun</h1><p>Everything here lands straight in the newsroom’s inbox. No email chains and nothing lost in a spam folder.</p></header>
  <div class="tabs" id="tabs">
    <button class="chip" data-t="tip">Story tip</button><button class="chip" data-t="event">Event</button><button class="chip" data-t="celebration">Celebration</button><button class="chip" data-t="correction">Correction</button><button class="chip" data-t="letter">Letter to the editor</button>
  </div>
  <form class="form-card" id="f" novalidate style="margin-bottom:60px"></form>
</main>
<div id="foot"></div>
<script src="assets/seed.js?v=1"></script>
<script src="assets/store.js?v=1"></script>
<script src="assets/site.js?v=1"></script>
<script>
(function(){
  var H=HS,e=H.esc, q=new URLSearchParams(location.search), type=q.get('type')||'tip', photo=null;
  var F={
    tip:{h:'What should we look into?',fields:'<div class="field"><label for="subject">Headline or topic</label><input id="subject" required placeholder="e.g. New restaurant going in on Lorna Road"></div><div class="field"><label for="message">Details</label><textarea id="message" required placeholder="What you know, who we should talk to, when it happened."></textarea></div>'},
    event:{h:'Add an event to the calendar',fields:'<div class="field"><label for="subject">Event name</label><input id="subject" required></div><div class="row2"><div class="field"><label for="date">Date</label><input id="date" type="date" required></div><div class="field"><label for="time">Time</label><input id="time" placeholder="e.g. 10 a.m. to 2 p.m."></div></div><div class="field"><label for="where">Location</label><input id="where" required placeholder="Venue and address in Hoover"></div><div class="row2"><div class="field"><label for="cost">Cost</label><input id="cost" placeholder="Free, $10, etc."></div><div class="field"><label for="link">Website</label><input id="link" placeholder="example.com"></div></div><div class="field"><label for="message">Description</label><textarea id="message" required></textarea></div>'+'PHOTO'},
    celebration:{h:'Share a celebration',fields:'<div class="field"><label for="kind">Type</label><select id="kind"><option>Birth</option><option>Engagement</option><option>Wedding</option><option>Anniversary</option><option>Milestone birthday</option><option>Achievement</option></select></div><div class="field"><label for="subject">Who are we celebrating?</label><input id="subject" required></div><div class="field"><label for="message">Announcement text</label><textarea id="message" required placeholder="Write it the way you’d like it to appear."></textarea><span class="hint">Celebrations run free online and in print as space allows.</span></div>PHOTO'},
    correction:{h:'Report an error',fields:'<div class="field"><label for="subject">Which story?</label><input id="subject" required></div><div class="field"><label for="message">What needs fixing?</label><textarea id="message" required></textarea></div>'},
    letter:{h:'Write to the editor',fields:'<div class="field"><label for="subject">Subject</label><input id="subject" required></div><div class="field"><label for="message">Your letter</label><textarea id="message" required style="min-height:200px"></textarea><span class="hint">Letters under 400 words. Include your neighborhood for publication.</span></div>'}
  };
  var PHOTO='<div class="field"><label>Photo <span style="font-weight:400;color:var(--mute)">(optional)</span></label><div class="drop" id="drop" tabindex="0" role="button">Drag a photo here or <b style="color:var(--maroon)">browse</b><input type="file" accept="image/*" id="file" hidden></div></div>';
  function draw(){
    photo=null;
    document.querySelectorAll('[data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===type);});
    var f=F[type];
    document.getElementById('f').innerHTML='<h2 class="hl" style="font-size:26px;margin-bottom:18px">'+f.h+'</h2>'+f.fields.replace('PHOTO',PHOTO)+
      '<div class="row2"><div class="field"><label for="name">Your name</label><input id="name" required autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div></div>'+
      '<button class="btn solid" type="submit" style="margin-top:6px">Send to the newsroom</button>';
    var story=q.get('story'); if(type==='correction'&&story){ var a=H.read('articles').filter(function(x){return x.slug===story;})[0]; if(a) document.getElementById('subject').value=a.title; }
    var drop=document.getElementById('drop');
    if(drop){
      var file=document.getElementById('file');
      drop.onclick=function(){file.click();}; drop.onkeydown=function(k){ if(k.key==='Enter'||k.key===' ') file.click(); };
      file.onchange=function(){ if(file.files[0]) take(file.files[0]); };
      ['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(x){x.preventDefault();drop.classList.add('over');});});
      ['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(x){x.preventDefault();drop.classList.remove('over');});});
      drop.addEventListener('drop',function(x){ if(x.dataTransfer.files[0]) take(x.dataTransfer.files[0]); });
    }
    function take(fl){ drop.innerHTML='Processing…'; H.processImage(fl,1600).then(function(r){ var id=H.uid('m'); return H.putBlob(id,r.blob).then(function(){ photo='idb:'+id; return H.blobURL(id); }); }).then(function(u){ drop.innerHTML='<img src="'+u+'" alt="">'+e(fl.name)+' · <b style="color:var(--maroon)">change</b><input type="file" accept="image/*" id="file" hidden>'; var nf=document.getElementById('file'); nf.onchange=function(){ if(nf.files[0]) take(nf.files[0]); }; }).catch(function(err){ drop.textContent=err.message; }); }
  }
  document.getElementById('tabs').onclick=function(x){ var b=x.target.closest('[data-t]'); if(!b) return; type=b.dataset.t; history.replaceState(null,'','?type='+type); draw(); };
  document.getElementById('f').onsubmit=function(x){
    x.preventDefault();
    var bad=[].slice.call(this.querySelectorAll('[required]')).filter(function(i){return !i.value.trim()||(i.type==='email'&&!/^\S+@\S+\.\S+$/.test(i.value));});
    this.querySelectorAll('input,textarea').forEach(function(i){i.style.borderColor='';});
    if(bad.length){ bad.forEach(function(i){i.style.borderColor='#c0392b';}); bad[0].focus(); H.toast('Please fill in the highlighted fields'); return; }
    function v(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
    var s={id:H.uid('s'),type:type,name:v('name'),email:v('email'),created:new Date().toISOString(),subject:v('subject'),message:v('message'),photo:photo,status:'new'};
    if(type==='celebration') s.kind=v('kind');
    if(type==='event'){ var d=new Date(v('date')+'T12:00'); s.event={title:v('subject'),date:v('date'),when:d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})+(v('time')?', '+v('time'):''),where:v('where'),cost:v('cost'),link:v('link'),details:v('message'),image:photo}; }
    var all=H.read('submissions'); all.unshift(s); H.write('submissions',all);
    H.log('New '+type+' submission',s.subject,s.name);
    document.getElementById('f').innerHTML='<div style="text-align:center;padding:30px 0"><div style="width:64px;height:64px;border-radius:50%;background:#e8f4ea;color:#2a7a3b;display:grid;place-items:center;margin:0 auto 16px;font-size:30px">✓</div><h2 class="hl" style="font-size:28px">Got it. Thank you!</h2><p style="color:var(--mute);margin:10px auto 22px;max-width:460px">Your '+e(type==='tip'?'tip':type)+' is in the Hoover Sun newsroom inbox now.'+(type==='event'?' Once an editor approves it, it appears on the events calendar.':'')+'</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn" href="submit.html?type='+type+'">Send another</a><a class="btn solid" href="admin/#inbox">See it in the staff dashboard →</a></div></div>';
    scrollTo({top:0,behavior:'smooth'});
  };
  draw();
})();
</script>

</body>
</html>
