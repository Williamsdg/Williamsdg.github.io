<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Story · Hoover Sun</title>
<meta name="description" content="Local news, schools, sports, business, events and people from Hoover, Alabama. Concept redesign preview.">
<meta name="theme-color" content="#8e2a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a19'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial' font-weight='900' font-size='44' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3Ccircle cx='49' cy='16' r='7' fill='%23e9a23b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1">
</head>
<body data-page="article">
<div id="chrome"></div>
<div class="progress" id="progress"></div>
<main id="main"></main>
<div id="foot"></div>
<script src="assets/seed.js?v=1"></script>
<script src="assets/store.js?v=1"></script>
<script src="assets/site.js?v=1"></script>
<script>
(function(){
  var H=HS,T=H.T,e=H.esc;
  var q=new URLSearchParams(location.search), slug=q.get('slug'), preview=q.get('preview');
  var counted=false;
  function render(){
    var all=H.read('articles');
    var a=all.filter(function(x){return x.slug===slug||x.id===preview;})[0];
    var main=document.getElementById('main');
    if(!a||(!H.isLive(a)&&!preview)){
      main.innerHTML='<div class="wrap empty"><h1 class="hl" style="font-size:34px;color:var(--ink)">This story isn’t available.</h1><p style="margin:12px 0 22px">It may have been unpublished or moved.</p><a class="btn" href="index.html">Back to the front page</a></div>';
      return;
    }
    document.title=a.title+' · Hoover Sun';
    if(!counted&&!preview){ H.bumpView(a.id); counted=true; }
    var body=H.bodyHTML(a);
    // drop an inline ad after the 4th paragraph
    var parts=body.split('</p>');
    if(parts.length>6){ parts[3]+='</p><div class="zone" data-zone="inline"></div>'; body=parts.join('</p>').replace('</p></p>','</p>'); }
    var more=H.published().filter(function(x){return x.section===a.section&&x.id!==a.id;}).slice(0,4);
    var side=H.published().filter(function(x){return x.id!==a.id&&x.section!==a.section;}).slice(0,4);
    var url=location.href.split('&preview')[0];
    main.innerHTML=(preview&&!H.isLive(a)?'<div style="background:#fff4d6;border-bottom:1px solid #ecd9a3;padding:10px 16px;text-align:center;font-size:14px"><b>Preview</b> — this story is <b>'+e(a.status)+'</b> and not visible to readers yet.</div>':'')+
      '<article><header class="art-head"><a class="kicker" href="section.html?s='+a.section+'">'+e(H.sectionName(a.section))+(a.subsection?' · '+e(a.subsection):'')+'</a><h1>'+e(a.title)+'</h1>'+(a.dek?'<p class="dek">'+e(a.dek)+'</p>':'')+
      '<div class="byline"><span>By <b>'+e(a.author)+'</b></span><span>'+H.fmtDate(a.date,true)+'</span><div class="share"><button data-share aria-label="Share">'+H.ICON.share+'</button><a href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url)+'" target="_blank" rel="noopener" aria-label="Share on Facebook">'+H.ICON.fb+'</a><a href="mailto:?subject='+encodeURIComponent(a.title)+'&body='+encodeURIComponent(url)+'" aria-label="Email">'+H.ICON.mail+'</a><button data-copy aria-label="Copy link">'+H.ICON.link+'</button></div></div></header>'+
      (a.image?'<figure class="art-hero"><img src="'+H.src(a.image)+'"'+H.imgAttr(a.image)+' alt="'+e(a.caption||a.title)+'">'+((a.caption||a.credit)?'<figcaption>'+e(a.caption)+(a.credit?' <em>'+e(a.credit)+'</em>':'')+'</figcaption>':'')+'</figure>':'')+
      '<div class="art-layout"><div><div class="prose">'+body+'</div>'+
      '<div class="art-end"><span>See something that needs fixing? <a href="submit.html?type=correction&story='+encodeURIComponent(a.slug)+'">Send a correction</a></span><span>Have a tip? <a href="submit.html">Tell the newsroom</a></span></div></div>'+
      '<aside class="rail"><div class="zone-sidebar" data-zone="sidebar"></div>'+H.newsletterBox()+'<div class="mostread"><div class="shead"><h2>Also in the Sun</h2></div><ol>'+side.map(function(x){return '<li><a href="'+T.href(x)+'"><span class="hl">'+e(x.title)+'</span></a></li>';}).join('')+'</ol></div></aside></div></article>'+
      (more.length?'<section class="more"><div class="wrap"><div class="shead"><h2>More '+e(H.sectionName(a.section))+'</h2><a href="section.html?s='+a.section+'">See all →</a></div><div class="card-grid">'+more.map(T.card).join('')+'</div></div></section>':'');
    var sh=main.querySelector('[data-share]');
    sh.onclick=function(){ if(navigator.share) navigator.share({title:a.title,url:url}).catch(function(){}); else copy(); };
    main.querySelector('[data-copy]').onclick=copy;
    function copy(){ (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){H.toast('Link copied');},function(){H.toast(url);}); }
    H.renderZones(); H.hydrate();
  }
  render(); H.live(render);
  var pr=document.getElementById('progress');
  addEventListener('scroll',function(){ var p=document.querySelector('.prose'); if(!p) return; var r=p.getBoundingClientRect(); var t=Math.min(1,Math.max(0,(innerHeight-r.top)/(r.height+innerHeight*.4))); pr.style.width=(t*100)+'%'; },{passive:true});
})();
</script>

</body>
</html>
