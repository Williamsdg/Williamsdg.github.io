<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hoover Sun · Hoover’s Community News Source</title>
<meta name="description" content="Local news, schools, sports, business, events and people from Hoover, Alabama. Concept redesign preview.">
<meta name="theme-color" content="#8e2a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a19'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial' font-weight='900' font-size='44' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3Ccircle cx='49' cy='16' r='7' fill='%23e9a23b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1">
</head>
<body data-page="home">
<div id="chrome"></div>
<main id="main"></main>
<div id="foot"></div>
<script src="assets/seed.js?v=1"></script>
<script src="assets/store.js?v=1"></script>
<script src="assets/site.js?v=1"></script>
<script>
(function(){
  var H=HS,T=H.T,e=H.esc;
  function render(){
    var pub=H.published(), used={};
    function take(a){ if(a) used[a.id]=1; return a; }
    function free(list){ return list.filter(function(a){return !used[a.id];}); }
    var lead=take(pub.filter(function(a){return a.placement==='lead'&&a.image;})[0]||pub.filter(function(a){return a.image;})[0]);
    var top=pub.filter(function(a){return a.placement==='top'&&!used[a.id];}).slice(0,3);
    free(pub).filter(function(a){return a.image&&top.indexOf(a)<0;}).forEach(function(a){ if(top.length<3) top.push(a); });
    top.forEach(take);
    var latest=free(pub).slice(0,6);
    var sports=pub.filter(function(a){return a.section==='sports';});
    var events=H.read('events').filter(function(v){return v.status==='approved'&&v.date>=HS.today();}).sort(function(a,b){return a.date<b.date?-1:1;}).slice(0,4);
    var issue=H.read('issues').filter(function(i){return i.status==='published';}).sort(function(a,b){return a.month<b.month?1:-1;})[0];
    var editor=pub.filter(function(a){return a.section==='opinion';})[0];
    var views=H.views();
    var most=pub.slice().sort(function(a,b){return (views[b.id]||0)-(views[a.id]||0);}).filter(function(a){return views[a.id];}).slice(0,5);
    if(most.length<5) pub.filter(function(a){return a.section==='news'&&most.indexOf(a)<0;}).slice(0,5-most.length).forEach(function(a){most.push(a);});

    latest.forEach(take); sports.forEach(take);
    var news=free(pub).filter(function(a){return a.section==='news';}).slice(0,5);
    var biz=free(pub).filter(function(a){return a.section==='business';}).slice(0,5);
    news.forEach(take); biz.forEach(take);
    var community=free(pub).filter(function(a){return a.section!=='opinion'&&a.image;}).slice(0,4);

    function stack(list){ return list.map(function(a,i){ return i===0? '<a href="'+T.href(a)+'">'+(a.image?T.img(a):'')+T.kick(a)+'<h3 class="hl" style="margin-top:6px">'+e(a.title)+'</h3><p class="dek" style="font-size:15.5px;margin-top:6px">'+e(a.dek)+'</p>'+T.meta(a)+'</a>' : T.row(a); }).join(''); }
    function evCard(v){ var d=new Date(v.date+'T12:00'); return '<a class="ev-card" href="events.html#'+v.id+'"><div class="ev-date"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('en-US',{weekday:'short'})+'<br>'+d.toLocaleDateString('en-US',{month:'short'})+'</span></div><h4>'+e(v.title)+'</h4><p>'+e((v.where||'').split(',')[0])+'</p></a>'; }

    var html='';
    html+='<section class="front"><div class="wrap"><div class="grid">'+
      '<div class="latest"><h3>Latest</h3><div class="list">'+latest.map(function(a){return '<a href="'+T.href(a)+'"><span class="t">'+H.timeAgo(a.date)+' · '+e(H.sectionName(a.section))+'</span><h4 class="hl">'+e(a.title)+'</h4></a>';}).join('')+'</div></div>'+
      (lead?'<article class="lead"><a href="'+T.href(lead)+'">'+T.img(lead)+'<div style="margin-top:16px">'+T.kick(lead)+'</div><h2 class="hl">'+e(lead.title)+'</h2><p class="dek">'+e(lead.dek)+'</p>'+T.meta(lead)+'</a></article>':'<div></div>')+
      '<div class="top">'+top.map(function(a){return '<a href="'+T.href(a)+'">'+T.img(a)+T.kick(a)+'<h3 class="hl">'+e(a.title)+'</h3>'+T.meta(a)+'</a>';}).join('')+'</div>'+
    '</div></div></section>';
    html+='<div class="wrap"><div class="zone" data-zone="leaderboard"></div></div>';
    if(sports.length){
      html+='<section class="band"><div class="wrap"><div class="shead"><h2>Bucs &amp; Jags</h2><a href="section.html?s=sports">All sports →</a></div>'+
        '<div class="schools-chips" role="tablist"><button class="chip on" data-sp="">All</button><button class="chip" data-sp="Hoover">Hoover Bucs</button><button class="chip" data-sp="Spain Park">Spain Park Jags</button></div><div id="sportsBody"></div></div></section>';
    }
    if(events.length){
      html+='<section class="events-strip"><div class="wrap"><div class="shead"><h2>Coming up in Hoover</h2><a href="events.html">Full calendar →</a></div><div class="ev-row">'+events.map(evCard).join('')+'</div>'+
      '<div class="ev-actions"><a class="btn sm" href="events.html">'+H.ICON.cal+' Browse the calendar</a><a class="btn sm solid" href="submit.html?type=event">Add your event</a></div></div></section>';
    }
    html+='<section class="cols"><div class="wrap"><div class="grid">'+
      '<div><div class="shead"><h2>News</h2><a href="section.html?s=news">More news →</a></div><div class="stack">'+stack(news)+'</div></div>'+
      '<div><div class="shead"><h2>Business</h2><a href="section.html?s=business">More business →</a></div><div class="stack">'+stack(biz)+'</div></div>'+
      '<aside class="rail">'+(issue?'<a class="issue-card" href="edition.html"><span class="kicker">In print now</span><img src="'+H.src(issue.cover)+'"'+H.imgAttr(issue.cover)+' alt="'+e(issue.title)+' cover"><h4>The '+e(issue.title)+' issue</h4><p>Mailed to Hoover homes. Read every page online.</p><span class="btn sm">Read the issue</span></a>':'')+
      H.newsletterBox()+'<div class="zone-sidebar" data-zone="sidebar"></div>'+
      '<div class="mostread"><div class="shead"><h2>Most read</h2></div><ol>'+most.map(function(a){return '<li><a href="'+T.href(a)+'"><span class="hl">'+e(a.title)+'</span></a></li>';}).join('')+'</ol></div></aside>'+
    '</div></div></section>';
    if(community.length) html+='<section class="cols" style="padding-top:0"><div class="wrap"><div class="shead"><h2>Around town</h2><a href="section.html?s=people">People →</a></div><div class="card-grid">'+community.map(T.card).join('')+'</div></div></section>';
    html+='<section class="opinion"><div class="wrap"><div class="shead"><h2>Opinion</h2><a href="section.html?s=opinion">All columns →</a></div><div class="op-grid">'+
      (editor?'<a class="op-feature" href="'+T.href(editor)+'"><img src="'+H.src(editor.image)+'"'+H.imgAttr(editor.image)+' alt="'+e(editor.author)+'"><div><span class="kicker">'+e(editor.subsection||'Opinion')+'</span><h3 class="hl">'+e(editor.title)+'</h3><div class="meta-line"><b>'+e(editor.author)+'</b>, Managing Editor</div></div></a>':'<div></div>')+
      [["Mayor's Minute",'A monthly note from City Hall.'],['Kari Kampakis','Faith, family and raising kids.'],['Rick Watson','Life, memory and the small stuff.']].map(function(c){return '<a class="op-col" href="section.html?s=opinion&sub='+encodeURIComponent(c[0])+'"><span class="kicker">Column</span><h5 style="margin-top:8px">'+e(c[0])+'</h5><p>'+c[1]+'</p></a>';}).join('')+
    '</div></div></section>';
    document.getElementById('main').innerHTML=html;

    var sp=document.getElementById('sportsBody');
    function drawSports(sub){
      var list=sports.filter(function(a){return !sub||a.subsection===sub||(sub==='Hoover'&&/Bucs/.test(a.title))||(sub==='Spain Park'&&/Jags|Spain Park/.test(a.title));});
      if(!list.length){ sp.innerHTML='<p style="color:#a99f97">No stories yet.</p>'; return; }
      var b=list[0];
      sp.innerHTML='<div class="grid"><a class="big" href="'+T.href(b)+'">'+T.img(b)+'<div style="margin-top:14px">'+T.kick(b)+'</div><h3 class="hl">'+e(b.title)+'</h3><p class="dek">'+e(b.dek)+'</p>'+T.meta(b)+'</a><div class="list">'+
        list.slice(1,5).map(function(a){return '<a href="'+T.href(a)+'">'+T.img(a)+'<div>'+T.kick(a)+'<h4 class="hl" style="margin-top:6px">'+e(a.title)+'</h4>'+T.meta(a)+'</div></a>';}).join('')+'</div></div>';
      H.hydrate(sp);
    }
    if(sp){ drawSports(''); document.querySelectorAll('[data-sp]').forEach(function(c){ c.onclick=function(){ document.querySelectorAll('[data-sp]').forEach(function(x){x.classList.toggle('on',x===c);}); drawSports(c.getAttribute('data-sp')); }; }); }
    H.renderZones(); H.hydrate();
  }
  render(); H.live(render);
})();
</script>
</body>
</html>
