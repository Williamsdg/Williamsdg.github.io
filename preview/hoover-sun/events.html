<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Events Calendar · Hoover Sun</title>
<meta name="description" content="Local news, schools, sports, business, events and people from Hoover, Alabama. Concept redesign preview.">
<meta name="theme-color" content="#8e2a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a19'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial' font-weight='900' font-size='44' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3Ccircle cx='49' cy='16' r='7' fill='%23e9a23b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1">
</head>
<body data-page="events">
<div id="chrome"></div>
<main class="wrap" id="main">
  <header class="sec-head"><span class="kicker">Community calendar</span><h1>Things to do in Hoover</h1><p>Festivals, fundraisers, library programs and game nights. Hosting something? <a href="submit.html?type=event" style="color:var(--maroon);font-weight:600">Add it to the calendar</a> and our editors will review it.</p></header>
  <div style="display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:start;padding-bottom:60px" class="ev-layout">
    <div><div class="cal" id="cal"></div><div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="chip on" data-f="all">All upcoming</button><button class="chip" data-f="weekend">This weekend</button><button class="chip" data-f="free">Free</button></div></div>
    <div class="ev-list" id="list"></div>
  </div>
</main>
<style>@media(max-width:900px){.ev-layout{grid-template-columns:1fr!important;gap:24px!important}}</style>
<div id="foot"></div>
<script src="assets/seed.js?v=1"></script>
<script src="assets/store.js?v=1"></script>
<script src="assets/site.js?v=1"></script>
<script>
(function(){
  var H=HS,e=H.esc;
  var now=new Date(), view=new Date(now.getFullYear(),now.getMonth(),1), sel=null, filter='all';
  var todayISO=new Date(now.getTime()-now.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function events(){ return H.read('events').filter(function(v){return v.status==='approved';}).sort(function(a,b){return a.date<b.date?-1:1;}); }
  function cal(){
    var ev=events(), y=view.getFullYear(), m=view.getMonth(), first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
    var h='<div class="cal-head"><button class="icon-btn" id="prev" aria-label="Previous month">‹</button><h3>'+H.MONTHS[m]+' '+y+'</h3><button class="icon-btn" id="next" aria-label="Next month">›</button></div><div class="cal-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
    for(var i=0;i<42;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), k=iso(d), todays=ev.filter(function(v){return v.date===k;});
      if(i===35&&d.getMonth()!==m) break;
      h+='<button class="day'+(d.getMonth()!==m?' other':'')+(k===todayISO?' today':'')+(sel===k?' sel':'')+'" data-d="'+k+'" aria-label="'+k+(todays.length?', '+todays.length+' events':'')+'"><span class="n">'+d.getDate()+'</span><span class="es">'+todays.map(function(v){return '<span class="e">'+e(v.title)+'</span>';}).join('')+'</span></button>';
    }
    document.getElementById('cal').innerHTML=h+'</div>';
    document.getElementById('prev').onclick=function(){ view=new Date(y,m-1,1); cal(); };
    document.getElementById('next').onclick=function(){ view=new Date(y,m+1,1); cal(); };
    document.querySelectorAll('.day').forEach(function(b){ b.onclick=function(){ sel=sel===b.dataset.d?null:b.dataset.d; cal(); list(); if(innerWidth<900&&sel) document.getElementById('list').scrollIntoView({behavior:'smooth'}); }; });
  }
  function list(){
    var ev=events(), out;
    if(sel) out=ev.filter(function(v){return v.date===sel;});
    else {
      out=ev.filter(function(v){return v.date>=todayISO;});
      if(filter==='free') out=out.filter(function(v){return /free/i.test(v.cost||'');});
      if(filter==='weekend'){ var d=new Date(now), dow=d.getDay(), off=dow===0?-2:dow===6?-1:5-dow, fri=new Date(d.getFullYear(),d.getMonth(),d.getDate()+off), sun=new Date(fri.getFullYear(),fri.getMonth(),fri.getDate()+2); out=out.filter(function(v){return v.date>=iso(fri)&&v.date<=iso(sun);}); }
    }
    var h=sel?'<div class="shead"><h2>'+H.fmtDate(sel+'T12:00',true)+'</h2><a href="#" id="clr">Show all</a></div>':'<div class="shead"><h2>'+(filter==='weekend'?'This weekend':filter==='free'?'Free events':'Upcoming')+'</h2><a href="submit.html?type=event">+ Submit an event</a></div>';
    if(!out.length) h+='<p class="empty" style="padding:30px 0">Nothing on the calendar'+(sel?' that day':'')+' yet.</p>';
    h+=out.map(function(v){ var d=new Date(v.date+'T12:00');
      return '<div class="ev" id="'+v.id+'"><div class="tile"><span>'+d.toLocaleDateString('en-US',{month:'short'})+'</span><b>'+d.getDate()+'</b></div><div><h3>'+e(v.title)+'</h3><dl>'+(v.when?'<dt>When</dt><dd>'+e(v.when)+'</dd>':'')+(v.where?'<dt>Where</dt><dd>'+e(v.where)+'</dd>':'')+(v.cost?'<dt>Cost</dt><dd>'+e(v.cost)+'</dd>':'')+'</dl>'+(v.details?'<p>'+e(v.details)+'</p>':'')+
        '<div class="ev-actions" style="margin-top:14px"><button class="btn sm" data-ics="'+v.id+'">'+H.ICON.cal+' Add to calendar</button>'+(v.link?'<a class="btn sm" target="_blank" rel="noopener" href="https://'+e(v.link.replace(/^https?:\/\//,''))+'">Event info</a>':'')+'</div></div></div>'; }).join('');
    document.getElementById('list').innerHTML=h;
    var c=document.getElementById('clr'); if(c) c.onclick=function(x){x.preventDefault(); sel=null; cal(); list();};
    document.querySelectorAll('[data-ics]').forEach(function(b){ b.onclick=function(){ var v=ev.filter(function(x){return x.id===b.dataset.ics;})[0]; ics(v); }; });
  }
  function ics(v){
    var d=v.date.replace(/-/g,''), n=new Date(v.date+'T12:00'); n.setDate(n.getDate()+1);
    var end=iso(n).replace(/-/g,'');
    var body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hoover Sun//Events//EN','BEGIN:VEVENT','UID:'+v.id+'@hooversun','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+v.title,'LOCATION:'+(v.where||'').replace(/,/g,'\\,'),'DESCRIPTION:'+((v.when||'')+' '+(v.details||'')).replace(/,/g,'\\,'),'END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'})); a.download=H.slugify(v.title)+'.ics'; a.click(); H.toast('Calendar file downloaded');
  }
  document.querySelectorAll('[data-f]').forEach(function(b){ b.onclick=function(){ filter=b.dataset.f; sel=null; document.querySelectorAll('[data-f]').forEach(function(x){x.classList.toggle('on',x===b);}); cal(); list(); }; });
  function render(){ cal(); list(); if(location.hash){ var t=document.querySelector(location.hash); if(t) t.scrollIntoView(); } }
  render(); H.live(function(){ cal(); list(); });
})();
</script>

</body>
</html>
