<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Highlands Ops — Event Operations Platform</title>
<meta name="description" content="Multi-campus event operations & After Action platform concept for Church of the Highlands.">
<style>
  :root{
    --navy:#0f2440; --navy2:#13294b; --navy3:#1c3760;
    --gold:#d3a84c; --gold2:#c9a14a; --gold-soft:#f4e4bd;
    --content-bg:#f4f5f3;
    --card:#ffffff; --line:#e4e1d9; --line2:#22406b;
    --ink:#1b2735; --muted:#6b7480; --muted2:#9fb0c6;
    --ok:#2f9e5a; --ok-w:#e6f4ec; --ok-t:#1c6d3d;
    --warn:#e0a021; --warn-w:#fdf3d9; --warn-t:#8a6100;
    --bad:#d64545; --bad-w:#fbe9e9; --bad-t:#a32d2d;
    --info:#2a78d6; --info-w:#e7f0fc; --info-t:#1c5cab;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--content-bg);color:var(--ink);line-height:1.45;font-size:14px}
  button{font-family:inherit}
  .pvb{background:linear-gradient(90deg,#3a2b0c,#5a4310);color:#ffe9b8;font-size:12px;
    text-align:center;padding:5px 12px;letter-spacing:.3px;font-weight:600}
  .pvb b{color:#fff}

  .app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 28px)}

  /* sidebar */
  .side{background:var(--navy);color:#dce6f4;display:flex;flex-direction:column;position:sticky;top:0;
    height:calc(100vh - 28px);overflow-y:auto}
  .brand{padding:18px 18px 12px}
  .brand .logo{display:flex;align-items:center;gap:10px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#b8862f);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#2a1c05;font-size:17px;flex:0 0 auto}
  .brand h1{margin:0;font-size:14px;letter-spacing:.3px;color:#fff;font-weight:700}
  .brand .sub{font-size:10px;color:var(--muted2);letter-spacing:.6px;text-transform:uppercase;margin-top:1px}
  .campuspick{margin:4px 14px 8px}
  .campuspick label{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted2);font-weight:700}
  .campuspick select{width:100%;margin-top:4px;background:var(--navy3);color:#fff;border:1px solid var(--line2);
    border-radius:8px;padding:8px 9px;font-size:13px;font-weight:600}
  .campuspick .scope{font-size:10.5px;color:var(--muted2);margin-top:5px}
  .sdiv{height:1px;background:var(--line2);margin:6px 16px}
  .nav{padding:8px 12px;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:14px;
    color:#c6d3e6;cursor:pointer;text-decoration:none;font-weight:500;margin-bottom:2px}
  .nav a:hover{background:var(--navy3);color:#fff}
  .nav a.on{background:linear-gradient(90deg,rgba(211,168,76,.22),rgba(211,168,76,.05));color:#fff;
    box-shadow:inset 2px 0 0 var(--gold)}
  .nav a .ic{width:19px;text-align:center;flex:0 0 auto;font-size:15px}
  .nav a .bdg{margin-left:auto;font-size:10px;font-weight:700;background:var(--bad);color:#fff;
    border-radius:20px;padding:1px 7px}
  .nav a .bdg.g{background:var(--gold);color:#2a1c05}
  .nav .mini{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:#6f83a2;font-weight:700;padding:12px 12px 5px}
  .sidefoot{padding:12px 16px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted2)}
  .sidefoot .b{color:#fff;font-weight:700}

  /* main */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:11px 24px;display:flex;
    align-items:center;gap:14px;position:sticky;top:0;z-index:6}
  .topbar h2{margin:0;font-size:17px;font-weight:700;color:var(--navy2)}
  .topbar .crumb{font-size:12px;color:var(--muted);margin-top:1px}
  .topbar .crumb a{color:var(--info-t);cursor:pointer;text-decoration:none}
  .topbar .crumb a:hover{text-decoration:underline}
  .spacer{flex:1}
  .clock{text-align:right}
  .clock .t{font-size:15px;font-weight:700;color:var(--navy2);font-variant-numeric:tabular-nums}
  .clock .d{font-size:11px;color:var(--muted)}
  .content{padding:22px;max-width:1240px;width:100%;margin:0 auto}

  .row{display:flex;gap:16px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px}
  .card h3{margin:0 0 3px;font-size:14px;font-weight:700;color:var(--navy2)}
  .card .desc{font-size:12px;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.g2,.g3,.g4{grid-template-columns:1fr}}

  .kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 17px}
  .kpi .l{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .v{font-size:30px;font-weight:800;color:var(--navy2);line-height:1.05;margin-top:5px}
  .kpi .d{font-size:12px;margin-top:3px;font-weight:600}
  .up{color:var(--ok-t)} .down{color:var(--bad-t)} .flat{color:var(--muted)}

  .sect-title{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--navy3);
    margin:26px 2px 12px;display:flex;align-items:center;gap:9px}
  .sect-title:first-child{margin-top:0}
  .sect-title .hint{font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}

  table.tbl{border-collapse:collapse;width:100%;font-size:13px}
  table.tbl th{text-align:left;padding:9px 12px;background:var(--navy2);color:#fff;font-size:10px;
    text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  table.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
  table.tbl tr:hover td{background:#faf9f5}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;
    padding:2px 9px;white-space:nowrap}
  .pill .dt{width:7px;height:7px;border-radius:50%;display:inline-block}
  .p-ok{background:var(--ok-w);color:var(--ok-t)} .p-ok .dt{background:var(--ok)}
  .p-warn{background:var(--warn-w);color:var(--warn-t)} .p-warn .dt{background:var(--warn)}
  .p-bad{background:var(--bad-w);color:var(--bad-t)} .p-bad .dt{background:var(--bad)}
  .p-info{background:var(--info-w);color:var(--info-t)} .p-info .dt{background:var(--info)}
  .p-gold{background:var(--gold-soft);color:#7a5a12} .p-gold .dt{background:var(--gold)}
  .p-muted{background:#eef0ee;color:#5b6470} .p-muted .dt{background:#9aa4ae}

  .stars{color:var(--gold);letter-spacing:1px} .stars .e{color:#d8d3c7}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;
    font-weight:600;cursor:pointer;color:var(--navy2)}
  .btn:hover{background:#f2efe8}
  .btn.pri{background:var(--navy2);color:#fff;border-color:var(--navy2)} .btn.pri:hover{background:var(--navy3)}
  .btn.gold{background:var(--gold);color:#2a1c05;border-color:var(--gold)} .btn.gold:hover{filter:brightness(1.05)}
  .btn.sm{padding:5px 10px;font-size:12px}

  .ring{--p:0;width:88px;height:88px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--gold) calc(var(--p)*1%), #e7eaef 0);display:flex;align-items:center;justify-content:center}
  .ring .in{width:68px;height:68px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-size:22px;color:var(--navy2);line-height:1} .ring .in span{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .bar{height:9px;background:#e9ece9;border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px;background:var(--gold)}
  .bar.ok > i{background:var(--ok)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
  .scorebadge{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex:0 0 auto}

  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
  .tabs button{border:none;background:none;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button:hover{color:var(--navy2)}
  .tabs button.on{color:var(--navy2);border-bottom-color:var(--gold)}

  /* status tracker */
  .track{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .track .seg{flex:1;min-width:180px}
  .track .stackbar{height:14px;border-radius:8px;overflow:hidden;display:flex;margin-top:6px}
  .track .stackbar > i{height:100%}
  .track .leg{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
  .track .leg span{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
  .track .leg .dt{width:9px;height:9px;border-radius:50%}

  .campcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .1s,box-shadow .1s}
  .campcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,36,64,.12)}
  .campcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .campcard .nm{font-weight:700}
  .campcard .top .pill{flex:0 0 auto}
  .campcard .mini{display:flex;gap:14px;margin-top:10px;font-size:12px}
  .campcard .mini b{display:block;font-size:16px;color:var(--navy2)}
  .campcard .mini .l{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .campcard.stripe-ok{border-left:4px solid var(--ok)}
  .campcard.stripe-prog{border-left:4px solid var(--warn)}
  .campcard.stripe-not{border-left:4px solid var(--bad)}

  /* service cards */
  .svc{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
  .svc .h{display:flex;justify-content:space-between;align-items:center}
  .svc .time{font-size:19px;font-weight:800;color:var(--navy2)}
  .svc .attn{font-size:26px;font-weight:800;color:var(--navy2);margin:6px 0 2px}

  /* field form */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--navy3);text-transform:uppercase;margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .field textarea{min-height:70px;resize:vertical}
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .starpick{font-size:20px;color:#d8d3c7;letter-spacing:3px;cursor:pointer;user-select:none}
  .starpick .on{color:var(--gold)}
  .win{background:var(--ok-w);border:1px solid #cbe6d5;border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px}
  .opp{background:var(--warn-w);border:1px solid #eeddbf;border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px}
  .add-row{display:flex;gap:8px;margin-top:6px}
  .add-row input{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12px;margin:0 6px 6px 0}
  .empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:13px}
  .muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:700} .gold-t{color:var(--gold2)}
  hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

  /* calendar */
  .cal{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .cal .head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--navy2)}
  .cal .head div{padding:8px;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;text-align:center}
  .cal .body{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal .day{min-height:96px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;font-size:12px;position:relative}
  .cal .day:nth-child(7n+1){border-left:none}
  .cal .day .n{color:var(--muted);font-weight:600}
  .cal .day.other .n{color:#cfcdc5}
  .cal .day.today{background:#fbf6e8}
  .cal .day.today .n{color:var(--gold2);font-weight:800}
  .cal .evp{display:block;margin-top:3px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal .evp:hover{filter:brightness(.96)}
  .ev-sun{background:var(--info-w);color:var(--info-t)}
  .ev-fw{background:var(--gold-soft);color:#7a5a12}
  .ev-motion{background:#efe7fb;color:#5d3b8a}
  .ev-gt{background:var(--ok-w);color:var(--ok-t)}
  .ev-conf{background:#fde9e0;color:#9a4a2a}
  .ev-other{background:#eef0f5;color:#4a5470}

  /* event list */
  .evgroup{margin-bottom:8px}
  .evrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;margin-bottom:8px}
  .evrow:hover{background:#faf9f5}
  .evrow .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .evrow .nm{font-weight:700;flex:1}

  .feed .it{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .feed .it:first-child{border-top:none}
  .feed .ok{color:var(--ok)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .modal-bg{position:fixed;inset:0;background:rgba(10,20,36,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal-bg.on{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.35)}
  .modal .mh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .modal .mb{padding:20px}
  .modal .mx{margin-left:auto;cursor:pointer;font-size:20px;color:var(--muted);border:none;background:none}
  .spark{display:flex;align-items:flex-end;gap:5px;height:70px}
  .spark .col{flex:1;background:var(--navy3);border-radius:4px 4px 0 0;min-width:8px}
  .spark .col.hl{background:var(--gold)}
</style>
</head>
<body>
<div class="pvb">CONCEPT DEMO — Built by <b>Williams Digital</b> for Church of the Highlands · mock data · Planning Center / ProPresenter / weather &amp; AI are simulated</div>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><div class="mark">H</div>
        <div><h1>Highlands Ops</h1><div class="sub">Event Operations</div></div>
      </div>
    </div>
    <div class="campuspick">
      <label>Viewing As</label>
      <select id="campusSel" onchange="setCampus(this.value)"></select>
      <div class="scope" id="scopeNote"></div>
    </div>
    <div class="sdiv"></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot"><div class="b">Central Operations</div><div>26 campuses · one source of truth</div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="crumb" id="pageCrumb"></div>
      </div>
      <div class="spacer"></div>
      <div class="clock"><div class="t" id="clockT">--:--:--</div><div class="d" id="clockD"></div></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   HIGHLANDS OPS — Event Operations Platform (concept demo)
   Nav: Dashboard · Calendar · Events · Action Items · Recognition
   Depth lives inside each EVENT → CAMPUS → workspace tabs.
   All mock data. Integrations simulated.
   ===================================================================== */

/* ---- 26 campuses ---- */
const CAMPUS_NAMES = ['Grants Mill','Greystone','Auburn','Riverchase','Huntsville','Shoals','Montgomery','Tuscaloosa',
  'Opelika','Mobile','Cullman','Oxford','Gadsden','Alexander City','Columbiana','Fultondale','Grandview','McCalla',
  'Trussville','Chelsea','Pell City','Scottsboro','Albertville','Guntersville','Woodlawn','Tuscumbia'];
const CAMPUSES = CAMPUS_NAMES.map((n,i)=>({id:n.toLowerCase().replace(/[^a-z]/g,''),name:n,flagship:i===0}));
const CENTRAL = {id:'central',name:'Central Operations'};

/* pseudo-random but STABLE per campus (no Math.random at runtime for determinism) */
function seed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;}
function rint(str,lo,hi){return Math.floor(lo+seed(str)*(hi-lo+1));}

/* report status: 18 submitted, 4 in progress, 4 not started */
const STATUS_ORDER = {};
CAMPUSES.forEach((c,i)=>{ STATUS_ORDER[c.id] = i<18?'submitted':i<22?'progress':'notstarted'; });
// hand-tune a few named ones to match earlier narrative
STATUS_ORDER['grantsmill']='submitted'; STATUS_ORDER['greystone']='progress';
STATUS_ORDER['auburn']='submitted'; STATUS_ORDER['riverchase']='notstarted'; STATUS_ORDER['huntsville']='submitted';

/* build a campus report snapshot on demand (mock) */
function campusReport(cid){
  const c=CAMPUSES.find(x=>x.id===cid);
  const base=rint(cid+'a',900,4200);
  const total=base;
  const adults=Math.round(total*0.63), kids=Math.round(total*0.2), students=Math.round(total*0.09), dt=Math.round(total*0.1);
  const st=STATUS_ORDER[cid];
  return {
    campus:c, status:st,
    attendance:{adults,kids,students,dreamTeam:dt,total, guests:rint(cid+'g',30,240), salvations:rint(cid+'s',3,42), baptisms:0},
    lobby:{parking:rint(cid+'p',3,5),coffee:rint(cid+'c',3,5),connect:rint(cid+'cc',4,5),traffic:rint(cid+'t',3,5),guest:rint(cid+'ge',4,5),atmosphere:rint(cid+'at',4,5)},
    setup:{arrival:'6:15 AM',complete:'7:35 AM',equip:st!=='notstarted',building:true},
    recognitionCount:rint(cid+'r',0,4),
    actionCount:rint(cid+'ac',0,3),
    submittedBy: st==='submitted'?['Kevin Ruff','Ashley Kim','Tyler Beard','Grace Odom','Sam Delk','Priya Anand'][rint(cid+'by',0,5)]:'',
    submittedTime: st==='submitted'?['1:12 PM','1:34 PM','12:58 PM','1:47 PM','1:05 PM'][rint(cid+'tm',0,4)]:'',
    weather:{cond:['Sunny','Sunny','Rain','Overcast','Sunny'][rint(cid+'w',0,4)],temp:rint(cid+'te',54,74),wind:rint(cid+'wi',3,16),impact:seed(cid+'imp')>0.75},
  };
}

/* ---- events (calendar + catalog) ---- */
const EVENTS = [
  {id:'sun-0719', type:'sun',    name:'Sunday', date:'2026-07-19', label:'July 19', cat:'Weekend Services'},
  {id:'fw-0805',  type:'fw',     name:'First Wednesday', date:'2026-08-05', label:'Aug 5', cat:'Weekend Services'},
  {id:'motion-0710', type:'motion', name:'Motion Night', date:'2026-07-10', label:'July 10', cat:'Student Ministry'},
  {id:'gt-0726',  type:'gt',     name:'Growth Track', date:'2026-07-26', label:'July 26', cat:'Discipleship'},
  {id:'prayer-0801', type:'prayer', name:'21 Days of Prayer', date:'2026-08-01', label:'Aug 1', cat:'Discipleship'},

PAGES.calendar=function(){
  // July 2026 grid. July 1 2026 is a Wednesday (index 3).
  const year=2026, month=6; // July
  const firstDow=3; const daysInMonth=31; const today=22;
  const byDate={};EVENTS.filter(e=>e.date.startsWith('2026-07')).forEach(e=>{const d=+e.date.slice(8);(byDate[d]=byDate[d]||[]).push(e);});
  // add weekly Sundays in July: 5,12,19,26
  [5,12,19,26].forEach(d=>{if(!byDate[d])byDate[d]=[];if(!byDate[d].some(e=>e.type==='sun'))byDate[d].unshift({id:'sun-07'+String(d).padStart(2,'0'),type:'sun',name:'Sunday',date:'2026-07-'+String(d).padStart(2,'0'),label:'July '+d});});
  let cells='';
  for(let i=0;i<firstDow;i++)cells+=`<div class="day other"><span class="n"></span></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const evs=byDate[d]||[];
    cells+=`<div class="day ${d===today?'today':''}"><span class="n">${d}</span>${evs.map(e=>{const t=EVTYPE[e.type];return `<span class="evp ${t.cls}" onclick="openEvent('${e.id.startsWith('sun-07')?'sun-0719':e.id}')">${t.icon} ${e.name}</span>`}).join('')}</div>`;
  }
  const rem=(firstDow+daysInMonth)%7;if(rem)for(let i=0;i<7-rem;i++)cells+=`<div class="day other"><span class="n"></span></div>`;
  V().innerHTML=`
  <div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="flex:1"><h3 style="margin:0">July 2026</h3><div class="small muted">Click any event to open its workspace. This calendar is the navigation.</div></div>

  <div class="card"><textarea style="min-height:120px" placeholder="Free-form notes for the weekend…">${c.id==='huntsville'?'Record first-time guests. Second service coffee needs earlier restock. Two families joined a small group after the 11:15.':''}</textarea></div>

  <div class="sect-title">Uploads</div>
  <div class="card"><div class="grid g3" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
    ${['Pictures','Documents','Videos'].map(l=>`<div style="border:2px dashed var(--line);border-radius:11px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);cursor:pointer" onclick="toast('${l} upload (demo)')"><span style="font-size:22px">${l==='Pictures'?'📷':l==='Videos'?'🎬':'📄'}</span><span class="small">${l}</span></div>`).join('')}
  </div></div>

  <div class="card" style="margin-top:16px;text-align:center">
    ${r.status==='submitted'?`<span class="pill p-ok" style="font-size:13px;padding:6px 14px"><span class="dt"></span>Submitted to Central Ops · ${r.submittedTime}</span>`
      :`<button class="btn pri" style="padding:11px 26px;font-size:15px" onclick="toast('✅ Submitted to Central Operations (demo)')">Submit Report</button>`}
  </div>`;
  window.scrollTo(0,0);
}
function recalcCR(){const inputs=V().querySelectorAll('.card .field input[type=number]');
  // total = adults+kids+students+dreamTeam (first 4)
  let total=0;[...inputs].slice(0,4).forEach(i=>total+=(+i.value||0));
  const t=document.getElementById('crTotal');if(t)t.textContent=fmt(total);}
function genSummary(cid){
  const c=CAMPUSES.find(x=>x.id===cid);const r=campusReport(cid);const a=r.attendance;
  const box=document.getElementById('aiSummaryBox');box.innerHTML=`<div class="card" style="border-left:4px solid var(--gold)"><div class="muted small">✦ Generating…</div></div>`;
  setTimeout(()=>{
    const txt=`The <b>${c.name}</b> campus welcomed <b>${fmt(a.total)}</b> attendees, including <b>${a.guests}</b> first-time guests and <b>${a.salvations}</b> salvations. Lobby experience rated strong (${r.lobby.guest}/5 guest experience). ${c.id==='greystone'?'Production noted a microphone dropout that was resolved within 30 seconds. ':'Production ran clean. '}${r.weather.impact?'Weather ('+r.weather.cond.toLowerCase()+') had a minor impact on early arrivals. ':''}Recommended follow-ups: increase coffee inventory for peak services and pre-stage the weather parking plan.`;
    box.innerHTML=`<div class="card" style="border-left:4px solid var(--gold)"><h3>✦ AI Event Summary</h3><div class="desc">Generated from this report</div><p style="margin:0;line-height:1.7">${txt}</p>
      <div style="margin-top:10px"><button class="btn sm" onclick="toast('Copied (demo)')">Copy</button> <button class="btn sm" onclick="toast('Sent to Central Ops (demo)')">Send to Central Ops</button></div></div>`;
    box.scrollIntoView({behavior:'smooth',block:'center'});
  },650);
}

/* ===================== ACTION ITEMS ===================== */
PAGES.actions=function(){
  const list = CUR==='central'?ACTIONS:ACTIONS.filter(a=>a.campus===campusObj().name);
  const buckets={Open:[],'In Progress':[],Overdue:[],Complete:[]};
  list.forEach(a=>{(buckets[a.status]||buckets.Open).push(a);});
  V().innerHTML=`
  <div class="grid g4" style="margin-bottom:16px">
    ${[['Open','p-warn',buckets.Open.length],['In Progress','p-info',buckets['In Progress'].length],['Overdue','p-bad',buckets.Overdue.length],['Completed','p-ok',buckets.Complete.length]].map(([l,cl,n])=>
      `<div class="kpi"><div class="l">${l}</div><div class="v">${n}</div></div>`).join('')}
  </div>
  ${['Overdue','Open','In Progress','Complete'].filter(s=>buckets[s].length).map(s=>`
    <div class="sect-title">${s==='Complete'?'Completed':s} <span class="pill ${s==='Overdue'?'p-bad':s==='Complete'?'p-ok':s==='In Progress'?'p-info':'p-warn'}" style="margin-left:4px"><span class="dt"></span>${buckets[s].length}</span></div>
    ${actionTable(buckets[s])}
  `).join('')}`;
};
function actionTable(list){
  const prCls=p=>p==='High'?'p-bad':p==='Medium'?'p-warn':'p-muted';
  return `<div class="tblwrap"><table class="tbl">
    <thead><tr><th>Task</th><th>Campus</th><th>Owner</th><th>Due</th><th>Priority</th><th>Status</th></tr></thead>
    <tbody>${list.map(a=>{const i=ACTIONS.indexOf(a);return `<tr>
      <td class="b">${a.task}</td><td class="small muted">${a.campus}</td><td>${a.owner}</td><td>${a.due}</td>
      <td><span class="pill ${prCls(a.priority)}"><span class="dt"></span>${a.priority}</span></td>
      <td><select onchange="setActionStatus(${i},this.value)" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600">
        ${['Open','In Progress','Overdue','Complete'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
    </tr>`}).join('')}</tbody></table></div>`;
}
function setActionStatus(i,v){ACTIONS[i].status=v;render();toast('Updated');}

/* ===================== RECOGNITION ===================== */
PAGES.recognition=function(){
  V().innerHTML=`
  <div class="card" style="margin-bottom:16px">
    <h3>A running feed of every recognition submitted</h3>
    <div class="desc">Filter by campus, department, date, event, or type. At year-end you instantly know who to celebrate.</div>
    <div class="row" style="gap:10px">
      <input id="recSearch" placeholder="Search name, department, campus, event…" oninput="filterRec()" style="flex:1;padding:9px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px">
      <select id="recKind" onchange="filterRec()" style="padding:9px 12px;border:1px solid var(--line);border-radius:10px"><option value="">All types</option><option>Volunteer</option><option>Employee</option></select>
    </div>
  </div>
  <div id="recList" class="grid g2"></div>`;
  filterRec();
};
function recCard(r){
  return `<div class="card">
    <div style="display:flex;gap:12px">
      <div style="font-size:26px">⭐</div>
      <div style="flex:1">
        <div class="b" style="font-size:15px">${r.name}</div>
        <div><span class="pill p-gold" style="margin-right:6px"><span class="dt"></span>${r.dept}</span><span class="small muted">${r.campus} · ${r.event}</span></div>
        <p style="margin:8px 0 6px">${r.reason}</p>
        <div class="small muted">Recognized by ${r.by} · ${r.date} · ${r.kind}</div>
      </div>
    </div></div>`;
}
function filterRec(){
  const q=(document.getElementById('recSearch').value||'').toLowerCase();
  const kind=document.getElementById('recKind').value;
  let list=RECOGNITION.filter(r=>(r.name+r.dept+r.campus+r.event+r.reason).toLowerCase().includes(q));
  if(kind)list=list.filter(r=>r.kind===kind);
  if(CUR!=='central')list=list.filter(r=>r.campus===campusObj().name);
  document.getElementById('recList').innerHTML=list.map(recCard).join('')||'<div class="empty">No recognition matches.</div>';
}

/* ===================== MINISTRY INTELLIGENCE ===================== */
const INTEL_QA=[
  {q:/park/i,a:()=>`<b>2 campuses flagged parking</b> this weekend: <b>Riverchase</b> (rain, cones missing) and <b>Greystone</b> (congestion after 9:30). Historically parking complaints spike <b>+180% on rain weekends</b> and during <b>Easter</b>. Recommended: pre-stage the weather parking plan.`},
  {q:/declin|drop|down|trend|attend/i,a:()=>`Across 26 campuses, most are trending up week-over-week. <b>Riverchase</b> and <b>Tuscaloosa</b> are the two soft spots — Riverchase hasn't submitted this Sunday's report and has 12 open Kids volunteer slots. Suggest a campus health check.`},
  {q:/audio|served|40|volunteer.*most/i,a:()=>`In Audio, <b>John Smith</b> (Greystone) has served <b>212 Sundays</b> — the most of any audio volunteer. <b>Tyler Beard</b> (Auburn) trained 4 new audio volunteers this month. Both are strong mentorship-track candidates.`},
  {q:/recurring|common|pattern|issue/i,a:()=>`Recurring themes across campuses: <b>1) Coffee running low on peak weekends</b> (5 campuses), <b>2) Parking during weather</b> (Riverchase, Greystone), <b>3) ProPresenter media prep</b> (Riverchase). A standardized weather playbook is the highest-leverage fix.`},
  {q:/easter|compare|christmas|last (three|3)/i,a:()=>`Easter trend (all-campus): <b>2023 ~31k → 2024 ~34k → 2025 ~36k</b>, +8%/yr. Top recurring Easter issue: parking overflow before the 9:30 service. First-time guests roughly double.`},
  {q:/recognition|celebrate|above and beyond/i,a:()=>`This week <b>9 recognitions</b> were submitted across 6 campuses. Standouts: Sarah Jones (Grants Mill, Guest Services), John Smith (Greystone, Production), and the Huntsville Kids Team. Guest Services leads all departments in recognitions this month.`},
];
let intelHistory=[];
PAGES.intel=function(){
  V().innerHTML=`
  <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#0f2440,#1c3760);color:#fff;border:none">
    <div style="display:flex;align-items:center;gap:12px"><span style="font-size:26px">✦</span>
      <div><div class="b" style="color:#fff;font-size:16px">Ministry Intelligence</div>
      <div style="color:#c6d3e6;font-size:13px">Every report, note, recognition & action item feeds one AI knowledge base. Ask leadership-level questions across every campus and event.</div></div></div>
  </div>
  <div class="card">
    <div class="chat" id="chatBox" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="row" id="suggBox" style="gap:8px;margin-top:6px">
      ${['Which campuses had parking issues?','Show recurring issues across all campuses','Who has served in Audio the most?','Compare this Easter to the last three years','Who should we celebrate this week?'].map(s=>`<button class="btn sm" onclick="askIntel(this.textContent)">${s}</button>`).join('')}
    </div>
    <div class="row" style="gap:8px;margin-top:14px">
      <input id="intelIn" placeholder="Ask anything across every campus and event…" style="flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px" onkeydown="if(event.key==='Enter'){askIntel(this.value);this.value=''}">
      <button class="btn pri" onclick="const i=document.getElementById('intelIn');askIntel(i.value);i.value=''">Ask</button>
    </div>
  </div>`;
  const box=document.getElementById('chatBox');
  if(!intelHistory.length)intelHistory.push({r:'a',t:'Hi — I can search across every Campus Report, recognition, and action item. Try a suggestion below, or ask your own.'});
  intelHistory.forEach(m=>box.appendChild(msgEl(m)));box.scrollTop=box.scrollHeight;
};
function msgEl(m){const d=document.createElement('div');d.style.cssText=`max-width:88%;padding:12px 15px;border-radius:14px;font-size:13.5px;line-height:1.55;${m.r==='u'?'align-self:flex-end;background:var(--navy2);color:#fff;border-bottom-right-radius:5px':'align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px'}`;d.innerHTML=m.t;return d;}
function askIntel(q){q=(q||'').trim();if(!q)return;const box=document.getElementById('chatBox');
  intelHistory.push({r:'u',t:q});box.appendChild(msgEl({r:'u',t:q}));
  const think=msgEl({r:'a',t:'<span class="muted">✦ Searching 26 campuses…</span>'});box.appendChild(think);box.scrollTop=box.scrollHeight;
  setTimeout(()=>{const m=INTEL_QA.find(x=>x.q.test(q));const ans=m?m.a():`I searched every campus report but didn't find a strong match. Try asking about <b>attendance, parking, volunteers, recurring issues, recognition, or events</b> like Easter or Motion.`;
    think.remove();intelHistory.push({r:'a',t:ans});box.appendChild(msgEl({r:'a',t:ans}));box.scrollTop=box.scrollHeight;},600);
}

/* ---- clock ---- */
function tick(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  document.getElementById('clockT').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  document.getElementById('clockD').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});}

/* ---- modal ---- */
function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalBg').classList.add('on');}
function closeModal(){document.getElementById('modalBg').classList.remove('on');}

/* ---- boot ---- */
render();tick();setInterval(tick,1000);
</script>
</body>
</html>
