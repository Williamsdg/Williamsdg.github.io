<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide Reader — GameFAQs Redesign Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1117;--bg-2:#151a23;--bg-3:#1b2230;--panel:#161c27;--panel-2:#1d2533;
    --line:#28313f;--line-2:#323d4f;--text:#e7ecf3;--text-2:#a3afc0;--text-3:#6c7a8d;
    --brand:#ff4d4d;--brand-2:#ff7a4d;--accent:#4d9fff;--green:#37d67a;--gold:#ffc44d;
    --shadow:0 8px 30px rgba(0,0,0,.35);--ease:cubic-bezier(.22,.61,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  body.sepia{--bg:#1c1812;--bg-2:#241f17;--bg-3:#2c261c;--panel:#231e16;--line:#3a3225;--line-2:#4a4030;--text:#ece2cf;--text-2:#c5b89e;--text-3:#8c7e63}
  a{color:inherit;text-decoration:none}
  .mono{font-family:'JetBrains Mono',monospace}

  .demo-banner{background:linear-gradient(90deg,#ff4d4d,#ff7a4d);color:#1a0e0e;font-weight:700;font-size:13px;text-align:center;padding:8px 16px}
  .demo-banner a{text-decoration:underline;font-weight:800}

  header.rbar{position:sticky;top:0;z-index:60;background:rgba(14,17,23,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  body.sepia header.rbar{background:rgba(28,24,18,.92)}
  .rbar-in{display:flex;align-items:center;gap:14px;height:58px;max-width:1180px;margin:0 auto;padding:0 20px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;flex:none}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
  .logo .faqs{background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .rtitle{flex:1;min-width:0;font-size:13.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .rtools{display:flex;gap:6px;align-items:center;flex:none}
  .tbtn{background:var(--bg-3);border:1px solid var(--line-2);color:var(--text-2);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:all .12s}
  .tbtn:hover{color:var(--text);border-color:var(--brand)}
  .tbtn.on{color:var(--brand-2);border-color:var(--brand)}
  .rsearch{position:relative}
  .rsearch input{height:34px;width:160px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--text);font-size:13px;padding:0 12px 0 32px;outline:none}
  .rsearch input:focus{border-color:var(--brand);width:200px}
  .rsearch .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3)}

  .layout{display:grid;grid-template-columns:260px 1fr;max-width:1180px;margin:0 auto;min-height:calc(100vh - 100px)}
  .toc{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
  .toc .crumb{font-size:12px;color:var(--text-3);margin:0 8px 16px}
  .toc .crumb a{color:var(--brand-2)}
  .toc-h{font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;margin:0 8px 10px}
  .toc a.tl{display:block;font-size:13.5px;color:var(--text-2);padding:8px 10px;border-radius:8px;margin-bottom:2px;transition:all .12s;cursor:pointer}
  .toc a.tl:hover{background:var(--bg-3);color:var(--text)}
  .toc a.tl.on{background:rgba(255,77,77,.12);color:var(--brand-2);font-weight:600;border-left:2px solid var(--brand)}

  .reading{padding:36px 0;display:flex;justify-content:center}
  .doc{width:100%;max-width:var(--col,760px);padding:0 32px;transition:max-width .2s}
  .doc .gtitle{font-size:13px;color:var(--brand-2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .doc h1{font-size:30px;font-weight:900;letter-spacing:-.6px;margin-bottom:6px;line-height:1.1}
  .doc .byline{font-size:13px;color:var(--text-3);margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .doc .byline b{color:var(--text-2)}
  .doc h2{font-size:21px;font-weight:800;margin:34px 0 12px;letter-spacing:-.3px;scroll-margin-top:74px}
  .doc h3{font-size:16px;font-weight:800;margin:24px 0 10px;color:var(--brand-2)}
  .doc p{font-size:var(--fs,16px);color:var(--text-2);margin-bottom:15px;line-height:1.8}
  .doc b{color:var(--text)}
  .doc .callout{background:rgba(77,159,255,.08);border:1px solid rgba(77,159,255,.25);border-left:3px solid var(--accent);border-radius:8px;padding:13px 16px;margin:0 0 16px;font-size:14px;color:var(--text-2)}
  .doc .callout b{color:var(--accent)}
  .doc .tip{background:rgba(255,196,77,.08);border:1px solid rgba(255,196,77,.25);border-left:3px solid var(--gold);border-radius:8px;padding:13px 16px;margin:0 0 16px;font-size:14px;color:var(--text-2)}
  .doc .tip b{color:var(--gold)}
  .doc pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:15px 18px;font-size:13px;color:var(--text-2);overflow:auto;margin-bottom:16px;line-height:1.7;font-family:'JetBrains Mono',monospace}
  body.sepia .doc pre{background:#15110b}
  .doc ul{margin:0 0 16px 22px;color:var(--text-2)}
  .doc li{margin-bottom:7px;font-size:var(--fs,16px)}
  mark{background:rgba(255,196,77,.45);color:var(--text);border-radius:3px;padding:0 2px}

  .docnav{display:flex;justify-content:space-between;gap:14px;margin-top:46px;padding-top:24px;border-top:1px solid var(--line)}
  .docnav a{flex:1;padding:14px 18px;border:1px solid var(--line);border-radius:11px;background:var(--panel);transition:border-color .15s,transform .15s;cursor:pointer}
  .docnav a:hover{border-color:var(--brand);transform:translateY(-2px)}
  .docnav .dl{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .docnav .dt{font-size:14px;font-weight:700}
  .docnav a.next{text-align:right}
  .docnav a.disabled{opacity:.35;pointer-events:none}

  .progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand-2));width:0;z-index:70;transition:width .1s}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .toc{display:none}
    .rsearch input{width:120px}
    .doc{padding:0 20px}
  }
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div class="demo-banner">⚡ Guide Reader concept — the modern home for GameFAQs' plaintext FAQs. <a href="index.html">← Homepage</a></div>

<header class="rbar">
  <div class="rbar-in">
    <a href="index.html" class="logo"><span class="mark">G</span><span><span style="color:var(--text)">Game</span><span class="faqs">FAQs</span></span></a>
    <div class="rtitle" id="rtitle">Loading guide…</div>
    <div class="rtools">
      <div class="rsearch">
        <svg class="si" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="find" placeholder="Find in guide…">
      </div>
      <button class="tbtn" id="fsDown" title="Smaller text">A−</button>
      <button class="tbtn" id="fsUp" title="Larger text">A＋</button>
      <button class="tbtn" id="widthBtn" title="Toggle width">⇄</button>
      <button class="tbtn" id="sepiaBtn" title="Sepia mode">☾</button>
      <button class="tbtn" id="printBtn" title="Print / save">⎙</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="toc">
    <div class="crumb"><a href="#" id="backGame">← Back to game</a></div>
    <div class="toc-h">Contents</div>
    <nav id="toc"></nav>
  </aside>
  <div class="reading">
    <article class="doc" id="doc"></article>
  </div>
</div>

<script src="games-data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'elden-ring-nightreign';
  const game = (window.GAMES||[]).find(g=>g.id===id) || (window.GAMES||[])[0];

  document.getElementById('backGame').href = 'game.html?id=' + game.id;
  const guideTitle = game.guides[0].title + ' — ' + game.title;
  document.getElementById('rtitle').textContent = guideTitle;
  document.title = guideTitle + ' — Guide Reader';

  // Build a sample guide body, tailored slightly to the game.
  const sections = [
    {id:'intro', t:'Introduction',
     html:`<p>Welcome to the complete <b>${game.title}</b> walkthrough. This guide is written for players who want to see everything — no missed collectibles, no missed optional content. It's spoiler-light in the early sections and clearly flags anything story-critical.</p>
     <div class="callout"><b>◆ How to use this guide:</b> Use the table of contents on the left to jump anywhere, or the Find box up top to search the whole guide. Adjust font size and width to taste — it remembers your settings as you read.</div>
     <p>Estimated completion time: <b>${30 + (game.guideCount % 40)}–${55 + (game.guideCount % 40)} hours</b> for the critical path, longer for 100%.</p>`},
    {id:'start', t:'Getting Started',
     html:`<p>Before diving in, a few setup notes that will save you grief later in <b>${game.title}</b>.</p>
     <h3>Recommended difficulty</h3>
     <p>If this is your first time, start on the standard difficulty. The systems below ramp up quickly and there's no shame in adjusting later.</p>
     <div class="tip"><b>✦ Tip:</b> Bind your most-used action to a comfortable button now. You'll be doing it thousands of times.</div>
     <h3>Early priorities</h3>
     <ul>
       <li>Grab every map fragment you can reach — they reveal points of interest.</li>
       <li>Don't over-invest in your first build; respec options open up soon.</li>
       <li>Talk to every NPC at your hub at least once to unlock side content.</li>
     </ul>`},
    {id:'route', t:'Optimal Early Route',
     html:`<p>This is the fastest way to snowball your power without skipping anything important.</p>
     <pre>  1. Hub / Starting Area ........ Tutorial, first upgrades
  2. First Region (West) ........ Map fragment + key item
  3. Optional Mini-Boss ......... Big resource payout, skippable
  4. Second Region ............. Unlocks fast travel network
  5. Return to Hub ............. Spend resources, respec</pre>
     <p>Following this loop, you should hit a comfortable mid-game power spike before the first major story wall.</p>
     <div class="callout"><b>◆ Note:</b> Step 3 is optional but strongly recommended — it roughly doubles your early resources.</div>`},
    {id:'boss', t:'First Major Boss',
     html:`<p>The first real difficulty check. Here's how to break it down.</p>
     <h3>Phase 1</h3>
     <p>Stay mobile and punish after its heavy attacks. Greed is the number-one cause of death here — two hits and reset to a safe distance.</p>
     <h3>Phase 2</h3>
     <p>The arena changes and adds a new attack pattern. Watch for the wind-up tell; it's generous, and dodging through it leaves a long opening.</p>
     <div class="tip"><b>✦ Tip:</b> If you're struggling, the optional mini-boss from the previous section drops gear that trivializes this fight.</div>`},
    {id:'collect', t:'Collectibles & 100%',
     html:`<p>Everything you need for full completion of <b>${game.title}</b>, organized by region so you can clean up as you go.</p>
     <ul>
       <li><b>Region 1:</b> 8 collectibles, 2 optional bosses, 1 hidden vendor.</li>
       <li><b>Region 2:</b> 12 collectibles, a questline that gates the true ending.</li>
       <li><b>Endgame:</b> point of no return is clearly marked in-game — finish side content first.</li>
     </ul>
     <div class="callout"><b>◆ Missables:</b> Only the Region 2 questline is truly missable. Everything else can be cleaned up after the credits.</div>`},
    {id:'credits', t:'Credits & Thanks',
     html:`<p>This guide was written by <b>${game.guides[0].author}</b> for the GameFAQs community. Thanks to the message board regulars who tested routes and reported corrections.</p>
     <p class="mono" style="color:var(--text-3);font-size:13px">Version 1.4 · ${game.guides[0].size} · This is a design-concept sample guide, not the real text.</p>`}
  ];

  // render TOC
  const toc = document.getElementById('toc');
  toc.innerHTML = sections.map((s,i)=>`<a class="tl${i===0?' on':''}" data-jump="${s.id}">${s.t}</a>`).join('');

  // render doc
  const doc = document.getElementById('doc');
  doc.innerHTML = `
    <div class="gtitle">${game.title}</div>
    <h1>${game.guides[0].title}</h1>
    <div class="byline">by <b>${game.guides[0].author}</b> · ${game.guides[0].type} · ${game.guides[0].size} · last updated v1.4</div>
    ${sections.map(s=>`<section><h2 id="${s.id}">${s.t}</h2>${s.html}</section>`).join('')}
    <div class="docnav">
      <a class="prev disabled"><div class="dl">← Previous game</div><div class="dt">—</div></a>
      <a class="next" href="game.html?id=${game.id}"><div class="dl">Up next</div><div class="dt">Back to ${game.title} →</div></a>
    </div>`;

  // TOC click -> smooth scroll + active state
  toc.querySelectorAll('.tl').forEach(a=>{
    a.addEventListener('click',()=>{
      const el = document.getElementById(a.dataset.jump);
      el.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

  // scrollspy + reading progress
  const heads = sections.map(s=>document.getElementById(s.id));
  const prog = document.getElementById('prog');
  function onScroll(){
    const st = window.scrollY, h = document.body.scrollHeight - window.innerHeight;
    prog.style.width = Math.min(100,(st/h)*100) + '%';
    let cur = 0;
    heads.forEach((hd,i)=>{ if(hd.getBoundingClientRect().top < 120) cur = i; });
    toc.querySelectorAll('.tl').forEach((a,i)=>a.classList.toggle('on', i===cur));
  }
  window.addEventListener('scroll', onScroll, {passive:true});

  // ---- reading tools ----
  let fs = 16, col = 760;
  const root = document.documentElement;
  document.getElementById('fsUp').onclick = ()=>{ fs=Math.min(22,fs+1); doc.style.setProperty('--fs',fs+'px'); };
  document.getElementById('fsDown').onclick = ()=>{ fs=Math.max(13,fs-1); doc.style.setProperty('--fs',fs+'px'); };
  const wb = document.getElementById('widthBtn');
  wb.onclick = ()=>{ col = col===760?980:760; doc.style.setProperty('--col',col+'px'); wb.classList.toggle('on',col===980); };
  const sb = document.getElementById('sepiaBtn');
  sb.onclick = ()=>{ document.body.classList.toggle('sepia'); sb.classList.toggle('on'); };
  document.getElementById('printBtn').onclick = ()=>window.print();

  // ---- find in guide (highlight + jump) ----
  const find = document.getElementById('find');
  let lastTerm = '';
  function clearMarks(){
    doc.querySelectorAll('mark').forEach(m=>{ const t=document.createTextNode(m.textContent); m.replaceWith(t); });
    doc.normalize();
  }
  function runFind(term){
    clearMarks();
    if(!term){ return; }
    const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
    const nodes=[]; while(walker.nextNode()){ if(walker.currentNode.parentElement.tagName!=='SCRIPT') nodes.push(walker.currentNode); }
    let first=null;
    nodes.forEach(n=>{
      if(re.test(n.textContent)){
        const span=document.createElement('span');
        span.innerHTML = n.textContent.replace(re,'<mark>$1</mark>');
        n.replaceWith(span);
        if(!first) first = span.querySelector('mark');
      }
    });
    if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
  }
  find.addEventListener('keydown',e=>{ if(e.key==='Enter'){ lastTerm=find.value.trim(); runFind(lastTerm);} });
  find.addEventListener('input',()=>{ if(!find.value) clearMarks(); });

  // keyboard: "/" focuses find
  document.addEventListener('keydown',e=>{
    if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); find.focus(); }
  });

  onScroll();
</script>
</body>
</html>
