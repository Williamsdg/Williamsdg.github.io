<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site Editor — Town of Decatur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1F4D3A;--green-deep:#163A2B;--tint:#E7EEE9;--brick:#A32A00;--brick-deep:#7A1F00;--paper:#F7F3EA;--card:#FCFAF4;--line:#D8D0BE;--rule:#9A9385;--ink:#232323;--ink-2:#474747;--ink-3:#666}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Public Sans",Arial,Helvetica,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
a{color:var(--green)}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border:1px solid var(--green);border-radius:3px;padding:8px 14px;font-weight:700;cursor:pointer;text-decoration:none;min-height:38px;transition:background-color .15s ease}
.btn:hover{background:var(--green-deep)}
.btn.ghost{background:#fff;color:var(--green)}
.btn.ghost:hover{background:var(--tint)}
.btn.brick{background:var(--brick);border-color:var(--brick)}
.btn.brick:hover{background:var(--brick-deep)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px 18px;padding:10px 18px;flex-wrap:wrap}
.top .brand{font-family:Fraunces,Georgia,serif;font-size:22px;color:var(--ink);text-decoration:none;font-weight:600}
.top .brand small{display:block;font:600 10.5px "Public Sans",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.top .status{flex:1;min-width:200px;font-size:13.5px;color:var(--ink-2)}
.top .status b{color:var(--ink)}
.top .status .warn{color:var(--brick)}
.top .who{font-size:13px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card)}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 60px)}
@media(min-width:900px){.shell{grid-template-columns:230px minmax(0,1fr)}}
.side{background:var(--green-deep);padding:14px 10px;display:flex;flex-wrap:wrap;gap:4px}
@media(min-width:900px){.side{display:block;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto;padding:18px 12px}}
.side a{display:block;color:#DCE5DE;text-decoration:none;font-weight:600;padding:9px 12px;border-radius:3px;font-size:14px}
.side a:hover{background:rgba(255,255,255,.08);color:#fff}
.side a.on{background:#fff;color:var(--green-deep)}
.side a:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.side .grp{font:700 10.5px "Public Sans",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9FB5A6;padding:14px 12px 6px;width:100%}
.content{padding:22px 18px 60px;max-width:1040px}
@media(min-width:900px){.content{padding:28px 34px 80px}}
section[data-view]{display:none}
section[data-view].on{display:block}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin:0 0 18px}
.vh h1{font-size:30px}
.vh p{margin:4px 0 0;color:var(--ink-3)}
.note{background:#FFF3C4;border:1px solid #E6D38A;color:#3B2F00;padding:10px 14px;border-radius:3px;font-size:14px;margin:0 0 18px}
.note.green{background:var(--tint);border-color:#C7D8CC;color:var(--green-deep)}
/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);margin:0 0 14px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.panel .ph h2{font-size:19px}
.panel .ph p{margin:3px 0 0;font-size:13.5px;color:var(--ink-3)}
.panel .pbody{padding:4px 16px 18px;border-top:1px solid var(--line)}
.panel .pbody[hidden]{display:none}
.grid2{display:grid;gap:0 18px}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.fld{margin:12px 0 0}
.fld label,.fld .lab{display:block;font:700 12.5px "Public Sans",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink);font:15px "Public Sans",Arial,sans-serif;padding:9px 10px;min-height:40px}
.fld textarea{min-height:92px;resize:vertical;line-height:1.5}
.fld .help{margin:4px 0 0;font-size:12.5px;color:var(--ink-3)}
.sw{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-weight:600}
.sw input{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 0}
/* photo widget */
fieldset.photo{display:grid;grid-template-columns:1fr;gap:12px 18px;margin:14px 0 0;padding:14px;background:#fff;border:1px solid var(--line);min-width:0}
fieldset.photo legend{font:700 12.5px "Public Sans",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 4px}
@media(min-width:640px){fieldset.photo{grid-template-columns:180px minmax(0,1fr)}}
.ph-prev{aspect-ratio:4/3;background:#e9e6df;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--ink-3);font-size:13px}
.ph-prev img{width:100%;height:100%;object-fit:cover;display:block}
.ph-ctl .fld:first-child{margin-top:0}
.ph-ctl .btns{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
/* lists */
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brick);padding:12px 16px 16px;margin:0 0 12px}
.item .ih{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.item .ih b{font-size:15px}
.item .ih .meta{font-size:12.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:6px}
.cards{display:grid;gap:14px}
@media(min-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);padding:14px 16px}
.card h2{font-size:17px;margin:0 0 6px}
.card .big{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:600;line-height:1;margin:4px 0 6px}
.card p{margin:0 0 6px;font-size:14px;color:var(--ink-2)}
.card ul{margin:6px 0 0;padding-left:18px;font-size:14px}
/* media grid */
.mgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mi{background:#fff;border:1px solid var(--line);padding:8px;font-size:12.5px}
.mi .th{aspect-ratio:4/3;background:#e9e6df;overflow:hidden;margin:0 0 6px}
.mi .th img{width:100%;height:100%;object-fit:cover;display:block}
.mi b{display:block;font-size:13px;line-height:1.3;margin:0 0 2px}
.mi .cr{color:var(--ink-3)}
.mi .acts{display:flex;gap:6px;margin:6px 0 0;flex-wrap:wrap}
.meter{height:8px;background:#e9e6df;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--green)}
/* revisions */
.rev{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.rev:last-child{border-bottom:1px solid var(--line)}
/* picker */
dialog{border:1px solid var(--line);border-radius:4px;padding:0;max-width:880px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .db{padding:16px 18px;max-height:70vh;overflow:auto}
.pick{display:flex;flex-direction:column;align-items:stretch;width:100%;height:auto;text-align:left;background:#fff;border:2px solid var(--line);padding:6px;cursor:pointer;border-radius:3px;color:var(--ink)}
.pick:hover{border-color:var(--green)}
.pick .th{display:block;aspect-ratio:4/3;overflow:hidden;background:#e9e6df;margin:0 0 6px}
.pick .th img{width:100%;height:100%;object-fit:cover;display:block}
.pick b{display:block;font-size:12.5px;line-height:1.3}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.sr{position:absolute;left:-9999px}
@media(max-width:899px){.top{position:static;padding:10px 14px}.top .who{display:none}.side{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:8px 10px;-webkit-overflow-scrolling:touch}.side .grp{display:none}.side a{white-space:nowrap;padding:12px 14px}}
@media(pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:44px;padding:10px 12px}.side a{padding:12px 14px}.fld input,.fld select{min-height:44px}}
@media(max-width:400px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}dialog .db{padding:10px}}
.tabnote{background:#FBEDE8;border:1px solid #E9C2B3;border-left:4px solid var(--brick);padding:10px 14px;margin:0 0 16px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">Town of Decatur <small>Site editor</small></a>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="who" id="who"></div>
  <div class="acts">
    <button class="btn ghost" id="btnSave" type="button">Save draft</button>
    <button class="btn ghost" id="btnPreview" type="button">Preview</button>
    <button class="btn brick" id="btnPublish" type="button">Publish</button>
  </div>
</header>
<div class="shell">
  <nav class="side" aria-label="Editor sections" id="sidenav">
    <a href="#overview" data-view="overview">Overview</a>
    <span class="grp">Content</span>
    <a href="#home" data-view="home">Home page</a>
    <a href="#pages" data-view="pages">Town pages</a>
    <a href="#announcements" data-view="announcements">Announcements</a>
    <a href="#stories" data-view="stories">Stories</a>
    <a href="#calendar" data-view="calendar">Town calendar</a>
    <span class="grp">Library</span>
    <a href="#media" data-view="media">Media library</a>
    <span class="grp">Site</span>
    <a href="#settings" data-view="settings">Site settings</a>
  </nav>
  <main class="content" id="content"><div id="tabNote" class="tabnote" hidden>This draft was changed in another tab. Reload this page before editing to avoid overwriting those changes.</div>
    <section data-view="overview" id="v-overview"></section>
    <section data-view="home" id="v-home"></section>
    <section data-view="pages" id="v-pages"></section>
    <section data-view="announcements" id="v-announcements"></section>
    <section data-view="stories" id="v-stories"></section>
    <section data-view="calendar" id="v-calendar"></section>
    <section data-view="media" id="v-media"></section>
    <section data-view="settings" id="v-settings"></section>
  </main>
</div>
<dialog id="picker" aria-labelledby="pickerTitle">
  <div class="dh"><h2 id="pickerTitle" style="font-size:20px">Choose a photo</h2><button class="btn ghost sm" type="button" id="pickerClose">Close</button></div>
  <div class="db" id="pickerBody"></div>
</dialog>
<input type="file" id="fileIn" accept="image/*" class="sr" aria-hidden="true" tabindex="-1">
<div id="toast" role="status" aria-live="polite"></div>
<script src="_site.js?v=12"></script>
<script>
(function(){
  var W=window.WDSite; if(!W){ document.getElementById('status').textContent='The site script did not load.'; return; }
  var D=W.loadDraft(), MANIFEST=null, dirty=false, saveTimer=null, pickTarget=null, pickAfter=null, pagesSel='police';
  var $=function(id){return document.getElementById(id);};
  var esc=W.esc;
  var POS=[['50% 50%','Center'],['50% 0%','Top'],['50% 100%','Bottom'],['0% 50%','Left'],['100% 50%','Right'],['0% 0%','Top left'],['100% 0%','Top right'],['0% 100%','Bottom left'],['100% 100%','Bottom right']];
  var PAGES=W.PAGES;
  var DEFIMG={hero:{src:'img/courthouse-600.webp',alt:'The Newton County Courthouse in Decatur'},exF:{src:'img/downtown-600.webp',alt:'Main street, downtown Decatur'},ex1:{src:'img/turkey-creek-600.webp',alt:'Turkey Creek Water Park'},ex2:{src:'img/library-600.webp',alt:'Jessie Mae Everett Public Library'},ex3:{src:'img/eccc-600.webp',alt:'East Central Community College'},police:{src:'img/police-car-600.webp',alt:'A Town of Decatur police vehicle'},fire:{src:'img/vfd-group-600.webp',alt:'Members of the Decatur Volunteer Fire Department'},works:{src:'img/water-tower-600.webp',alt:'The Decatur water tower'},hall:null,'p-police':{src:'img/police-car-600.webp',alt:'A Town of Decatur police vehicle'},'p-fire-department':{src:'img/vfd-group-600.webp',alt:'Members of the Decatur Volunteer Fire Department'},'p-public-works':{src:'img/water-tower-600.webp',alt:'The Decatur water tower'}};

  /* ---- data helpers ---- */
  function get(path){ return path.split('.').reduce(function(o,k){ return o==null?undefined:o[k]; }, D); }
  function set(path,v){ var ks=path.split('.'), o=D; for(var i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; }
  function today(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
  function uid(){ return 'x'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
  function when(iso){ if(!iso) return ''; var d=new Date(iso); return isNaN(d)?'':d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }
  function nowTime(){ return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2600); }
  function canPublish(){ return W.user().role==='publisher'; }
  function status(extra){ var m=W.meta(), s=$('status');
    s.innerHTML=(dirty?'<span class="warn"><b>Saving…</b></span>':(W.hasDraft()?'<b>Changes waiting to be published</b>':'<b>Nothing waiting to be published</b>'))+
      (extra?' · '+esc(extra):'')+' · Last published: <b>'+(m.lastPublished?esc(when(m.lastPublished))+(m.by?' by '+esc(m.by):''):'never')+'</b>';
    var u=W.user(); $('who').textContent='Signed in as '+u.name+' ('+(u.role==='publisher'?'can publish':'editor, drafts only')+')';
    $('btnPublish').disabled=!canPublish(); $('btnPublish').title=canPublish()?'Make the draft live':'Only approved staff can publish. Ask the Town Clerk to publish this draft.'; }
  function mark(){ dirty=true; status(); clearTimeout(saveTimer); saveTimer=setTimeout(saveDraft,600); }
  function saveDraft(){ clearTimeout(saveTimer); if(JSON.stringify(D)===JSON.stringify(W.loadPublished())){ W.discardDraft(); dirty=false; status('nothing to save'); if(cur==='overview') renderOverview(); return true; } if(!W.saveDraft(D)){ toast('Could not save: this browser’s storage is full.'); return false; } dirty=false; status('saved '+nowTime()); if(cur==='overview') renderOverview(); return true; }
  function publishNow(){ if(!canPublish()) return; if(!saveDraft()) return; if(!confirm('Publish the draft? Residents will see these changes immediately.')) return;
    if(W.publish(D, W.user().name)){ dirty=false; status(); toast('Published — the public site is updated.'); renderOverview(); renderSettings(); } else toast('Publish failed: this browser’s storage is full. Delete an upload in the Media library and try again.'); }
  function preview(){ saveDraft(); var url={home:'index.html',pages:(PAGES.filter(function(p){return p[0]===pagesSel;})[0]||PAGES[0])[2],announcements:'news.html',stories:'stories.html',calendar:'calendar.html'}[cur]||'index.html'; window.open(url+'?preview=1','wdPreview'); }

  /* ---- field builders ---- */
  function fid(path){ return 'f_'+path.replace(/[^a-z0-9]/gi,'_'); }
  function fld(label,path,o){ o=o||{}; var v=get(path); v=v==null?'':v; var id=fid(path);
    var ctl=o.type==='textarea'?'<textarea id="'+id+'" data-bind="'+path+'" rows="'+(o.rows||4)+'" placeholder="'+esc(o.ph||'')+'">'+esc(v)+'</textarea>'
      :o.type==='select'?'<select id="'+id+'" data-bind="'+path+'">'+o.opts.map(function(x){return '<option value="'+esc(x[0])+'"'+(String(v)===x[0]?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select>'
      :'<input id="'+id+'" type="'+(o.type||'text')+'" data-bind="'+path+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'">';
    return '<div class="fld"><label for="'+id+'">'+esc(label)+'</label>'+ctl+(o.help?'<p class="help">'+esc(o.help)+'</p>':'')+'</div>'; }
  function sw(label,path){ var id=fid(path); return '<label class="sw" for="'+id+'"><input type="checkbox" id="'+id+'" data-bind="'+path+'"'+(get(path)?' checked':'')+'>'+esc(label)+'</label>'; }
  function photoBox(path,defKey,opts){ opts=opts||{}; var p=get(path)||null, def=DEFIMG[defKey]||null; var label=opts.label||'Photo';
    var shown=p&&p.src?{src:W.resolveSrc(p.src),alt:p.alt}:(p&&p.remove?null:def);
    return '<fieldset class="photo" data-path="'+path+'" data-def="'+esc(defKey||'')+'" data-label="'+esc(label)+'"><legend>'+esc(label)+'</legend>'+
      '<div class="ph-prev">'+(shown&&shown.src?'<img src="'+esc(shown.src)+'" alt="" style="object-position:'+esc((p&&p.pos)||'50% 50%')+'">':'<span>'+(p&&p.remove?'Photo removed':'No photo')+'</span>')+'</div>'+
      '<div class="ph-ctl"><div class="btns"><button type="button" class="btn sm" data-act="choose">Choose photo</button><button type="button" class="btn ghost sm" data-act="upload">Upload new</button>'+
      (def?'<button type="button" class="btn ghost sm" data-act="default">Use the original</button>':'')+'<button type="button" class="btn ghost sm" data-act="remove">Remove photo</button></div>'+
      fld('Alt text (what the photo shows)',path+'.alt',{ph:def?def.alt:'Describe the photo for screen readers'})+
      fld('Crop position',path+'.pos',{type:'select',opts:POS})+
      (opts.cap?fld('Caption',path+'.cap',{ph:opts.capPh||'Shown under the photo'}):'')+
      '</div></fieldset>'; }
  function panel(id,title,sum,body){ return '<div class="panel" id="'+id+'"><div class="ph"><div><h2 id="'+id+'_h">'+title+'</h2><p id="'+id+'_s">'+sum+'</p></div><button type="button" class="btn ghost sm" id="'+id+'_btn" data-toggle="'+id+'" aria-expanded="false" aria-controls="'+id+'_b" aria-labelledby="'+id+'_btn '+id+'_h">Edit</button></div><div class="pbody" id="'+id+'_b" hidden>'+body+'</div></div>'; }
  function vh(title,sub,acts){ return '<div class="vh"><div><h1>'+title+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="row" style="margin:0">'+(acts||'')+'</div></div>'; }

  /* ---- views ---- */
  function renderOverview(){ var m=W.meta(), u=W.user(), n=(D.news||[]).length, st=(D.stories||[]).length, ev=(D.events||[]).filter(function(e){return e&&e.d&&Date.parse(e.d)>=Date.now()-86400000;}).length, med=Object.keys(W.mediaStore()).length;
    $('v-overview').innerHTML=vh('Overview','Where things stand on the Town of Decatur website.')+
      '<div class="cards">'+
      '<div class="card"><h2>Draft</h2><p class="big" style="font-size:22px">'+(dirty?'Saving…':(W.hasDraft()?'Changes waiting':'Nothing waiting'))+'</p><p>'+(dirty||W.hasDraft()?'There are changes that residents cannot see until you publish.':'Residents see exactly what is in the editor now.')+'</p><div class="row"><button type="button" class="btn sm" data-go="#home">Edit the home page</button><button type="button" class="btn ghost sm" id="ovPreview">Preview draft</button></div></div>'+
      '<div class="card"><h2>Last published</h2><p class="big" style="font-size:22px">'+(m.lastPublished?esc(when(m.lastPublished)):'Never')+'</p><p>'+(m.by?'by '+esc(m.by):'Publish to make the draft live.')+'</p><div class="row"><button type="button" class="btn brick sm" id="ovPublish"'+(canPublish()?'':' disabled')+'>Publish now</button><button type="button" class="btn ghost sm" data-go="#settings">Revision history</button></div></div>'+
      '<div class="card"><h2>Content</h2><ul><li><b>'+n+'</b> announcement'+(n===1?'':'s')+' (home shows the 5 newest)</li><li><b>'+st+'</b> stor'+(st===1?'y':'ies')+'</li><li><b>'+ev+'</b> upcoming event'+(ev===1?'':'s')+'</li><li><b>'+med+'</b> uploaded photo'+(med===1?'':'s')+'</li></ul><div class="row"><button type="button" class="btn ghost sm" data-go="#announcements">Add an announcement</button><button type="button" class="btn ghost sm" data-go="#stories">Write a story</button><button type="button" class="btn ghost sm" data-go="#calendar">Add an event</button></div></div>'+
      '<div class="card"><h2>Signed in</h2><p class="big" style="font-size:22px">'+esc(u.name)+'</p><p>'+(u.role==='publisher'?'Can edit and publish.':'Can edit and save drafts. Publishing needs the Town Clerk.')+'</p><div class="row"><button type="button" class="btn ghost sm" data-go="#settings">Change</button></div></div>'+

  $('fileIn').onchange=function(){ var f=this.files[0]; this.value=''; if(!f) return; var img=new Image(), url=URL.createObjectURL(f);
    img.onload=function(){ var max=1600, w=img.naturalWidth, h=img.naturalHeight, sc=Math.min(1,max/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      var data=c.toDataURL('image/jpeg',0.82), id=uid(); if(W.usage()+data.length>4.5*1024*1024){ toast('Not enough room in this browser for that photo. Delete an upload first.'); return; }
      if(!W.setMedia(id,{src:data,name:f.name.replace(/\.[^.]+$/,''),alt:'',w:c.width,h:c.height})){ toast('Could not store the photo.'); return; }
      if(pickTarget){ var cur=get(pickTarget)||{}; set(pickTarget,{src:'media:'+id,alt:cur.alt||'',w:c.width,h:c.height,pos:cur.pos||'50% 50%',cap:cur.cap||''}); mark(); rerenderPhoto(pickTarget,'upload'); }
      if(pickAfter){ pickAfter(); pickAfter=null; } toast('Photo added to the media library.'); };
    img.onerror=function(){ toast('That file is not an image.'); }; img.src=url; };
  function rerenderPhoto(path,focusAct){ var box=document.querySelector('.photo[data-path="'+path+'"]'); if(!box) return; var def=box.getAttribute('data-def')||null, label=box.getAttribute('data-label')||'Photo'; var hasCap=!!box.querySelector('[data-bind="'+path+'.cap"]'); var tmp=document.createElement('div'); tmp.innerHTML=photoBox(path,def,{cap:hasCap,label:label}); var nb=tmp.firstChild; box.replaceWith(nb); var fb=nb.querySelector('[data-act="'+(focusAct||'choose')+'"]'); if(fb) fb.focus(); }

  /* ---- events ---- */
  document.getElementById('content').addEventListener('input',function(e){ var b=e.target.getAttribute('data-bind'); if(!b) return;
    if(b.indexOf('__media.')===0){ var parts=b.split('.'), ms=W.mediaStore(), m=ms[parts[1]]; if(m){ m.alt=e.target.value; W.setMedia(parts[1],m); walkSet(D,'media:'+parts[1],e.target.value); mark(); } return; }
    var v=e.target.type==='checkbox'?e.target.checked:e.target.value; set(b,v); mark();
    if(b.indexOf('banner.')===0){ var bs=$('p_banner_s'); if(bs) bs.innerHTML=bannerSum(); }
    if(/\.photo\.pos$/.test(b)){ var box=e.target.closest('.photo'); var im=box&&box.querySelector('.ph-prev img'); if(im) im.style.objectPosition=v; } });
  document.getElementById('content').addEventListener('click',function(e){
    var t=e.target.closest('[data-toggle],[data-go],[data-preview],[data-add],[data-del],[data-act],[data-restore],[data-mdel]'); if(!t) return;
    if(t.hasAttribute('data-toggle')){ var p=$(t.getAttribute('data-toggle')); var body=p.querySelector('.pbody'); body.hidden=!body.hidden; t.textContent=body.hidden?'Edit':'Done'; t.setAttribute('aria-expanded',String(!body.hidden)); return; }
    if(t.hasAttribute('data-go')){ location.hash=t.getAttribute('data-go'); return; }
    if(t.hasAttribute('data-preview')){ saveDraft(); window.open(t.getAttribute('data-preview')+'?preview=1','wdPreview'); return; }
    if(t.hasAttribute('data-add')){ var k=t.getAttribute('data-add'); D[k]=D[k]||[]; var item={id:uid(),d:today()}; D[k].push(item); mark(); ({news:renderAnnouncements,stories:renderStories,events:renderCalendar})[k](); var first=document.querySelector('[data-bind="'+k+'.'+(D[k].length-1)+'.t"]'); if(first){ first.focus(); first.scrollIntoView({block:'center'}); } return; }
    if(t.hasAttribute('data-del')){ var k2=t.getAttribute('data-del'), i=+t.getAttribute('data-i'); if(!confirm('Remove this item?')) return; D[k2].splice(i,1); mark(); ({news:renderAnnouncements,stories:renderStories,events:renderCalendar})[k2](); toast('Removed.'); var addb=document.querySelector('[data-add="'+k2+'"]'); if(addb) addb.focus(); return; }
    if(t.hasAttribute('data-restore')){ var ri=+t.getAttribute('data-restore'), rv=W.revisions()[ri]; if((dirty||W.hasDraft())&&!confirm('Replace your current unpublished draft with the version published '+when(rv&&rv.ts)+'? Your draft changes will be lost.')) return; var d=W.restore(ri); if(d){ D=d; dirty=false; renderAll(); status('restored to draft'); toast('That version is now the draft. Nothing changes for residents until you publish.'); } return; }
    if(t.hasAttribute('data-mdel')){ var id=t.getAttribute('data-mdel'), u=usedIn(id); if(!confirm(u.length?'This photo is used on '+u.join(' and ')+'. Deleting it removes it there immediately, without a publish, and the original photo shows instead. Delete it?':'Delete this uploaded photo?')) return; W.deleteMedia(id); renderMedia(); toast('Photo deleted.'); var ab=$('mediaUpload'); if(ab) ab.focus(); return; }
    if(t.hasAttribute('data-act')){ var box=t.closest('.photo'), path=box.getAttribute('data-path'), act=t.getAttribute('data-act');
      if(act==='choose') openPicker(path); else if(act==='upload'){ pickTarget=path; pickAfter=null; $('fileIn').click(); }
      else if(act==='remove'){ set(path,{remove:true}); mark(); rerenderPhoto(path,'choose'); toast('Photo removed from this spot.'); } else if(act==='default'){ set(path,null); mark(); rerenderPhoto(path,'choose'); toast('Original photo restored.'); } return; } });
  $('btnSave').onclick=function(){ if(saveDraft()) toast('Draft saved.'); };
  $('btnPreview').onclick=preview;
  $('btnPublish').onclick=publishNow;
  window.addEventListener('hashchange',route);
  window.addEventListener('beforeunload',function(e){ if(dirty){ saveDraft(); } });
  document.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); if(saveDraft()) toast('Draft saved.'); } });
  renderAll(); route(); status();
})();
</script>
