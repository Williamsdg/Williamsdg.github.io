<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Intake Admin · Williams Digital</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='13' fill='white' text-anchor='middle'%3EWD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070710;--card:rgba(255,255,255,.03);--card2:rgba(255,255,255,.05);--text:#fff;--soft:#a1a1aa;--mute:#71717a;
  --indigo:#6366f1;--purple:#8b5cf6;--cyan:#06b6d4;--pink:#ec4899;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);--ok:#4ade80;--err:#f87171;--warn:#fbbf24}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--cyan)}
/* ---- gate ---- */
.gate{max-width:400px;margin:14vh auto;text-align:center;padding:0 1.5rem}
.logo-mark{width:44px;height:44px;border-radius:11px;background:var(--grad);display:inline-grid;place-items:center;font-size:1rem;font-weight:800;box-shadow:0 0 30px rgba(99,102,241,.4);margin-bottom:1.4rem}
.gate h1{font-size:1.5rem;font-weight:800;margin-bottom:.4rem}
.gate p{color:var(--soft);font-size:.9rem;margin-bottom:1.6rem}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.75rem .9rem;color:var(--text);font-family:inherit;font-size:.94rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple);background:var(--card2)}
.btn{font-family:inherit;font-weight:600;border:none;border-radius:10px;padding:.7rem 1.2rem;cursor:pointer;font-size:.9rem;transition:all .18s}
.btn-p{background:var(--grad);color:#fff}.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:transparent;color:var(--soft);border:1px solid var(--bd)}.btn-g:hover{color:#fff;border-color:var(--bd2)}
.btn-sm{padding:.4rem .8rem;font-size:.8rem;border-radius:8px}
.gate .btn{width:100%;margin-top:.9rem}
.gate-err{color:var(--err);font-size:.85rem;margin-top:.8rem;min-height:1.2em}
/* ---- app ---- */
.app{display:none}
.top{position:sticky;top:0;z-index:20;background:rgba(7,7,16,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd);padding:.9rem 1.5rem;display:flex;align-items:center;gap:.7rem}
.top .brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem}
.top .brand .m{width:28px;height:28px;border-radius:7px;background:var(--grad);display:grid;place-items:center;font-size:.68rem;font-weight:800}
.top .stat{margin-left:auto;font-size:.8rem;color:var(--mute)}
.top .stat b{color:var(--soft)}
.wrap{max-width:1180px;margin:0 auto;padding:1.5rem;display:grid;grid-template-columns:340px 1fr;gap:1.5rem;align-items:start}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
/* list */
.list{display:grid;gap:.6rem}
.searchbar{margin-bottom:.3rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:.9rem 1rem;cursor:pointer;transition:all .18s}
.card:hover{border-color:var(--bd2);background:var(--card2)}
.card.sel{border-color:var(--purple);background:rgba(139,92,246,.08)}
.card .nm{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.card .sub{color:var(--mute);font-size:.78rem;margin-top:.15rem}
.card .foot{display:flex;align-items:center;gap:.5rem;margin-top:.6rem}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .5rem;border-radius:6px}
.b-new{background:rgba(99,102,241,.15);color:#a5b4fc}
.b-reviewed{background:rgba(74,222,128,.12);color:#86efac}
.b-archived{background:rgba(113,113,122,.15);color:var(--mute)}
.b-ready{background:rgba(6,182,212,.12);color:#67e8f9}
.b-pending{background:rgba(251,191,36,.12);color:#fcd34d}
.b-error{background:rgba(248,113,113,.12);color:#fca5a5}
.pctmini{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--soft)}
/* detail */
.detail{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1.6rem;min-height:60vh}
.empty{color:var(--mute);text-align:center;padding:5rem 1rem;font-size:.95rem}
.dh{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.dh h2{font-size:1.5rem;font-weight:800}
.dh .contact{color:var(--soft);font-size:.88rem;margin-top:.2rem}
.dh .acts{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}
.brief{margin-top:1.5rem;background:linear-gradient(135deg,rgba(99,102,241,.09),rgba(6,182,212,.06));border:1px solid rgba(139,92,246,.22);border-radius:14px;padding:1.3rem}
.brief h3{font-size:.72rem;font-family:'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.brief .grid{display:grid;gap:.85rem}
.bf{display:grid;grid-template-columns:150px 1fr;gap:1rem}
@media(max-width:560px){.bf{grid-template-columns:1fr;gap:.2rem}}
.bf .k{font-size:.76rem;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding-top:.1rem}
.bf .v{font-size:.92rem;color:var(--text)}
.pill{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:20px;padding:.2rem .65rem;font-size:.78rem;margin:.15rem .25rem .15rem 0;color:var(--soft)}
.oq{margin-top:.8rem;padding-top:.8rem;border-top:1px solid var(--bd)}
.oq li{color:var(--soft);font-size:.86rem;margin-left:1.1rem;margin-top:.25rem}
.brief-pending{color:var(--soft);font-size:.9rem;display:flex;align-items:center;gap:.6rem}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--purple);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* raw answers */
.sec{margin-top:1.5rem}
.sec h4{font-size:.72rem;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:.7rem}
.ans{display:grid;grid-template-columns:180px 1fr;gap:.7rem;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.88rem}
.ans .k{color:var(--mute)}
.ans .v{color:var(--text)}
@media(max-width:560px){.ans{grid-template-columns:1fr;gap:.1rem}}
/* files */
.frow{display:flex;align-items:center;gap:.6rem;background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:.55rem .8rem;font-size:.85rem;margin-bottom:.4rem}
.frow .sz{margin-left:auto;color:var(--mute);font-family:'JetBrains Mono',monospace;font-size:.72rem}
/* status editor */
.stedit{margin-top:1.5rem;border:1px solid var(--bd);border-radius:14px;padding:1.2rem}
.stlist{display:grid;gap:.4rem;margin:.8rem 0}
.stitem{display:flex;align-items:center;gap:.7rem;font-size:.9rem}
.stitem input[type=checkbox]{width:auto;accent-color:var(--purple);width:18px;height:18px}
.stitem.done label{color:var(--soft)}
.editrow{display:grid;gap:.7rem;margin-top:.9rem}
.editrow label{font-size:.76rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem;display:block}
.savebar{display:flex;gap:.6rem;align-items:center;margin-top:1rem}
.savemsg{font-size:.8rem;color:var(--ok);opacity:0;transition:opacity .3s}
.savemsg.show{opacity:1}
.linkrow{margin-top:.7rem;font-size:.8rem;color:var(--mute);word-break:break-all}
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--card2);border:1px solid var(--bd2);border-radius:10px;padding:.7rem 1.1rem;font-size:.85rem;z-index:50;opacity:0;transform:translateY(10px);transition:all .3s}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>

<!-- passphrase gate -->
<div class="gate" id="gate">
  <span class="logo-mark">WD</span>
  <h1>Intake Admin</h1>
  <p>Williams Digital · client onboarding</p>
  <input type="password" id="pass" placeholder="Admin passphrase" autocomplete="current-password">
  <button class="btn btn-p" id="unlock">Unlock →</button>
  <div class="gate-err" id="gateErr"></div>
</div>

<!-- app -->
<div class="app" id="app">
  <div class="top">
    <span class="brand"><span class="m">WD</span> Intake Admin</span>
    <span class="stat" id="topstat"></span>
    <button class="btn btn-g btn-sm" id="refresh">↻ Refresh</button>
    <button class="btn btn-g btn-sm" id="lock">Lock</button>
  </div>
  <div class="wrap">
    <div>
      <input class="searchbar" id="search" placeholder="Search name / email…">
      <div class="list" id="list"></div>
    </div>
    <div class="detail" id="detail"><div class="empty">Select a submission to view all of its answers.</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FN="https://tkkhvbkocumyxpgsrpxv.supabase.co/functions/v1/intake-admin";
let PASS=sessionStorage.getItem('wd-admin-pass')||"";
let subs=[], selId=null, curDetail=null;

const $=s=>document.querySelector(s);
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){return d? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

async function api(payload){
  const res=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS},body:JSON.stringify(payload)});
  if(res.status===401){throw new Error('unauthorized');}
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'request failed');
  return data;
}

/* ---- gate ---- */
async function tryUnlock(p){
  PASS=p;
  try{
    const d=await api({action:'list'});
    sessionStorage.setItem('wd-admin-pass',PASS);
    subs=d.submissions;
    $('#gate').style.display='none';
    $('#app').style.display='block';
    renderList();
  }catch(e){
    if(e.message==='unauthorized'){$('#gateErr').textContent='Wrong passphrase.';}
    else{$('#gateErr').textContent=e.message;}
    PASS="";
    sessionStorage.removeItem('wd-admin-pass');
  }
}
$('#unlock').addEventListener('click',()=>tryUnlock($('#pass').value));
$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock($('#pass').value);});
$('#lock').addEventListener('click',()=>{sessionStorage.removeItem('wd-admin-pass');location.reload();});
$('#refresh').addEventListener('click',async()=>{try{subs=(await api({action:'list'})).submissions;renderList();toast('Refreshed');}catch(e){toast(e.message);}});
if(PASS) tryUnlock(PASS);

/* ---- list ---- */
function renderList(){
  const q=($('#search').value||'').toLowerCase();
  const filtered=subs.filter(s=>!q||`${s.business_name} ${s.email} ${s.contact_name}`.toLowerCase().includes(q));
  $('#topstat').innerHTML=`<b>${subs.length}</b> submissions`;
  $('#list').innerHTML=filtered.map(s=>`
    <div class="card ${s.id===selId?'sel':''}" data-id="${s.id}">
      <div class="nm">${esc(s.business_name||'—')}</div>
      <div class="sub">${esc(s.contact_name||'')} ${s.email?'· '+esc(s.email):''}</div>
      <div class="foot">
        <span class="badge b-${esc(s.status||'new')}">${esc(s.status||'new')}</span>
        ${s.pct!=null?`<span class="pctmini">${s.pct}%</span>`:''}
      </div>
    </div>`).join('') || '<div class="empty">No matches.</div>';
  $('#list').querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)));
}
$('#search').addEventListener('input',renderList);

/* ---- detail ---- */
const CHIPS=v=>Array.isArray(v)&&v.length?v.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span style="color:var(--mute)">—</span>';

async function openDetail(id){
  selId=id;renderList();
  $('#detail').innerHTML='<div class="empty"><span class="spin"></span> Loading…</div>';
  try{
    const d=await api({action:'get',id});
    curDetail=d;
    renderDetail(d);
  }catch(e){$('#detail').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
}

function renderDetail(d){
  const s=d.submission, st=d.status;
  const statusLink=`${location.origin}${location.pathname.replace('intake-admin/','project-status/')}?id=${s.id}`;

  const answer=(k,label,val)=>`<div class="ans"><div class="k">${label}</div><div class="v">${val||'<span style="color:var(--mute)">—</span>'}</div></div>`;

  $('#detail').innerHTML=`
    <div class="dh">
      <div>
        <h2>${esc(s.business_name||'—')}</h2>
        <div class="contact">${esc(s.contact_name||'')} · ${esc(s.email||'')} ${s.phone?'· '+esc(s.phone):''}</div>
        <div class="mono" style="font-size:.72rem;color:var(--mute);margin-top:.3rem">${fmtDate(s.created_at)}</div>
      </div>
      <div class="acts">
        <button class="btn btn-g btn-sm" onclick="mark('${s.id}','reviewed')">Mark reviewed</button>
        <button class="btn btn-g btn-sm" onclick="mark('${s.id}','archived')">Archive</button>
      </div>
    </div>

    <div class="sec">
      <h4>About the business</h4>
      ${answer('','What they do',esc(s.what_you_do))}
      ${answer('','Ideal customer',esc(s.ideal_customer))}
      ${answer('','Differentiator',esc(s.differentiator))}
      ${answer('','Services',CHIPS(s.services)+(s.services_other?' <span class="pill">'+esc(s.services_other)+'</span>':''))}
    </div>
    <div class="sec">
      <h4>Goals</h4>
      ${answer('','Website goals',CHIPS(s.goals)+(s.goals_other?' <span class="pill">'+esc(s.goals_other)+'</span>':''))}
      ${answer('','6-month vision',esc(s.six_month_vision))}
    </div>
    <div class="sec">
      <h4>Design</h4>
      ${answer('','Styles',CHIPS(s.styles))}
      ${answer('','Brand words',CHIPS(s.brand_words))}
      ${answer('','Inspiration',(s.inspiration&&s.inspiration.length)?s.inspiration.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('<br>'):'')}
    </div>
    <div class="sec">
      <h4>Build</h4>
      ${answer('','Features',CHIPS(s.features))}
      ${answer('','Has content',esc(s.content_status))}
      ${answer('','Dashboard needs',CHIPS(s.dashboard))}
      ${answer('','Unique process',esc(s.unique_process))}
    </div>
    <div class="sec">
      <h4>Success</h4>
      ${answer('','"Worth it" if…',esc(s.worth_it))}
      ${answer('','Anything else',esc(s.anything_else))}
    </div>

    ${d.files&&d.files.length?`<div class="sec"><h4>Uploaded files (${d.files.length})</h4>${d.files.map(f=>`<div class="frow"><span>📄</span><span>${esc(f.file_name)}</span><span class="sz">${f.url?`<a href="${f.url}" target="_blank">download</a>`:'—'}</span></div>`).join('')}</div>`:''}

    ${renderStatusEditor(s.id,st)}
    <div class="linkrow">Client status link: <a href="${statusLink}" target="_blank">${statusLink}</a></div>
  `;
}

function renderStatusEditor(id,st){
  const stages=(st&&st.stages)||[
    {key:'discovery',label:'Discovery',done:false},{key:'assets',label:'Assets Received',done:false},
    {key:'content',label:'Content Written',done:false},{key:'homepage',label:'Homepage Design',done:false},
    {key:'review',label:'Client Review',done:false},{key:'development',label:'Development',done:false},
    {key:'mobile',label:'Mobile Optimization',done:false},{key:'seo',label:'SEO',done:false},
    {key:'testing',label:'Testing',done:false},{key:'launch',label:'Launch',done:false}
  ];
  const done=stages.filter(s=>s.done).length;
  return `<div class="stedit">
    <h4 style="font-size:.72rem;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)">Project status · client dashboard <span style="color:var(--mute)">(${Math.round(done/stages.length*100)}%)</span></h4>
    <div class="stlist" id="stlist">
      ${stages.map((s,i)=>`<div class="stitem ${s.done?'done':''}"><input type="checkbox" id="st${i}" ${s.done?'checked':''} data-i="${i}"><label for="st${i}">${esc(s.label)}</label></div>`).join('')}
    </div>
    <div class="editrow">
      <div><label>Project name (shown to client)</label><input id="ed_name" value="${esc((st&&st.project_name)||'')}"></div>
      <div><label>Estimated timeline</label><input id="ed_time" value="${esc((st&&st.timeline_note)||'2–4 weeks')}"></div>
      <div><label>Public note (optional, shown to client)</label><textarea id="ed_note" rows="2">${esc((st&&st.public_note)||'')}</textarea></div>
    </div>
    <div class="savebar">
      <button class="btn btn-p btn-sm" onclick="saveStatus('${id}')">Save status</button>
      <span class="savemsg" id="savemsg">✓ Saved</span>
    </div>
  </div>`;
}

/* ---- actions ---- */
window.saveStatus=async(id)=>{
  const boxes=[...document.querySelectorAll('#stlist input')];
  const base=(curDetail.status&&curDetail.status.stages)||[];
  const labels=['Discovery','Assets Received','Content Written','Homepage Design','Client Review','Development','Mobile Optimization','SEO','Testing','Launch'];
  const keys=['discovery','assets','content','homepage','review','development','mobile','seo','testing','launch'];
  const stages=boxes.map((b,i)=>({key:(base[i]&&base[i].key)||keys[i],label:(base[i]&&base[i].label)||labels[i],done:b.checked}));
  try{
    await api({action:'stages',id,stages,project_name:$('#ed_name').value,timeline_note:$('#ed_time').value,public_note:$('#ed_note').value});
    $('#savemsg').classList.add('show');setTimeout(()=>$('#savemsg').classList.remove('show'),1800);
    subs=(await api({action:'list'})).submissions;renderList();
    // refresh curDetail.status locally
    curDetail.status={...(curDetail.status||{}),stages,project_name:$('#ed_name').value,timeline_note:$('#ed_time').value,public_note:$('#ed_note').value};
  }catch(e){toast(e.message);}
};
window.mark=async(id,status)=>{try{await api({action:'mark',id,status});toast('Marked '+status);subs=(await api({action:'list'})).submissions;renderList();}catch(e){toast(e.message);}};
</script>
</body>
</html>
