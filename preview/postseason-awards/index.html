<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynasty Postseason Awards Tracker</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a30;
    --panel-2: #1a2240;
    --line: #283156;
    --text: #e8ecf7;
    --muted: #8a93b3;
    --accent: #f5b94a;
    --accent-2: #6aa6ff;
    --first: #f5b94a;
    --second: #b8bfd6;
    --winner: #f5b94a;
    --danger: #ff6a6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0a0f1f, #0b1020 200px);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 22px 28px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 0.3px; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent-2); }
  button.primary { background: var(--accent); color: #1b1300; border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); border-color: #4a2a2a; }
  .years {
    display: flex;
    gap: 6px;
    padding: 14px 28px 0;
    flex-wrap: wrap;
  }
  .year-tab {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 6px 6px 0 0;
    font-size: 13px;
    cursor: pointer;
  }
  .year-tab.active {
    background: var(--panel);
    color: var(--accent);
    border-color: var(--accent);
    border-bottom-color: var(--panel);
  }
  .view-tabs {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    margin-top: -1px;
    border-bottom: 1px solid var(--line);
  }
  .view-tab {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 0 28px 60px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 18px;
  }
  .section { margin-top: 22px; }
  .section:first-child { margin-top: 0; }
  .section h2 {
    margin: 0 0 10px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-2);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
  }
  th {
    background: var(--panel-2);
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  td[contenteditable="true"]:focus {
    outline: 1px solid var(--accent-2);
    background: rgba(106, 166, 255, 0.06);
  }
  .rank-1 { color: var(--first); font-weight: 600; }
  .rank-2 { color: var(--second); }
  .row-actions { width: 36px; text-align: center; }
  .row-actions button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 2px 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .row-actions button:hover { color: var(--danger); }
  .add-row {
    margin-top: 8px;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 8px;
    border-radius: 6px;
    width: 100%;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
  }
  .add-row:hover { color: var(--accent); border-color: var(--accent); }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
    font-size: 13px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 1000;
  }
  .toast.show { opacity: 1; }
  .meta { color: var(--muted); font-size: 11px; margin-top: 14px; }
  .award-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
  }
  .award-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .award-card h3 {
    margin: 0;
    padding: 10px 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.15);
  }
  .award-card table { font-size: 12px; }
  .award-card td, .award-card th { padding: 5px 10px; }
  .award-card tr.winner td {
    background: rgba(245, 185, 74, 0.08);
    color: var(--winner);
    font-weight: 600;
  }
  .award-card tr.winner td:first-child::before {
    content: "★ ";
    color: var(--winner);
  }
  .winner-toggle {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 14px;
  }
  .winner-toggle.active { color: var(--winner); }

  /* Allow horizontal scroll only inside table wrappers, not the page */
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table { min-width: 540px; }
  .award-card .table-scroll table { min-width: 460px; }

  /* Tablet / large phone landscape */
  @media (max-width: 900px) {
    header { padding: 16px 16px 12px; }
    header h1 { font-size: 18px; }
    header .sub { font-size: 11px; }
    .years { padding: 12px 16px 0; }
    .view-tabs { padding: 0 16px; }
    main { padding: 0 16px 40px; }
    .panel { padding: 12px; }
    .award-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  }

  /* Phone portrait */
  @media (max-width: 600px) {
    header {
      padding: 12px;
      flex-direction: column;
      align-items: stretch;
    }
    header h1 { font-size: 16px; }
    header .sub { font-size: 10px; }
    .toolbar { justify-content: flex-start; }
    .toolbar button { padding: 6px 10px; font-size: 12px; flex: 1 1 auto; }
    .years {
      padding: 10px 12px 0;
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .year-tab {
      padding: 7px 12px;
      font-size: 12px;
      flex: 0 0 auto;
    }
    .view-tabs { padding: 0 12px; }
    .view-tab { padding: 9px 12px; font-size: 11px; }
    main { padding: 0 12px 32px; }
    .panel { padding: 10px; }
    .section { margin-top: 16px; }
    .section h2 { font-size: 12px; }
    th, td { padding: 6px 8px; font-size: 12px; }
    .award-grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .award-card h3 { font-size: 11px; padding: 9px 10px; }
    .award-card td, .award-card th { padding: 5px 8px; font-size: 11px; }
    .toast {
      left: 12px;
      right: 12px;
      transform: none;
      bottom: 12px;
      text-align: center;
    }
  }

  /* Very small / older phones */
  @media (max-width: 380px) {
    header h1 { font-size: 15px; }
    .toolbar button { font-size: 11px; padding: 6px 8px; }
    .year-tab { padding: 6px 10px; }
  }

  /* Landscape phones — keep nav compact, give table area more vertical room */
  @media (max-height: 480px) and (orientation: landscape) {
    header { padding: 8px 16px; }
    header h1 { font-size: 15px; }
    header .sub { display: none; }
    .years { padding: 6px 16px 0; }
    .view-tab { padding: 7px 14px; }
    main { padding: 0 16px 24px; }
  }
</style>
</head>

let state = load();
let currentYear = 2024;
let currentView = "all-americans";

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const init = { years: {} };
  YEARS.forEach(y => {
    const seed = SEED[y];
    init.years[y] = {
      allAmericans: seed ? seed.allAmericans.slice() : [],
      awards: {}
    };
    AWARDS.forEach(a => {
      init.years[y].awards[a] = seed && seed.awards && seed.awards[a] ? seed.awards[a].slice() : [];
    });
  });
  return init;
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1800);
}

function setView(v) {
  currentView = v;
  document.querySelectorAll(".view-tab").forEach(b => {
    b.classList.toggle("active", b.dataset.view === v);
  });
  render();
}

function renderTabs() {
  const el = document.getElementById("yearTabs");
  el.innerHTML = "";
  YEARS.forEach(y => {
    const b = document.createElement("button");
    b.className = "year-tab" + (y === currentYear ? " active" : "");
    b.textContent = y;
    b.onclick = () => { currentYear = y; render(); };
    el.appendChild(b);
  });
}

function render() {
  renderTabs();
  const yearData = state.years[currentYear];
  if (!yearData) return;
  const panel = document.getElementById("panel");
  panel.innerHTML = "";
  if (currentView === "all-americans") {
    SECTIONS.forEach(sec => panel.appendChild(renderAASection(sec, yearData)));
  } else {
    panel.appendChild(renderAwards(yearData));
  }
}

function renderAASection(sec, yearData) {
  const wrap = document.createElement("div");
  wrap.className = "section";
  wrap.innerHTML = `<h2>${sec.label}</h2>`;
  const rows = yearData.allAmericans.filter(r => sec.positions.includes(r.pos));
  if (rows.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No selections yet — add one below.";
    wrap.appendChild(empty);
  } else {
    const table = document.createElement("table");
    table.innerHTML = `
      <thead><tr>
        <th>Pos</th><th>Team</th><th>Player</th><th>School</th><th>Class</th><th>Owner</th><th></th>
      </tr></thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector("tbody");
    rows.forEach(row => {
      const idx = yearData.allAmericans.indexOf(row);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td contenteditable="true" data-field="pos">${escape(row.pos)}</td>
        <td class="rank-${row.rank}" contenteditable="true" data-field="rank">${row.rank === 1 ? "1st" : "2nd"}</td>
        <td contenteditable="true" data-field="player">${escape(row.player)}</td>
        <td contenteditable="true" data-field="team">${escape(row.team)}</td>
        <td contenteditable="true" data-field="cls">${escape(row.cls)}</td>
        <td contenteditable="true" data-field="owner">${escape(row.owner)}</td>
        <td class="row-actions"><button title="Remove" onclick="removeAA(${idx})">&times;</button></td>
      `;
      tr.addEventListener("blur", e => {
        const c = e.target;
        if (!c.dataset.field) return;
        const field = c.dataset.field;
        let v = c.textContent.trim();
        if (field === "rank") v = v.startsWith("2") ? 2 : 1;
        yearData.allAmericans[idx][field] = v;
        save();
        if (field === "rank") render();
      }, true);
      tbody.appendChild(tr);
    });
    const scroll = document.createElement("div");
    scroll.className = "table-scroll";
    scroll.appendChild(table);
    wrap.appendChild(scroll);
  }
  const addBtn = document.createElement("button");
  addBtn.className = "add-row";
  addBtn.textContent = `+ Add ${sec.label} selection`;
  addBtn.onclick = () => {
    yearData.allAmericans.push({ pos: sec.positions[0], rank: 1, player: "", team: "", cls: "", owner: "" });
    save();
    render();
  };
  wrap.appendChild(addBtn);
  return wrap;
}

function renderAwards(yearData) {
  const wrap = document.createElement("div");
  wrap.className = "section";
  const grid = document.createElement("div");
  grid.className = "award-grid";
  AWARDS.forEach(name => {
    grid.appendChild(renderAwardCard(name, yearData));
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderAwardCard(name, yearData) {
  const isCoach = COACH_AWARDS.has(name);
  const card = document.createElement("div");
  card.className = "award-card";
  card.innerHTML = `<h3>${name}</h3>`;
  const finalists = yearData.awards[name] || [];
  const table = document.createElement("table");
  const headers = isCoach
    ? `<tr><th></th><th>Coach</th><th>Team</th><th></th></tr>`
    : `<tr><th></th><th>Player</th><th>Pos</th><th>Team</th><th>Cls</th><th>Owner</th><th></th></tr>`;
  table.innerHTML = `<thead>${headers}</thead><tbody></tbody>`;
  const tbody = table.querySelector("tbody");
  finalists.forEach((f, idx) => {
    const tr = document.createElement("tr");
    if (f.winner) tr.classList.add("winner");
    const winBtn = `<button class="winner-toggle ${f.winner ? "active" : ""}" title="Mark as winner" onclick="toggleWinner('${escapeJs(name)}', ${idx})">★</button>`;
    const del = `<button title="Remove" onclick="removeFinalist('${escapeJs(name)}', ${idx})">&times;</button>`;
    if (isCoach) {
      tr.innerHTML = `
        <td>${winBtn}</td>
        <td contenteditable="true" data-field="player">${escape(f.player || "")}</td>
        <td contenteditable="true" data-field="team">${escape(f.team || "")}</td>
        <td class="row-actions">${del}</td>
      `;
    } else {
      tr.innerHTML = `
        <td>${winBtn}</td>
        <td contenteditable="true" data-field="player">${escape(f.player || "")}</td>
        <td contenteditable="true" data-field="pos">${escape(f.pos || "")}</td>
        <td contenteditable="true" data-field="team">${escape(f.team || "")}</td>
        <td contenteditable="true" data-field="cls">${escape(f.cls || "")}</td>
        <td contenteditable="true" data-field="owner">${escape(f.owner || "")}</td>
        <td class="row-actions">${del}</td>
      `;
    }
    tr.addEventListener("blur", e => {
      const c = e.target;
      if (!c.dataset.field) return;
      yearData.awards[name][idx][c.dataset.field] = c.textContent.trim();
      save();
    }, true);
    tbody.appendChild(tr);
  });
  const scroll = document.createElement("div");
  scroll.className = "table-scroll";
  scroll.appendChild(table);
  card.appendChild(scroll);
  const addBtn = document.createElement("button");
  addBtn.className = "add-row";
  addBtn.textContent = `+ Add finalist`;
  addBtn.onclick = () => {
    if (!yearData.awards[name]) yearData.awards[name] = [];
    yearData.awards[name].push(isCoach ? { player: "", team: "" } : { player: "", pos: "", team: "", cls: "", owner: "" });
    save();
    render();
  };
  card.appendChild(addBtn);
  return card;
}

function toggleWinner(award, idx) {
  const list = state.years[currentYear].awards[award];
  const wasWinner = !!list[idx].winner;
  list.forEach(f => delete f.winner);
  if (!wasWinner) list[idx].winner = true;
  save();
  render();
}

function removeFinalist(award, idx) {
  state.years[currentYear].awards[award].splice(idx, 1);
  save();
  render();
}

function removeAA(idx) {
  state.years[currentYear].allAmericans.splice(idx, 1);
  save();
  render();
}

function escape(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function escapeJs(s) { return String(s).replace(/'/g, "\\'"); }

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `postseason-awards-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Exported JSON");
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.years) throw new Error("Invalid format");
      state = data;
      save();
      render();
      toast("Imported");
    } catch (err) {
      alert("Import failed: " + err.message);
    }
  };
  r.readAsText(file);
  e.target.value = "";
}

function resetYear() {
  if (!confirm(`Reset ${currentYear}? Wipes both All-Americans and Awards for this year.`)) return;
  const seed = SEED[currentYear];
  state.years[currentYear] = {
    allAmericans: seed ? seed.allAmericans.slice() : [],
    awards: {}
  };
  AWARDS.forEach(a => {
    state.years[currentYear].awards[a] = seed && seed.awards && seed.awards[a] ? seed.awards[a].slice() : [];
  });
  save();
  render();
  toast(`${currentYear} reset to seed`);
}

render();
