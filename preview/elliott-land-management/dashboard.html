<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Elliott Land Management | Operations Platform</title>
<meta name="theme-color" content="#1f3322" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f3322'/><text x='32' y='44' font-family='sans-serif' font-size='30' font-weight='800' fill='%23c79a3b' text-anchor='middle'>E</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --forest:#2f4a32;--forest-deep:#1f3322;--moss:#6b8a4f;--gold:#c79a3b;--gold-soft:#a8801f;
  --green:#48b265;--green-l:rgba(72,178,101,0.15);
  --amber:#e0a93b;--amber-l:rgba(224,169,59,0.15);
  --red:#d9694e;--red-l:rgba(217,105,78,0.15);
  --blue:#5b8fb0;--blue-l:rgba(91,143,176,0.15);
  --r:14px;--disp:'Oswald',sans-serif;
  --bg:#0e1410;
  --canvas:radial-gradient(1100px 700px at 88% -10%, rgba(199,154,59,0.10), transparent 60%),radial-gradient(900px 700px at -10% 110%, rgba(107,138,79,0.12), transparent 70%),#0e1410;
  --surface:rgba(255,255,255,0.04);--surface-strong:rgba(255,255,255,0.065);--surface-soft:rgba(255,255,255,0.022);
  --text:#eef2ea;--text-soft:#c4cdbd;--text-mute:#7e8a78;
  --border:rgba(255,255,255,0.09);--border-soft:rgba(255,255,255,0.05);
  --row-hover:rgba(255,255,255,0.035);
  --shadow:0 0 0 1px rgba(255,255,255,0.04),0 24px 64px -28px rgba(0,0,0,0.7);
}
[data-theme="light"]{
  --bg:#f4f3ec;
  --canvas:radial-gradient(1100px 700px at 90% -20%, rgba(199,154,59,0.12), transparent 60%),#f4f3ec;
  --surface:#ffffff;--surface-strong:#ffffff;--surface-soft:#fafaf4;
  --text:#16201a;--text-soft:#3b4639;--text-mute:#6a7464;
  --border:rgba(22,32,26,0.1);--border-soft:rgba(22,32,26,0.05);
  --row-hover:rgba(22,32,26,0.025);
  --shadow:0 1px 3px rgba(22,32,26,0.06),0 8px 24px -12px rgba(22,32,26,0.12);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas) fixed;color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}
.layout{display:flex;min-height:100vh}
::selection{background:rgba(199,154,59,0.25);color:var(--text)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* SIDEBAR */
.sidebar{width:260px;background:linear-gradient(180deg,var(--forest-deep),#16271a);border-right:1px solid var(--border-soft);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;transition:transform .3s}
.sidebar-header{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:11px}
.logo-mark{width:40px;height:40px;border-radius:10px;background:var(--gold);display:grid;place-items:center;color:var(--forest-deep);flex-shrink:0}
.logo-mark svg{width:24px;height:24px}
.logo-text .nm{font-family:var(--disp);font-weight:700;font-size:1.1rem;letter-spacing:1px;color:#fff;line-height:1}
.logo-text .sb{font-size:.6rem;color:var(--gold);text-transform:uppercase;letter-spacing:2.5px;margin-top:4px;font-weight:600}
.sidebar-nav{flex:1;padding:12px 12px 18px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{width:6px}.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}
.nav-label{font-size:.6rem;font-weight:700;color:#7e8c75;text-transform:uppercase;letter-spacing:2px;padding:14px 14px 5px}
.nav-label:first-child{padding-top:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:9px;color:#a9b4a0;font-size:.85rem;font-weight:500;transition:all .18s;border:none;background:none;width:100%;text-align:left;position:relative}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(199,154,59,0.18),rgba(199,154,59,0.02));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold)}
.nav-item .badge{margin-left:auto;background:var(--gold);color:var(--forest-deep);font-size:.62rem;font-weight:800;padding:1px 7px;border-radius:20px}

/* MAIN */
.main{flex:1;margin-left:260px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-soft);padding:14px 30px;display:flex;align-items:center;gap:18px}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:1.4rem}
.page-title{font-family:var(--disp);font-size:1.35rem;font-weight:600;letter-spacing:.3px}
.page-sub{font-size:.78rem;color:var(--text-mute);margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 13px;color:var(--text-mute);font-size:.84rem;min-width:230px}
.search input{background:none;border:none;outline:none;color:var(--text);flex:1;font-family:inherit;font-size:.84rem}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-soft);transition:.18s}
.icon-btn:hover{background:var(--surface-strong);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--forest-deep);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.content{padding:26px 30px 60px;flex:1}

/* COMPONENTS */
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.metrics{grid-template-columns:repeat(4,1fr)}
.metric{padding:18px 18px 16px;position:relative;overflow:hidden}
.metric .mlabel{font-size:.72rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:1px;font-weight:600;display:flex;align-items:center;gap:7px}
.metric .mlabel svg{width:15px;height:15px;color:var(--gold)}
.metric .mval{font-family:var(--disp);font-size:1.85rem;font-weight:700;margin-top:9px;line-height:1}
.metric .mtrend{font-size:.74rem;margin-top:8px;font-weight:600;display:flex;align-items:center;gap:5px}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--text-mute)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-head h2{font-family:var(--disp);font-size:1.15rem;font-weight:600;letter-spacing:.3px}
.section-head .link{font-size:.8rem;color:var(--gold);font-weight:600}
.two-col{grid-template-columns:1.5fr 1fr}
.three-col{grid-template-columns:repeat(3,1fr)}
.card-pad{padding:20px}
.card-title{font-weight:700;font-size:.95rem;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.card-title .t{display:flex;align-items:center;gap:9px}
.card-title svg{width:18px;height:18px;color:var(--gold)}

/* lists */
.row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.row:last-child{border-bottom:none}
.row .ico{width:38px;height:38px;border-radius:9px;background:var(--surface-strong);display:grid;place-items:center;flex-shrink:0;color:var(--moss)}
.row .ico svg{width:18px;height:18px}
.row .meta{flex:1;min-width:0}
.row .meta .nm{font-weight:600;font-size:.88rem}
.row .meta .ds{font-size:.76rem;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-weight:700;font-size:.85rem;text-align:right;white-space:nowrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:30px;text-transform:uppercase;letter-spacing:.4px}
.pill.green{background:var(--green-l);color:var(--green)}
.pill.amber{background:var(--amber-l);color:var(--amber)}
.pill.red{background:var(--red-l);color:var(--red)}
.pill.blue{background:var(--blue-l);color:var(--blue)}
.pill.gold{background:rgba(199,154,59,0.16);color:var(--gold)}
.pill.gray{background:var(--surface-strong);color:var(--text-mute)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-mute);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--border-soft)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:var(--row-hover)}
.tbl .cust{display:flex;align-items:center;gap:11px}
.tbl .ava{width:34px;height:34px;border-radius:8px;background:var(--forest);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:.78rem;flex-shrink:0}

/* progress */
.bar{height:7px;border-radius:6px;background:var(--surface-strong);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--moss),var(--gold))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.84rem;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:.18s}
.btn:hover{background:var(--surface-strong)}
.btn svg{width:16px;height:16px}
.btn.gold{background:var(--gold);color:var(--forest-deep);border-color:transparent;font-weight:700}
.btn.gold:hover{filter:brightness(1.06)}
.btn.forest{background:var(--forest);color:#fff;border-color:transparent}

/* bars chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.chart .col .bk{width:100%;max-width:34px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--gold),var(--moss));transition:.5s;position:relative}
.chart .col .bk:hover{filter:brightness(1.12)}
.chart .col .lb{font-size:.68rem;color:var(--text-mute);font-weight:600}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut{width:128px;height:128px;border-radius:50%;flex-shrink:0;position:relative;display:grid;place-items:center}
.donut::after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--surface)}
.donut .ctr{position:relative;z-index:1;text-align:center}
.donut .ctr .n{font-family:var(--disp);font-size:1.5rem;font-weight:700;line-height:1}
.donut .ctr .l{font-size:.62rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:1px}
.legend{display:flex;flex-direction:column;gap:9px;font-size:.82rem}
.legend .lg{display:flex;align-items:center;gap:9px}
.legend .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}

/* pipeline kanban */
.kanban{display:grid;grid-template-columns:repeat(8,minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-soft);border:1px solid var(--border-soft);border-radius:12px;padding:11px;min-height:130px}
.kcol h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-mute);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab;transition:.15s}
.kcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.kcard .nm{font-weight:600;font-size:.8rem}
.kcard .sv{font-size:.72rem;color:var(--text-mute);margin-top:3px}
.kcard .vl{font-weight:700;font-size:.82rem;color:var(--gold);margin-top:6px}

/* map */
#estMap,#opsMap{height:480px;width:100%;border-radius:12px;z-index:1}
.leaflet-container{background:#1a2620;font-family:inherit}
.addr-search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:12px}
.addr-search .addr-ic{color:var(--gold);display:grid;place-items:center;flex-shrink:0}
.addr-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:.92rem}
.addr-search input::placeholder{color:var(--text-mute)}
.addr-search .btn{flex-shrink:0;white-space:nowrap}
.addr-result{font-size:.84rem;color:var(--text-soft);margin-bottom:14px;min-height:1.1em;display:flex;align-items:center;gap:8px}
.addr-result .pin{color:var(--gold);flex-shrink:0}
.addr-result.err{color:var(--red)}
.map-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.measure-out{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.mout{background:var(--surface-soft);border:1px solid var(--border-soft);border-radius:10px;padding:14px}
.mout .l{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-mute);font-weight:600}
.mout .v{font-family:var(--disp);font-size:1.4rem;font-weight:700;margin-top:5px;color:var(--gold)}

/* photos */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.photo{aspect-ratio:4/3;border-radius:11px;overflow:hidden;position:relative;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;transition:.4s}
.photo:hover img{transform:scale(1.07)}
.photo .tag{position:absolute;top:8px;left:8px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;background:rgba(15,20,16,0.8);color:#fff;backdrop-filter:blur(4px)}
.photo .stamp{position:absolute;bottom:8px;left:8px;right:8px;font-size:.68rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}

/* compare slider */
.compare{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;user-select:none}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{clip-path:inset(0 0 0 50%)}
.compare .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--gold);transform:translateX(-50%)}
.compare .handle::after{content:"⇄";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--forest-deep);display:grid;place-items:center;font-weight:800}
.compare .clab{position:absolute;bottom:12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:4px 11px;border-radius:20px;background:rgba(15,20,16,0.78);color:#fff}

/* portal phone */
.phone{width:330px;margin:0 auto;background:var(--forest-deep);border-radius:34px;padding:13px;box-shadow:var(--shadow)}
.phone-screen{background:var(--bg);border-radius:24px;overflow:hidden;min-height:560px}

/* roles */
.role-grid{grid-template-columns:repeat(3,1fr)}
.role{padding:20px}
.role h3{font-family:var(--disp);font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:5px}
.role h3 svg{width:20px;height:20px;color:var(--gold)}
.role .perms{margin-top:12px;display:flex;flex-direction:column;gap:7px;font-size:.83rem}
.role .perms div{display:flex;align-items:center;gap:8px;color:var(--text-soft)}
.role .perms svg{width:15px;height:15px;color:var(--green)}

.empty-hint{font-size:.78rem;color:var(--text-mute);padding:12px 0}
.banner{background:linear-gradient(100deg,rgba(199,154,59,0.14),rgba(107,138,79,0.06));border:1px solid rgba(199,154,59,0.25);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:13px;margin-bottom:18px;font-size:.85rem}
.banner svg{width:22px;height:22px;color:var(--gold);flex-shrink:0}
.demo-tag{font-size:.62rem;background:var(--surface-strong);color:var(--text-mute);padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.5px}

@media (max-width:1080px){.metrics{grid-template-columns:repeat(2,1fr)}.two-col,.three-col,.role-grid{grid-template-columns:1fr}.photo-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .main{margin-left:0}.hamburger{display:block}.search{display:none}
  .content{padding:18px 16px 50px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
.scrim.show{display:block}
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12c0-4 2-7 5-9-1 4-1 7-5 9z"/><path d="M12 14c0-4-2-7-5-9 1 4 1 7 5 9z"/></svg></span>
      <span class="logo-text"><span class="nm">ELLIOTT</span><span class="sb">Ops Platform</span></span>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div>
        <div class="page-title" id="pageTitle">Executive Dashboard</div>
        <div class="page-sub" id="pageSub">Real-time overview of the entire operation</div>
      </div>
      <div class="topbar-actions">
        <div class="search"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="Search customers, jobs, equipment…" /></div>
        <button class="icon-btn" id="themeBtn" title="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="icon-btn" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
        <div class="avatar">CE</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ============================================================
   ELLIOTT LAND MANAGEMENT — OPERATIONS PLATFORM (demo prototype)
   Williams Digital. All data below is sample/mock data.
============================================================ */

const fmt = n => '$' + n.toLocaleString();
const ic = {
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
  crm:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  lead:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  map:'<path d="m9 18-6-3V3l6 3 6-3 6 3v12l-6 3-6-3z"/><path d="M9 6v12M15 6v12"/>',

/* ---------- ROUTER ---------- */
let estMapInst, opsMapInst;
function render(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));

/* ---------- ESTIMATING MAP ---------- */
let curSvc='Forestry Mulching', estMarker=null, estDrawHandler=null, estDrawn=null;
const RATES={'Forestry Mulching':{hr:1.4,low:320,high:440},'Land Clearing':{hr:2.1,low:900,high:1500},'Gravel Driveway':{hr:0.8,low:6,high:9},'Pool Excavation':{hr:6,low:50,high:80}};
function setSvc(s){curSvc=s;const l=document.getElementById('svcLabel');if(l)l.textContent=s;}

/* Geocode an address (OpenStreetMap Nominatim) and fly the satellite map there */
async function geocode(e){
  if(e) e.preventDefault();
  const input=document.getElementById('addrInput');
  const out=document.getElementById('addrResult');
  const btn=document.getElementById('addrBtn');
  const q=input.value.trim();
  if(!q){input.focus();return false;}
  if(!estMapInst){out.className='addr-result err';out.textContent='Map still loading — try again in a second.';return false;}
  out.className='addr-result';
  out.innerHTML='Searching…';
  btn.disabled=true;
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q);
    const res=await fetch(url,{headers:{'Accept':'application/json'}});
    const data=await res.json();
    if(!data.length){
      out.className='addr-result err';
      out.textContent='No match found for "'+q+'". Try a fuller address or nearby town.';
      return false;
    }
    const lat=+data[0].lat, lon=+data[0].lon;
    estMapInst.setView([lat,lon],17,{animate:true});
    if(estMarker) estMapInst.removeLayer(estMarker);
    estMarker=L.marker([lat,lon]).addTo(estMapInst).bindPopup('<b>'+(data[0].display_name||q)+'</b>').openPopup();
    out.className='addr-result';
    out.innerHTML='<span class="pin">'+svg(ic.map,16)+'</span> Property located — draw the work area on the satellite view above.';
  }catch(err){
    out.className='addr-result err';
    out.textContent='Lookup failed — check your connection and try again.';
  }finally{
    btn.disabled=false;
  }
  return false;
}
function initEstMap(){
  const el=document.getElementById('estMap'); if(!el||el._init)return; el._init=true;
  const m=L.map(el,{scrollWheelZoom:false}).setView([33.61,-86.50],14);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri',maxZoom:19}).addTo(m);
  const drawn=new L.FeatureGroup().addTo(m);
  estDrawn=drawn;

  // Keep a handle on the active polygon drawer so the "Finish Area" button can complete it.
  const polyHandler=new L.Draw.Polygon(m,{shapeOptions:{color:'#c79a3b',weight:3,fillOpacity:.25},allowIntersection:false,showArea:false});
  estDrawHandler=polyHandler;

  m.addControl(new L.Control.Draw({edit:{featureGroup:drawn},draw:{polygon:{shapeOptions:{color:'#c79a3b',weight:3,fillOpacity:.25},allowIntersection:false},polyline:{shapeOptions:{color:'#c79a3b',weight:4}},rectangle:{shapeOptions:{color:'#c79a3b'}},circle:false,marker:false,circlemarker:false}}));

  // Show the finish hint whenever a draw starts; hide it once a shape is created/cancelled.
  m.on(L.Draw.Event.DRAWSTART,()=>toggleFinishHint(true));
  m.on(L.Draw.Event.DRAWSTOP,()=>toggleFinishHint(false));
  m.on(L.Draw.Event.CREATED,e=>{drawn.clearLayers();drawn.addLayer(e.layer);calc(e.layer);toggleFinishHint(false);});
  m.on(L.Draw.Event.EDITED,e=>e.layers.eachLayer(calc));

  function metersBetween(a,b){
    const R=6371000, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
    const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  function calc(layer){
    const r=RATES[curSvc];
    const elA=document.getElementById('mArea'), elH=document.getElementById('mHours'), elC=document.getElementById('mCost');
    if(!elA) return;
    // Polyline = linear measure (driveway / trench / fence length)
    if(layer instanceof L.Polyline && !(layer instanceof L.Polygon)){
      const ll=layer.getLatLngs(); let m2=0;
      for(let i=1;i<ll.length;i++) m2+=metersBetween(ll[i-1],ll[i]);
      const feet=m2*3.28084;
      elA.textContent=Math.round(feet).toLocaleString()+' ft';
      elH.textContent=Math.max(0.5,feet/660*r.hr).toFixed(1)+' hrs';
      elC.textContent='$'+Math.round(feet/660*r.low).toLocaleString()+' – $'+Math.round(feet/660*r.high).toLocaleString();
      return;
    }
    // Polygon / rectangle = acreage
    const ll=layer.getLatLngs()[0]; let area=0;
    for(let i=0,j=ll.length-1;i<ll.length;j=i++){const xi=ll[i].lng*111320*Math.cos(ll[i].lat*Math.PI/180),yi=ll[i].lat*110540,xj=ll[j].lng*111320*Math.cos(ll[j].lat*Math.PI/180),yj=ll[j].lat*110540;area+=(xj+xi)*(yj-yi);}
    const acres=Math.abs(area/2)/4046.86;
    const hrs=Math.max(0.5,acres*r.hr);
    elA.textContent=acres.toFixed(2)+' ac';
    elH.textContent=hrs.toFixed(1)+' hrs';
    elC.textContent='$'+Math.round(acres*r.low).toLocaleString()+' – $'+Math.round(acres*r.high).toLocaleString();
  }
  estMapInst=m;
}

/* Start the polygon drawer from our own button */
function startDrawArea(){
  if(estDrawHandler) estDrawHandler.enable();
}
/* Complete whatever is currently being drawn (same as double-click / clicking first point) */
function finishDrawArea(){
  const map=estMapInst;
  if(map && map._toolbars){
    // Leaflet.draw stores the active handler on the draw toolbar
    for(const k in map._toolbars){
      const tb=map._toolbars[k];
      if(tb && tb._activeMode && tb._activeMode.handler && tb._activeMode.handler._finishShape){
        tb._activeMode.handler._finishShape();
        return;
      }
    }
  }
  if(estDrawHandler && estDrawHandler._finishShape && estDrawHandler._enabled){
    estDrawHandler._finishShape();
  }
}
function toggleFinishHint(show){
  const h=document.getElementById('drawHint');
  if(h) h.style.display=show?'flex':'none';
}
/* Remove the drawn shape and reset the readout */
function clearDrawArea(){
  if(estDrawn) estDrawn.clearLayers();
  const a=document.getElementById('mArea'), h=document.getElementById('mHours'), c=document.getElementById('mCost');
  if(a){a.textContent='— ac';h.textContent='—';c.textContent='Draw an area';}
}

/* ---------- OPS MAP ---------- */
function initOpsMap(){
  const el=document.getElementById('opsMap'); if(!el||el._init)return; el._init=true;
  const m=L.map(el,{scrollWheelZoom:false}).setView([33.55,-86.65],10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© CARTO',maxZoom:19}).addTo(m);
  const pts=[['Cahaba Dev — Active',33.62,-86.59,'#5b8fb0'],['Harmon Farm — Active',33.77,-86.47,'#5b8fb0'],['Oak Ridge HOA — Active',33.40,-86.81,'#5b8fb0'],['Greystone — Scheduled',33.42,-86.66,'#c79a3b'],['Maddox — Site visit',33.58,-86.29,'#c79a3b'],['Shop / Equipment',33.55,-86.75,'#48b265']];
  pts.forEach(p=>L.circleMarker([p[1],p[2]],{radius:9,color:'#fff',weight:2,fillColor:p[3],fillOpacity:.9}).addTo(m).bindPopup('<b>'+p[0]+'</b>'));
  opsMapInst=m;
}

/* ---------- COMPARE SLIDER ---------- */
function initCompare(){
  const wrap=document.getElementById('compare'); if(!wrap||wrap._init)return; wrap._init=true;
  const after=wrap.querySelector('.after'),handle=document.getElementById('cmpHandle');
  let drag=false;
  const move=x=>{const r=wrap.getBoundingClientRect();let p=(x-r.left)/r.width*100;p=Math.max(2,Math.min(98,p));after.style.clipPath=`inset(0 0 0 ${p}%)`;handle.style.left=p+'%';};
  const dn=()=>drag=true,up=()=>drag=false;
  wrap.addEventListener('mousedown',e=>{dn();move(e.clientX);});
  window.addEventListener('mousemove',e=>drag&&move(e.clientX));
  window.addEventListener('mouseup',up);
  wrap.addEventListener('touchstart',e=>{dn();move(e.touches[0].clientX);});
  wrap.addEventListener('touchmove',e=>{if(drag){move(e.touches[0].clientX);}},{passive:true});
  wrap.addEventListener('touchend',up);
}

/* ---------- THEME + MOBILE ---------- */
document.getElementById('themeBtn').onclick=()=>{
  const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
  [estMapInst,opsMapInst].forEach(m=>m&&setTimeout(()=>m.invalidateSize(),50));
};
const sb=document.getElementById('sidebar'),scrim=document.getElementById('scrim');
function closeSidebar(){sb.classList.remove('open');scrim.classList.remove('show');}
document.getElementById('hamburger').onclick=()=>{sb.classList.toggle('open');scrim.classList.toggle('show');};
scrim.onclick=closeSidebar;

render('dashboard');
</script>
