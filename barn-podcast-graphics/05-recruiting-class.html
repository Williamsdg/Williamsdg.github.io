<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruiting Class — The Barn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:linear-gradient(155deg,#03244d 0%,#0a3a6b 50%,#03244d 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:70px 80px}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(242,101,34,.06) 1px,transparent 1px);background-size:30px 30px;animation:dotDrift 15s linear infinite}
@keyframes dotDrift{0%{background-position:0 0}100%{background-position:30px 30px}}
.header{z-index:2;margin-bottom:50px;animation:fadeIn .6s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-block;background:rgba(242,101,34,.15);border:1px solid rgba(242,101,34,.25);padding:8px 22px;border-radius:40px;font-size:13px;font-weight:700;color:#F26522;text-transform:uppercase;letter-spacing:3px;margin-bottom:16px}
.title{font-size:68px;font-weight:900;text-transform:uppercase;letter-spacing:-2px;line-height:1}
.title span{color:#F26522}
.subtitle{font-size:20px;color:rgba(255,255,255,.45);margin-top:10px;letter-spacing:2px;text-transform:uppercase}
.chart{z-index:2;display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center}
.bar-row{display:flex;align-items:center;gap:16px;animation:barRowIn .6s ease-out both}
.bar-row:nth-child(1){animation-delay:.4s}
.bar-row:nth-child(2){animation-delay:.55s}
.bar-row:nth-child(3){animation-delay:.7s}
.bar-row:nth-child(4){animation-delay:.85s}
.bar-row:nth-child(5){animation-delay:1s}
.bar-row:nth-child(6){animation-delay:1.15s}
.bar-row:nth-child(7){animation-delay:1.3s}
.bar-row:nth-child(8){animation-delay:1.45s}
@keyframes barRowIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.rank{font-size:16px;font-weight:800;color:rgba(255,255,255,.35);width:30px;text-align:right;flex-shrink:0}
.team-name{font-size:16px;font-weight:700;width:120px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:40px;background:rgba(255,255,255,.04);border-radius:8px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:8px;background:rgba(255,255,255,.12);animation:barGrow 1.2s ease-out both;transform-origin:left}
.bar-row:nth-child(1) .bar-fill{animation-delay:.6s}
.bar-row:nth-child(2) .bar-fill{animation-delay:.75s}
.bar-row:nth-child(3) .bar-fill{animation-delay:.9s}
.bar-row:nth-child(4) .bar-fill{animation-delay:1.05s}
.bar-row:nth-child(5) .bar-fill{animation-delay:1.2s}
.bar-row:nth-child(6) .bar-fill{animation-delay:1.35s}
.bar-row:nth-child(7) .bar-fill{animation-delay:1.5s}
.bar-row:nth-child(8) .bar-fill{animation-delay:1.65s}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
.bar-fill{width:var(--w)}
.bar-fill.auburn{background:linear-gradient(90deg,#F26522,#ff8c42)}
.score{font-size:15px;font-weight:700;color:rgba(255,255,255,.5);width:70px;flex-shrink:0;text-align:right}
.bar-row.highlight .team-name{color:#F26522}
.bar-row.highlight .rank{color:#F26522}
.bar-row.highlight .score{color:#F26522}
.bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);background-size:200% 100%;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.network-tag{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;font-weight:600;z-index:2}
</style>
</head>
<body>
<div class="card">
  <div class="dots"></div>
  <div class="header">
    <div class="badge">SEC Rankings</div>
    <div class="title">2026 <span>RECRUITING</span> CLASS</div>
    <div class="subtitle">Top SEC Recruiting Classes by Points</div>
  </div>
  <div class="chart">
    <div class="bar-row">
      <div class="rank">1</div>
      <div class="team-name">Georgia</div>
      <div class="bar-track"><div class="bar-fill" style="--w:100%"></div></div>
      <div class="score">318.42</div>
    </div>
    <div class="bar-row">
      <div class="rank">2</div>
      <div class="team-name">Alabama</div>
      <div class="bar-track"><div class="bar-fill" style="--w:94%"></div></div>
      <div class="score">301.18</div>
    </div>
    <div class="bar-row">
      <div class="rank">3</div>
      <div class="team-name">Texas</div>
      <div class="bar-track"><div class="bar-fill" style="--w:89%"></div></div>
      <div class="score">289.55</div>
    </div>
    <div class="bar-row">
      <div class="rank">4</div>
      <div class="team-name">LSU</div>
      <div class="bar-track"><div class="bar-fill" style="--w:83%"></div></div>
      <div class="score">274.30</div>
    </div>
    <div class="bar-row highlight">
      <div class="rank">5</div>
      <div class="team-name">Auburn</div>
      <div class="bar-track"><div class="bar-fill auburn" style="--w:78%"></div></div>
      <div class="score">261.87</div>
    </div>
    <div class="bar-row">
      <div class="rank">6</div>
      <div class="team-name">Tennessee</div>
      <div class="bar-track"><div class="bar-fill" style="--w:74%"></div></div>
      <div class="score">248.62</div>
    </div>
    <div class="bar-row">
      <div class="rank">7</div>
      <div class="team-name">Ole Miss</div>
      <div class="bar-track"><div class="bar-fill" style="--w:68%"></div></div>
      <div class="score">232.15</div>
    </div>
    <div class="bar-row">
      <div class="rank">8</div>
      <div class="team-name">Florida</div>
      <div class="bar-track"><div class="bar-fill" style="--w:63%"></div></div>
      <div class="score">218.90</div>
    </div>
  </div>
  <div class="network-tag">The Barn Podcast Network</div>
  <div class="bottom-strip"></div>
</div>
</body>
</html>
