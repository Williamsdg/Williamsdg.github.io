<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Village Vice — The Barn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:#03244d;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(242,101,34,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(242,101,34,.05) 1px,transparent 1px);background-size:60px 60px;animation:gridMove 20s linear infinite}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:60px 60px}}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:80px}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(242,101,34,.15);border:1px solid rgba(242,101,34,.25);padding:8px 20px;border-radius:40px;font-size:14px;font-weight:600;color:#F26522;text-transform:uppercase;letter-spacing:2px;width:fit-content;animation:fadeIn .8s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.show-title{font-size:96px;font-weight:900;text-transform:uppercase;letter-spacing:-3px;margin-top:40px;line-height:.9;animation:fadeIn .8s ease-out .2s both}
.show-title span{color:#F26522;display:block}
.desc{font-size:22px;color:rgba(255,255,255,.55);margin-top:24px;max-width:600px;line-height:1.6;animation:fadeIn .8s ease-out .4s both}
.hosts-row{display:flex;gap:24px;margin-top:auto;animation:fadeIn .8s ease-out .6s both}
.host-card{background:rgba(242,101,34,.08);border:1px solid rgba(242,101,34,.12);border-radius:16px;padding:20px 28px;display:flex;align-items:center;gap:16px}
.host-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#F26522,#d4550f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.host-info{font-size:15px}
.host-info strong{display:block;font-size:18px;margin-bottom:2px}
.host-info span{color:rgba(255,255,255,.4)}
.schedule{position:absolute;top:80px;right:80px;text-align:right;animation:fadeIn .8s ease-out .3s both}
.schedule-label{font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.schedule-time{font-size:28px;font-weight:800;color:#F26522}
.eq-bars{position:absolute;bottom:80px;right:80px;display:flex;gap:6px;align-items:flex-end;height:80px}
.eq-bar{width:8px;background:#F26522;border-radius:4px;animation:eq 1.2s ease-in-out infinite}
.eq-bar:nth-child(1){animation-delay:0s}
.eq-bar:nth-child(2){animation-delay:.15s}
.eq-bar:nth-child(3){animation-delay:.3s}
.eq-bar:nth-child(4){animation-delay:.45s}
.eq-bar:nth-child(5){animation-delay:.6s}
.eq-bar:nth-child(6){animation-delay:.75s}
.eq-bar:nth-child(7){animation-delay:.9s}
@keyframes eq{0%,100%{height:20px;opacity:.4}50%{height:70px;opacity:1}}
.corner-accent{position:absolute;width:120px;height:120px;border:2px solid rgba(242,101,34,.15)}
.corner-accent.tl{top:40px;left:40px;border-right:none;border-bottom:none}
.corner-accent.br{bottom:40px;right:40px;border-left:none;border-top:none}
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="corner-accent tl"></div>
  <div class="corner-accent br"></div>
  <div class="content">
    <div class="badge">Daily Show</div>
    <div class="show-title">VILLAGE<span>VICE</span></div>
    <div class="desc">Your daily dose of Auburn athletics. Every weekday, breaking down the latest in Tigers sports.</div>
    <div class="hosts-row">
      <div class="host-card">
        <div class="host-avatar">BL</div>
        <div class="host-info"><strong>Brad Law</strong><span>Co-Host</span></div>
      </div>
      <div class="host-card">
        <div class="host-avatar">ZB</div>
        <div class="host-info"><strong>Zac Blackerby</strong><span>Co-Host</span></div>
      </div>
    </div>
  </div>
  <div class="schedule">
    <div class="schedule-label">Airs</div>
    <div class="schedule-time">Every Weekday</div>
  </div>
  <div class="eq-bars">
    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
  </div>
</div>
</body>
</html>
