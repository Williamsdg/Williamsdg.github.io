<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auburn Football Stats — The Barn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:linear-gradient(160deg,#03244d 0%,#0a3a6b 40%,#03244d 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:70px 80px}
.hex-bg{position:absolute;inset:0;opacity:.04}
.hex{position:absolute;width:100px;height:100px;border:2px solid #F26522;border-radius:12px;transform:rotate(45deg);animation:hexFloat 8s ease-in-out infinite}
.hex:nth-child(1){top:5%;left:8%;animation-delay:0s;width:80px;height:80px}
.hex:nth-child(2){top:15%;right:12%;animation-delay:1.5s;width:60px;height:60px}
.hex:nth-child(3){bottom:20%;left:5%;animation-delay:3s}
.hex:nth-child(4){bottom:10%;right:8%;animation-delay:2s;width:70px;height:70px}
.hex:nth-child(5){top:45%;left:2%;animation-delay:4s;width:50px;height:50px}
@keyframes hexFloat{0%,100%{opacity:1;transform:rotate(45deg) translateY(0)}50%{opacity:.5;transform:rotate(45deg) translateY(-15px)}}
.header{text-align:center;z-index:2;animation:fadeDown .8s ease-out}
@keyframes fadeDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-block;background:rgba(242,101,34,.15);border:1px solid rgba(242,101,34,.25);padding:8px 24px;border-radius:40px;font-size:14px;font-weight:600;color:#F26522;text-transform:uppercase;letter-spacing:3px;margin-bottom:20px}
.year{font-size:86px;font-weight:900;letter-spacing:-3px;line-height:1}
.year span{color:#F26522}
.sub{font-size:22px;color:rgba(255,255,255,.5);margin-top:8px;letter-spacing:4px;text-transform:uppercase;font-weight:500}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:60px;z-index:2;width:100%}
.stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:36px;text-align:center;animation:statIn .8s ease-out both}
.stat-card:nth-child(1){animation-delay:.3s}
.stat-card:nth-child(2){animation-delay:.5s}
.stat-card:nth-child(3){animation-delay:.7s}
.stat-card:nth-child(4){animation-delay:.9s}
@keyframes statIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ring-wrap{width:130px;height:130px;margin:0 auto 16px;position:relative}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:8}
.ring-fill{fill:none;stroke:#F26522;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;animation:ringDraw 2s ease-out both}
.stat-card:nth-child(1) .ring-fill{stroke-dasharray:377;stroke-dashoffset:377;animation-delay:.5s;--target:47}
.stat-card:nth-child(2) .ring-fill{stroke-dasharray:377;stroke-dashoffset:377;animation-delay:.7s;--target:94}
.stat-card:nth-child(3) .ring-fill{stroke-dasharray:377;stroke-dashoffset:377;animation-delay:.9s;--target:132}
.stat-card:nth-child(4) .ring-fill{stroke-dasharray:377;stroke-dashoffset:377;animation-delay:1.1s;--target:151}
@keyframes ringDraw{to{stroke-dashoffset:var(--target)}}
.stat-card:nth-child(1) .ring-fill{animation-name:ring1}
.stat-card:nth-child(2) .ring-fill{animation-name:ring2}
.stat-card:nth-child(3) .ring-fill{animation-name:ring3}
.stat-card:nth-child(4) .ring-fill{animation-name:ring4}
@keyframes ring1{to{stroke-dashoffset:47}}
@keyframes ring2{to{stroke-dashoffset:94}}
@keyframes ring3{to{stroke-dashoffset:132}}
@keyframes ring4{to{stroke-dashoffset:151}}
.stat-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:#F26522}
.stat-label{font-size:15px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.stat-value-text{font-size:13px;color:rgba(255,255,255,.35);margin-top:4px}
.bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);background-size:200% 100%;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.network-tag{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;font-weight:600;z-index:2}
</style>
</head>
<body>
<div class="card">
  <div class="hex-bg"><div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div></div>
  <div class="header">
    <div class="badge">Stat Breakdown</div>
    <div class="year">2026 <span>AUBURN</span></div>
    <div class="sub">Football Season Stats</div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="ring-wrap">
        <svg viewBox="0 0 130 130" width="130" height="130">
          <circle class="ring-bg" cx="65" cy="65" r="60"/>
          <circle class="ring-fill" cx="65" cy="65" r="60"/>
        </svg>
        <div class="stat-num">10</div>
      </div>
      <div class="stat-label">Wins</div>
      <div class="stat-value-text">10 – 2 Record</div>
    </div>
    <div class="stat-card">
      <div class="ring-wrap">
        <svg viewBox="0 0 130 130" width="130" height="130">
          <circle class="ring-bg" cx="65" cy="65" r="60"/>
          <circle class="ring-fill" cx="65" cy="65" r="60"/>
        </svg>
        <div class="stat-num">412</div>
      </div>
      <div class="stat-label">Points Scored</div>
      <div class="stat-value-text">34.3 Per Game</div>
    </div>
    <div class="stat-card">
      <div class="ring-wrap">
        <svg viewBox="0 0 130 130" width="130" height="130">
          <circle class="ring-bg" cx="65" cy="65" r="60"/>
          <circle class="ring-fill" cx="65" cy="65" r="60"/>
        </svg>
        <div class="stat-num">2,847</div>
      </div>
      <div class="stat-label">Rushing Yards</div>
      <div class="stat-value-text">237.3 Per Game</div>
    </div>
    <div class="stat-card">
      <div class="ring-wrap">
        <svg viewBox="0 0 130 130" width="130" height="130">
          <circle class="ring-bg" cx="65" cy="65" r="60"/>
          <circle class="ring-fill" cx="65" cy="65" r="60"/>
        </svg>
        <div class="stat-num">28</div>
      </div>
      <div class="stat-label">Passing TDs</div>
      <div class="stat-value-text">2.3 Per Game</div>
    </div>
  </div>
  <div class="network-tag">The Barn Podcast Network</div>
  <div class="bottom-strip"></div>
</div>
</body>
</html>
