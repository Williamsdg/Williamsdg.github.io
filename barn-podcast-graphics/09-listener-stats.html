<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listener Stats — The Barn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:linear-gradient(155deg,#03244d 0%,#0a3a6b 40%,#03244d 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wave-bg{position:absolute;bottom:0;left:0;right:0;height:400px;overflow:hidden}
.wave{position:absolute;bottom:0;left:-50%;width:200%;height:200px;border-radius:45%;animation:waveMove 8s linear infinite}
.wave:nth-child(1){background:rgba(242,101,34,.04);animation-duration:8s;bottom:-40px}
.wave:nth-child(2){background:rgba(242,101,34,.03);animation-duration:10s;bottom:-60px;animation-delay:-2s}
.wave:nth-child(3){background:rgba(242,101,34,.02);animation-duration:12s;bottom:-80px;animation-delay:-4s}
@keyframes waveMove{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.header{text-align:center;z-index:2;margin-bottom:70px;animation:fadeIn .8s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-block;background:rgba(242,101,34,.15);border:1px solid rgba(242,101,34,.25);padding:8px 24px;border-radius:40px;font-size:14px;font-weight:700;color:#F26522;text-transform:uppercase;letter-spacing:3px;margin-bottom:20px}
.title{font-size:68px;font-weight:900;text-transform:uppercase;letter-spacing:-2px}
.title span{color:#F26522}
.subtitle{font-size:20px;color:rgba(255,255,255,.45);margin-top:8px;letter-spacing:2px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;z-index:2;padding:0 100px;width:100%}
.stat-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:40px;text-align:center;animation:statPop .7s ease-out both}
.stat-box:nth-child(1){animation-delay:.3s}
.stat-box:nth-child(2){animation-delay:.5s}
.stat-box:nth-child(3){animation-delay:.7s}
.stat-box:nth-child(4){animation-delay:.9s}
@keyframes statPop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.stat-icon{width:64px;height:64px;margin:0 auto 20px;background:rgba(242,101,34,.12);border-radius:16px;display:flex;align-items:center;justify-content:center}
.stat-icon svg{width:32px;height:32px;stroke:#F26522;fill:none;stroke-width:2}
.stat-number{font-size:56px;font-weight:900;color:#F26522;line-height:1;animation:countUp 2s ease-out both}
.stat-box:nth-child(1) .stat-number{animation-delay:.5s}
.stat-box:nth-child(2) .stat-number{animation-delay:.7s}
.stat-box:nth-child(3) .stat-number{animation-delay:.9s}
.stat-box:nth-child(4) .stat-number{animation-delay:1.1s}
@keyframes countUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.stat-plus{font-size:36px;font-weight:900;color:#F26522}
.stat-label{font-size:16px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-top:8px}
.bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);background-size:200% 100%;animation:shimmer 2s linear infinite;z-index:3}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.network-tag{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;font-weight:600;z-index:2}
</style>
</head>
<body>
<div class="card">
  <div class="wave-bg">
    <div class="wave"></div><div class="wave"></div><div class="wave"></div>
  </div>
  <div class="header">
    <div class="badge">By The Numbers</div>
    <div class="title">LISTENER <span>STATS</span></div>
    <div class="subtitle">The Barn Podcast Network</div>
  </div>
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </div>
      <div class="stat-number">1000<span class="stat-plus">+</span></div>
      <div class="stat-label">Episodes</div>
    </div>
    <div class="stat-box">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="stat-number">4</div>
      <div class="stat-label">Hosts</div>
    </div>
    <div class="stat-box">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="stat-number">365</div>
      <div class="stat-label">Days / Year</div>
    </div>
    <div class="stat-box">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div class="stat-number">1</div>
      <div class="stat-label">Network</div>
    </div>
  </div>
  <div class="network-tag">The Barn Podcast Network</div>
  <div class="bottom-strip"></div>
</div>
</body>
</html>
