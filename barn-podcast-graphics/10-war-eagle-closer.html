<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Eagle — The Barn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:#03244d;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.4) 100%);z-index:1}
/* Particles */
.particles{position:absolute;inset:0;z-index:2}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;bottom:-10px;animation:rise linear infinite}
.particle:nth-child(1){left:8%;width:3px;height:3px;background:#F26522;animation-duration:4s;animation-delay:0s}
.particle:nth-child(2){left:15%;width:5px;height:5px;background:#ff8c42;animation-duration:5s;animation-delay:.5s}
.particle:nth-child(3){left:22%;width:2px;height:2px;background:#F26522;animation-duration:3.5s;animation-delay:1s}
.particle:nth-child(4){left:30%;width:4px;height:4px;background:#ffaa66;animation-duration:4.5s;animation-delay:.2s}
.particle:nth-child(5){left:37%;width:3px;height:3px;background:#F26522;animation-duration:5.5s;animation-delay:1.5s}
.particle:nth-child(6){left:44%;width:5px;height:5px;background:#ff8c42;animation-duration:4s;animation-delay:.8s}
.particle:nth-child(7){left:51%;width:2px;height:2px;background:#F26522;animation-duration:3s;animation-delay:2s}
.particle:nth-child(8){left:58%;width:4px;height:4px;background:#ffaa66;animation-duration:4.8s;animation-delay:.3s}
.particle:nth-child(9){left:65%;width:3px;height:3px;background:#F26522;animation-duration:5s;animation-delay:1.2s}
.particle:nth-child(10){left:72%;width:5px;height:5px;background:#ff8c42;animation-duration:3.8s;animation-delay:.6s}
.particle:nth-child(11){left:79%;width:2px;height:2px;background:#F26522;animation-duration:4.2s;animation-delay:1.8s}
.particle:nth-child(12){left:86%;width:4px;height:4px;background:#ffaa66;animation-duration:5.2s;animation-delay:.1s}
.particle:nth-child(13){left:12%;width:3px;height:3px;background:#F26522;animation-duration:4.6s;animation-delay:2.5s}
.particle:nth-child(14){left:42%;width:6px;height:6px;background:#ff8c42;animation-duration:5.5s;animation-delay:1.8s}
.particle:nth-child(15){left:68%;width:3px;height:3px;background:#F26522;animation-duration:3.2s;animation-delay:2.2s}
.particle:nth-child(16){left:92%;width:4px;height:4px;background:#ffaa66;animation-duration:4.4s;animation-delay:.9s}
.particle:nth-child(17){left:25%;width:5px;height:5px;background:#F26522;animation-duration:5.8s;animation-delay:1.4s}
.particle:nth-child(18){left:55%;width:3px;height:3px;background:#ff8c42;animation-duration:3.6s;animation-delay:2.8s}
.particle:nth-child(19){left:78%;width:4px;height:4px;background:#F26522;animation-duration:4.1s;animation-delay:.4s}
.particle:nth-child(20){left:48%;width:2px;height:2px;background:#ffaa66;animation-duration:5.3s;animation-delay:1.6s}
@keyframes rise{0%{bottom:-10px;opacity:0;transform:translateX(0) scale(1)}10%{opacity:1}70%{opacity:.8}100%{bottom:110%;opacity:0;transform:translateX(30px) scale(0)}}
/* Spark lines */
.spark{position:absolute;width:1px;bottom:0;background:linear-gradient(0deg,rgba(242,101,34,.6),transparent);animation:sparkRise 2s ease-out infinite}
.spark:nth-child(21){left:20%;height:80px;animation-delay:0s}
.spark:nth-child(22){left:35%;height:120px;animation-delay:.4s}
.spark:nth-child(23){left:50%;height:100px;animation-delay:.8s}
.spark:nth-child(24){left:65%;height:90px;animation-delay:1.2s}
.spark:nth-child(25){left:80%;height:110px;animation-delay:1.6s}
@keyframes sparkRise{0%{bottom:-120px;opacity:0}20%{opacity:1}100%{bottom:100%;opacity:0}}
.content{z-index:3;text-align:center}
.war-eagle{font-size:140px;font-weight:900;text-transform:uppercase;letter-spacing:-4px;line-height:.9;background:linear-gradient(135deg,#F26522 0%,#ff8c42 25%,#F26522 50%,#ffaa66 75%,#F26522 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientShift 4s ease-in-out infinite,revealUp 1.2s ease-out both}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes revealUp{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.network-name{font-size:28px;font-weight:700;color:rgba(255,255,255,.7);margin-top:24px;letter-spacing:6px;text-transform:uppercase;animation:revealUp 1s ease-out .4s both}
.divider{width:120px;height:3px;background:#F26522;margin:30px auto;border-radius:3px;animation:revealUp .8s ease-out .6s both}
.tagline{font-size:18px;color:rgba(255,255,255,.4);letter-spacing:3px;text-transform:uppercase;animation:revealUp .8s ease-out .8s both}
.socials{display:flex;gap:30px;margin-top:50px;animation:revealUp .8s ease-out 1s both}
.social{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:40px;padding:12px 24px}
.social-icon{width:20px;height:20px;opacity:.5}
.social-icon svg{width:20px;height:20px;fill:rgba(255,255,255,.5)}
.social-handle{font-size:15px;color:rgba(255,255,255,.5);font-weight:600}
.bottom-glow{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(0deg,rgba(242,101,34,.08),transparent);z-index:1}
.bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);background-size:200% 100%;animation:shimmer 2s linear infinite;z-index:4}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
</style>
</head>
<body>
<div class="card">
  <div class="vignette"></div>
  <div class="bottom-glow"></div>
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div>
  </div>
  <div class="content">
    <div class="war-eagle">WAR<br>EAGLE</div>
    <div class="network-name">The Barn Podcast Network</div>
    <div class="divider"></div>
    <div class="tagline">Auburn Sports. Every Day.</div>
    <div class="socials">
      <div class="social">
        <div class="social-icon"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div>
        <div class="social-handle">@TheBarnPodcast</div>
      </div>
      <div class="social">
        <div class="social-icon"><svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg></div>
        <div class="social-handle">@TheBarnPodcast</div>
      </div>
    </div>
  </div>
  <div class="bottom-strip"></div>
</div>
</body>
</html>
