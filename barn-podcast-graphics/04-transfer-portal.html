<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Portal — The Barn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:linear-gradient(170deg,#0a3a6b 0%,#03244d 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:70px 80px}
.scan-line{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(242,101,34,.015) 4px,rgba(242,101,34,.015) 5px);pointer-events:none;z-index:1}
.sweep{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#F26522,transparent);animation:sweep 3s ease-in-out infinite;z-index:3;opacity:.5}
@keyframes sweep{0%{top:0}50%{top:100%}100%{top:0}}
.header{z-index:2;margin-bottom:50px;animation:fadeIn .6s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.top-row{display:flex;align-items:center;justify-content:space-between}
.tag{background:rgba(242,101,34,.15);border:1px solid rgba(242,101,34,.3);padding:6px 18px;border-radius:30px;font-size:13px;color:#F26522;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#F26522;margin-right:8px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.title{font-size:64px;font-weight:900;text-transform:uppercase;letter-spacing:-2px;margin-top:16px}
.title span{color:#F26522}
.players{display:flex;flex-direction:column;gap:20px;z-index:2}
.player-card{display:flex;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:22px 28px;gap:20px;animation:slideIn .7s ease-out both;position:relative;overflow:hidden}
.player-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#F26522;border-radius:4px 0 0 4px}
.player-card:nth-child(1){animation-delay:.3s}
.player-card:nth-child(2){animation-delay:.5s}
.player-card:nth-child(3){animation-delay:.7s}
.player-card:nth-child(4){animation-delay:.9s}
.player-card:nth-child(5){animation-delay:1.1s}
@keyframes slideIn{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
.pos{background:#F26522;color:#fff;font-weight:900;font-size:18px;width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.player-info{flex:1}
.player-name{font-size:22px;font-weight:700}
.player-school{font-size:14px;color:rgba(255,255,255,.4);margin-top:2px}
.stars{display:flex;gap:4px;margin-top:4px}
.star{width:16px;height:16px;position:relative}
.star::before{content:'';position:absolute;inset:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#F26522}
.star.empty::before{background:rgba(255,255,255,.15)}
.status{text-align:right;flex-shrink:0}
.committed{color:#4ade80;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.check{width:22px;height:22px;border-radius:50%;background:rgba(74,222,128,.15);display:flex;align-items:center;justify-content:center;animation:popIn .4s ease-out both}
.player-card:nth-child(1) .check{animation-delay:1s}
.player-card:nth-child(2) .check{animation-delay:1.2s}
.player-card:nth-child(3) .check{animation-delay:1.4s}
.player-card:nth-child(4) .check{animation-delay:1.6s}
.player-card:nth-child(5) .check{animation-delay:1.8s}
@keyframes popIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.check svg{width:12px;height:12px}
.visiting{color:#F26522;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);background-size:200% 100%;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.network-tag{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;font-weight:600;z-index:2}
</style>
</head>
<body>
<div class="card">
  <div class="scan-line"></div>
  <div class="sweep"></div>
  <div class="header">
    <div class="top-row">
      <div class="tag"><span class="live-dot"></span>Transfer Portal</div>
      <div class="tag">2026 Cycle</div>
    </div>
    <div class="title">TRANSFER <span>PORTAL</span> UPDATE</div>
  </div>
  <div class="players">
    <div class="player-card">
      <div class="pos">QB</div>
      <div class="player-info">
        <div class="player-name">Marcus Williams</div>
        <div class="player-school">From: Oklahoma State</div>
        <div class="stars"><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star empty"></div></div>
      </div>
      <div class="status"><div class="committed"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>Committed</div></div>
    </div>
    <div class="player-card">
      <div class="pos">WR</div>
      <div class="player-info">
        <div class="player-name">Jaylen Carter</div>
        <div class="player-school">From: USC</div>
        <div class="stars"><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div></div>
      </div>
      <div class="status"><div class="committed"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>Committed</div></div>
    </div>
    <div class="player-card">
      <div class="pos">LB</div>
      <div class="player-info">
        <div class="player-name">De'Andre Mitchell</div>
        <div class="player-school">From: Texas A&amp;M</div>
        <div class="stars"><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star empty"></div></div>
      </div>
      <div class="status"><div class="committed"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>Committed</div></div>
    </div>
    <div class="player-card">
      <div class="pos">CB</div>
      <div class="player-info">
        <div class="player-name">Keon Jackson</div>
        <div class="player-school">From: Florida</div>
        <div class="stars"><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star empty"></div></div>
      </div>
      <div class="status"><div class="visiting">Visiting</div></div>
    </div>
    <div class="player-card">
      <div class="pos">DL</div>
      <div class="player-info">
        <div class="player-name">Tyrese Robinson</div>
        <div class="player-school">From: Michigan</div>
        <div class="stars"><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div></div>
      </div>
      <div class="status"><div class="visiting">Visiting</div></div>
    </div>
  </div>
  <div class="network-tag">The Barn Podcast Network</div>
  <div class="bottom-strip"></div>
</div>
</body>
</html>
