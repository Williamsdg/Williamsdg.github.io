*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:linear-gradient(145deg,#03244d 0%,#0a3a6b 50%,#03244d 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px}
.glow-orb{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(242,101,34,.1) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:orbPulse 5s ease-in-out infinite}
@keyframes orbPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.content{z-index:2;text-align:center;max-width:800px}
.ep-badge{display:inline-block;background:rgba(242,101,34,.15);border:1px solid rgba(242,101,34,.25);padding:8px 22px;border-radius:40px;font-size:14px;font-weight:700;color:#F26522;text-transform:uppercase;letter-spacing:3px;margin-bottom:50px;animation:fadeIn .8s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.quote-marks{position:relative;margin-bottom:20px}
.quote-marks svg{width:60px;height:60px;fill:#F26522;opacity:.4;animation:fadeIn .6s ease-out .2s both}
.quote-text{font-size:38px;font-weight:700;line-height:1.5;letter-spacing:-.5px;overflow:hidden}
.quote-text span{display:inline-block;opacity:0;animation:typeIn .04s ease-out forwards}
.attribution{margin-top:40px;animation:fadeIn .8s ease-out 4s both}
.host-name{font-size:22px;font-weight:800;color:#F26522}
.host-title{font-size:15px;color:rgba(255,255,255,.4);margin-top:4px}
.waveform{display:flex;gap:4px;align-items:center;justify-content:center;margin-top:60px;height:50px;animation:fadeIn .8s ease-out 4.2s both}
.wave-bar{width:4px;border-radius:4px;background:#F26522;animation:waveAnim 1.4s ease-in-out infinite}
.wave-bar:nth-child(1){height:20px;animation-delay:0s}
.wave-bar:nth-child(2){height:32px;animation-delay:.1s}
.wave-bar:nth-child(3){height:45px;animation-delay:.2s}

.wave-bar:nth-child(20){height:20px;animation-delay:.75s}
@keyframes waveAnim{0%,100%{transform:scaleY(.5);opacity:.4}50%{transform:scaleY(1);opacity:1}}
.bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);background-size:200% 100%;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.network-tag{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;font-weight:600;z-index:2}
