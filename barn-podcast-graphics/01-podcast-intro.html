<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Barn Podcast Network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:linear-gradient(145deg,#03244d 0%,#0a3a6b 50%,#03244d 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg-barn{position:absolute;top:0;left:0;right:0;bottom:0;opacity:.04}
.bg-barn::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;height:800px;border:80px solid #F26522;border-radius:50%;animation:pulse 4s ease-in-out infinite}
.bg-barn::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border:40px solid #F26522;border-radius:50%;animation:pulse 4s ease-in-out infinite .5s}
@keyframes pulse{0%,100%{opacity:.03;transform:translate(-50%,-50%) scale(1)}50%{opacity:.08;transform:translate(-50%,-50%) scale(1.05)}}
.lines{position:absolute;top:0;left:0;right:0;bottom:0}
.line{position:absolute;background:linear-gradient(180deg,transparent,rgba(242,101,34,.15),transparent);width:1px;height:200px;animation:fall linear infinite}
.line:nth-child(1){left:10%;animation-duration:3s;animation-delay:0s}
.line:nth-child(2){left:25%;animation-duration:4s;animation-delay:1s}
.line:nth-child(3){left:40%;animation-duration:3.5s;animation-delay:.5s}
.line:nth-child(4){left:55%;animation-duration:4.5s;animation-delay:2s}
.line:nth-child(5){left:70%;animation-duration:3s;animation-delay:1.5s}
.line:nth-child(6){left:85%;animation-duration:4s;animation-delay:.8s}
@keyframes fall{0%{top:-200px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.logo-area{text-align:center;z-index:2;animation:fadeUp 1s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.barn-icon{width:120px;height:120px;background:#F26522;border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 40px;box-shadow:0 0 60px rgba(242,101,34,.3);animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 40px rgba(242,101,34,.2)}50%{box-shadow:0 0 80px rgba(242,101,34,.4)}}
.barn-icon svg{width:60px;height:60px}
.title{font-size:72px;font-weight:900;letter-spacing:-2px;margin-bottom:16px;text-transform:uppercase}
.title span{color:#F26522}
.subtitle{font-size:24px;color:rgba(255,255,255,.6);font-weight:500;letter-spacing:6px;text-transform:uppercase;animation:fadeUp 1s ease-out .3s both}
.hosts{display:flex;gap:32px;margin-top:60px;animation:fadeUp 1s ease-out .6s both}
.host{text-align:center}
.host-dot{width:48px;height:48px;border-radius:50%;background:rgba(242,101,34,.15);border:2px solid rgba(242,101,34,.3);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#F26522}
.host-name{font-size:14px;color:rgba(255,255,255,.5);font-weight:500}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.bottom-bar{background-size:200% 100%}
</style>
</head>
<body>
<div class="card">
  <div class="bg-barn"></div>
  <div class="lines"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
  <div class="logo-area">
    <div class="barn-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/><path d="M10 9h4"/></svg>
    </div>
    <div class="title">THE <span>BARN</span></div>
    <div class="subtitle">Podcast Network</div>
    <div class="hosts">
      <div class="host"><div class="host-dot">KR</div><div class="host-name">Kyle Rush</div></div>
      <div class="host"><div class="host-dot">ZB</div><div class="host-name">Zac Blackerby</div></div>
      <div class="host"><div class="host-dot">LC</div><div class="host-name">Lindsay Crosby</div></div>
      <div class="host"><div class="host-dot">BL</div><div class="host-name">Brad Law</div></div>
    </div>
  </div>
  <div class="bottom-bar"></div>
</div>
</body>
</html>
