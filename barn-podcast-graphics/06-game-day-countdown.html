<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Day Countdown — The Barn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03244d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{width:1080px;height:1080px;background:#03244d;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.radial-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(242,101,34,.08) 0%,transparent 60%)}
.stadium{position:absolute;bottom:0;left:0;right:0;height:260px;z-index:1}
.stadium-shape{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:1000px;height:200px}
.stadium-base{position:absolute;bottom:0;left:0;right:0;height:40px;background:rgba(242,101,34,.08);border-radius:100% 100% 0 0}
.stadium-tier1{position:absolute;bottom:30px;left:5%;right:5%;height:60px;background:rgba(242,101,34,.05);border-radius:100% 100% 0 0}
.stadium-tier2{position:absolute;bottom:70px;left:12%;right:12%;height:60px;background:rgba(242,101,34,.04);border-radius:100% 100% 0 0}
.stadium-tier3{position:absolute;bottom:110px;left:20%;right:20%;height:50px;background:rgba(242,101,34,.03);border-radius:100% 100% 0 0}
.stadium-lights{position:absolute;bottom:140px;display:flex;gap:60px;left:50%;transform:translateX(-50%)}
.light-pole{width:3px;height:80px;background:rgba(255,255,255,.06);position:relative}
.light-pole::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:rgba(242,101,34,.3);animation:lightFlicker 2s ease-in-out infinite}
.light-pole:nth-child(2)::after{animation-delay:.5s}
.light-pole:nth-child(3)::after{animation-delay:1s}
.light-pole:nth-child(4)::after{animation-delay:1.5s}
@keyframes lightFlicker{0%,100%{opacity:.3;box-shadow:0 0 10px rgba(242,101,34,.2)}50%{opacity:1;box-shadow:0 0 30px rgba(242,101,34,.5)}}
.content{z-index:2;text-align:center}
.badge{display:inline-block;background:rgba(242,101,34,.15);border:1px solid rgba(242,101,34,.3);padding:10px 28px;border-radius:40px;font-size:14px;font-weight:700;color:#F26522;text-transform:uppercase;letter-spacing:4px;margin-bottom:30px;animation:fadeIn .8s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.game-day{font-size:130px;font-weight:900;text-transform:uppercase;letter-spacing:-4px;line-height:.9;animation:fadeIn .8s ease-out .2s both}
.game-day span{display:block;color:#F26522}
.matchup{margin-top:40px;animation:fadeIn .8s ease-out .4s both}
.vs{font-size:18px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:4px;margin-bottom:8px}
.opponent{font-size:48px;font-weight:800;letter-spacing:-1px}
.details{display:flex;gap:40px;justify-content:center;margin-top:20px;animation:fadeIn .8s ease-out .6s both}
.detail{text-align:center}
.detail-label{font-size:12px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.detail-value{font-size:22px;font-weight:700;color:#F26522}
.countdown-boxes{display:flex;gap:20px;margin-top:40px;animation:fadeIn .8s ease-out .7s both}
.cd-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px 28px;text-align:center;min-width:100px}
.cd-num{font-size:48px;font-weight:900;color:#F26522;line-height:1}
.cd-label{font-size:12px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;margin-top:4px}
.war-eagle{margin-top:60px;font-size:42px;font-weight:900;color:#F26522;text-transform:uppercase;letter-spacing:8px;animation:pulseText 2s ease-in-out infinite}
@keyframes pulseText{0%,100%{opacity:1;text-shadow:0 0 20px rgba(242,101,34,.3)}50%{opacity:.7;text-shadow:0 0 40px rgba(242,101,34,.6)}}
.bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F26522,#ff8c42,#F26522);background-size:200% 100%;animation:shimmer 2s linear infinite;z-index:3}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
</style>
</head>
<body>
<div class="card">
  <div class="radial-bg"></div>
  <div class="stadium">
    <div class="stadium-shape">
      <div class="stadium-tier3"></div>
      <div class="stadium-tier2"></div>
      <div class="stadium-tier1"></div>
      <div class="stadium-base"></div>
    </div>
    <div class="stadium-lights">
      <div class="light-pole"></div>
      <div class="light-pole"></div>
      <div class="light-pole"></div>
      <div class="light-pole"></div>
    </div>
  </div>
  <div class="content">
    <div class="badge">Auburn Tigers Football</div>
    <div class="game-day">GAME<span>DAY</span></div>
    <div class="matchup">
      <div class="vs">Auburn vs</div>
      <div class="opponent">Alabama Crimson Tide</div>
    </div>
    <div class="details">
      <div class="detail">
        <div class="detail-label">Date</div>
        <div class="detail-value">Nov 28, 2026</div>
      </div>
      <div class="detail">
        <div class="detail-label">Kickoff</div>
        <div class="detail-value">2:30 PM CT</div>
      </div>
      <div class="detail">
        <div class="detail-label">Venue</div>
        <div class="detail-value">Jordan-Hare</div>
      </div>
    </div>
    <div class="countdown-boxes">
      <div class="cd-box"><div class="cd-num">07</div><div class="cd-label">Days</div></div>
      <div class="cd-box"><div class="cd-num">14</div><div class="cd-label">Hours</div></div>
      <div class="cd-box"><div class="cd-num">32</div><div class="cd-label">Mins</div></div>
      <div class="cd-box"><div class="cd-num">08</div><div class="cd-label">Secs</div></div>
    </div>
    <div class="war-eagle">War Eagle</div>
  </div>
  <div class="bottom-strip"></div>
</div>
</body>
</html>
