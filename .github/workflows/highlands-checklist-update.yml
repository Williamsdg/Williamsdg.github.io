name: Highlands checklist — auto-update sermons

on:
  schedule:
    # Every Monday 13:00 UTC (~7-8am Central) — after the weekend's messages post
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull new sermons from church feeds into Supabase
        env:
          SUPABASE_URL: ${{ secrets.HIGHLANDS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HIGHLANDS_SUPABASE_SERVICE_ROLE_KEY }}
        run: python preview/highlands-checklist/_updater/update_sermons.py
