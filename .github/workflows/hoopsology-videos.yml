name: Hoopsology — pull new episodes + Shorts

on:
  schedule:
    # Every 2 hours. Only commits (and redeploys) when a new video appears,
    # plus one daily refresh of view counts.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write
  actions: write

concurrency:
  group: hoopsology-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull YouTube feeds into data/videos.json
        id: pull
        run: |
          out=$(python preview/hoopsology/_updater/update_videos.py)
          echo "$out"
          case "$out" in CHANGED*) echo "changed=true" >> "$GITHUB_OUTPUT";; esac
      - name: Commit + redeploy
        if: steps.pull.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hoopsology-bot"
          git config user.email "hoopsology-bot@users.noreply.github.com"
          git add preview/hoopsology/data/videos.json
          git commit -m "Hoopsology: refresh episodes + Shorts"
          git pull --rebase origin main
          git push origin HEAD:main
          # pushes made with GITHUB_TOKEN don't trigger other workflows; dispatch does
          gh workflow run pages.yml --ref main
