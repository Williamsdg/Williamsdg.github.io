<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartPath Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://files.manuscdn.com/user_upload_by_module/session_file/310419663029617589/rMkdqcZajiHmIWkM.png">
  <style>
    :root {
      --bg: #060F0A;
      --bg-card: #0D1A12;
      --bg-card-hover: #111F16;
      --bg-elevated: #142419;
      --gold: #BF9B3B;
      --gold-light: #CCAB52;
      --gold-dim: rgba(191, 155, 59, 0.15);
      --cream: #F5F0E1;
      --cream-muted: rgba(245, 240, 225, 0.5);
      --cream-dim: rgba(245, 240, 225, 0.25);
      --green-ok: #4CAF50;
      --green-ok-dim: rgba(76, 175, 80, 0.15);
      --red: #E57373;
      --red-dim: rgba(229, 115, 115, 0.15);
      --border: rgba(245, 240, 225, 0.08);
      --border-light: rgba(245, 240, 225, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOGIN GATE ── */
    .login-gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 32px;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--cream);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    .login-input:focus {
      border-color: var(--gold);
    }

    .login-input::placeholder {
      color: var(--cream-dim);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: var(--gold-light);
    }

    .login-error {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ── DASHBOARD ── */
    .dashboard {
      display: none;
      min-height: 100vh;
    }

    .dashboard.active {
      display: block;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .new-app-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      background: var(--gold-dim);
      padding: 6px 12px;
      border-radius: 20px;
      animation: pulse-gold 2s infinite;
    }

    .new-app-indicator.visible {
      display: flex;
    }

    @keyframes pulse-gold {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .new-app-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      color: var(--cream);
      border-color: var(--cream-dim);
    }

    /* Main Content */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 32px 64px;
    }

    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cream-muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--cream);
      line-height: 1;
    }

    .stat-card.pending .stat-value {
      color: var(--gold);
    }

    .stat-card.approved .stat-value {
      color: var(--green-ok);
    }

    .stat-card.declined .stat-value {
      color: var(--cream-muted);
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .filter-tab {
      padding: 10px 16px;
      background: none;
      border: none;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-tab:hover {
      color: var(--cream);
    }

    .filter-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .tab-badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--border);
      color: var(--cream-muted);
      padding: 1px 7px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .filter-tab.active .tab-badge {
      background: var(--gold-dim);
      color: var(--gold);
    }

    /* Table */
    .table-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-header {
      display: grid;
      grid-template-columns: 100px 1.4fr 1.2fr 120px 110px 160px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--cream-dim);
    }

    .app-row {
      display: grid;
      grid-template-columns: 100px 1.4fr 1.2fr 120px 110px 160px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .app-row:hover {
      background: var(--bg-card-hover);
    }

    .app-row:last-child {
      border-bottom: none;
    }

    .app-row.expanded {
      background: var(--bg-card-hover);
      border-bottom: none;
    }

    .cell-date {
      font-size: 13px;
      color: var(--cream-muted);
    }

    .cell-name {
      font-size: 14px;
      font-weight: 500;
    }

    .cell-email {
      font-size: 12px;
      color: var(--cream-muted);
      margin-top: 2px;
    }

    .cell-company {
      font-size: 14px;
      font-weight: 500;
    }

    .cell-title {
      font-size: 12px;
      color: var(--cream-muted);
      margin-top: 2px;
    }

    /* Tier Badges */
    .tier-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tier-badge.founders {
      background: var(--gold-dim);
      color: var(--gold);
    }

    .tier-badge.chairmans {
      background: rgba(192, 192, 192, 0.15);
      color: #C0C0C0;
    }

    .tier-badge.executive {
      background: var(--border);
      color: var(--cream-muted);
    }

    /* Status Badges */
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-badge.pending {
      background: var(--gold-dim);
      color: var(--gold);
    }

    .status-badge.approved {
      background: var(--green-ok-dim);
      color: var(--green-ok);
    }

    .status-badge.declined {
      background: var(--red-dim);
      color: var(--red);
    }

    /* Action Buttons */
    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn-approve {
      padding: 6px 14px;
      background: var(--green-ok-dim);
      color: var(--green-ok);
      border: 1px solid rgba(76, 175, 80, 0.25);
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-approve:hover {
      background: var(--green-ok);
      color: #fff;
    }

    .btn-decline {
      padding: 6px 14px;
      background: transparent;
      color: var(--cream-muted);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-resend {
      padding: 6px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(191,155,59,0.3);
      background: rgba(191,155,59,0.08);
      color: #BF9B3B;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-resend:hover {
      background: rgba(191,155,59,0.15);
      border-color: rgba(191,155,59,0.5);
    }
    .btn-resend:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .detail-actions .btn-resend {
      padding: 12px 28px;
      font-size: 12px;
    }
    .btn-decline:hover {
      background: var(--red-dim);
      color: var(--red);
      border-color: rgba(229, 115, 115, 0.25);
    }

    /* Expanded Row Detail */
    .app-detail {
      display: none;
      padding: 0 20px 20px;
      background: var(--bg-card-hover);
      border-bottom: 1px solid var(--border);
    }

    .app-detail.open {
      display: block;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 20px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .detail-item label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-bottom: 4px;
    }

    .detail-item span {
      font-size: 14px;
      color: var(--cream);
    }

    .detail-actions {
      display: flex;
      gap: 12px;
    }

    .detail-actions .btn-approve,
    .detail-actions .btn-decline {
      padding: 10px 24px;
      font-size: 13px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--cream-muted);
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-state-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 8px;
    }

    .empty-state-text {
      font-size: 13px;
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Loading */
    .loading-wrap {
      text-align: center;
      padding: 64px 24px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      color: var(--cream-muted);
    }

    /* Error */
    .error-wrap {
      text-align: center;
      padding: 48px 24px;
    }

    .error-msg {
      font-size: 14px;
      color: var(--red);
      margin-bottom: 16px;
    }

    .btn-retry {
      padding: 10px 24px;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--cream);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-retry:hover {
      border-color: var(--cream-dim);
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 14px;
      color: var(--cream-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .modal-btns {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-cancel {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-cancel:hover {
      color: var(--cream);
      border-color: var(--cream-dim);
    }

    .modal-confirm {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-confirm.approve {
      background: var(--green-ok);
      color: #fff;
    }

    .modal-confirm.approve:hover {
      background: #66BB6A;
    }

    .modal-confirm.decline {
      background: var(--red);
      color: #fff;
    }

    .modal-confirm.decline:hover {
      background: #EF9A9A;
    }

    .modal-confirm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 24px;
      z-index: 600;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 14px 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--cream);
      animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 3.7s;
      max-width: 360px;
    }

    .toast.success {
      border-color: rgba(76, 175, 80, 0.3);
    }

    .toast.error {
      border-color: rgba(229, 115, 115, 0.3);
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toast-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .topbar {
        padding: 14px 16px;
      }

      .main {
        padding: 20px 16px 48px;
      }

      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card {
        padding: 16px;
      }

      .stat-value {
        font-size: 26px;
      }

      .filter-tabs {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .filter-tab {
        white-space: nowrap;
        padding: 10px 12px;
        font-size: 12px;
      }

      /* Card layout on mobile */
      .table-header {
        display: none;
      }

      .app-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 16px;
      }

      .cell-date {
        order: 1;
        font-size: 12px;
        width: auto;
      }

      .cell-status-wrap {
        order: 2;
        margin-left: auto;
      }

      .cell-name-wrap {
        order: 3;
        width: 100%;
      }

      .cell-name {
        font-size: 15px;
      }

      .cell-company-wrap {
        order: 4;
        width: 100%;
      }

      .cell-tier-wrap {
        order: 5;
      }

      .cell-actions {
        order: 6;
        margin-left: auto;
      }

      .detail-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 16px;
      }

      .detail-actions {
        flex-direction: column;
      }

      .toast-container {
        left: 16px;
        right: 16px;
      }

      .toast {
        max-width: none;
      }
    }

    @media (max-width: 480px) {
      .stats-row {
        grid-template-columns: 1fr 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- LOGIN GATE -->
  <div class="login-gate" id="loginGate">
    <div class="login-box">
      <div class="login-brand">CARTPATH</div>
      <div class="login-title">Admin Dashboard</div>
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <input type="email" class="login-input" id="emailInput" placeholder="Email" autocomplete="email" style="margin-bottom: 12px;">
        <input type="password" class="login-input" id="passwordInput" placeholder="Password" autocomplete="off">
        <button type="submit" class="login-btn">Access Dashboard</button>
      </form>
      <div class="login-error" id="loginError">Invalid email or password.</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="topbar">
      <div class="topbar-brand">CARTPATH ADMIN</div>
      <div class="topbar-right">
        <div class="new-app-indicator" id="newAppIndicator">
          <div class="new-app-dot"></div>
          New application!
        </div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>
    </div>

    <div class="main">
      <!-- Stats -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-label">Total Applications</div>
          <div class="stat-value" id="statTotal">-</div>
        </div>
        <div class="stat-card pending" id="statPendingCard">
          <div class="stat-label">Pending Review</div>
          <div class="stat-value" id="statPending">-</div>
        </div>
        <div class="stat-card approved">
          <div class="stat-label">Approved</div>
          <div class="stat-value" id="statApproved">-</div>
        </div>
        <div class="stat-card declined">
          <div class="stat-label">Declined</div>
          <div class="stat-value" id="statDeclined">-</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">
          All <span class="tab-badge" id="badgeAll">0</span>
        </button>
        <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">
          Pending <span class="tab-badge" id="badgePending">0</span>
        </button>
        <button class="filter-tab" data-filter="approved" onclick="setFilter('approved')">
          Approved <span class="tab-badge" id="badgeApproved">0</span>
        </button>
        <button class="filter-tab" data-filter="declined" onclick="setFilter('declined')">
          Declined <span class="tab-badge" id="badgeDeclined">0</span>
        </button>
      </div>

      <!-- Content area -->
      <div id="contentArea">
        <div class="loading-wrap" id="loadingState">
          <div class="spinner"></div>
          <div class="loading-text">Loading applications...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-text" id="modalText"></div>
      <div id="declineReasonWrap" style="display:none; margin: 16px 0;">
        <label style="display:block; font-size:11px; color:rgba(245,240,225,0.5); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px;">Reason for Decline</label>
        <textarea id="declineReason" style="width:100%; min-height:80px; background:#10352A; color:#F5F0E1; border:1px solid rgba(191,155,59,0.15); border-radius:4px; padding:12px; font-family:Inter,sans-serif; font-size:13px; resize:vertical; outline:none;" placeholder="e.g. Incomplete application, outside service area, etc."></textarea>
      </div>
      <div class="modal-btns">
        <button class="modal-cancel" onclick="closeModal()">Cancel</button>
        <button class="modal-confirm" id="modalConfirm" onclick="confirmAction()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = 'https://ha2sinzpu3.execute-api.us-east-1.amazonaws.com/prod';
    const ADMINS = {
      'dylan@williamsdigital.io': 'CartPath2026!',
      'msowell@cartpath.com': 'CartPath2026!'
    };
    let currentFilter = 'all';
    let applications = [];
    let stats = { total: 0, pending: 0, approved: 0, declined: 0 };
    let expandedId = null;
    let pendingAction = null;
    let pollInterval = null;
    let lastTotal = null;

    // ── AUTH ──
    function getToken() {
      return sessionStorage.getItem('cartpath_admin_token');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const pw = document.getElementById('passwordInput').value;
      if (ADMINS[email] && ADMINS[email] === pw) {
        sessionStorage.setItem('cartpath_admin_token', pw);
        sessionStorage.setItem('cartpath_admin_email', email);
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
      return false;
    }

    function handleLogout() {
      sessionStorage.removeItem('cartpath_admin_token');
      if (pollInterval) clearInterval(pollInterval);
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('loginGate').style.display = 'flex';
      document.getElementById('passwordInput').value = '';
      document.getElementById('loginError').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      loadData();
      startPolling();
    }

    // Check session on load
    if (getToken() && Object.values(ADMINS).includes(getToken())) {
      showDashboard();
    }

    // ── API HELPERS ──
    function apiHeaders() {
      return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
    }

    async function fetchApplications(status) {
      const url = status && status !== 'all' ? API + '/applications?status=' + status : API + '/applications';
      const res = await fetch(url, { headers: apiHeaders() });
      if (!res.ok) throw new Error('Failed to load applications');
      return res.json();
    }

    async function fetchStats() {
      const res = await fetch(API + '/applications/stats', { headers: apiHeaders() });
      if (!res.ok) throw new Error('Failed to load stats');
      return res.json();
    }

    async function approveApplication(id) {
      const res = await fetch(API + '/applications/' + id + '/approve', { method: 'PATCH', headers: apiHeaders() });
      if (!res.ok) throw new Error('Failed to approve');
      return res.json();
    }

    async function declineApplication(id, reason) {
      const res = await fetch(API + '/applications/' + id + '/decline', {
        method: 'PATCH',
        headers: apiHeaders(),
        body: JSON.stringify({ reason: reason || '' })
      });
      if (!res.ok) throw new Error('Failed to decline');
      return res.json();
    }

    // ── DATA LOADING ──
    async function loadData() {
      showLoading();
      try {
        const [apps, st] = await Promise.all([fetchApplications(currentFilter), fetchStats()]);
        applications = Array.isArray(apps) ? apps : (apps.applications || apps.data || []);
        stats = {
          total: st.total || 0,
          pending: st.pending || 0,
          approved: st.approved || 0,
          declined: st.declined || 0
        };
        updateStats();
        renderTable();
      } catch (err) {
        showError(err.message);
      }
    }

    function showLoading() {
      document.getElementById('contentArea').innerHTML = '<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading applications...</div></div>';
    }

    function showError(msg) {
      document.getElementById('contentArea').innerHTML =
        '<div class="error-wrap"><div class="error-msg">' + escapeHtml(msg) + '</div><button class="btn-retry" onclick="loadData()">Retry</button></div>';
    }

    // ── STATS ──
    function updateStats() {
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statPending').textContent = stats.pending;
      document.getElementById('statApproved').textContent = stats.approved;
      document.getElementById('statDeclined').textContent = stats.declined;

      const pendingCard = document.getElementById('statPendingCard');
      if (stats.pending > 0) {
        pendingCard.classList.add('pending');
      } else {
        pendingCard.classList.remove('pending');
      }

      document.getElementById('badgeAll').textContent = stats.total;
      document.getElementById('badgePending').textContent = stats.pending;
      document.getElementById('badgeApproved').textContent = stats.approved;
      document.getElementById('badgeDeclined').textContent = stats.declined;
    }

    // ── FILTERS ──
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(function(tab) {
        tab.classList.toggle('active', tab.dataset.filter === filter);
      });
      expandedId = null;
      loadData();
    }

    // ── RENDER TABLE ──
    function renderTable() {
      var area = document.getElementById('contentArea');

      if (applications.length === 0) {
        var emptyMsg, emptyTitle;
        if (currentFilter === 'all') {
          emptyTitle = 'No applications yet';
          emptyMsg = 'Share <strong>williamsdigital.io/cartpath-apply</strong> to start receiving applications.';
        } else if (currentFilter === 'pending') {
          emptyTitle = 'All caught up!';
          emptyMsg = 'No pending applications.';
        } else {
          emptyTitle = 'None found';
          emptyMsg = 'No ' + currentFilter + ' applications.';
        }
        area.innerHTML = '<div class="table-wrapper"><div class="empty-state"><div class="empty-state-icon">&#9971;</div><div class="empty-state-title">' + emptyTitle + '</div><div class="empty-state-text">' + emptyMsg + '</div></div></div>';
        return;
      }

      var html = '<div class="table-wrapper">';
      html += '<div class="table-header"><div>Date</div><div>Name</div><div>Company</div><div>Tier</div><div>Status</div><div>Actions</div></div>';

      applications.forEach(function(app) {
        var id = app.id || app.applicationId || app.application_id;
        var name = (app.firstName || app.first_name || '') + ' ' + (app.lastName || app.last_name || '');
        name = name.trim() || 'Unknown';
        var email = app.email || '';
        var company = app.companyName || app.company_name || app.company || '';
        var title = app.jobTitle || app.job_title || app.title || '';
        var tier = app.membershipTier || app.membership_tier || app.tier || 'executive';
        var status = (app.status || 'pending').toLowerCase();
        var date = formatDate(app.createdAt || app.created_at || app.submittedAt || app.submitted_at || '');
        var phone = app.phone || app.phoneNumber || app.phone_number || '';
        var city = app.city || '';
        var handicap = app.handicap || app.golfHandicap || app.golf_handicap || '';
        var frequency = app.playFrequency || app.play_frequency || app.golfFrequency || app.golf_frequency || '';
        var homeCourse = app.homeCourse || app.home_course || app.homeClub || app.home_club || '';
        var athletes = app.athletesInterested || app.athletes_interested || app.athletes || '';
        var referral = app.referralSource || app.referral_source || app.referral || '';
        var notes = app.additionalNotes || app.additional_notes || app.notes || '';

        var tierClass = tier.toLowerCase().replace(/[^a-z]/g, '');
        if (tierClass.includes('founder')) tierClass = 'founders';
        else if (tierClass.includes('chairman')) tierClass = 'chairmans';
        else tierClass = 'executive';

        var tierLabel = tierClass === 'founders' ? "Founder's" : tierClass === 'chairmans' ? "Chairman's" : 'Executive';

        var isExpanded = expandedId === id;

        html += '<div class="app-row' + (isExpanded ? ' expanded' : '') + '" onclick="toggleExpand(\'' + id + '\')">';
        html += '<div class="cell-date">' + escapeHtml(date) + '</div>';
        html += '<div class="cell-name-wrap"><div class="cell-name">' + escapeHtml(name) + '</div><div class="cell-email">' + escapeHtml(email) + '</div></div>';
        html += '<div class="cell-company-wrap"><div class="cell-company">' + escapeHtml(company) + '</div><div class="cell-title">' + escapeHtml(title) + '</div></div>';
        html += '<div class="cell-tier-wrap"><span class="tier-badge ' + tierClass + '">' + tierLabel + '</span></div>';
        html += '<div class="cell-status-wrap"><span class="status-badge ' + status + '">' + status.toUpperCase() + '</span></div>';
        html += '<div class="cell-actions" onclick="event.stopPropagation()">';
        if (status === 'pending') {
          html += '<div class="action-btns"><button class="btn-approve" onclick="openModal(\'approve\', \'' + id + '\', \'' + escapeAttr(name) + '\', \'' + escapeAttr(email) + '\', \'' + escapeAttr(tierLabel) + '\')">Approve</button>';
          html += '<button class="btn-decline" onclick="openModal(\'decline\', \'' + id + '\', \'' + escapeAttr(name) + '\', \'' + escapeAttr(email) + '\', \'' + escapeAttr(tierLabel) + '\')">Decline</button></div>';
        } else if (status === 'approved') {
          html += '<div class="action-btns"><button class="btn-resend" onclick="event.stopPropagation(); resendApproval(\'' + id + '\', \'' + escapeAttr(name) + '\', \'' + escapeAttr(email) + '\')">Resend Email</button></div>';
        }
        html += '</div>';
        html += '</div>';

        // Detail panel
        html += '<div class="app-detail' + (isExpanded ? ' open' : '') + '" id="detail-' + id + '">';
        html += '<div class="detail-grid">';
        html += detailField('Phone', phone);
        html += detailField('City', city);
        html += detailField('Handicap', handicap);
        html += detailField('Play Frequency', frequency);
        html += detailField('Home Course', homeCourse);
        html += detailField('Athletes Interested', athletes);
        html += detailField('Referral Source', referral);
        html += detailField('Notes', notes);
        html += detailField('Membership Tier', tierLabel);
        html += '</div>';
        if (status === 'pending') {
          html += '<div class="detail-actions">';
          html += '<button class="btn-approve" onclick="openModal(\'approve\', \'' + id + '\', \'' + escapeAttr(name) + '\', \'' + escapeAttr(email) + '\', \'' + escapeAttr(tierLabel) + '\')">Approve Application</button>';
          html += '<button class="btn-decline" onclick="openModal(\'decline\', \'' + id + '\', \'' + escapeAttr(name) + '\', \'' + escapeAttr(email) + '\', \'' + escapeAttr(tierLabel) + '\')">Decline Application</button>';
          html += '</div>';
        } else if (status === 'approved') {
          html += '<div class="detail-actions">';
          html += '<button class="btn-resend" onclick="resendApproval(\'' + id + '\', \'' + escapeAttr(name) + '\', \'' + escapeAttr(email) + '\')">Resend Welcome Email &amp; Payment Link</button>';
          html += '</div>';
        }
        html += '</div>';
      });

      html += '</div>';
      area.innerHTML = html;
    }

    function detailField(label, value) {
      return '<div class="detail-item"><label>' + escapeHtml(label) + '</label><span>' + escapeHtml(value || '—') + '</span></div>';
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      renderTable();
    }

    // ── MODAL ──
    function openModal(action, id, name, email, tier) {
      pendingAction = { action: action, id: id, name: name, email: email, tier: tier };
      var titleEl = document.getElementById('modalTitle');
      var textEl = document.getElementById('modalText');
      var confirmBtn = document.getElementById('modalConfirm');
      var declineWrap = document.getElementById('declineReasonWrap');
      var declineInput = document.getElementById('declineReason');

      if (action === 'approve') {
        titleEl.textContent = 'Approve Application';
        textEl.textContent = 'Approve ' + name + ' for ' + tier + '? This will send them a welcome email with Stripe payment link.';
        confirmBtn.textContent = 'Approve';
        confirmBtn.className = 'modal-confirm approve';
        declineWrap.style.display = 'none';
        declineInput.value = '';
      } else {
        titleEl.textContent = 'Decline Application';
        textEl.textContent = "Decline " + name + "'s application? Please provide a reason below — this will be included in the email to the applicant.";
        confirmBtn.textContent = 'Decline';
        confirmBtn.className = 'modal-confirm decline';
        declineWrap.style.display = 'block';
        declineInput.value = '';
        declineInput.focus();
      }

      confirmBtn.disabled = false;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay')) return;
      document.getElementById('modalOverlay').classList.remove('active');
      pendingAction = null;
    }

    async function confirmAction() {
      if (!pendingAction) return;
      var btn = document.getElementById('modalConfirm');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        if (pendingAction.action === 'approve') {
          await approveApplication(pendingAction.id);
          showToast('Approved! Welcome email sent to ' + pendingAction.email, 'success');
        } else {
          var reason = document.getElementById('declineReason').value.trim();
          await declineApplication(pendingAction.id, reason);
          showToast('Application declined. Email sent to ' + pendingAction.email, 'success');
        }
        closeModal();
        loadData();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = pendingAction.action === 'approve' ? 'Approve' : 'Decline';
      }
    }

    async function resendApproval(id, name, email) {
      var btn = event.target;
      btn.disabled = true;
      btn.textContent = 'SENDING...';
      try {
        var res = await fetch(API + '/applications/' + id + '/approve', {
          method: 'PATCH',
          headers: authHeaders()
        });
        if (!res.ok) throw new Error('Failed');
        showToast('Welcome email resent to ' + email, 'success');
      } catch (err) {
        showToast('Failed to resend email', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'RESEND EMAIL';
      }
    }

    // ── TOAST ──
    function showToast(msg, type) {
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast ' + (type || '');
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 4000);
    }

    // ── POLLING ──
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async function() {
        try {
          var st = await fetchStats();
          var newTotal = st.total || 0;
          if (lastTotal !== null && newTotal > lastTotal) {
            document.getElementById('newAppIndicator').classList.add('visible');
            setTimeout(function() {
              document.getElementById('newAppIndicator').classList.remove('visible');
            }, 8000);
            loadData();
          }
          lastTotal = newTotal;
        } catch (e) {
          // Silent fail on poll
        }
      }, 30000);
    }

    // ── HELPERS ──
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
      } catch (e) {
        return dateStr;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function escapeAttr(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
