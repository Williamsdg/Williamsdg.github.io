<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  #stage{width:1080px;height:1080px;position:relative;background:#070710;overflow:hidden}
  .glow{position:absolute;inset:0;background:radial-gradient(55% 55% at 50% 42%,rgba(99,102,241,.45),rgba(139,92,246,.12) 55%,rgba(7,7,16,0) 100%)}
  .tile{
    position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
    width:460px;height:460px;border-radius:104px;
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
    box-shadow:0 22px 80px rgba(99,102,241,.45);
    display:flex;align-items:center;justify-content:center;
  }
  .wd{
    font-family:'Inter',sans-serif;font-weight:800;color:#fff;
    font-size:248px;letter-spacing:-8px;line-height:1;
    transform:translateY(-4px);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="glow"></div>
    <div class="tile"><div class="wd">WD</div></div>
  </div>
</body>
</html>
