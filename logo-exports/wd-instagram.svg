<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <!-- Brand gradient: indigo -> purple -> cyan -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Subtle radial glow behind the mark -->
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"  stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070710" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft drop shadow for the tile -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="40" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark background matching williamsdigital.io (#070710) -->
  <rect width="1080" height="1080" fill="#070710"/>
  <!-- Ambient glow -->
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Rounded gradient tile (centered, circle-safe with generous padding) -->
  <g filter="url(#softShadow)">
    <rect x="310" y="290" width="460" height="460" rx="104" fill="url(#brandGrad)"/>
  </g>

  <!-- WD monogram -->
  <text x="540" y="540"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="248" font-weight="800" letter-spacing="-8"
        fill="#ffffff" text-anchor="middle" dominant-baseline="central">WD</text>
</svg>
