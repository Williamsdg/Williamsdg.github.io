<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#15152b"/>
      <stop offset="60%" stop-color="#0c0c1a"/>
      <stop offset="100%" stop-color="#070710"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="mesh" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- full square fill so the circular crop has no corners showing through -->
  <rect width="500" height="500" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="250" fill="url(#mesh)"/>
  <!-- WD tile -->
  <rect x="148" y="120" width="204" height="204" rx="50" fill="url(#g)" filter="url(#glow)"/>
  <rect x="148" y="120" width="204" height="204" rx="50" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <text x="250" y="226" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800"
        font-size="104" letter-spacing="-4" fill="#ffffff">WD</text>
  <!-- wordmark -->
  <text x="250" y="372" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700"
        font-size="40" letter-spacing="-1" fill="#ffffff">Williams</text>
  <text x="250" y="416" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700"
        font-size="40" letter-spacing="-1" fill="#ffffff">Digital</text>
</svg>
