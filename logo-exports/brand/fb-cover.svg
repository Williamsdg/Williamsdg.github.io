<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="664" viewBox="0 0 1640 664">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b1a"/>
      <stop offset="55%" stop-color="#080814"/>
      <stop offset="100%" stop-color="#06060f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="m1" cx="20%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m3" cx="60%" cy="95%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#6366f1" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1640" height="664" fill="url(#bg)"/>
  <rect width="1640" height="664" fill="url(#grid)"/>
  <rect width="1640" height="664" fill="url(#m1)"/>
  <rect width="1640" height="664" fill="url(#m2)"/>
  <rect width="1640" height="664" fill="url(#m3)"/>

  <!-- Content kept within FB safe area: centered, away from bottom-left profile overlap -->
  <g transform="translate(820, 250)">
    <!-- mark -->
    <g transform="translate(-560, -90)">
      <rect x="0" y="0" width="180" height="180" rx="46" fill="url(#g)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="180" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
      <text x="90" y="98" text-anchor="middle" dominant-baseline="central"
            font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800"
            font-size="92" letter-spacing="-3" fill="#ffffff">WD</text>
    </g>
    <!-- wordmark -->
    <text x="-350" y="-20"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800"
          font-size="104" letter-spacing="-4" fill="#ffffff">Williams <tspan fill="url(#gtext)">Digital</tspan></text>
    <!-- tagline -->
    <text x="-348" y="58"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="500"
          font-size="38" letter-spacing="-0.5" fill="#a1a1aa">Websites that win customers. Dashboards that run the business.</text>
  </g>

  <!-- bottom meta strip, centered to stay clear of FB UI corners -->
  <text x="820" y="600" text-anchor="middle"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-weight="400"
        font-size="26" letter-spacing="2" fill="#71717a">BIRMINGHAM, AL  ·  WILLIAMSDIGITAL.IO</text>
</svg>
