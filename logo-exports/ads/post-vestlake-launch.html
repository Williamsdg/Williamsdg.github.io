<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; position: relative;
    background: #08080f; }
  .glow1 { position: absolute; width: 900px; height: 900px; left: -300px; top: -300px; background: radial-gradient(circle, rgba(99,102,241,0.22), transparent 65%); }
  .glow2 { position: absolute; width: 900px; height: 900px; right: -350px; bottom: -350px; background: radial-gradient(circle, rgba(56,189,248,0.16), transparent 65%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 54px 54px; }

  .brand { position: absolute; top: 64px; left: 72px; display: flex; align-items: center; gap: 18px; }
  .brand img { width: 74px; height: 74px; }
  .brand span { color: #fff; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }

  .live { position: absolute; top: 84px; right: 72px; display: flex; align-items: center; gap: 10px;
    background: rgba(34,197,94,0.12); border: 1.5px solid rgba(34,197,94,0.5); border-radius: 100px; padding: 10px 22px; }
  .live i { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 14px #22c55e; }
  .live span { color: #4ade80; font-size: 20px; font-weight: 700; letter-spacing: 2.5px; }

  h1 { position: absolute; top: 196px; left: 72px; width: 940px; color: #fff; font-size: 84px; line-height: 1.08; font-weight: 800; letter-spacing: -2.5px; }
  h1 .grad { background: linear-gradient(90deg, #818cf8, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; top: 410px; left: 72px; color: #9ca3af; font-size: 29px; line-height: 1.5; width: 700px; }

  .browser { position: absolute; left: 72px; top: 548px; width: 740px; height: 392px; border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 30px 80px rgba(0,0,0,0.6); background: #11131d; }
  .bar { height: 52px; background: #171a26; display: flex; align-items: center; padding: 0 20px; gap: 9px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .url { margin-left: 16px; background: #0d0f17; border-radius: 8px; padding: 8px 20px; color: #a5b4fc;
    font-family: 'SF Mono', Menlo, monospace; font-size: 18px; letter-spacing: 0.5px; }
  .browser img { width: 100%; display: block; }

  .phone { position: absolute; right: 56px; top: 540px; width: 300px; border-radius: 42px 42px 0 0; overflow: hidden;
    border: 11px solid #1c1f2e; border-bottom: none; box-shadow: 0 30px 80px rgba(0,0,0,0.65); background: #1c1f2e; }
  .phone img { width: 100%; display: block; }

  .foot { position: absolute; bottom: 48px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: center; }
  .foot .tag { color: #6b7280; font-family: 'SF Mono', Menlo, monospace; font-size: 22px; letter-spacing: 1px; }
  .foot .domain { color: #e5e7eb; font-family: 'SF Mono', Menlo, monospace; font-size: 26px; letter-spacing: 1px; }
  .foot .domain b { color: #38bdf8; font-weight: 400; }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div>

  <div class="brand"><img src="wd-logo-transparent-1080.png"><span>Williams Digital</span></div>
  <div class="live"><i></i><span>NEW SITE LIVE</span></div>

  <h1>Vestlake Communities<br>at Liberty Park is <span class="grad">live.</span></h1>
  <p class="sub">A new community home for a Vestavia Hills HOA — events, newsletters, documents, and an admin their team runs themselves.</p>

  <div class="browser">
    <div class="bar">
      <div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div>
      <div class="url">vestlakelibertypark.com</div>
    </div>
    <img src="vestlake.jpg">
  </div>

  <div class="phone"><img src="vestlake-m.jpg"></div>

  <div class="foot" style="flex-direction:column;align-items:flex-start;gap:10px;right:auto;">
    <span class="tag">// CLIENT LAUNCH — HOA</span>
    <span class="domain">williamsdigital<b>.io</b></span>
  </div>
</body>
</html>
