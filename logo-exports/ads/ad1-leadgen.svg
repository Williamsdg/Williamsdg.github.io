<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b1a"/><stop offset="55%" stop-color="#080814"/><stop offset="100%" stop-color="#06060f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="m1" cx="18%" cy="18%" r="55%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="m2" cx="88%" cy="85%" r="55%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 H0 V60" fill="none" stroke="#6366f1" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect width="1080" height="1080" fill="url(#m1)"/>
  <rect width="1080" height="1080" fill="url(#m2)"/>

  <!-- logo lockup top -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="86" height="86" rx="22" fill="url(#g)"/>
    <text x="43" y="48" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-2" fill="#fff">WD</text>
    <text x="108" y="48" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="40" letter-spacing="-1" fill="#fff">Williams Digital</text>
  </g>

  <!-- eyebrow -->
  <text x="90" y="360" font-family="'JetBrains Mono', monospace" font-size="30" letter-spacing="4" fill="#22d3ee">// FOR GROWING BUSINESSES</text>

  <!-- headline -->
  <text x="86" y="470" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="110" letter-spacing="-5" fill="#ffffff">Need a website</text>
  <text x="86" y="590" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="110" letter-spacing="-5" fill="#ffffff">that actually</text>
  <text x="86" y="710" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="110" letter-spacing="-5" fill="url(#gtext)">wins customers?</text>

  <!-- subcopy -->
  <text x="90" y="800" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="40" fill="#a1a1aa">Custom sites &amp; business dashboards,</text>
  <text x="90" y="852" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="40" fill="#a1a1aa">built and hosted end-to-end.</text>

  <!-- CTA button -->
  <g filter="url(#glow)">
    <rect x="90" y="918" width="430" height="96" rx="20" fill="url(#g)"/>
  </g>
  <text x="305" y="968" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="40" fill="#fff">Get a free quote →</text>

  <!-- url -->
  <text x="990" y="978" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="30" letter-spacing="1" fill="#71717a">williamsdigital.io</text>
</svg>
