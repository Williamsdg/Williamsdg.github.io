<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#06060f"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="gau" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E87722"/><stop offset="100%" stop-color="#F4A261"/></linearGradient>
    <linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="m1" cx="50%" cy="15%" r="55%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.24"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 H0 V60" fill="none" stroke="#6366f1" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect width="1080" height="1080" fill="url(#m1)"/>

  <g transform="translate(90,86)">
    <rect x="0" y="0" width="74" height="74" rx="19" fill="url(#g)"/>
    <text x="37" y="42" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="38" letter-spacing="-2" fill="#fff">WD</text>
    <text x="92" y="42" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-1" fill="#fff">Williams Digital</text>
  </g>

  <text x="540" y="290" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="30" letter-spacing="3" fill="#22d3ee">// BUILT BY A REAL DEVELOPER</text>

  <!-- big quote -->
  <text x="540" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="86" letter-spacing="-4" fill="#ffffff">Auburn Computer</text>
  <text x="540" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="86" letter-spacing="-4" fill="#ffffff">Science grad.</text>
  <text x="540" y="630" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="86" letter-spacing="-4" fill="url(#gtext)">Creator of Buy Auburn.</text>

  <text x="540" y="730" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="42" fill="#a1a1aa">Custom-coded websites, dashboards &amp; platforms —</text>
  <text x="540" y="786" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="42" fill="#a1a1aa">no templates, no agency runaround.</text>

  <!-- Auburn accent pill -->
  <rect x="370" y="846" width="340" height="64" rx="32" fill="url(#gau)" fill-opacity="0.14" stroke="#E87722" stroke-opacity="0.5"/>
  <text x="540" y="879" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="32" fill="#F4A261">War Eagle 🦅</text>

  <g><rect x="340" y="940" width="400" height="92" rx="20" fill="url(#g)"/></g>
  <text x="540" y="988" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="38" fill="#fff">See my work →</text>
</svg>
