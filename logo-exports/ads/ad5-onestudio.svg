<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#06060f"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="m1" cx="80%" cy="20%" r="55%"><stop offset="0%" stop-color="#ec4899" stop-opacity="0.16"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="m2" cx="20%" cy="85%" r="55%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 H0 V60" fill="none" stroke="#6366f1" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect width="1080" height="1080" fill="url(#m1)"/>
  <rect width="1080" height="1080" fill="url(#m2)"/>

  <g transform="translate(90,86)">
    <rect x="0" y="0" width="74" height="74" rx="19" fill="url(#g)"/>
    <text x="37" y="42" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="38" letter-spacing="-2" fill="#fff">WD</text>
    <text x="92" y="42" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-1" fill="#fff">Williams Digital</text>
  </g>

  <text x="540" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="180" letter-spacing="-8" fill="url(#gtext)">One studio.</text>
  <text x="540" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="110" letter-spacing="-5" fill="#ffffff">No handoffs.</text>

  <text x="540" y="590" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="42" fill="#a1a1aa">Design, build, hosting, and support —</text>
  <text x="540" y="646" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="42" fill="#a1a1aa">one point of contact, one bill.</text>

  <!-- 3 chips -->
  <g font-family="Inter, Arial, sans-serif" font-weight="600" font-size="34" fill="#c7d2fe" text-anchor="middle">
    <rect x="150" y="730" width="240" height="80" rx="40" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4"/><text x="270" y="775" dominant-baseline="central">Websites</text>
    <rect x="420" y="730" width="240" height="80" rx="40" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4"/><text x="540" y="775" dominant-baseline="central">Dashboards</text>
    <rect x="690" y="730" width="240" height="80" rx="40" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4"/><text x="810" y="775" dominant-baseline="central">Portals</text>
  </g>

  <g><rect x="340" y="900" width="400" height="96" rx="20" fill="url(#g)"/></g>
  <text x="540" y="950" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="40" fill="#fff">Start a project →</text>
  <text x="540" y="1030" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" letter-spacing="1" fill="#71717a">williamsdigital.io</text>
</svg>
