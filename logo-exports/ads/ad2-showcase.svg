<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0b1a"/><stop offset="55%" stop-color="#080814"/><stop offset="100%" stop-color="#06060f"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="m1" cx="80%" cy="15%" r="55%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="m2" cx="15%" cy="88%" r="55%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 H0 V60" fill="none" stroke="#6366f1" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect width="1080" height="1080" fill="url(#m1)"/>
  <rect width="1080" height="1080" fill="url(#m2)"/>

  <!-- logo -->
  <g transform="translate(90,86)">
    <rect x="0" y="0" width="74" height="74" rx="19" fill="url(#g)"/>
    <text x="37" y="42" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="38" letter-spacing="-2" fill="#fff">WD</text>
    <text x="92" y="42" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-1" fill="#fff">Williams Digital</text>
  </g>

  <!-- headline -->
  <text x="86" y="280" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="-4" fill="#ffffff">The website your</text>
  <text x="86" y="372" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="-4" fill="#ffffff">customers see +</text>
  <text x="86" y="464" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="-4" fill="url(#gtext)">the dashboard you run.</text>

  <!-- browser mock -->
  <g transform="translate(120,560)">
    <rect x="0" y="0" width="500" height="360" rx="18" fill="#11112480" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="42" rx="18" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="26" cy="21" r="6" fill="#ff5f57"/><circle cx="48" cy="21" r="6" fill="#febc2e"/><circle cx="70" cy="21" r="6" fill="#28c840"/>
    <text x="30" y="98" font-family="'JetBrains Mono',monospace" font-size="18" fill="#22d3ee">// LIVE SITE</text>
    <rect x="30" y="120" width="280" height="22" rx="6" fill="url(#g)"/>
    <rect x="30" y="160" width="380" height="12" rx="6" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="30" y="184" width="320" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="30" y="222" width="120" height="40" rx="10" fill="url(#g)"/>
    <rect x="30" y="290" width="210" height="50" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="260" y="290" width="210" height="50" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  </g>

  <!-- dashboard mock -->
  <g transform="translate(560,640)">
    <rect x="0" y="0" width="400" height="300" rx="16" fill="#0d0d1f" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="36" rx="16" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="22" cy="18" r="5" fill="#ff5f57"/><circle cx="40" cy="18" r="5" fill="#febc2e"/><circle cx="58" cy="18" r="5" fill="#28c840"/>
    <rect x="20" y="58" width="110" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="34" y="86" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="24" fill="#22d3ee">$24k</text>
    <text x="34" y="106" font-family="Inter,Arial,sans-serif" font-size="13" fill="#71717a">Revenue</text>
    <rect x="145" y="58" width="110" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="159" y="86" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="24" fill="#a78bfa">18</text>
    <text x="159" y="106" font-family="Inter,Arial,sans-serif" font-size="13" fill="#71717a">Jobs</text>
    <rect x="270" y="58" width="110" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="284" y="86" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="24" fill="#818cf8">42</text>
    <text x="284" y="106" font-family="Inter,Arial,sans-serif" font-size="13" fill="#71717a">Leads</text>
    <rect x="20" y="130" width="360" height="150" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
    <polyline points="40,250 100,225 160,235 220,195 280,205 340,165" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="340" cy="165" r="6" fill="#22d3ee"/>
  </g>

  <text x="990" y="1010" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="30" letter-spacing="1" fill="#71717a">williamsdigital.io</text>
</svg>
