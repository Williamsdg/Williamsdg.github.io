<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a18"/><stop offset="100%" stop-color="#05050d"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="m1" cx="50%" cy="10%" r="60%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 H0 V60" fill="none" stroke="#6366f1" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect width="1080" height="1080" fill="url(#m1)"/>

  <g transform="translate(90,86)">
    <rect x="0" y="0" width="74" height="74" rx="19" fill="url(#g)"/>
    <text x="37" y="42" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="38" letter-spacing="-2" fill="#fff">WD</text>
    <text x="92" y="42" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-1" fill="#fff">Williams Digital</text>
  </g>

  <text x="90" y="250" font-family="'JetBrains Mono', monospace" font-size="30" letter-spacing="4" fill="#22d3ee">// BUSINESS DASHBOARDS</text>
  <text x="86" y="370" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="100" letter-spacing="-5" fill="#ffffff">Still running your</text>
  <text x="86" y="480" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="100" letter-spacing="-5" fill="#ffffff">business on</text>
  <text x="86" y="590" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="100" letter-spacing="-5" fill="url(#gtext)">spreadsheets?</text>

  <!-- feature checklist -->
  <g font-family="Inter, Arial, sans-serif" font-size="40" fill="#e4e4e7" font-weight="500">
    <g transform="translate(90,700)"><circle cx="22" cy="-12" r="22" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.5"/><path d="M12 -13 l7 7 12 -14" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="0">Jobs, bookings &amp; customers in one screen</text></g>
    <g transform="translate(90,772)"><circle cx="22" cy="-12" r="22" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.5"/><path d="M12 -13 l7 7 12 -14" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="0">Live data straight from your website</text></g>
    <g transform="translate(90,844)"><circle cx="22" cy="-12" r="22" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.5"/><path d="M12 -13 l7 7 12 -14" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="0">Built around how you actually work</text></g>
  </g>

  <g><rect x="90" y="912" width="500" height="96" rx="20" fill="url(#g)"/></g>
  <text x="340" y="962" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="40" fill="#fff">See what's possible →</text>
  <text x="990" y="970" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="28" letter-spacing="1" fill="#71717a">williamsdigital.io</text>
</svg>
