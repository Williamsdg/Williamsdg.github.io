<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Outreach · Williams Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070710'/%3E%3Crect x='9' y='8' width='4' height='16' rx='1' fill='%236366f1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>

<div id="login" class="login hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="tab"></span><span class="wordmark">WILLIAMS DIGITAL</span></div>
    <div class="sub">OUTREACH · PRIVATE</div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <a class="brand" href="#campaigns"><span class="tab"></span><span class="wordmark">WILLIAMS DIGITAL</span><span class="sub2">OUTREACH</span></a>
    <nav class="nav" id="nav">
      <a href="#campaigns" data-view="campaigns">Campaigns</a>
      <a href="#businesses" data-view="businesses">Businesses</a>
      <a href="#queue" data-view="queue">Review queue <span class="pill" id="queueCount"></span></a>
      <a href="#sent" data-view="sent">Sent &amp; replies</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
    <div class="status-strip" id="strip" title="Provider status"></div>
    <button class="btn ghost small" id="logout">Sign out</button>
  </header>

  <main id="view" class="view"></main>

  <aside id="drawer" class="drawer hidden" aria-label="Business detail">
    <div class="drawer-head"><strong id="drawerTitle">Business</strong><button class="btn ghost small" id="drawerClose">Close</button></div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
