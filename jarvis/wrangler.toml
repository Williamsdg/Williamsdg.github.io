# Cloudflare Worker config for the JARVIS analytics API.
# Deploy:  cd jarvis && wrangler deploy
# Secrets (set separately, never commit them):
#   wrangler secret put GOOGLE_CLIENT_EMAIL
#   wrangler secret put GOOGLE_PRIVATE_KEY
#   wrangler secret put SITES
#   wrangler secret put AUTH_TOKEN          # optional
#   wrangler secret put ELEVENLABS_API_KEY  # optional, for the exact JARVIS voice
#   wrangler secret put ELEVENLABS_VOICE_ID # optional, your chosen voice ID

name = "jarvis-analytics"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Lock the API to your site(s). Comma-separated, no trailing slash.
ALLOWED_ORIGINS = "https://williamsdigital.io,https://www.williamsdigital.io"
